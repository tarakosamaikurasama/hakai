<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>日野市の街並みに歴史</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
background:#eee;
color:#222;
}

button,input,select{
font:inherit;
}

button{
cursor:pointer;
touch-action:manipulation;
}

.screen{
position:absolute;
inset:0;
display:none;
}

.screen.active{
display:flex;
}

/* =========================
   スタート
========================= */

#home{
align-items:center;
justify-content:center;
padding:20px;
background:
radial-gradient(circle at 15% 15%,#fff 0,transparent 34%),
radial-gradient(circle at 85% 85%,#fff 0,transparent 35%),
#f1f1f1;
}

.home-card{
width:min(620px,calc(100vw - 40px));
padding:42px 34px 38px;
background:#fff;
border-radius:30px;
box-shadow:
0 20px 55px rgba(0,0,0,.13),
0 3px 8px rgba(0,0,0,.05);
text-align:center;
}

.home-title{
font-size:clamp(32px,7vw,52px);
font-weight:900;
letter-spacing:.02em;
margin:0 0 10px;
}

.home-subtitle{
font-size:15px;
color:#777;
margin-bottom:32px;
}

.start-buttons{
display:flex;
flex-direction:column;
gap:16px;
}

.start-button{
appearance:none;
border:0;
width:100%;
min-height:68px;
border-radius:20px;
background:#f80;
color:white;
font-size:20px;
font-weight:900;
box-shadow:
0 7px 0 #c66000,
0 13px 25px rgba(255,136,0,.2);
transition:transform .08s,box-shadow .08s,filter .08s;
}

.start-button:hover{
filter:brightness(1.04);
}

.start-button:active{
transform:translateY(6px);
box-shadow:
0 1px 0 #c66000,
0 5px 12px rgba(255,136,0,.16);
}

.start-button.white{
background:#fff;
color:#222;
box-shadow:
0 6px 0 #ddd,
0 12px 22px rgba(0,0,0,.08);
}

.start-button.white:active{
box-shadow:0 1px 0 #ddd;
}

/* =========================
   共通上部UI
========================= */

.topbar{
position:absolute;
top:0;
left:0;
right:0;
height:64px;
display:flex;
align-items:center;
gap:9px;
padding:9px 12px;
background:#fff;
box-shadow:0 2px 12px rgba(0,0,0,.12);
z-index:100;
}

.top-title{
font-weight:900;
font-size:18px;
margin-right:auto;
white-space:nowrap;
}

.ui-button{
border:0;
border-radius:13px;
padding:10px 14px;
background:#fff;
color:#222;
font-weight:800;
box-shadow:0 2px 7px rgba(0,0,0,.13);
white-space:nowrap;
}

.ui-button.orange{
background:#f80;
color:#fff;
box-shadow:0 4px 0 #c66000;
}

.ui-button:active{
transform:translateY(2px);
}

/* =========================
   エディター
========================= */

#editor,
#play{
background:#ddd;
}

.editor-body,
.play-body{
position:absolute;
left:0;
right:0;
top:64px;
bottom:0;
display:flex;
overflow:hidden;
}

.sidebar{
position:relative;
z-index:20;
width:285px;
height:100%;
background:#fff;
padding:12px;
overflow-y:auto;
overflow-x:hidden;
box-shadow:4px 0 16px rgba(0,0,0,.1);
}

.panel{
background:#fff;
border-radius:15px;
padding:11px;
margin-bottom:11px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.panel-title{
font-size:14px;
font-weight:900;
margin-bottom:9px;
}

.tool-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.tool{
border:0;
border-radius:12px;
background:#f5f5f5;
min-height:52px;
padding:8px 5px;
font-size:12px;
font-weight:800;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.tool:active{
transform:scale(.97);
}

.tool.active{
background:#f80;
color:#fff;
}

.small-button{
border:0;
border-radius:9px;
background:#f2f2f2;
padding:8px 10px;
font-weight:800;
margin:2px;
}

.danger{
background:#e33;
color:#fff;
}

.row{
display:flex;
align-items:center;
gap:7px;
margin:7px 0;
}

.row label{
font-size:12px;
font-weight:800;
flex:1;
}

.row input,
.row select{
width:100%;
min-width:0;
border:1px solid #ddd;
border-radius:8px;
padding:7px;
background:#fff;
}

.game-area{
position:relative;
flex:1;
min-width:0;
min-height:0;
overflow:hidden;
background:#dfe2e5;
}

.game-canvas{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
display:block;
touch-action:none;
}

.status{
position:absolute;
left:14px;
bottom:14px;
z-index:30;
background:rgba(255,255,255,.94);
padding:8px 12px;
border-radius:13px;
font-size:12px;
font-weight:800;
box-shadow:0 3px 12px rgba(0,0,0,.14);
pointer-events:none;
}

.zoom{
position:absolute;
right:14px;
bottom:14px;
display:flex;
gap:7px;
z-index:30;
}

.zoom button{
border:0;
width:45px;
height:45px;
border-radius:14px;
background:#fff;
font-size:23px;
font-weight:900;
box-shadow:0 3px 12px rgba(0,0,0,.15);
}

/* =========================
   プレイ
========================= */

.play-body{
display:block;
}

.play-area{
position:absolute;
inset:0;
overflow:hidden;
background:#dfe2e5;
}

.play-buttons{
position:absolute;
top:14px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:8px;
z-index:40;
background:rgba(255,255,255,.95);
padding:8px;
border-radius:15px;
box-shadow:0 4px 16px rgba(0,0,0,.15);
}

.play-buttons button{
border:0;
border-radius:11px;
padding:9px 14px;
background:#fff;
font-weight:900;
box-shadow:0 2px 7px rgba(0,0,0,.1);
white-space:nowrap;
}

.play-buttons button.active{
background:#f80;
color:#fff;
}

/* =========================
   保存データ
========================= */

.data-body{
position:absolute;
top:64px;
left:0;
right:0;
bottom:0;
overflow:auto;
padding:20px;
}

.data-panel{
max-width:900px;
margin:0 auto;
background:#fff;
border-radius:18px;
padding:15px;
box-shadow:0 3px 14px rgba(0,0,0,.1);
}

.save-item{
display:flex;
align-items:center;
gap:8px;
background:#f6f6f6;
border-radius:12px;
padding:10px;
margin:7px 0;
}

.save-name{
flex:1;
font-weight:800;
min-width:0;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

/* =========================
   モーダル
========================= */

.modal-layer{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
padding:18px;
background:rgba(0,0,0,.3);
backdrop-filter:blur(5px);
z-index:500;
}

.modal-layer.show{
display:flex;
}

.modal{
width:min(500px,100%);
max-height:90vh;
overflow:auto;
background:#fff;
border-radius:24px;
padding:22px;
box-shadow:0 20px 60px rgba(0,0,0,.28);
}

.modal h2{
margin:0 0 16px;
font-size:22px;
}

.modal-actions{
display:flex;
justify-content:flex-end;
gap:8px;
margin-top:17px;
}

.modal-actions button{
border:0;
border-radius:10px;
padding:10px 15px;
font-weight:800;
background:#eee;
}

.modal-actions .main{
background:#f80;
color:#fff;
}

@media(max-width:700px){
.sidebar{
width:215px;
}

.top-title{
font-size:15px;
}

.ui-button{
padding:9px 10px;
font-size:12px;
}
}

@media(max-width:520px){
.sidebar{
width:180px;
}

.tool{
font-size:11px;
}

.topbar{
height:58px;
}

.editor-body,
.play-body{
top:58px;
}
}
</style>
</head>

<body>

<div id="app">

<!-- =========================
     スタート
========================= -->

<section id="home" class="screen active">

<div class="home-card">

<h1 class="home-title">ステージメーカー</h1>

<div class="home-subtitle">
ステージを作って、保存して、遊べます
</div>

<div class="start-buttons">

<button type="button" id="startCreate" class="start-button">
ステージを作る
</button>

<button type="button" id="startPlay" class="start-button white">
ステージで遊ぶ
</button>

<button type="button" id="startData" class="start-button white">
保存データ
</button>

</div>

</div>

</section>


<!-- =========================
     エディター
========================= -->

<section id="editor" class="screen">

<div class="topbar">

<button type="button" class="ui-button" id="editorHome">
← スタート
</button>

<div class="top-title">
ステージを作る
</div>

<button type="button" class="ui-button" id="newSave">
新しく保存
</button>

<button type="button" class="ui-button orange" id="overwriteSave">
上書き保存
</button>

<button type="button" class="ui-button" id="editorPlay">
▶ 遊ぶ
</button>

</div>


<div class="editor-body">

<aside class="sidebar">

<div class="panel">

<div class="panel-title">
ブロック
</div>

<div class="tool-grid">

<button class="tool" data-type="wood">木</button>
<button class="tool" data-type="glass">ガラス</button>
<button class="tool" data-type="stone">石</button>
<button class="tool" data-type="bedrock">岩盤</button>

<button class="tool" data-type="dog">犬</button>
<button class="tool" data-type="bigdog">巨大犬</button>
<button class="tool" data-type="armor">よろい犬</button>
<button class="tool" data-type="movingdog">動く犬</button>

<button class="tool" data-type="bomb">爆弾</button>
<button class="tool" data-type="multiplier">倍ブロック</button>

<button class="tool" data-type="housewood">木の家</button>
<button class="tool" data-type="houseglass">ガラスの家</button>
<button class="tool" data-type="housestone">石の家</button>
<button class="tool" data-type="housebedrock">岩盤の家</button>

</div>

</div>


<div class="panel">

<div class="panel-title">
自動装置
</div>

<div class="tool-grid">

<button class="tool" data-type="bombgen">
爆弾発生器
</button>

<button class="tool" data-type="doggen">
犬発生器
</button>

</div>

</div>


<div class="panel">

<div class="panel-title">
爆弾設定
</div>

<div class="row">

<label>爆発まで</label>

<input
id="editorBombTime"
type="number"
min="0.2"
step="0.1"
value="3">

</div>

</div>


<div class="panel">

<div class="panel-title">
操作
</div>

<button type="button" class="small-button" id="editorSelect">
選択
</button>

<button type="button" class="small-button" id="editorDelete">
削除
</button>

<button type="button" class="small-button" id="editorRotate">
回転
</button>

<button type="button" class="small-button" id="clearStage">
全削除
</button>

</div>

</aside>


<div class="game-area" id="editorArea">

<canvas id="editorCanvas" class="game-canvas"></canvas>

<div class="status" id="editorStatus">
配置モード
</div>

<div class="zoom">

<button type="button" id="zoomOut">−</button>
<button type="button" id="zoomIn">＋</button>

</div>

</div>

</div>

</section>


<!-- =========================
     プレイ
========================= -->

<section id="play" class="screen">

<div class="topbar">

<button type="button" class="ui-button" id="playHome">
← スタート
</button>

<div class="top-title">
ステージで遊ぶ
</div>

<button type="button" class="ui-button" id="allExplode">
全爆破
</button>

</div>


<div class="play-body">

<div class="play-area">

<canvas id="playCanvas" class="game-canvas"></canvas>

<div class="play-buttons">

<button type="button" id="placeBomb" class="active">
爆弾を置く
</button>

<button type="button" id="playSelect">
選択
</button>

</div>

<div class="status" id="playStatus">
爆弾を置くモード
</div>

</div>

</div>

</section>


<!-- =========================
     データ
========================= -->

<section id="data" class="screen">

<div class="topbar">

<button type="button" class="ui-button" id="dataHome">
← スタート
</button>

<div class="top-title">
保存データ
</div>

<button type="button" class="ui-button orange" id="importData">
データ読み込み
</button>

<button type="button" class="ui-button" id="exportData">
データ書き出し
</button>

</div>


<div class="data-body">

<div class="data-panel">

<div style="font-weight:900;margin-bottom:10px">
保存したステージ
</div>

<div id="stageList"></div>

</div>

</div>

</section>

</div>


<div id="modalLayer" class="modal-layer">

<div id="modal" class="modal"></div>

</div>

<input
id="fileInput"
type="file"
accept=".json,application/json"
style="display:none">


<script>
"use strict";

/* =========================================================
   基本
========================================================= */

const STORAGE_KEY="stage_maker_data_v2";

const $=id=>document.getElementById(id);

let stages=[];

try{
stages=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
if(!Array.isArray(stages))stages=[];
}catch(e){
stages=[];
}

let currentStage=null;

let editorEngine=null;
let playEngine=null;

let editorObjects=[];
let playObjects=[];

let editorCanvasSize={width:1,height:1};
let playCanvasSize={width:1,height:1};

let editorMode="place";
let playMode="bomb";

let selectedTool="wood";
let selectedEditor=null;
let selectedPlay=null;

let editorScale=1;

let editorFrame=0;
let playFrame=0;

let uniqueCounter=1;


/* =========================================================
   ID
========================================================= */

function makeId(){

return "obj_"+
Date.now().toString(36)+
"_"+(uniqueCounter++)+
"_"+Math.random().toString(36).slice(2,8);

}


/* =========================================================
   保存
========================================================= */

function saveStages(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(stages)
);

}


/* =========================================================
   ステージ
========================================================= */

function newStage(){

return{

id:makeId(),

name:"新しいステージ",

bombTime:3,

objects:[]

};

}


function clone(obj){

return JSON.parse(
JSON.stringify(obj)
);

}


/* =========================================================
   画面
========================================================= */

function showScreen(id){

document.querySelectorAll(".screen").forEach(
screen=>screen.classList.remove("active")
);

$(id).classList.add("active");

}


/* =========================================================
   スタート
========================================================= */

$("startCreate").addEventListener("click",function(){

currentStage=newStage();

showScreen("editor");

setTimeout(function(){

initEditor();

},50);

});


$("startPlay").addEventListener("click",function(){

if(stages.length===0){

openMessage(
"保存されたステージがありません。"
);

return;

}

openStageSelector("play");

});


$("startData").addEventListener("click",function(){

showScreen("data");

renderStageList();

});


/* =========================================================
   上部ボタン
========================================================= */

$("editorHome").addEventListener("click",function(){

stopEditor();

showScreen("home");

});


$("playHome").addEventListener("click",function(){

stopPlay();

showScreen("home");

});


$("dataHome").addEventListener("click",function(){

showScreen("home");

});


/* =========================================================
   材質
========================================================= */

function getMaterial(type){

switch(type){

case"wood":
case"housewood":
return{
hp:4
};

case"glass":
case"houseglass":
return{
hp:1
};

case"stone":
case"housestone":
return{
hp:8
};

case"bedrock":
case"housebedrock":
return{
hp:Infinity
};

case"dog":
case"movingdog":
return{
hp:2
};

case"bigdog":
return{
hp:4
};

case"armor":
return{
hp:2,
defense:2
};

case"multiplier":
return{
hp:5
};

default:
return{
hp:1
};

}

}


/* =========================================================
   色
========================================================= */

function getColor(type){

switch(type){

case"wood":
case"housewood":
return"#a96b38";

case"glass":
case"houseglass":
return"rgba(80,190,240,.45)";

case"stone":
case"housestone":
return"#858585";

case"bedrock":
case"housebedrock":
return"#363636";

case"dog":
case"bigdog":
case"armor":
case"movingdog":
return"#996438";

case"bomb":
case"bombgen":
return"#222";

case"doggen":
return"#744626";

case"multiplier":
return"#f80";

default:
return"#aaa";

}

}


/* =========================================================
   種類判定
========================================================= */

function isHouse(type){

return[
"housewood",
"houseglass",
"housestone",
"housebedrock"
].includes(type);

}


function isDog(type){

return[
"dog",
"bigdog",
"armor",
"movingdog"
].includes(type);

}


/* =========================================================
   サイズ
========================================================= */

function getSize(type){

if(type==="bigdog"){

return{
w:80,
h:80
};

}

if(isHouse(type)){

return{
w:150,
h:120
};

}

if(type==="bomb"){

return{
w:34,
h:34
};

}

return{
w:60,
h:60
};

}


/* =========================================================
   オブジェクト
========================================================= */

function createObject(type,x,y){

const size=getSize(type);

const material=getMaterial(type);

return{

id:makeId(),

type:type,

x:x,
y:y,

w:size.w,
h:size.h,

angle:0,

hp:material.hp,

maxHp:material.hp,

timer:type==="bomb"?
(currentStage?.bombTime||3):
null,

remaining:type==="bomb"?
(currentStage?.bombTime||3):
null,

generatorOn:true,

interval:3,

count:1,

dogType:"dog",

direction:"down",

blockedMultiplierId:null,

startTime:null,

targetX:null,

targetY:null

};

}


/* =========================================================
   Matter Body
========================================================= */

function createBody(obj){

const body=Matter.Bodies.rectangle(
obj.x,
obj.y,
obj.w,
obj.h,
{
isStatic:
obj.type==="bedrock"||
obj.type==="housebedrock",

restitution:0.03,

friction:.75,

frictionAir:.001,

label:obj.id
}
);

body.gameObject=obj;

return body;

}


/* =========================================================
   Canvasサイズ
   CSS座標と内部座標を完全一致させる
========================================================= */

function resizeCanvas(canvas){

const rect=canvas.getBoundingClientRect();

const width=Math.max(1,rect.width);
const height=Math.max(1,rect.height);

const dpr=Math.max(
1,
Math.min(window.devicePixelRatio||1,2)
);

canvas.width=Math.round(width*dpr);
canvas.height=Math.round(height*dpr);

const ctx=canvas.getContext("2d");

ctx.setTransform(
dpr,
0,
0,
dpr,
0,
0
);

return{
width:width,
height:height,
dpr:dpr
};

}


/* =========================================================
   Canvas座標
========================================================= */

function pointerPosition(event,canvas){

const rect=canvas.getBoundingClientRect();

return{

x:event.clientX-rect.left,

y:event.clientY-rect.top

};

}


/* =========================================================
   床
========================================================= */

function createFloor(width,height){

return Matter.Bodies.rectangle(
width/2,
height+500,
width+1000,
1000,
{
isStatic:true,
label:"floor"
}
);

}


/* =========================================================
   描画
========================================================= */

function drawFloor(ctx,width,height){

/*
   床そのものは画面には描かない。
   物理的な床だけを画面下に置く。
*/

}


function drawObject(ctx,obj,selected){

ctx.save();

ctx.translate(obj.x,obj.y);

ctx.rotate(obj.angle||0);

const w=obj.w;
const h=obj.h;

ctx.lineWidth=selected?4:2;

ctx.strokeStyle=
selected?
"#f80":
"#222";


/* 家 */

if(isHouse(obj.type)){

ctx.fillStyle="rgba(255,255,255,.2)";

ctx.fillRect(
-w/2,
-h/2,
w,
h
);

ctx.fillStyle=getColor(obj.type);

ctx.fillRect(
-w/2,
-h/2,
w,
10
);

ctx.fillRect(
-w/2,
h/2-10,
w,
10
);

ctx.fillRect(
-w/2,
-h/2,
10,
h
);

ctx.fillRect(
w/2-10,
-h/2,
10,
h
);

ctx.strokeRect(
-w/2,
-h/2,
w,
h
);

ctx.restore();

return;

}


/* 爆弾 */

if(obj.type==="bomb"){

ctx.beginPath();

ctx.fillStyle="#222";

ctx.arc(
0,
0,
Math.min(w,h)/2,
0,
Math.PI*2
);

ctx.fill();

ctx.stroke();

ctx.fillStyle="#f80";

ctx.font="bold 12px sans-serif";

ctx.textAlign="center";

ctx.textBaseline="middle";

ctx.fillText(
Math.max(
0,
obj.remaining??obj.timer??3
).toFixed(1),
0,
0
);

ctx.restore();

return;

}


/* 倍 */

if(obj.type==="multiplier"){

ctx.fillStyle="#f80";

function addBomb(x,y,timer){

const obj=createObject(
"bomb",
x,
y
);

obj.timer=timer;

obj.remaining=timer;

obj.startTime=performance.now();

const body=createBody(obj);

playObjects.push(body);

playEngine.world,
body
);

}


function updateBombs(){

const now=performance.now();

playObjects
.filter(
body=>body.gameObject.type==="bomb"
)
.forEach(
function(body){

const obj=body.gameObject;

if(!obj.startTime){

obj.startTime=now;

}

obj.remaining=Math.max(
0,
obj.timer-
(now-obj.startTime)/1000
);

if(
obj.remaining<=0 &&
!obj.exploded
){

explodeBomb(body);

}

}
);

}


/* =========================================================
   爆発
========================================================= */

function explodeBomb(bombBody){

if(!bombBody)return;

const bomb=bombBody.gameObject;

if(bomb.exploded)return;

bomb.exploded=true;

const radius=125;

const targets=playObjects.slice();

targets.forEach(
function(target){

if(target===bombBody)return;

const obj=target.gameObject;

if(
obj.type==="bomb"
||
obj.type==="multiplier"
||
obj.type==="bombgen"
||
obj.type==="doggen"
){

}

const dx=
target.position.x-
bombBody.position.x;

const dy=
target.position.y-
bombBody.position.y;

const distance=
Math.sqrt(
dx*dx+dy*dy
);

if(distance>radius)return;

let damage=2;

const material=
getMaterial(obj.type);

if(material.defense){

damage/=material.defense;

}

if(obj.hp!==Infinity){

obj.hp-=damage;

}

const d=distance||1;

Matter.Body.setVelocity(
target,
{
x:dx/d*7,
y:dy/d*7
}
);

if(
obj.hp!==Infinity &&
obj.hp<=0
){

removePlayBody(target);

}

}
);

removePlayBody(
bombBody
);

}

/* =========================================================
   倍ブロック
========================================================= */

function multiplyBomb(bomb,multiplier){

if(
bomb.blockedMultiplierId===
multiplier.id
){

return;

}

if(
bomb.lastMultiplierTime &&
performance.now()-
bomb.lastMultiplierTime<
300
){

return;

}

bomb.lastMultiplierTime=
performance.now();

const amount=5;

for(
let i=1;
i<amount;
i++
){

const child=clone(bomb);

child.id=makeId();

child.x=
bomb.x+
(i-2)*10;

child.y=
bomb.y+
(i%2)*8;

child.blockedMultiplierId=
multiplier.id;

child.startTime=
performance.now();

const body=createBody(child);

playObjects.push(body);

Matter.World.add(
playEngine.world,
body
);

}

bomb.blockedMultiplierId=
multiplier.id;

}


/* =========================================================
   移動する犬
========================================================= */

function updateMovingDogs(){

playObjects.forEach(
function(body){

const obj=body.gameObject;

if(obj.type!=="movingdog")return;

if(
obj.targetX===null||
obj.targetY===null||
Math.hypot(
obj.targetX-obj.x,
obj.targetY-obj.y
)<12
){

obj.targetX=
40+
Math.random()*
Math.max(
20,
playCanvasSize.width-80
);

obj.targetY=
40+
Math.random()*
Math.max(
20,
playCanvasSize.height-110
);

}

const dx=
obj.targetX-obj.x;

const dy=
obj.targetY-obj.y;

const distance=
Math.hypot(dx,dy)||1;

Matter.Body.setVelocity(
body,
{
x:dx/distance*1.5,
y:dy/distance*1.5
}
);

}
);

}


/* =========================================================
   発生器
========================================================= */

function updateGenerators(){

const now=performance.now();

playObjects.forEach(
function(body){

const obj=body.gameObject;

if(!obj.generatorOn)return;

if(
obj.type==="bombgen"
){

if(!obj.nextTime){

obj.nextTime=
now+
(obj.interval||3)*1000;

}

if(
now>=obj.nextTime
){

obj.nextTime=
now+
(obj.interval||3)*1000;

for(
let i=0;
i<(obj.count||1);
i++
){

addBomb(
obj.x+(i-1)*15,
obj.y+40,
obj.timer||
currentStage.bombTime||
3
);

}

}

}


if(
obj.type==="doggen"
){

if(!obj.nextTime){

obj.nextTime=
now+
(obj.interval||3)*1000;

}

if(
now>=obj.nextTime
){

obj.nextTime=
now+
(obj.interval||3)*1000;

for(
let i=0;
i<(obj.count||1);
i++
){

addGeneratedDog(obj);

}

}

}

}
);

}


/* =========================================================
   犬発生
========================================================= */

function addGeneratedDog(generator){

const type=
generator.dogType||"dog";

const obj=createObject(
type,
generator.x,
generator.y+40
);

obj.direction=
generator.direction||
"down";

if(type==="movingdog"){

obj.targetX=null;
obj.targetY=null;

}

const body=createBody(obj);

playObjects.push(body);

Matter.World.add(
playEngine.world,
body
);

let vx=0;
let vy=0;

if(generator.direction==="left")vx=-4;
if(generator.direction==="right")vx=4;
if(generator.direction==="up")vy=-4;
if(generator.direction==="down")vy=4;

Matter.Body.setVelocity(
body,
{
x:vx,
y:vy
}
);

}

}


/* =========================================================
   名前入力
========================================================= */

function openNameModal(title,value,callback){

$("modal").innerHTML=
'<h2>'+
title+
'</h2>'+
'<div class="row">'+
'<input id="nameInput" value="'+
escapeHTML(value||"")+
'">'+
'</div>'+
'<div class="modal-actions">'+
'<button id="nameCancel">キャンセル</button>'+
'<button id="nameOK" class="main">保存</button>'+
'</div>';

$("modalLayer").classList.add("show");

$("nameCancel").onclick=
closeModal;

$("nameOK").onclick=function(){

const name=
$("nameInput").value.trim();

if(!name)return;

closeModal();

callback(name);

};

}


/* =========================================================
   メッセージ
========================================================= */

function openMessage(text){

$("modal").innerHTML=
'<h2>お知らせ</h2>'+
'<div style="line-height:1.7">'+
escapeHTML(text)+
'</div>'+
'<div class="modal-actions">'+
'<button id="messageClose">閉じる</button>'+
'</div>';

$("modalLayer").classList.add("show");

$("messageClose").onclick=
closeModal;

}


/* =========================================================
   モーダル
========================================================= */

function closeModal(){

$("modalLayer").classList.remove("show");

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================================
   JSON書き出し
========================================================= */

$("exportData").addEventListener(
"click",
function(){

const blob=new Blob(
[
JSON.stringify(
stages,
null,
2
)
],
{
type:"application/json"
}
);

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=
"stage-data.json";

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
function(){
URL.revokeObjectURL(url);
},
1000
);

}
);


/* =========================================================
   JSON読み込み
========================================================= */

$("importData").addEventListener(
"click",
function(){

$("fileInput").click();

}
);


$("fileInput").addEventListener(
"change",
function(event){

const file=
event.target.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=function(){

try{

const data=
JSON.parse(
reader.result
);

if(!Array.isArray(data)){

throw new Error();

}

stages=data;

saveStages();

renderStageList();

openMessage(
"データを読み込みました。"
);

}catch(e){

openMessage(
"データの読み込みに失敗しました。"
);

}

};

reader.readAsText(file);

event.target.value="";

}
);


/* =========================================================
   リサイズ
========================================================= */

window.addEventListener(
"resize",
function(){

if(
editorEngine &&
$("editor").classList.contains("active")
){

const oldWidth=
editorCanvasSize.width;

editorCanvasSize=
resizeCanvas(
$("editorCanvas")
);

const dx=
(editorCanvasSize.width-oldWidth)/2;

if(Math.abs(dx)>1){

editorObjects.forEach(
function(body){

Matter.Body.translate(
body,
{
x:dx,
y:0
}
);

}
);

}

}

if(
playEngine &&
$("play").classList.contains("active")
){

playCanvasSize=
resizeCanvas(
$("playCanvas")
);

}

}
);


/* =========================================================
   初期化
========================================================= */

document.querySelector(
'[data-type="wood"]'
).classList.add("active");

</script>

</body>
</html>
