<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>スライム城メーカー</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  background:#f7ead3;
  color:#33251c;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.screen{
  display:none;
  position:absolute;
  inset:0;
}

.screen.active{
  display:flex;
}

/* =========================
   START
========================= */

#startScreen{
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:
    radial-gradient(circle at 50% 20%,#fff8e9 0,#f7ead3 55%,#ead1aa 100%);
}

.logo{
  font-size:clamp(32px,7vw,72px);
  font-weight:900;
  color:#7d3f18;
  text-shadow:
    0 4px 0 #fff,
    0 7px 0 rgba(90,50,20,.12);
  margin-bottom:45px;
  text-align:center;
}

.startButtons{
  display:flex;
  flex-direction:column;
  gap:18px;
  width:min(520px,85vw);
}

.mainButton{
  min-height:72px;
  border-radius:18px;
  background:#e77d28;
  color:#fff;
  font-weight:900;
  font-size:22px;
  box-shadow:
    0 5px 0 #a84e16,
    0 9px 18px rgba(90,50,20,.18);
}

.mainButton:active{
  transform:translateY(4px);
  box-shadow:
    0 1px 0 #a84e16,
    0 4px 10px rgba(90,50,20,.18);
}

.subButton{
  background:#fff8ea;
  color:#713d1e;
  border:3px solid #d9a36d;
  box-shadow:0 4px 0 #bd8250;
}

/* =========================
   TOP BAR
========================= */

#editorScreen,
#playScreen{
  flex-direction:column;
}

.topbar{
  height:64px;
  min-height:64px;
  background:#713b1b;
  color:white;
  display:flex;
  align-items:center;
  gap:9px;
  padding:7px 10px;
  z-index:20;
  box-shadow:0 3px 8px rgba(0,0,0,.25);
}

.topTitle{
  font-weight:900;
  font-size:19px;
  margin-right:auto;
  white-space:nowrap;
}

.topButton{
  background:#fff3df;
  color:#5e3218;
  border-radius:10px;
  padding:9px 13px;
  font-weight:800;
  white-space:nowrap;
}

.topButton.orange{
  background:#f80;
  color:#fff;
}

.topButton.red{
  background:#bd3327;
  color:white;
}

@media(max-width:700px){
  .topbar{
    height:58px;
    min-height:58px;
    padding:5px;
    gap:5px;
  }

  .topTitle{
    font-size:14px;
  }

  .topButton{
    padding:7px 8px;
    font-size:12px;
  }
}

/* =========================
   EDITOR
========================= */

.editorArea,
.playArea{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  background:#e9d0a5;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

/* editor toolbar */

.editorToolbar{
  position:absolute;
  left:10px;
  top:10px;
  z-index:10;
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  max-width:min(650px,calc(100vw - 20px));
  pointer-events:none;
}

.tool{
  pointer-events:auto;
  min-width:62px;
  min-height:52px;
  border-radius:11px;
  background:#fff5e2;
  border:2px solid #c38b52;
  color:#563019;
  box-shadow:0 3px 5px rgba(60,30,10,.2);
  font-weight:900;
}

.tool.selected{
  background:#f80;
  color:white;
  border-color:#a94e00;
}

.tool small{
  display:block;
  font-size:10px;
  opacity:.8;
}

.toolIcon{
  font-size:20px;
  line-height:20px;
}

/* editor information */

.editorInfo{
  position:absolute;
  right:10px;
  top:10px;
  z-index:10;
  background:rgba(255,248,232,.92);
  border:2px solid #bd8b58;
  border-radius:10px;
  padding:9px 12px;
  font-size:12px;
  font-weight:700;
  pointer-events:none;
  max-width:250px;
}

/* zoom */

.zoomBox{
  position:absolute;
  right:10px;
  bottom:10px;
  z-index:10;
  display:flex;
  gap:6px;
}

.zoomBox button{
  width:45px;
  height:45px;
  border-radius:10px;
  background:#fff5e2;
  border:2px solid #bd8b58;
  font-size:23px;
  font-weight:900;
  color:#57311a;
}

/* stage name */

.stageNameBox{
  position:absolute;
  left:10px;
  bottom:10px;
  z-index:10;
  background:rgba(255,248,232,.95);
  border:2px solid #bd8b58;
  border-radius:10px;
  padding:7px;
  display:flex;
  gap:6px;
}

.stageNameBox input{
  width:180px;
  border:2px solid #c9945c;
  border-radius:7px;
  padding:7px;
  background:#fff;
}

.stageNameBox button{
  background:#e77d28;
  color:#fff;
  border-radius:7px;
  padding:7px 10px;
  font-weight:900;
}

/* =========================
   PLAY
========================= */

.playInfo{
  position:absolute;
  left:10px;
  top:10px;
  z-index:10;
  background:rgba(255,248,232,.92);
  border:2px solid #bd8b58;
  border-radius:10px;
  padding:8px 12px;
  font-weight:800;
  pointer-events:none;
}

.playHelp{
  position:absolute;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:10;
  background:rgba(80,40,20,.82);
  color:white;
  padding:9px 16px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
  pointer-events:none;
  white-space:nowrap;
}

/* =========================
   SELECT
========================= */

#selectScreen{
  flex-direction:column;
  background:#f7ead3;
}

.selectHeader{
  height:72px;
  min-height:72px;
  background:#713b1b;
  color:white;
  display:flex;
  align-items:center;
  padding:0 15px;
  gap:10px;
}

.selectHeader h1{
  margin:0;
  font-size:24px;
}

.selectHeader button{
  margin-left:auto;
  padding:10px 16px;
  border-radius:9px;
  background:#fff2dc;
  color:#663516;
  font-weight:900;
}

.stageList{
  flex:1;
  overflow:auto;
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:15px;
  align-content:start;
}

.stageCard{
  background:#fff7e8;
  border:3px solid #d2a06d;
  border-radius:15px;
  padding:16px;
  box-shadow:0 4px 8px rgba(80,40,10,.15);
}

.stageCard h2{
  margin:0 0 8px;
  font-size:19px;
}

.stageMeta{
  font-size:12px;
  color:#76533c;
  margin-bottom:13px;
}

.stageActions{
  display:flex;
  gap:7px;
}

.stageActions button{
  flex:1;
  padding:9px;
  border-radius:8px;
  background:#e77d28;
  color:#fff;
  font-weight:900;
}

.stageActions .delete{
  background:#bd3327;
}

.noStages{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:#79563e;
  font-weight:800;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){
  .editorInfo{
    display:none;
  }

  .stageNameBox input{
    width:130px;
  }

  .tool{
    min-width:55px;
    min-height:48px;
  }

  .playHelp{
    font-size:11px;
    bottom:7px;
  }
}
</style>
</head>

<body>

<!-- =========================
     START
========================= -->

<section id="startScreen" class="screen active">

  <div class="logo">
    スライム城メーカー
  </div>

  <div class="startButtons">

    <button class="mainButton" id="createStageButton">
      ステージを作る
    </button>

    <button class="mainButton" id="playStageButton">
      ステージで遊ぶ
    </button>

  </div>

</section>


<!-- =========================
     SELECT
========================= -->

<section id="selectScreen" class="screen">

  <div class="selectHeader">
    <h1>ステージを選択</h1>
    <button id="selectBackButton">戻る</button>
  </div>

  <div id="stageList" class="stageList"></div>

</section>


<!-- =========================
     EDITOR
========================= -->

<section id="editorScreen" class="screen">

  <div class="topbar">

    <div class="topTitle">
      ステージ作成
    </div>

    <button class="topButton" id="editorTestButton">
      テストプレイ
    </button>

    <button class="topButton orange" id="saveStageButton">
      保存
    </button>

    <button class="topButton red" id="editorExitButton">
      終了
    </button>

  </div>

  <div class="editorArea">

    <canvas id="editorCanvas"></canvas>

    <div class="editorToolbar">

      <button class="tool selected" data-tool="wood">
        <span class="toolIcon">🪵</span>
        <small>木</small>
      </button>

      <button class="tool" data-tool="glass">
        <span class="toolIcon">▱</span>
        <small>ガラス</small>
      </button>

      <button class="tool" data-tool="stone">
        <span class="toolIcon">⬛</span>
        <small>石</small>
      </button>

      <button class="tool" data-tool="enemy">
        <span class="toolIcon">●</span>
        <small>敵</small>
      </button>

      <button class="tool" data-tool="bomb">
        <span class="toolIcon">💣</span>
        <small>爆弾</small>
      </button>

      <button class="tool" data-tool="erase">
        <span class="toolIcon">⌫</span>
        <small>消す</small>
      </button>

      <button class="tool" data-tool="pan">
        <span class="toolIcon">✋</span>
        <small>移動</small>
      </button>

    </div>

    <div class="editorInfo">
      クリック：配置<br>
      移動ツール：ドラッグ<br>
      ホイール：ズーム<br>
      <span id="editorObjectCount">物体 0</span>
    </div>

    <div class="stageNameBox">

      <input
        id="stageNameInput"
        maxlength="40"
        placeholder="ステージ名"
      >

      <button id="clearStageButton">
        全消去
      </button>

    </div>

    <div class="zoomBox">
      <button id="zoomOut">−</button>
      <button id="zoomReset">100%</button>
      <button id="zoomIn">＋</button>
    </div>

  </div>

</section>


<!-- =========================
     PLAY
========================= -->

<section id="playScreen" class="screen">

  <div class="topbar">

    <div class="topTitle" id="playTitle">
      プレイ
    </div>

    <button class="topButton orange" id="explodeButton">
      全爆破
    </button>

    <button class="topButton" id="playRestartButton">
      リセット
    </button>

    <button class="topButton red" id="playExitButton">
      終了
    </button>

  </div>

  <div class="playArea">

    <canvas id="playCanvas"></canvas>

    <div class="playInfo">
      爆弾：<span id="bombCount">0</span>
    </div>

    <div class="playHelp">
      画面をクリックして爆弾を配置 → 「全爆破」
    </div>

  </div>

</section>


<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>

<script>
"use strict";

/* ============================================================
   Matter.js
============================================================ */

const {
  Engine,
  World,
  Bodies,
  Body,
  Composite,
  Vector
} = Matter;


/* ============================================================
   定数
============================================================ */

const STORAGE_KEY = "slimeCastleMakerStages_v2";

const WORLD_GROUND_Y = 9000;

const EXPLOSION_RADIUS = 110;
const EXPLOSION_FORCE_RADIUS = 150;
const EXPLOSION_FORCE = 0.045;
const EXPLOSION_BLOCK_DAMAGE = 150;

const ENEMY_KILL_IMPACT = 9;

const IMPACT_MASS_CAP = 14;

const FALLING_BLOCK_THRESHOLD = 4.5;

const CAMERA_PADDING = 100;


/* ============================================================
   素材設定
   HinaTech公開ソースの数値をベースにした物理設定
============================================================ */

const MATERIALS = {

  wood:{
    density:0.0035,
    friction:0.4,
    restitution:0.08,
    hp:2,
    threshold:16,
    color:"#9a5c2e"
  },

  glass:{
    density:0.0028,
    friction:0.15,
    restitution:0.25,
    hp:1,
    threshold:10,
    color:"#a9dbe5"
  },

  stone:{
    density:0.008,
    friction:0.6,
    restitution:0.02,
    hp:3,
    threshold:48,
    color:"#77736d"
  }

};


/* ============================================================
   状態
============================================================ */

let currentScreen = "start";

let currentTool = "wood";

let currentStageId = null;

let editorEngine = null;
let playEngine = null;

let editorCanvas = null;
let playCanvas = null;

let editorCtx = null;
let playCtx = null;

let editorCamera = {
  x:0,
  y:0,
  zoom:1
};

let playCamera = {
  x:0,
  y:0,
  zoom:1
};

let editorPointer = {
  down:false,
  x:0,
  y:0,
  lastX:0,
  lastY:0,
  moved:false
};

let playPointer = {
  down:false
};

let editorAnimation = 0;
let playAnimation = 0;


/* ============================================================
   DOM
============================================================ */

const startScreen = document.getElementById("startScreen");
const selectScreen = document.getElementById("selectScreen");
const editorScreen = document.getElementById("editorScreen");
const playScreen = document.getElementById("playScreen");

const stageList = document.getElementById("stageList");

const stageNameInput =
  document.getElementById("stageNameInput");

const editorObjectCount =
  document.getElementById("editorObjectCount");

const bombCount =
  document.getElementById("bombCount");

const playTitle =
  document.getElementById("playTitle");


/* ============================================================
   ステージデータ
============================================================ */

function loadStages(){

  try{

    const raw =
      localStorage.getItem(STORAGE_KEY);

    if(!raw){
      return [];
    }

    const data = JSON.parse(raw);

    if(!Array.isArray(data)){
      return [];
    }

    return data;

  }catch(e){

    console.error(e);

    return [];

  }

}


function saveStages(stages){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(stages)
  );

}


function makeId(){

  return Date.now().toString(36) +
    "_" +
    Math.random().toString(36).slice(2);

}


/* ============================================================
   ステージ選択画面
============================================================ */

function renderStageList(){

  const stages = loadStages();

  stageList.innerHTML = "";

  if(stages.length === 0){

    const div =
      document.createElement("div");

    div.className = "noStages";

    div.innerHTML =
      "保存されたステージはありません。<br>" +
      "「ステージを作る」から作成してください。";

    stageList.appendChild(div);

    return;

  }


  stages.forEach(stage => {

    const card =
      document.createElement("div");

    card.className = "stageCard";

    const objects =
      Array.isArray(stage.objects)
        ? stage.objects
        : [];

    const enemies =
      objects.filter(x => x.type === "enemy").length;

    const blocks =
      objects.filter(x =>
        x.type === "wood" ||
        x.type === "glass" ||
        x.type === "stone"
      ).length;

    card.innerHTML = `

      <h2>${escapeHtml(stage.name || "無題のステージ")}</h2>

      <div class="stageMeta">
        物体：${objects.length}<br>
        敵：${enemies}<br>
        建築物：${blocks}
      </div>

      <div class="stageActions">

        <button class="playStage">
          遊ぶ
        </button>

        <button class="editStage">
          編集
        </button>

        <button class="delete">
          削除
        </button>

      </div>

    `;

    card.querySelector(".playStage")
      .addEventListener("click",() => {

        openPlayStage(stage.id);

      });


    card.querySelector(".editStage")
      .addEventListener("click",() => {

        openEditor(stage.id);

      });


    card.querySelector(".delete")
      .addEventListener("click",() => {

        if(!confirm(
          "このステージを削除しますか？"
        )){
          return;
        }

        const newStages =
          loadStages().filter(
            x => x.id !== stage.id
          );

        saveStages(newStages);

        renderStageList();

      });


    stageList.appendChild(card);

  });

}


function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ============================================================
   画面切り替え
============================================================ */

function showScreen(name){

  [
    startScreen,
    selectScreen,
    editorScreen,
    playScreen
  ].forEach(x =>
    x.classList.remove("active")
  );


  if(name === "start"){
    startScreen.classList.add("active");
  }

  if(name === "select"){
    selectScreen.classList.add("active");
    renderStageList();
  }

  if(name === "editor"){
    editorScreen.classList.add("active");
  }

  if(name === "play"){
    playScreen.classList.add("active");
  }

  currentScreen = name;

  resizeCanvases();

}


/* ============================================================
   エンジン生成
============================================================ */

function createEngine(){

  const engine =
    Engine.create();

  engine.gravity.x = 0;
  engine.gravity.y = 1;
  engine.gravity.scale = 0.001;

  engine.positionIterations = 8;
  engine.velocityIterations = 6;
  engine.constraintIterations = 2;

  return engine;

}


/* ============================================================
   地面
============================================================ */

function createGround(engine){

  const ground =
    Bodies.rectangle(
      0,
      WORLD_GROUND_Y,
      300000,
      100,
      {
        isStatic:true,
        label:"ground"
      }
    );

  ground.plugin = {
    gameType:"ground"
  };

  World.add(
    engine.world,
    ground
  );

}


/* ============================================================
   物体生成
============================================================ */

function createBlock(
  engine,
  material,
  x,
  y,
  w = 80,
  h = 30,
  angle = 0
){

  const m =
    MATERIALS[material];

  if(!m){
    return null;
  }


  const body =
    Bodies.rectangle(
      x,
      y,
      w,
      h,
      {
        angle:angle,

        density:m.density,

        friction:m.friction,

        restitution:m.restitution,

        frictionAir:0.001,

        label:"block"
      }
    );


  body.plugin = {

    gameType:"block",

    material:material,

    hp:m.hp,

    maxHp:m.hp,

    threshold:m.threshold,

    width:w,

    height:h

  };


  World.add(
    engine.world,
    body
  );


  return body;

}


function createEnemy(
  engine,
  x,
  y,
  radius = 23
){

  const body =
    Bodies.circle(
      x,
      y,
      radius,
      {
        density:0.0025,
        friction:0.5,
        restitution:0.1,
        frictionAir:0.002,
        label:"enemy"
      }
    );


  body.plugin = {

    gameType:"enemy",

    radius:radius,

    alive:true,

    hp:1

  };


  World.add(
    engine.world,
    body
  );


  return body;

}


function createBomb(
  engine,
  x,
  y
){

  const body =
    Bodies.circle(
      x,
      y,
      12,
      {
        density:0.003,
        friction:0.4,
        restitution:0.2,
        label:"bomb",
        isStatic:true
      }
    );


  body.plugin = {

    gameType:"bomb",

    radius:12,

    exploded:false

  };


  World.add(
    engine.world,
    body
  );


  return body;

}


/* ============================================================
   衝突ダメージ計算
============================================================ */

function computeCollisionImpact(
  a,
  b,
  target
){

  if(!a || !b || !target){
    return 0;
  }


  const av =
    a.velocity || {x:0,y:0};

  const bv =
    b.velocity || {x:0,y:0};


  const rvx =
    av.x - bv.x;

  const rvy =
    av.y - bv.y;


  const relativeSpeed =
    Math.sqrt(
      rvx * rvx +
      rvy * rvy
    );


  const mass =
    Math.min(
      target.mass || 1,
      IMPACT_MASS_CAP
    );


  return relativeSpeed * mass;

}


/* ============================================================
   衝突処理
============================================================ */

function setupCollisionEvents(engine){

  Matter.Events.on(
    engine,
    "collisionStart",
    event => {

      for(
        const pair of event.pairs
      ){

        processCollisionPair(
          pair.bodyA,
          pair.bodyB
        );

      }

    }
  );


  Matter.Events.on(
    engine,
    "collisionActive",
    event => {

      for(
        const pair of event.pairs
      ){

        processCollisionPair(
          pair.bodyA,
          pair.bodyB
        );

      }

    }
  );

}


function processCollisionPair(a,b){

  if(!a || !b){
    return;
  }


  const ag =
    a.plugin &&
    a.plugin.gameType;

  const bg =
    b.plugin &&
    b.plugin.gameType;


  if(
    ag === "ground" ||
    bg === "ground"
  ){
    return;
  }


  if(
    ag === "enemy" &&
    bg === "block"
  ){

    processEnemyBlock(
      a,
      b
    );

    return;

  }


  if(
    bg === "enemy" &&
    ag === "block"
  ){

    processEnemyBlock(
      b,
      a
    );

    return;

  }


  if(
    ag === "enemy" &&
    bg === "enemy"
  ){

    return;

  }


  if(
    ag === "block" &&
    bg === "block"
  ){

    processBlockBlock(
      a,
      b
    );

  }

}


function processEnemyBlock(
  enemy,
  block
){

  if(
    !enemy.plugin.alive ||
    block.plugin.hp <= 0
  ){
    return;
  }


  const impact =
    computeCollisionImpact(
      enemy,
      block,
      enemy
    );


  if(
    impact >= ENEMY_KILL_IMPACT
  ){

    killEnemy(
      enemy
    );

  }

}


function processBlockBlock(
  a,
  b
){

  if(
    a.plugin.hp <= 0 ||
    b.plugin.hp <= 0
  ){
    return;
  }


  damageBlockFromCollision(
    a,
    b
  );

  damageBlockFromCollision(
    b,
    a
  );

}


function damageBlockFromCollision(
  target,
  other
){

  const impact =
    computeCollisionImpact(
      target,
      other,
      target
    );


  const minimum =
    FALLING_BLOCK_THRESHOLD;


  if(
    impact < minimum
  ){
    return;
  }


  const threshold =
    target.plugin.threshold;


  const damage =
    Math.max(
      1,
      Math.floor(
        impact / threshold
      )
    );


  target.plugin.hp -= damage;


  if(
    target.plugin.hp <= 0
  ){

    destroyBody(
      target
    );

  }

}


function killEnemy(enemy){

  if(
    !enemy ||
    !enemy.plugin ||
    !enemy.plugin.alive
  ){
    return;
  }


  enemy.plugin.alive = false;

  enemy.plugin.deathTime =
    performance.now();


  Body.setStatic(
    enemy,
    true
  );


}


/* ============================================================
   物体削除
============================================================ */

function destroyBody(body){

  if(
    !body ||
    body.isStatic &&
    body.plugin &&
    body.plugin.gameType === "ground"
  ){
    return;
  }


  World.remove(
    body._engineWorld ||
    activeEngine(),
    body
  );

}


/*
  World.removeはengine.worldが必要なので
  bodyから取得できない場合は現在のengineを使う
*/

function activeEngine(){

  if(currentScreen === "editor"){
    return editorEngine;
  }

  return playEngine;

}


/* ============================================================
   爆発
============================================================ */

function explodeAt(
  engine,
  px,
  py
){

  const bodies =
    Composite.allBodies(
      engine.world
    );


  for(
    const body of bodies
  ){

    if(
      !body.position ||
      body.isStatic
    ){
      continue;
    }


    const dx =
      body.position.x - px;

    const dy =
      body.position.y - py;

    const d =
      Math.sqrt(
        dx * dx +
        dy * dy
      );


    if(
      d > EXPLOSION_FORCE_RADIUS ||
      d === 0
    ){
      continue;
    }


    const nx =
      dx / d;

    const ny =
      dy / d;


    const strength =
      EXPLOSION_FORCE *
      (1 - d / EXPLOSION_FORCE_RADIUS);


    const mass =
      Math.max(
        0.001,
        body.mass
      );


    Body.applyForce(
      body,
      body.position,
      {
        x:nx * strength * mass,
        y:ny * strength * mass
      }
    );


    if(
      body.plugin &&
      body.plugin.gameType === "block"
    ){

      const damage =
        EXPLOSION_BLOCK_DAMAGE *
        (1 - d / EXPLOSION_FORCE_RADIUS);


      body.plugin.hp -= damage / 100;


      if(
        body.plugin.hp <= 0
      ){

        World.remove(
          engine.world,
          body
        );

      }

    }


    if(
      body.plugin &&
      body.plugin.gameType === "enemy" &&
      body.plugin.alive
    ){

      if(
        d <
        EXPLOSION_RADIUS * 0.95
      ){

        killEnemy(
          body
        );

      }

    }

  }


  createExplosionVisual(
    engine,
    px,
    py
  );

}


/* ============================================================
   爆発エフェクト
============================================================ */

const explosionEffects = [];

function createExplosionVisual(
  engine,
  x,
  y
){

  explosionEffects.push({

    x:x,

    y:y,

    start:performance.now(),

    duration:420,

    radius:EXPLOSION_RADIUS

  });

}


/* ============================================================
   全爆破
============================================================ */

function explodeAllBombs(){

  if(!playEngine){
    return;
  }


  const bombs =
    Composite.allBodies(
      playEngine.world
    ).filter(
      body =>
        body.plugin &&
        body.plugin.gameType === "bomb"
    );


  for(
    const bomb of bombs
  ){

    explodeAt(
      playEngine,
      bomb.position.x,
      bomb.position.y
    );

  }


  for(
    const bomb of bombs
  ){

    World.remove(
      playEngine.world,
      bomb
    );

  }


  updateBombCount();

}


/* ============================================================
   カメラ
============================================================ */

function screenToWorld(
  canvas,
  camera,
  sx,
  sy
){

  return {

    x:
      (sx - canvas.width / 2) /
      camera.zoom +
      camera.x,

    y:
      (sy - canvas.height / 2) /
      camera.zoom +
      camera.y

  };

}


function worldToScreen(
  canvas,
  camera,
  x,
  y
){

  return {

    x:
      (x - camera.x) *
      camera.zoom +
      canvas.width / 2,

    y:
      (y - camera.y) *
      camera.zoom +
      canvas.height / 2

  };

}


/* ============================================================
   エディタ用グリッド
============================================================ */

function drawEditorGrid(){

  const ctx =
    editorCtx;

  const canvas =
    editorCanvas;

  const camera =
    editorCamera;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.fillStyle =
    "#e9d0a5";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  const step =
    100 * camera.zoom;


  if(step < 8){
    return;
  }


  const origin =
    worldToScreen(
      canvas,
      camera,
      0,
      0
    );


  ctx.beginPath();

  ctx.strokeStyle =
    "rgba(100,70,40,.12)";

  ctx.lineWidth = 1;


  let startX =
    ((origin.x % step) + step) % step;

  for(
    let x=startX;
    x<canvas.width;
    x+=step
  ){

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      canvas.height
    );

  }


  let startY =
    ((origin.y % step) + step) % step;

  for(
    let y=startY;
    y<canvas.height;
    y+=step
  ){

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      canvas.width,
      y
    );

  }


  ctx.stroke();


  /* 原点 */

  ctx.beginPath();

  ctx.strokeStyle =
    "rgba(100,60,30,.4)";

  ctx.lineWidth = 2;

  ctx.moveTo(
    origin.x,
    0
  );

  ctx.lineTo(
    origin.x,
    canvas.height
  );

  ctx.moveTo(
    0,
    origin.y
  );

  ctx.lineTo(
    canvas.width,
    origin.y
  );

  ctx.stroke();

}


/* ============================================================
   地面描画
============================================================ */

function drawGround(
  ctx,
  canvas,
  camera
){

  const p =
    worldToScreen(
      canvas,
      camera,
      0,
      WORLD_GROUND_Y
    );


  if(
    p.y < -100 ||
    p.y > canvas.height + 100
  ){
    return;
  }


  ctx.save();

  ctx.fillStyle =
    "#c59b62";

  ctx.fillRect(
    0,
    p.y,
    canvas.width,
    canvas.height - p.y
  );


  ctx.strokeStyle =
    "#8c663d";

  ctx.lineWidth =
    3;

  ctx.beginPath();

  ctx.moveTo(
    0,
    p.y
  );

  ctx.lineTo(
    canvas.width,
    p.y
  );

  ctx.stroke();

  ctx.restore();

}


/* ============================================================
   ボディ描画
============================================================ */

function drawBody(
  ctx,
  canvas,
  camera,
  body
){

  if(
    !body ||
    !body.position
  ){
    return;
  }


  const type =
    body.plugin &&
    body.plugin.gameType;


  if(type === "ground"){
    return;
  }


  const pos =
    worldToScreen(
      canvas,
      camera,
      body.position.x,
      body.position.y
    );


  ctx.save();

  ctx.translate(
    pos.x,
    pos.y
  );

  ctx.rotate(
    body.angle || 0
  );


  if(type === "block"){

    drawBlock(
      ctx,
      body
    );

  }
  else if(type === "enemy"){

    drawEnemy(
      ctx,
      body
    );

  }
  else if(type === "bomb"){

    drawBomb(
      ctx,
      body
    );

  }


  ctx.restore();

}


/* ============================================================
   木・ガラス・石
============================================================ */

function drawBlock(
  ctx,
  body
){

  const p =
    body.plugin;

  const w =
    p.width;

  const h =
    p.height;


  if(p.material === "wood"){

    ctx.fillStyle =
      "#a96332";

    ctx.strokeStyle =
      "#673719";

    ctx.lineWidth =
      3;

    ctx.fillRect(
      -w/2,
      -h/2,
      w,
      h
    );

    ctx.strokeRect(
      -w/2,
      -h/2,
      w,
      h
    );


    ctx.strokeStyle =
      "rgba(80,35,15,.35)";

    ctx.lineWidth =
      2;


    for(
      let y=-h/2+8;
      y<h/2;
      y+=10
    ){

      ctx.beginPath();

      ctx.moveTo(
        -w/2+4,
        y
      );

      ctx.lineTo(
        w/2-4,
        y + Math.sin(y)*2
      );

      ctx.stroke();

    }

  }


  if(p.material === "glass"){

    ctx.fillStyle =
      "rgba(190,235,245,.62)";

    ctx.strokeStyle =
      "#4e9aaa";

    ctx.lineWidth =
      3;

    ctx.fillRect(
      -w/2,
      -h/2,
      w,
      h
    );

    ctx.strokeRect(
      -w/2,
      -h/2,
      w,
      h
    );


    ctx.strokeStyle =
      "rgba(255,255,255,.8)";

    ctx.lineWidth =
      2;

    ctx.beginPath();

    ctx.moveTo(
      -w/2+5,
      h/2-5
    );

    ctx.lineTo(
      w/2-5,
      -h/2+5
    );

    ctx.stroke();

  }


  if(p.material === "stone"){

    ctx.fillStyle =
      "#77746e";

    ctx.strokeStyle =
      "#484640";

    ctx.lineWidth =
      3;

    ctx.fillRect(
      -w/2,
      -h/2,
      w,
      h
    );

    ctx.strokeRect(
      -w/2,
      -h/2,
      w,
      h
    );


    ctx.strokeStyle =
      "rgba(255,255,255,.12)";

    ctx.lineWidth =
      2;


    ctx.beginPath();

    ctx.moveTo(
      -w/2+8,
      0
    );

    ctx.lineTo(
      w/2-8,
      0
    );

    ctx.moveTo(
      0,
      -h/2+5
    );

    ctx.lineTo(
      0,
      h/2-5
    );

    ctx.stroke();

  }


  /* 耐久ゲージ */

  if(
    p.hp < p.maxHp
  ){

    const ratio =
      Math.max(
        0,
        Math.min(
          1,
          p.hp / p.maxHp
        )
      );


    ctx.fillStyle =
      "rgba(0,0,0,.45)";

    ctx.fillRect(
      -w/2,
      -h/2-8,
      w,
      5
    );


    ctx.fillStyle =
      "#5ca347";

    ctx.fillRect(
      -w/2,
      -h/2-8,
      w * ratio,
      5
    );

  }

}


/* ============================================================
   敵描画
============================================================ */

function drawEnemy(
  ctx,
  body
){

  const p =
    body.plugin;

  const r =
    p.radius;


  if(
    !p.alive
  ){

    ctx.globalAlpha =
      Math.max(
        0,
        1 -
        (performance.now() -
          (p.deathTime || performance.now()))
        / 500
      );

  }


  ctx.fillStyle =
    "#78a63c";

  ctx.strokeStyle =
    "#476426";

  ctx.lineWidth =
    3;


  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.stroke();


  /* 目 */

  ctx.fillStyle =
    "#fff";

  ctx.beginPath();

  ctx.arc(
    -r*0.34,
    -r*0.2,
    r*0.23,
    0,
    Math.PI*2
  );

  ctx.arc(
    r*0.34,
    -r*0.2,
    r*0.23,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle =
    "#222";

  ctx.beginPath();

  ctx.arc(
    -r*0.30,
    -r*0.17,
    r*0.10,
    0,
    Math.PI*2
  );

  ctx.arc(
    r*0.30,
    -r*0.17,
    r*0.10,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* 口 */

  ctx.strokeStyle =
    "#36501d";

  ctx.lineWidth =
    2;

  ctx.beginPath();

  ctx.arc(
    0,
    r*0.05,
    r*0.35,
    0,
    Math.PI
  );

  ctx.stroke();

}


/* ============================================================
   爆弾描画
============================================================ */

function drawBomb(
  ctx
){

  ctx.fillStyle =
    "#222";

  ctx.strokeStyle =
    "#111";

  ctx.lineWidth =
    2;


  ctx.beginPath();

  ctx.arc(
    0,
    2,
    11,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.stroke();


  ctx.fillStyle =
    "#333";

  ctx.fillRect(
    -3,
    -13,
    6,
    5
  );


  ctx.strokeStyle =
    "#f0a400";

  ctx.lineWidth =
    2;

  ctx.beginPath();

  ctx.moveTo(
    0,
    -13
  );

  ctx.quadraticCurveTo(
    5,
    -20,
    8,
    -17
  );

  ctx.stroke();

}


/* ============================================================
   爆発描画
============================================================ */

function drawExplosionEffects(
  ctx,
  canvas,
  camera
){

  const now =
    performance.now();


  for(
    let i=explosionEffects.length-1;
    i>=0;
    i--
  ){

    const e =
      explosionEffects[i];

    const elapsed =
      now - e.start;


    if(
      elapsed > e.duration
    ){

      explosionEffects.splice(
        i,
        1
      );

      continue;

    }


    const t =
      elapsed / e.duration;


    const radius =
      e.radius *
      (0.3 + t * 0.7);


    const p =
      worldToScreen(
        canvas,
        camera,
        e.x,
        e.y
      );


    ctx.save();

    ctx.globalAlpha =
      1 - t;


    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      radius * camera.zoom,
      0,
      Math.PI*2
    );


    const grad =
      ctx.createRadialGradient(
        p.x,
        p.y,
        0,
        p.x,
        p.y,
        radius * camera.zoom
      );


    grad.addColorStop(
      0,
      "rgba(255,245,170,.95)"
    );

    grad.addColorStop(
      .45,
      "rgba(255,150,20,.65)"
    );

    grad.addColorStop(
      1,
      "rgba(230,50,10,0)"
    );


    ctx.fillStyle =
      grad;

    ctx.fill();


    ctx.restore();

  }

}


/* ============================================================
   全ボディ描画
============================================================ */

function drawWorld(
  ctx,
  canvas,
  engine,
  camera,
  editor = false
){

  if(!ctx || !canvas || !engine){
    return;
  }


  if(editor){

    drawEditorGrid();

  }
  else{

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.fillStyle =
      "#e9d0a5";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

  }


  drawGround(
    ctx,
    canvas,
    camera
  );


  const bodies =
    Composite.allBodies(
      engine.world
    );


  for(
    const body of bodies
  ){

    drawBody(
      ctx,
      canvas,
      camera,
      body
    );

  }


  drawExplosionEffects(
    ctx,
    canvas,
    camera
  );

}

/* ============================================================
   キャンバスサイズ
============================================================ */

function resizeCanvas(
  canvas,
  ctx
){

  if(!canvas || !ctx){
    return;
  }


  const rect =
    canvas.getBoundingClientRect();


  const dpr =
    Math.max(
      1,
      Math.min(
        2,
        window.devicePixelRatio || 1
      )
    );


  canvas.width =
    Math.max(
      1,
      Math.floor(
        rect.width * dpr
      )
    );


  canvas.height =
    Math.max(
      1,
      Math.floor(
        rect.height * dpr
      )
    );


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}


function resizeCanvases(){

  resizeCanvas(
    editorCanvas,
    editorCtx
  );

  resizeCanvas(
    playCanvas,
    playCtx
  );

}


/* ============================================================
   エディタ開始
============================================================ */

function startNewEditor(){

  currentStageId = null;

  stageNameInput.value =
    "新しいステージ";


  editorEngine =
    createEngine();


  createGround(
    editorEngine
  );


  setupCollisionEvents(

  );

  editorCamera.y = 0;
  editorCamera.zoom = 1;


  showScreen(
    "editor"
  );


  resizeCanvases();

}


function openEditor(
  stageId
){

  const stage =
    loadStages().find(
      x => x.id === stageId
    );


  if(!stage){
    return;
  }


  currentStageId =
    stage.id;


  stageNameInput.value =
    stage.name || "無題";


  editorEngine =
    createEngine();


  createGround(
    editorEngine
  );


  setupCollisionEvents(
    editorEngine
  );


  loadObjectsIntoEngine(
    editorEngine,
    stage.objects || []
  );


  editorCamera =
    calculateEditorCamera(
      editorEngine
    );


  showScreen(
    "editor"
  );


  resizeCanvases();

}


/* ============================================================
   エディタカメラ
============================================================ */

function calculateEditorCamera(
  engine
){

  const bodies =
    Composite.allBodies(
      engine.world
    ).filter(
      b =>
        b.plugin &&
        b.plugin.gameType !== "ground"
    );


  if(bodies.length === 0){

    return {
      x:0,
      y:300,
      zoom:1
    };

  }


  let minX=Infinity;
  let maxX=-Infinity;
  let minY=Infinity;
  let maxY=-Infinity;


  bodies.forEach(b => {

    minX =
      Math.min(
        minX,
        b.position.x
      );

    maxX =
      Math.max(
        maxX,
        b.position.x
      );

    minY =
      Math.min(
        minY,
        b.position.y
      );

    maxY =
      Math.max(
        maxY,
        b.position.y
      );

  });


  return {

    x:(minX+maxX)/2,

    y:(minY+maxY)/2,

    zoom:1

  };

}


/* ============================================================
   ステージ読み込み
============================================================ */

function loadObjectsIntoEngine(
  engine,
  objects
){

  objects.forEach(obj => {

    if(
      obj.type === "wood" ||
      obj.type === "glass" ||
      obj.type === "stone"
    ){

      createBlock(
        engine,
        obj.type,
        obj.x,
        obj.y,
        obj.w || 80,
        obj.h || 30,
        obj.angle || 0
      );

    }
    else if(
      obj.type === "enemy"
    ){

      createEnemy(
        engine,
        obj.x,
        obj.y,
        obj.r || 23
      );

    }

  });

}


/* ============================================================
   ステージ保存用データ
============================================================ */

function engineToObjects(
  engine
){

  return Composite.allBodies(
    engine.world
  )
  .filter(
    body =>
      body.plugin &&
      body.plugin.gameType !== "ground"
  )
  .map(body => {

    const type =
      body.plugin.gameType;


    if(type === "block"){

      return {

        type:
          body.plugin.material,

        x:
          body.position.x,

        y:
          body.position.y,

        w:
          body.plugin.width,

        h:
          body.plugin.height,

        angle:
          body.angle

      };

    }


    if(type === "enemy"){

      return {

        type:"enemy",

        x:
          body.position.x,

        y:
          body.position.y,

        r:
          body.plugin.radius,

        angle:
          body.angle

      };

    }


    return null;

  })
  .filter(Boolean);

}


/* ============================================================
   保存
============================================================ */

function saveCurrentStage(){

  if(!editorEngine){
    return;
  }


  const name =
    stageNameInput.value.trim() ||
    "無題のステージ";


  const objects =
    engineToObjects(
      editorEngine
    );


  const stages =
    loadStages();


  let stage;


  if(currentStageId){

    stage =
      stages.find(
        x => x.id === currentStageId
      );

  }


  if(!stage){

    stage = {

      id:
        currentStageId ||
        makeId(),

      name:name,

      createdAt:
        Date.now(),

      objects:[]

    };

    currentStageId =
      stage.id;

    stages.push(
      stage
    );

  }


  stage.name =
    name;

  stage.objects =
    objects;

  stage.updatedAt =
    Date.now();


  saveStages(
    stages
  );


  alert(
    "ステージを保存しました。"
  );

}

function createPlayEngine(

/* ============================================================
   プレイカメラ
============================================================ */

function calculatePlayCamera(
  engine
){

  const bodies =
    Composite.allBodies(
      engine.world
    ).filter(
      b =>
        b.plugin &&
        (
          b.plugin.gameType === "block" ||
          b.plugin.gameType === "enemy"
        )
    );


  if(bodies.length === 0){

    return {

      x:0,

      y:300,

      zoom:1

    };

  }


  let minX=Infinity;
  let maxX=-Infinity;
  let minY=Infinity;
  let maxY=-Infinity;


  bodies.forEach(b => {

    const radius =
      b.plugin.gameType === "enemy"
        ? b.plugin.radius
        : Math.max(
            b.plugin.width,
            b.plugin.height
          ) / 2;


    minX =
      Math.min(
        minX,
        b.position.x-radius
      );

    maxX =
      Math.max(
        maxX,
        b.position.x+radius
      );

    minY =
      Math.min(
        minY,
        b.position.y-radius
      );

    maxY =
      Math.max(
        maxY,
        b.position.y+radius
      );

  });


  const width =
    Math.max(
      300,
      maxX-minX
    );


  const height =
    Math.max(
      300,
      maxY-minY
    );


  const canvasWidth =
    Math.max(
      1,
      playCanvas.clientWidth
    );


  const canvasHeight =
    Math.max(
      1,
      playCanvas.clientHeight
    );


  const zoomX =
    (canvasWidth -
      CAMERA_PADDING*2) /
    width;


  const zoomY =
    (canvasHeight -
      CAMERA_PADDING*2) /
    height;


  const zoom =
    Math.max(
      0.25,
      Math.min(
        2,
        zoomX,
        zoomY
      )
    );


  return {

    x:(minX+maxX)/2,

    y:(minY+maxY)/2,

    zoom:zoom

  };

}

/* ============================================================
   エディタ配置
============================================================ */

function addEditorObject(
  x,
  y
){

  if(!editorEngine){
    return;
  }


  if(currentTool === "wood"){

    createBlock(
      editorEngine,
      "wood",
      x,
      y,
      90,
      30,
      0
    );

  }


  else if(currentTool === "glass"){

    createBlock(
      editorEngine,
      "glass",
      x,
      y,
      90,
      30,
      0
    );

  }


  else if(currentTool === "stone"){

    createBlock(
      editorEngine,
      "stone",
      x,
      y,
      90,
      40,
      0
    );

  }


  else if(currentTool === "enemy"){

    createEnemy(
      editorEngine,
      x,
      y,
      23
    );

  }


  else if(currentTool === "bomb"){

    /*
      編集中の爆弾は保存対象にせず、
      テスト時に使える目印として表示する。
    */

    createBomb(
      editorEngine,
      x,
      y
    );

  }


  else if(currentTool === "erase"){

    eraseAt(
      editorEngine,
      x,
      y
    );

  }

}


/* ============================================================
   削除
============================================================ */

function eraseAt(
  engine,
  x,
  y
){

  const bodies =
    Composite.allBodies(
      engine.world
    );


  for(
    let i=bodies.length-1;
    i>=0;
    i--
  ){

    const body =
      bodies[i];


    if(
      !body.plugin ||
      body.plugin.gameType === "ground"
    ){
      continue;
    }


    const dx =
      body.position.x - x;

    const dy =
      body.position.y - y;


    const d =
      Math.sqrt(
        dx*dx +
        dy*dy
      );


    let r = 45;


    if(
      body.plugin.gameType === "enemy"
    ){

      r =
        body.plugin.radius;

    }
    else if(
      body.plugin.gameType === "block"
    ){

      r =
        Math.max(
          body.plugin.width,
          body.plugin.height
        ) / 2;

    }


    if(d < r){

      World.remove(
        engine.world,
        body
      );

      return;

    }

  }

}


/* ============================================================
   エディタポインター
============================================================ */

function editorPointerPosition(e){

  const rect =
    editorCanvas.getBoundingClientRect();


  return {

    x:
      e.clientX -
      rect.left,

    y:
      e.clientY -
      rect.top

  };

}


editorCanvas =
  document.getElementById(
    "editorCanvas"
  );

playCanvas =
  document.getElementById(

/* マウス */

editorCanvas.addEventListener(
  "pointerdown",
  e => {

    editorCanvas.setPointerCapture(
      e.pointerId
    );


    const p =
      editorPointerPosition(e);


    editorPointer.down = true;

    editorPointer.x = p.x;
    editorPointer.y = p.y;

    editorPointer.lastX = p.x;
    editorPointer.lastY = p.y;

    editorPointer.moved = false;


    if(
      currentTool !== "pan"
    ){

      const world =
        screenToWorld(
          editorCanvas,
          editorCamera,
          p.x,
          p.y
        );


      addEditorObject(
        world.x,
        world.y
      );

    }

  }
);


editorCanvas.addEventListener(
  "pointermove",
  e => {

    if(!editorPointer.down){
      return;
    }


    const p =
      editorPointerPosition(e);


    const dx =
      p.x -
      editorPointer.lastX;

    const dy =
      p.y -
      editorPointer.lastY;


    if(
      Math.abs(dx) > 2 ||
      Math.abs(dy) > 2
    ){

      editorPointer.moved = true;

    }


    if(
      currentTool === "pan"
    ){

      editorCamera.x -=
        dx /
        editorCamera.zoom;

      editorCamera.y -=
        dy /
        editorCamera.zoom;

    }


    editorPointer.lastX =
      p.x;

    editorPointer.lastY =
      p.y;

  }
);


editorCanvas.addEventListener(
  "pointerup",
  e => {

    editorPointer.down =
      false;

  }
);


editorCanvas.addEventListener(
  "pointercancel",
  e => {

    editorPointer.down =
      false;

  }
);


/* ============================================================
   ホイールズーム
============================================================ */

editorCanvas.addEventListener(
  "wheel",
  e => {

    e.preventDefault();


    const p =
      editorPointerPosition(e);


    const before =
      screenToWorld(
        editorCanvas,
        editorCamera,
        p.x,
        p.y
      );


    const factor =
      e.deltaY < 0
        ? 1.12
        : 0.89;


    editorCamera.zoom =
      Math.max(
        0.12,
        Math.min(
          4,
          editorCamera.zoom *
          factor
        )
      );


    const after =
      screenToWorld(
        editorCanvas,
        editorCamera,
        p.x,
        p.y
      );


    editorCamera.x +=
      before.x -
      after.x;

    editorCamera.y +=
      before.y -
      after.y;

  },
  {passive:false}
);


/* ============================================================
   タッチによるパン
============================================================ */

let touchStart = null;

editorCanvas.addEventListener(
  "touchstart",
  e => {

    if(e.touches.length !== 1){
      return;
    }


    const t =
      e.touches[0];

    touchStart = {

      x:t.clientX,

      y:t.clientY

    };

  },
  {passive:true}
);


editorCanvas.addEventListener(
  "touchmove",
  e => {

    if(
      e.touches.length !== 1 ||
      currentTool !== "pan" ||
      !touchStart
    ){
      return;
    }


    e.preventDefault();


    const t =
      e.touches[0];


    const dx =
      t.clientX -
      touchStart.x;

    const dy =
      t.clientY -
      touchStart.y;


    editorCamera.x -=
      dx /
      editorCamera.zoom;

    editorCamera.y -=
      dy /
      editorCamera.zoom;


    touchStart.x =
      t.clientX;

    touchStart.y =
      t.clientY;

  },
  {passive:false}
);


editorCanvas.addEventListener(
  "touchend",
  () => {

    touchStart = null;

  }
);

/* ============================================================
   サンプルステージ
============================================================ */

function createSampleStageIfNeeded(){

  const stages =
    loadStages();


  if(stages.length > 0){
    return;
  }


  const objects = [];


  /*
    大きめの城
  */

  const baseY =
    650;


  /* 左塔 */

  for(
    let i=0;
    i<5;
    i++
  ){

    objects.push({

      type:
        i % 2 === 0
          ? "stone"
          : "wood",

      x:-230,

      y:
        baseY -
        i*45,

      w:90,

      h:35,

      angle:0

    });

  }


  /* 右塔 */

  for(
    let i=0;
    i<5;
    i++
  ){

    objects.push({

      type:
        i % 2 === 0
          ? "stone"
          : "wood",

      x:230,

      y:
        baseY -
        i*45,

      w:90,

      h:35,

      angle:0

    });

  }


  /* 中央 */

  for(
    let row=0;
    row<5;
    row++
  ){

    for(
      let col=0;
      col<3;
      col++
    ){

      objects.push({

        type:
          row % 2 === 0
            ? "wood"
            : "glass",

        x:
          -90 +
          col*90,

        y:
          baseY -
          row*45,

        w:80,

        h:30,

        angle:0

      });

    }

  }


  /* 敵 */

  objects.push({

    type:"enemy",

    x:-230,

    y:430,

    r:23

  });


  objects.push({

    type:"enemy",

    x:0,

    y:430,

    r:23

  });


  objects.push({

    type:"enemy",

    x:230,

    y:430,

    r:23

  });


  objects.push({

    type:"enemy",

    x:0,

    y:250,

    r:23

  });


  stages.push({

    id:"sample",

    name:"サンプル城",

    createdAt:Date.now(),

    objects:objects

  });


  saveStages(
    stages
  );

}
