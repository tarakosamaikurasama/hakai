<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>日野市の街並みに歴史</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f3f3f3;color:#222}
body{overflow:hidden}
button,input,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{width:100%;height:100%;position:relative}
.screen{position:absolute;inset:0;display:none;background:#f3f3f3;overflow:auto}
.screen.active{display:block}

.home{
min-height:100%;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
background:
radial-gradient(circle at 20% 10%,#fff 0,transparent 35%),
radial-gradient(circle at 90% 80%,#fff 0,transparent 30%),
#f3f3f3
}
.home-card{
width:min(620px,100%);
padding:42px 34px 36px;
background:rgba(255,255,255,.94);
border-radius:32px;
box-shadow:0 18px 50px rgba(0,0,0,.13);
text-align:center
}
.logo{
font-size:clamp(30px,7vw,52px);
font-weight:900;
letter-spacing:.03em;
margin:0 0 10px
}
.subtitle{color:#777;font-size:15px;margin-bottom:34px}
.start-buttons{display:grid;gap:16px}
.start-button{
width:100%;
min-height:70px;
border:0;
border-radius:20px;
background:#f80;
color:#fff;
font-weight:900;
font-size:20px;
box-shadow:0 7px 0 #c76000,0 12px 25px rgba(255,136,0,.22);
transition:.12s transform,.12s box-shadow
}
.start-button:hover{filter:brightness(1.04)}
.start-button:active{
transform:translateY(6px);
box-shadow:0 1px 0 #c76000,0 5px 12px rgba(255,136,0,.18)
}
.start-button.secondary{
background:#fff;
color:#222;
box-shadow:0 5px 0 #ddd,0 10px 22px rgba(0,0,0,.08)
}
.start-button.secondary:active{box-shadow:0 1px 0 #ddd}

.topbar{
height:64px;
display:flex;
align-items:center;
gap:10px;
padding:10px 14px;
background:#fff;
box-shadow:0 2px 12px rgba(0,0,0,.08);
position:relative;
z-index:20
}
.top-title{font-weight:900;font-size:18px;margin-right:auto}
.ui-button{
border:0;
border-radius:13px;
padding:10px 15px;
background:#fff;
box-shadow:0 2px 7px rgba(0,0,0,.13);
font-weight:800;
white-space:nowrap
}
.ui-button.orange{background:#f80;color:#fff;box-shadow:0 4px 0 #c76000}
.ui-button:active{transform:translateY(2px)}
.ui-button.active{background:#f80;color:#fff}

.editor-layout,.play-layout{
height:calc(100% - 64px);
display:flex;
overflow:hidden
}
.sidebar{
width:285px;
background:#fff;
padding:14px;
overflow:auto;
box-shadow:4px 0 18px rgba(0,0,0,.08);
z-index:10
}
.sidebar h3{font-size:14px;margin:8px 4px 10px;color:#666}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{
border:0;
background:#fafafa;
border-radius:13px;
padding:12px 7px;
font-size:13px;
font-weight:800;
box-shadow:0 2px 7px rgba(0,0,0,.1);
min-height:55px
}
.tool.active{background:#f80;color:#fff}
.tool:active{transform:scale(.97)}

.canvas-wrap{
position:relative;
flex:1;
overflow:hidden;
background:
linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px),
#dfe2e5;
background-size:25px 25px
}
#editorCanvas,#playCanvas{
position:absolute;
inset:0;
width:100%;
height:100%;
touch-action:none
}
.zoom{
position:absolute;
right:15px;
bottom:15px;
z-index:15;
display:flex;
gap:7px
}
.zoom button{
width:45px;height:45px;border:0;border-radius:14px;background:#fff;
font-size:22px;font-weight:900;box-shadow:0 3px 12px rgba(0,0,0,.15)
}

.panel{
background:#fff;border-radius:16px;padding:12px;margin-bottom:12px;
box-shadow:0 2px 9px rgba(0,0,0,.08)
}
.panel-title{font-weight:900;font-size:14px;margin-bottom:9px}
.row{display:flex;gap:7px;align-items:center;margin:7px 0}
.row label{font-size:12px;font-weight:700;flex:1}
.row input,.row select{
width:100%;min-width:0;border:1px solid #ddd;border-radius:9px;
padding:8px;background:#fff
}
.small-button{
border:0;border-radius:9px;padding:8px 10px;background:#f2f2f2;font-weight:800
}
.danger{background:#e33;color:#fff}

.status{
position:absolute;
left:15px;bottom:15px;
background:rgba(255,255,255,.93);
border-radius:14px;
padding:9px 13px;
box-shadow:0 3px 12px rgba(0,0,0,.13);
font-size:12px;
font-weight:800;
z-index:15;
pointer-events:none
}

.play-tools{
position:absolute;
top:14px;
left:50%;
transform:translateX(-50%);
z-index:16;
display:flex;
gap:8px;
background:rgba(255,255,255,.94);
padding:8px;
border-radius:16px;
box-shadow:0 4px 16px rgba(0,0,0,.14)
}

.overlay{
position:fixed;
inset:0;
z-index:100;
display:none;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.28);
backdrop-filter:blur(5px);
padding:20px
}
.overlay.show{display:flex}
.modal{
width:min(500px,100%);
max-height:90vh;
overflow:auto;
background:#fff;
border-radius:25px;
padding:23px;
box-shadow:0 20px 60px rgba(0,0,0,.25)
}
.modal h2{margin:0 0 17px;font-size:22px}
.modal-list{display:grid;gap:9px}
.save-item{
display:flex;align-items:center;gap:8px;
padding:12px;border-radius:13px;background:#f7f7f7
}
.save-name{font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:17px}
.modal-actions button{border:0;border-radius:11px;padding:10px 15px;font-weight:800}

@media(max-width:700px){
.sidebar{width:215px;padding:9px}
.topbar{height:58px}
.editor-layout,.play-layout{height:calc(100% - 58px)}
.tool{font-size:11px;padding:8px 4px}
.home-card{padding:32px 22px}
}
@media(max-width:520px){
.sidebar{width:175px}
.top-title{font-size:15px}
.ui-button{padding:8px 9px;font-size:12px}
}
</style>
</head>
<body>
<div id="app">

<section id="home" class="screen active">
<div class="home">
<div class="home-card">
<h1 class="logo">ステージメーカー</h1>
<div class="subtitle">作って、保存して、遊べるステージエディター</div>
<div class="start-buttons">
<button type="button" class="start-button" id="startCreate">ステージを作る</button>
<button type="button" class="start-button secondary" id="startPlay">ステージで遊ぶ</button>
<button type="button" class="start-button secondary" id="startData">保存データ</button>
</div>
</div>
</div>
</section>

<section id="editor" class="screen">
<div class="topbar">
<button class="ui-button" id="editorHome">← スタート</button>
<div class="top-title">ステージを作る</div>
<button class="ui-button" id="newSave">新しく保存</button>
<button class="ui-button orange" id="overwriteSave">上書き保存</button>
<button class="ui-button" id="editorPlay">▶ 遊ぶ</button>
</div>

<div class="editor-layout">
<aside class="sidebar">

<div class="panel">
<div class="panel-title">ブロック</div>
<div class="tool-grid">
<button class="tool" data-type="wood">木</button>
<button class="tool" data-type="glass">ガラス</button>
<button class="tool" data-type="stone">石</button>
<button class="tool" data-type="bedrock">岩盤</button>
<button class="tool" data-type="dog">犬</button>
<button class="tool" data-type="bigdog">巨大犬</button>
<button class="tool" data-type="armor">よろい犬</button>
<button class="tool" data-type="movingdog">動く犬</button>
<button class="tool" data-type="bomb">爆弾</button>
<button class="tool" data-type="multiplier">倍ブロック</button>
<button class="tool" data-type="housewood">木の家</button>
<button class="tool" data-type="houseglass">ガラスの家</button>
<button class="tool" data-type="housestone">石の家</button>
<button class="tool" data-type="housebedrock">岩盤の家</button>
</div>
</div>

<div class="panel">
<div class="panel-title">自動装置</div>
<div class="tool-grid">
<button class="tool" data-type="bombgen">爆弾発生器</button>
<button class="tool" data-type="doggen">犬発生器</button>
</div>
</div>

<div class="panel">
<div class="panel-title">爆弾</div>
<div class="row">
<label>爆発まで</label>
<input id="editorBombTime" type="number" min="0.2" step=".1" value="3">
</div>
</div>

<div class="panel">
<div class="panel-title">操作</div>
<button class="small-button" id="editorSelect">選択</button>
<button class="small-button" id="editorDelete">削除</button>
<button class="small-button" id="editorRotate">回転</button>
<button class="small-button" id="clearStage">全削除</button>
</div>

</aside>

<div class="canvas-wrap" id="editorArea">
<canvas id="editorCanvas"></canvas>
<div class="status" id="editorStatus">配置モード</div>
<div class="zoom">
<button id="zoomOut">−</button>
<button id="zoomIn">＋</button>
</div>
</div>
</div>
</section>

<section id="play" class="screen">
<div class="topbar">
<button class="ui-button" id="playHome">← スタート</button>
<div class="top-title">ステージで遊ぶ</div>
<button class="ui-button orange" id="placeBomb">爆弾を置く</button>
<button class="ui-button" id="playSelect">選択</button>
<button class="ui-button" id="allExplode">全爆破</button>
</div>

<div class="play-layout">
<div class="canvas-wrap">
<canvas id="playCanvas"></canvas>
<div class="status" id="playStatus">爆弾を置くモード</div>
</div>
</div>
</section>

<section id="data" class="screen">
<div class="topbar">
<button class="ui-button" id="dataHome">← スタート</button>
<div class="top-title">保存データ</div>
<button class="ui-button orange" id="importData">データ読み込み</button>
<button class="ui-button" id="exportData">データ書き出し</button>
</div>
<div style="padding:20px;max-width:900px;margin:auto">
<div class="panel">
<div class="panel-title">保存したステージ</div>
<div id="stageList"></div>
</div>
</div>
</section>

</div>

<div class="overlay" id="modal">
<div class="modal" id="modalContent"></div>
</div>

<input id="fileInput" type="file" accept=".json,application/json" style="display:none">

<script>
(function(){
"use strict";

const STORAGE="stage_maker_data_v1";
const $=id=>document.getElementById(id);

let stages=JSON.parse(localStorage.getItem(STORAGE)||"[]");
let currentStage=null;
let editorWorld=null;
let playWorld=null;
let editorMode="place";
let playMode="bomb";
let selectedTool="wood";
let selectedEditorBody=null;
let selectedPlayBody=null;
let editorScale=1;
let editorEngine=null;
let playEngine=null;
let editorRAF=0;
let playRAF=0;
let currentBombTime=3;
let nextId=1;

function id(){
return "b"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)+nextId++;
}

function saveStages(){
localStorage.setItem(STORAGE,JSON.stringify(stages));
}

function showScreen(name){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
$(name).classList.add("active");
}

function blankStage(name){
return {
id:id(),
name:name||"新しいステージ",
objects:[],
bombTime:3
};
}

function openCreate(){
currentStage=blankStage();
currentBombTime=3;
showScreen("editor");
setTimeout(initEditor,30);
}

function openPlay(){
if(!stages.length){
openDataModal("遊べる保存ステージがありません。先にステージを保存してください。");
return;
}
showStageChooser("play");
}

function openData(){
showScreen("data");
renderStageList();
}

function stageClone(stage){
return JSON.parse(JSON.stringify(stage));
}

function bodyDef(type,x,y,w,h,extra){
return {id:id(),type,x,y,w,h,angle:0,...extra};
}

function material(type){
if(type==="wood"||type==="housewood")return {hp:4};
if(type==="glass"||type==="houseglass")return {hp:1};
if(type==="stone"||type==="housestone")return {hp:8};
if(type==="bedrock"||type==="housebedrock")return {hp:Infinity};
if(type==="dog"||type==="movingdog")return {hp:2};
if(type==="bigdog")return {hp:4};
if(type==="armor")return {hp:2,defense:2};
if(type==="multiplier")return {hp:5};
return {hp:1};
}

function isHouse(t){
return ["housewood","houseglass","housestone","housebedrock"].includes(t);
}

function isDog(t){
return ["dog","bigdog","armor","movingdog"].includes(t);
}

function color(t){
if(t==="wood"||t==="housewood")return "#a96b38";
if(t==="glass"||t==="houseglass")return "rgba(100,190,240,.42)";
if(t==="stone"||t==="housestone")return "#858585";
if(t==="bedrock"||t==="housebedrock")return "#363636";
if(isDog(t))return "#9b693e";
if(t==="bomb"||t==="bombgen")return "#222";
if(t==="doggen")return "#8b542f";
if(t==="multiplier")return "#f80";
return "#aaa";
}

function createMatterBody(o,staticBody=false){
const M=window.Matter;
let w=o.w||60,h=o.h||60;
let body=M.Bodies.rectangle(o.x,o.y,w,h,{
isStatic:staticBody||o.type==="bedrock"||o.type==="housebedrock",
restitution:.05,
friction:.7,
label:o.id
});
body.game=o;
return body;
}

function floorBody(width,height){
return Matter.Bodies.rectangle(width/2,height+25,width,50,{isStatic:true,label:"floor"});
}

function setupEngine(canvas,mode){
if(!window.Matter)return null;
const M=window.Matter;
const engine=M.Engine.create({enableSleeping:false});
engine.gravity.y=1;
return engine;
}

function resizeCanvas(canvas){
const r=canvas.parentElement.getBoundingClientRect();
canvas.width=Math.max(1,Math.floor(r.width*devicePixelRatio));
canvas.height=Math.max(1,Math.floor(r.height*devicePixelRatio));
canvas.style.width=r.width+"px";
canvas.style.height=r.height+"px";
return {w:r.width,h:r.height};
}

function drawObject(ctx,o,selected=false){
ctx.save();
ctx.translate(o.x,o.y);
ctx.rotate(o.angle||0);

let w=o.w||60,h=o.h||60;
ctx.lineWidth=selected?4:2;
ctx.strokeStyle=selected?"#f80":"#222";

if(isHouse(o.type)){
ctx.fillStyle="rgba(255,255,255,.18)";
ctx.fillRect(-w/2,-h/2,w,h);
ctx.fillStyle=color(o.type);
ctx.fillRect(-w/2,-h/2,w,9);
ctx.fillRect(-w/2,h/2-9,w,9);
ctx.fillRect(-w/2,-h/2,9,h);
ctx.fillRect(w/2-9,-h/2,9,h);
ctx.strokeRect(-w/2,-h/2,w,h);
}else if(o.type==="bomb"){
ctx.beginPath();
ctx.arc(0,0,Math.min(w,h)/2,0,Math.PI*2);
ctx.fillStyle="#222";
ctx.fill();
ctx.stroke();
ctx.fillStyle="#f80";
ctx.font="bold 14px sans-serif";
ctx.textAlign="center";
ctx.fillText(Math.max(0,(o.remaining??o.timer??currentBombTime)).toFixed(1),0,5);
}else if(o.type==="multiplier"){
ctx.fillStyle=color(o.type);
ctx.fillRect(-w/2,-h/2,w,h);
ctx.fillStyle="#fff";
ctx.font="bold 23px sans-serif";
ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.fillText("×",0,0);
}else if(isDog(o.type)){
ctx.fillStyle=color(o.type);
ctx.fillRect(-w/2,-h/2,w,h);
ctx.fillStyle="#fff";
ctx.font="bold "+Math.max(12,w/4)+"px sans-serif";
ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.fillText(o.type==="bigdog"?"巨":o.type==="armor"?"鎧":"犬",0,0);
}else{
ctx.fillStyle=color(o.type);
ctx.fillRect(-w/2,-h/2,w,h);
ctx.strokeRect(-w/2,-h/2,w,h);
}

ctx.restore();
}

function drawFloor(ctx,w,h){
ctx.fillStyle="#555";
ctx.fillRect(0,h-18,w,18);
}

function initEditor(){
cancelAnimationFrame(editorRAF);
if(editorEngine)Matter.Engine.clear(editorEngine);

const canvas=$("editorCanvas");
const size=resizeCanvas(canvas);
editorEngine=setupEngine(canvas,"editor");
if(!editorEngine)return;

const world=editorEngine.world;
const floor=floorBody(size.w,size.h);
Matter.World.add(world,floor);

editorWorld={canvas,ctx:canvas.getContext("2d"),size,bodies:[]};

(currentStage.objects||[]).forEach(o=>{
const b=createMatterBody(o);
editorWorld.bodies.push(b);
Matter.World.add(world,b);
});

Matter.Events.on(editorEngine,"afterUpdate",()=>{
editorWorld.bodies.forEach(b=>{
if(!b.game)return;
b.game.x=b.position.x;
b.game.y=b.position.y;
b.game.angle=b.angle;
});
});

function loop(){
Matter.Engine.update(editorEngine,1000/60);
drawEditor();
editorRAF=requestAnimationFrame(loop);
}
loop();
}

function drawEditor(){
if(!editorWorld)return;
const {ctx,size}=editorWorld;
ctx.clearRect(0,0,size.w,size.h);
ctx.save();
ctx.scale(editorScale,editorScale);
drawFloor(ctx,size.w/editorScale,size.h/editorScale);
editorWorld.bodies.forEach(b=>drawObject(ctx,b.game,b===selectedEditorBody));
ctx.restore();
}

function addEditorObject(type,x,y){
let w=type==="bigdog"?80:60;
let h=type==="bigdog"?80:60;

if(isHouse(type)){
w=150;
h=120;
}

const o=bodyDef(type,x/editorScale,y/editorScale,w,h,{
hp:material(type).hp,
maxHp:material(type).hp,
timer:type==="bomb"?currentBombTime:null,
remaining:type==="bomb"?currentBombTime:null,
generatorOn:true,
interval:3,
count:1,
direction:"down",
dogType:"dog"
});

currentStage.objects.push(o);

const b=createMatterBody(o);
editorWorld.bodies.push(b);
Matter.World.add(editorEngine.world,b);
}

function canvasPoint(e,canvas){
const r=canvas.getBoundingClientRect();
return {x:e.clientX-r.left,y:e.clientY-r.top};
}

$("editorCanvas").addEventListener("pointerdown",e=>{
if(!editorWorld)return;
const p=canvasPoint(e,editorWorld.canvas);
let hit=null;

for(let i=editorWorld.bodies.length-1;i>=0;i--){
const b=editorWorld.bodies[i];
if(Matter.Bounds.contains(b.bounds,{x:p.x/editorScale,y:p.y/editorScale})){
hit=b;break;
}
}

if(editorMode==="select"){
selectedEditorBody=hit;
updateEditorStatus();
return;
}

if(editorMode==="delete"){
if(hit){
currentStage.objects=currentStage.objects.filter(o=>o.id!==hit.game.id);
Matter.World.remove(editorEngine.world,hit);
editorWorld.bodies=editorWorld.bodies.filter(b=>b!==hit);
selectedEditorBody=null;
}
return;
}

if(editorMode==="rotate"){
if(hit){
Matter.Body.rotate(hit,Math.PI/2);
hit.game.angle=hit.angle;
}
return;
}

addEditorObject(selectedTool,p.x,p.y);
});

function updateEditorStatus(){
if(!selectedEditorBody){
$("editorStatus").textContent="選択モード";
return;
}
const o=selectedEditorBody.game;
let hp=o.hp===Infinity?"∞":o.hp;
$("editorStatus").textContent=(o.type==="bomb"?"爆弾":o.type)+"　耐久: "+hp;
}

document.querySelectorAll(".tool").forEach(btn=>{
btn.addEventListener("click",()=>{
selectedTool=btn.dataset.type;
document.querySelectorAll(".tool").forEach(x=>x.classList.remove("active"));
btn.classList.add("active");
editorMode="place";
$("editorStatus").textContent="配置: "+btn.textContent;
});
});

$("editorSelect").onclick=()=>{
editorMode="select";
$("editorStatus").textContent="選択モード";
};

$("editorDelete").onclick=()=>{
editorMode="delete";
$("editorStatus").textContent="削除モード";
};

$("editorRotate").onclick=()=>{
editorMode="rotate";
$("editorStatus").textContent="回転するブロックを選択";
};

$("clearStage").onclick=()=>{
currentStage.objects=[];
initEditor();
};

$("editorBombTime").onchange=()=>{
currentBombTime=Math.max(.2,+$("editorBombTime").value||3);
};

$("zoomIn").onclick=()=>{
editorScale=Math.min(2.5,editorScale+.1);
};

$("zoomOut").onclick=()=>{
editorScale=Math.max(.5,editorScale-.1);
};

function getPlayObjects(){
return stageClone(currentStage).objects||[];
}

function initPlay(stage){
cancelAnimationFrame(playRAF);
currentStage=stage;
showScreen("play");

setTimeout(()=>{
const canvas=$("playCanvas");
const size=resizeCanvas(canvas);
playEngine=setupEngine(canvas,"play");
if(!playEngine)return;

const world=playEngine.world;
Matter.World.add(world,floorBody(size.w,size.h));

playWorld={canvas,ctx:canvas.getContext("2d"),size,bodies:[],bombs:[],generators:[]};

getPlayObjects().forEach(o=>{
const b=createMatterBody(o);
playWorld.bodies.push(b);
Matter.World.add(world,b);
});

Matter.Events.on(playEngine,"collisionStart",event=>{
event.pairs.forEach(pair=>{
const a=pair.bodyA,b=pair.bodyB;
if(a.game&&b.game){
handleCollision(a,b);
handleCollision(b,a);
}
});
});

Matter.Events.on(playEngine,"afterUpdate",()=>{
playWorld.bodies.forEach(b=>{
if(!b.game)return;
b.game.x=b.position.x;
b.game.y=b.position.y;
b.game.angle=b.angle;
});

for(const o of playWorld.bodies.map(x=>x.game)){
if(isDog(o.type)&&o.type==="movingdog"){
if(!o.targetX||Math.hypot(o.targetX-o.x,o.targetY-o.y)<10){
o.targetX=30+Math.random()*(size.w-60);
o.targetY=30+Math.random()*(size.h-100);
}
const dx=o.targetX-o.x,dy=o.targetY-o.y;
const d=Math.hypot(dx,dy)||1;
const body=playWorld.bodies.find(x=>x.game===o);
Matter.Body.setVelocity(body,{x:dx/d*1.5,y:dy/d*1.5});
}
}
});

function loop(){
Matter.Engine.update(playEngine,1000/60);
updatePlayBombs();
updateGenerators();
drawPlay();
playRAF=requestAnimationFrame(loop);
}
loop();
},30);
}

function handleCollision(a,b){
if(a.game.type==="bomb"&&b.game.type==="multiplier"){
multiplyBomb(a.game,b.game);
}
}

function multiplyBomb(bomb,mult){
if(bomb.blockedMultiplierId===mult.id)return;
if(bomb.lastMultipliedAt&&performance.now()-bomb.lastMultipliedAt<300)return;

bomb.lastMultipliedAt=performance.now();
const amount=5;

for(let i=1;i<amount;i++){
const child={...bomb,id:id(),blockedMultiplierId:mult.id,x:bomb.x+(i-2)*8,y:bomb.y+(i%2)*8};
const body=createMatterBody(child);
body.game=child;
playWorld.bodies.push(body);
playWorld.bombs.push(body);
Matter.World.add(playEngine.world,body);
}

bomb.blockedMultiplierId=mult.id;
}

function updatePlayBombs(){
if(!playWorld)return;
const now=performance.now();

playWorld.bodies.forEach(b=>{
const o=b.game;
if(o.type==="bomb"){
if(!o.startTime)o.startTime=now;
o.remaining=Math.max(0,(o.timer||currentStage.bombTime||3)-(now-o.startTime)/1000);
if(o.remaining<=0&&!o.exploded){
explodeBomb(b);
}
}
});
}

function explodeBomb(bombBody){
if(!bombBody||!bombBody.game||bombBody.game.exploded)return;

const bomb=bombBody.game;
bomb.exploded=true;

const radius=125;
playWorld.bodies.slice().forEach(target=>{
if(!target.game||target===bombBody||target.game.type==="floor")return;
const dx=target.position.x-bomb.position.x;
const dy=target.position.y-bomb.position.y;
const d=Math.hypot(dx,dy);

if(d<=radius){
let damage=2;
const m=material(target.game.type);
if(m.defense)damage/=m.defense;

if(target.game.hp!==Infinity){
target.game.hp-=damage;
}

Matter.Body.setVelocity(target,{
x:dx/(d||1)*8,
y:dy/(d||1)*8
});

if(target.game.hp<=0){
removePlayBody(target);
}
}
});

removePlayBody(bombBody);
}

function removePlayBody(body){
Matter.World.remove(playEngine.world,body);
playWorld.bodies=playWorld.bodies.filter(b=>b!==body);
playWorld.bombs=playWorld.bombs.filter(b=>b!==body);
}

function updateGenerators(){
if(!playWorld)return;
const now=performance.now();

playWorld.bodies.forEach(b=>{
const o=b.game;
if(!o.generatorOn)return;

if(o.type==="bombgen"){
if(!o.nextDrop)o.nextDrop=now+(o.interval||3)*1000;
if(now>=o.nextDrop){
o.nextDrop=now+(o.interval||3)*1000;
for(let i=0;i<(o.count||1);i++){
addPlayBomb(o.x+(i-1)*12,o.y+30,o.timer||currentStage.bombTime||3);
}
}
}

if(o.type==="doggen"){
if(!o.nextDrop)o.nextDrop=now+(o.interval||3)*1000;
if(now>=o.nextDrop){
o.nextDrop=now+(o.interval||3)*1000;
for(let i=0;i<(o.count||1);i++){
addPlayDog(o);
}
}
}
});
}

function addPlayBomb(x,y,timer){
const o=bodyDef("bomb",x,y,34,34,{
hp:1,
timer,
remaining:timer,
startTime:performance.now()
});
const b=createMatterBody(o);
b.game=o;
playWorld.bodies.push(b);
playWorld.bombs.push(b);
Matter.World.add(playEngine.world,b);
}

function addPlayDog(gen){
const t=gen.dogType||"dog";
const o=bodyDef(t,gen.x,gen.y, t==="bigdog"?80:60,t==="bigdog"?80:60,{
hp:material(t).hp,
maxHp:material(t).hp,
targetX:null,targetY:null
});
const b=createMatterBody(o);
b.game=o;
playWorld.bodies.push(b);
Matter.World.add(playEngine.world,b);

let vx=0,vy=0;
if(gen.direction==="left")vx=-4;
if(gen.direction==="right")vx=4;
if(gen.direction==="up")vy=-4;
if(gen.direction==="down")vy=4;
Matter.Body.setVelocity(b,{x:vx,y:vy});
}

function drawPlay(){
if(!playWorld)return;
const {ctx,size}=playWorld;
ctx.clearRect(0,0,size.w,size.h);
drawFloor(ctx,size.w,size.h);
playWorld.bodies.forEach(b=>drawObject(ctx,b.game,b===selectedPlayBody));
}

$("playCanvas").addEventListener("pointerdown",e=>{
if(!playWorld)return;
const p=canvasPoint(e,playWorld.canvas);

if(playMode==="bomb"){
addPlayBomb(p.x,p.y,currentStage.bombTime||3);
return;
}

let hit=null;
for(let i=playWorld.bodies.length-1;i>=0;i--){
const b=playWorld.bodies[i];
if(Matter.Bounds.contains(b.bounds,p)){hit=b;break}
}

selectedPlayBody=hit;

if(hit){
const o=hit.game;
if(o.type==="bombgen"||o.type==="doggen"){
showGeneratorSettings(o);
}else{
$("playStatus").textContent=(o.type)+"　耐久: "+(o.hp===Infinity?"∞":Math.max(0,o.hp));
}
}
});

$("placeBomb").onclick=()=>{
playMode="bomb";
$("placeBomb").classList.add("active");
$("playSelect").classList.remove("active");
$("playStatus").textContent="爆弾を置くモード";
};

$("playSelect").onclick=()=>{
playMode="select";
$("playSelect").classList.add("active");
$("placeBomb").classList.remove("active");
$("playStatus").textContent="選択モード";
};

$("allExplode").onclick=()=>{
if(!playWorld)return;
playWorld.bodies.filter(b=>b.game.type==="bomb").slice().forEach(explodeBomb);
};

function showGeneratorSettings(o){
$("modalContent").innerHTML="";
const h=document.createElement("h2");
h.textContent=o.type==="bombgen"?"爆弾発生器の設定":"犬発生器の設定";
$("modalContent").appendChild(h);

if(o.type==="bombgen"){
$("modalContent").innerHTML+=`
<div class="row"><label>間隔（秒）</label><input id="setInterval" type="number" min=".1" step=".1" value="${o.interval||3}"></div>
<div class="row"><label>一度に出す数</label><input id="setCount" type="number" min="1" value="${o.count||1}"></div>
<div class="row"><label>爆発まで（秒）</label><input id="setTimer" type="number" min=".2" step=".1" value="${o.timer||currentStage.bombTime||3}"></div>
<div class="row"><label>発生器</label><button class="small-button" id="toggleGenerator">${o.generatorOn===false?"OFF":"ON"}</button></div>
`;
}else{
$("modalContent").innerHTML+=`
<div class="row"><label>種類</label><select id="dogType">
<option value="dog">犬</option>
<option value="bigdog">巨大犬</option>
<option value="armor">よろい犬</option>
<option value="movingdog">動く犬</option>
</select></div>
<div class="row"><label>間隔（秒）</label><input id="setInterval" type="number" min=".1" step=".1" value="${o.interval||3}"></div>
<div class="row"><label>一度に出す数</label><input id="setCount" type="number" min="1" value="${o.count||1}"></div>
<div class="row"><label>方向</label><select id="direction">
<option value="left">左</option>
<option value="right">右</option>
<option value="down">下</option>
<option value="up">上</option>
</select></div>
<div class="row"><label>発生器</label><button class="small-button" id="toggleGenerator">${o.generatorOn===false?"OFF":"ON"}</button></div>
`;
$("dogType").value=o.dogType||"dog";
$("direction").value=o.direction||"down";
}

$("modalContent").innerHTML+=`
<div class="modal-actions">
<button id="closeModal">閉じる</button>
<button id="applyGenerator" style="background:#f80;color:#fff">適用</button>
</div>
`;

$("toggleGenerator").onclick=()=>{
o.generatorOn=o.generatorOn===false;
$("toggleGenerator").textContent=o.generatorOn?"ON":"OFF";
};

$("applyGenerator").onclick=()=>{
o.interval=Math.max(.1,+$("setInterval").value||3);
o.count=Math.max(1,+$("setCount").value||1);
if(o.type==="bombgen"){
o.timer=Math.max(.2,+$("setTimer").value||3);
}else{
o.dogType=$("dogType").value;
o.direction=$("direction").value;
}
$("modal").classList.remove("show");
};

$("closeModal").onclick=()=>$("modal").classList.remove("show");
$("modal").classList.add("show");
}

function saveNew(){
showInputModal("新しく保存",currentStage.name||"新しいステージ",(name)=>{
currentStage.name=name;
currentStage.id=id();
stages.push(stageClone(currentStage));
saveStages();
openData();
});
}

function overwrite(){
if(!currentStage||!currentStage.id){
openDataModal("上書きするステージを選択してください。");
return;
}
showStageChooser("overwrite");
}

function showInputModal(title,value,callback){
$("modalContent").innerHTML=`
<h2>${title}</h2>
<div class="row"><input id="stageNameInput" value="${escapeHtml(value)}" style="font-size:16px"></div>
<div class="modal-actions">
<button id="cancelInput">キャンセル</button>
<button id="okInput" style="background:#f80;color:#fff">保存</button>
</div>`;
$("modal").classList.add("show");
$("cancelInput").onclick=()=>$("modal").classList.remove("show");
$("okInput").onclick=()=>{
const name=$("stageNameInput").value.trim();
if(!name)return;
$("modal").classList.remove("show");
callback(name);
};
}

function showStageChooser(action){
$("modalContent").innerHTML="<h2>"+(action==="play"?"遊ぶステージを選択":"上書きするステージを選択")+"</h2>";
const list=document.createElement("div");
list.className="modal-list";

stages.forEach(stage=>{
const row=document.createElement("div");
row.className="save-item";
row.innerHTML=`<div class="save-name">${escapeHtml(stage.name)}</div>`;
const btn=document.createElement("button");
btn.className="small-button";
btn.textContent=action==="play"?"遊ぶ":"上書き";
btn.onclick=()=>{
$("modal").classList.remove("show");
if(action==="play"){
initPlay(stageClone(stage));
}else{
const copy=stageClone(currentStage);
copy.id=stage.id;
copy.name=stage.name;
stages[stages.findIndex(x=>x.id===stage.id)]=copy;
saveStages();
openData();
}
};
row.appendChild(btn);
list.appendChild(row);
});

$("modalContent").appendChild(list);
const close=document.createElement("button");
close.className="small-button";
close.textContent="閉じる";
close.style.marginTop="15px";
close.onclick=()=>$("modal").classList.remove("show");
$("modalContent").appendChild(close);
$("modal").classList.add("show");
}

function openDataModal(text){
$("modalContent").innerHTML=`
<h2>お知らせ</h2>
<p>${escapeHtml(text)}</p>
<div class="modal-actions"><button id="closeNotice">閉じる</button></div>`;
$("modal").classList.add("show");
$("closeNotice").onclick=()=>$("modal").classList.remove("show");
}

function renderStageList(){
const list=$("stageList");
list.innerHTML="";
if(!stages.length){
list.innerHTML="<div style='color:#777;padding:15px'>保存データはありません。</div>";
return;
}

stages.forEach(stage=>{
const row=document.createElement("div");
row.className="save-item";
row.innerHTML=`<div class="save-name">${escapeHtml(stage.name)}</div>`;

const play=document.createElement("button");
play.className="small-button";
play.textContent="遊ぶ";
play.onclick=()=>initPlay(stageClone(stage));

const edit=document.createElement("button");
edit.className="small-button";
edit.textContent="編集";
edit.onclick=()=>{
currentStage=stageClone(stage);
currentBombTime=currentStage.bombTime||3;
showScreen("editor");
setTimeout(initEditor,30);
};

const del=document.createElement("button");
del.className="small-button danger";
del.textContent="削除";
del.onclick=()=>{
showInputModal("削除確認",stage.name,(name)=>{
if(name!==stage.name){
openDataModal("ステージ名が一致しません。");
return;
}
stages=stages.filter(x=>x.id!==stage.id);
saveStages();
renderStageList();
});
};

row.append(play,edit,del);
list.appendChild(row);
});
}

function exportJSON(){
const blob=new Blob([JSON.stringify(stages,null,2)],{type:"application/json"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="stage-data.json";
a.click();
setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

$("importData").onclick=()=>$("fileInput").click();

$("fileInput").onchange=e=>{
const file=e.target.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=()=>{
try{
const data=JSON.parse(reader.result);
if(!Array.isArray(data))throw Error();
stages=data;
saveStages();
renderStageList();
openDataModal("データを読み込みました。");
}catch{
openDataModal("読み込みに失敗しました。");
}
};
reader.readAsText(file);
e.target.value="";
};

function escapeHtml(s){
return String(s).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

$("startCreate").addEventListener("click",function(e){
e.preventDefault();
openCreate();
});

$("startPlay").addEventListener("click",function(e){
e.preventDefault();
openPlay();
});

$("startData").addEventListener("click",function(e){
e.preventDefault();
openData();
});

$("editorHome").onclick=()=>{
cancelAnimationFrame(editorRAF);
showScreen("home");
};

$("playHome").onclick=()=>{
cancelAnimationFrame(playRAF);
showScreen("home");
};

$("dataHome").onclick=()=>showScreen("home");

$("newSave").onclick=saveNew;
$("overwriteSave").onclick=overwrite;

$("editorPlay").onclick=()=>{
if(!currentStage)return;
currentStage.bombTime=Math.max(.2,+$("editorBombTime").value||3);
initPlay(stageClone(currentStage));
};

$("exportData").onclick=exportJSON;

window.addEventListener("resize",()=>{
if(document.getElementById("editor").classList.contains("active")&&editorEngine){
resizeCanvas($("editorCanvas"));
}
if(document.getElementById("play").classList.contains("active")&&playEngine){
resizeCanvas($("playCanvas"));
}
});

})();
</script>
</body>
