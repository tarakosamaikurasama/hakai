<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>日野市の街並みの歴史</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  background:#fff7ee;
  color:#333;
}

body{
  overflow-x:hidden;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  touch-action:manipulation;
}

.screen{
  width:100%;
  min-height:100vh;
}

.hidden{
  display:none!important;
}

/* =========================
   TOP
========================= */

#titleScreen{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px 16px;
}

.title-card{
  width:min(680px,100%);
  background:#fff;
  border-radius:24px;
  padding:35px 22px;
  box-shadow:0 8px 30px rgba(120,70,20,.15);
  text-align:center;
}

.logo{
  font-size:clamp(30px,7vw,52px);
  font-weight:900;
  color:#f27b19;
  text-shadow:0 3px 0 #ffd2a7;
  margin-bottom:8px;
}

.subtitle{
  color:#777;
  font-size:15px;
  margin-bottom:28px;
}

.menu-buttons{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.main-button{
  min-height:62px;
  border-radius:20px;
  color:white;
  font-size:20px;
  font-weight:900;
  background:linear-gradient(#ffad50,#ed7316);
  box-shadow:0 5px 0 #c85d0b,0 8px 15px rgba(230,105,20,.22);
  transition:.12s;
}

.main-button:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #c85d0b;
}

.sub-button{
  min-height:52px;
  border-radius:18px;
  background:#fff;
  border:2px solid #eee;
  color:#555;
  font-weight:800;
  box-shadow:0 3px 8px rgba(0,0,0,.08);
}

.sub-button:active{
  transform:translateY(2px);
}

.danger-button{
  background:#fff0ec;
  color:#d64a32;
  border:2px solid #ffd2c9;
}

/* =========================
   GAME
========================= */

#gameScreen{
  min-height:100vh;
  padding:12px;
}

.game-wrapper{
  width:min(1100px,100%);
  margin:auto;
}

.topbar{
  background:#fff;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(100,60,20,.12);
  padding:10px 12px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  position:relative;
  z-index:100;
}

.topbar-title{
  font-weight:900;
  color:#e96d15;
  margin-right:auto;
}

.topbar button{
  padding:9px 14px;
  border-radius:13px;
  background:#fff;
  border:1px solid #eee;
  font-weight:800;
}

.topbar button:active{
  transform:translateY(2px);
}

.stage-wrapper{
  position:relative;
  width:100%;
  height:min(70vh,680px);
  min-height:420px;
  background:#dff3ff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(70,100,120,.16);
}

#gameCanvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

.toolbar{
  margin-top:10px;
  background:#fff;
  border-radius:20px;
  padding:12px;
  box-shadow:0 5px 20px rgba(100,60,20,.12);
  position:relative;
  z-index:200;
}

.tool-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(105px,1fr));
  gap:8px;
}

.tool{
  min-height:48px;
  border-radius:15px;
  background:#fff;
  border:2px solid #eee;
  font-weight:900;
  color:#555;
}

.tool.active{
  border-color:#f18a2c;
  background:#fff2e4;
  color:#df6811;
  box-shadow:inset 0 0 0 2px #ffd09e;
}

.tool:active{
  transform:translateY(2px);
}

.action-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.action-row button{
  flex:1 1 150px;
  min-height:48px;
  border-radius:16px;
  font-weight:900;
}

.explode{
  color:#fff;
  background:linear-gradient(#ff9f45,#e66b12);
  box-shadow:0 4px 0 #c45a0b;
}

.back{
  background:#fff;
  border:2px solid #eee;
}

.factor-area{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
  padding:10px;
  border-radius:15px;
  background:#fff8f0;
}

.factor-area input{
  width:90px;
  height:42px;
  border:2px solid #ffd2a6;
  border-radius:12px;
  text-align:center;
  font-size:18px;
  font-weight:900;
  background:#fff;
}

/* =========================
   STAGE LIST
========================= */

#stageListScreen{
  padding:18px;
}

.list-wrapper{
  width:min(700px,100%);
  margin:auto;
}

.list-card{
  background:#fff;
  border-radius:22px;
  padding:20px;
  box-shadow:0 7px 25px rgba(100,60,20,.12);
}

.list-card h2{
  margin-top:0;
  color:#ed7519;
}

.stage-item{
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:10px;
  padding:12px;
  border-radius:16px;
  background:#fff8f0;
}

.stage-name{
  flex:1;
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.stage-item button{
  border-radius:12px;
  padding:9px 12px;
  background:#fff;
  border:1px solid #eee;
  font-weight:800;
}

.empty{
  color:#888;
  text-align:center;
  padding:25px;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(40,25,10,.32);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:1000;
}

.modal-card{
  width:min(500px,100%);
  background:#fff;
  border-radius:24px;
  padding:22px;
  box-shadow:0 12px 40px rgba(0,0,0,.22);
}

.modal-card h3{
  margin-top:0;
  color:#e96f15;
}

.modal-card input{
  width:100%;
  height:48px;
  border:2px solid #eee;
  border-radius:14px;
  padding:0 13px;
  margin-bottom:12px;
}

.modal-buttons{
  display:flex;
  gap:8px;
}

.modal-buttons button{
  flex:1;
  min-height:48px;
  border-radius:15px;
  font-weight:900;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){
  #gameScreen{
    padding:7px;
  }

  .stage-wrapper{
    height:55vh;
    min-height:360px;
  }

  .topbar-title{
    width:100%;
  }

  .tool-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .tool{
    min-height:46px;
  }

  .logo{
    font-size:34px;
  }
}
</style>
</head>

<body>

<!-- =========================
     TITLE
========================= -->

<section id="titleScreen" class="screen">
  <div class="title-card">
    <div class="logo">スライム城くずし</div>
    <div class="subtitle">ステージメーカー</div>

    <div class="menu-buttons">
      <button class="main-button" id="makeStageBtn">ステージを作る</button>
      <button class="sub-button" id="playStageBtn">ステージで遊ぶ</button>
    </div>
  </div>
</section>

<!-- =========================
     GAME
========================= -->

<section id="gameScreen" class="screen hidden">

  <div class="game-wrapper">

    <div class="topbar">
      <div class="topbar-title" id="modeTitle">ステージ作成</div>
      <button id="saveBtn">保存</button>
      <button id="stageListBtn">ステージ一覧</button>
      <button id="homeBtn">ホーム</button>
    </div>

    <div class="stage-wrapper">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div class="toolbar">

      <div class="tool-grid" id="editorTools">

        <button class="tool" data-tool="wood">木</button>
        <button class="tool" data-tool="glass">ガラス</button>
        <button class="tool" data-tool="stone">石</button>
        <button class="tool" data-tool="slime">スライム</button>
        <button class="tool" data-tool="bomb">爆弾</button>
        <button class="tool" data-tool="multiply">倍ブロック</button>
        <button class="tool" data-tool="bedrock">岩盤</button>
        <button class="tool" data-tool="delete">削除</button>

      </div>

      <div class="factor-area" id="factorArea">
        <strong>倍数</strong>
        <span>×</span>
        <input id="factorInput" type="number" min="2" max="20" value="2">
      </div>

      <div class="action-row">
        <button class="explode" id="explodeBtn">全爆破</button>
        <button class="back" id="clearBtn">すべて消す</button>
      </div>

      <div class="action-row">
        <button class="back" id="editModeBtn">編集</button>
        <button class="back" id="playModeBtn">遊ぶ</button>
      </div>

    </div>

  </div>
</section>

<!-- =========================
     STAGE LIST
========================= -->

<section id="stageListScreen" class="screen hidden">
  <div class="list-wrapper">
    <div class="list-card">
      <h2>保存したステージ</h2>
      <div id="stageList"></div>

      <button class="sub-button" id="listBackBtn" style="width:100%;margin-top:10px;">
        戻る
      </button>
    </div>
  </div>
</section>

<!-- =========================
     SAVE MODAL
========================= -->

<div id="saveModal" class="modal hidden">
  <div class="modal-card">
    <h3>ステージを保存</h3>
    <input id="stageNameInput" type="text" maxlength="40" placeholder="ステージ名">

    <div class="modal-buttons">
      <button class="sub-button" id="saveCancelBtn">キャンセル</button>
      <button class="main-button" id="saveConfirmBtn">保存</button>
    </div>
  </div>
</div>

<script>
const {
  Engine,
  Render,
  Runner,
  Bodies,
  Body,
  Composite,
  Events,
  Vector
} = Matter;

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const titleScreen = document.getElementById("titleScreen");
const gameScreen = document.getElementById("gameScreen");
const stageListScreen = document.getElementById("stageListScreen");
const saveModal = document.getElementById("saveModal");

const makeStageBtn = document.getElementById("makeStageBtn");
const playStageBtn = document.getElementById("playStageBtn");
const saveBtn = document.getElementById("saveBtn");
const stageListBtn = document.getElementById("stageListBtn");
const homeBtn = document.getElementById("homeBtn");
const explodeBtn = document.getElementById("explodeBtn");
const clearBtn = document.getElementById("clearBtn");
const editModeBtn = document.getElementById("editModeBtn");
const playModeBtn = document.getElementById("playModeBtn");
const factorInput = document.getElementById("factorInput");
const factorArea = document.getElementById("factorArea");
const editorTools = document.getElementById("editorTools");
const modeTitle = document.getElementById("modeTitle");

const saveCancelBtn = document.getElementById("saveCancelBtn");
const saveConfirmBtn = document.getElementById("saveConfirmBtn");
const stageNameInput = document.getElementById("stageNameInput");
const stageList = document.getElementById("stageList");
const listBackBtn = document.getElementById("listBackBtn");

const FLOOR_HEIGHT = 42;
const SAVE_KEY = "slime_castle_maker_final";

let engine = null;
let bodies = [];
let currentTool = null;
let selectedBody = null;
let mode = "editor";

let canvasWidth = 0;
let canvasHeight = 0;

let animationFrame = null;
let lastTime = performance.now();

let dragging = false;
let dragType = null;
let dragOffset = {x:0,y:0};

let explosions = [];

let multiplierId = 1;

/*
  爆弾ごとに、
  「すでに入った倍ブロック」を記録する。
*/
const multiplierInside = new WeakMap();

function newId(){
  return "m" + Date.now().toString(36) +
    Math.random().toString(36).slice(2,8);
}

function resizeCanvas(){

  if(gameScreen.classList.contains("hidden")){
    return;
  }

  const rect = canvas.getBoundingClientRect();

  canvasWidth = Math.max(1, Math.floor(rect.width));
  canvasHeight = Math.max(1, Math.floor(rect.height));

  const dpr = Math.max(1, window.devicePixelRatio || 1);

  canvas.width = canvasWidth * dpr;
  canvas.height = canvasHeight * dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);

  rebuildFloor();
}

function showScreen(screen){

  titleScreen.classList.add("hidden");
  gameScreen.classList.add("hidden");
  stageListScreen.classList.add("hidden");

  screen.classList.remove("hidden");
}

function createEngine(){

  engine = Engine.create({
    enableSleeping:false
  });

  engine.gravity.x = 0;
  engine.gravity.y = 1;

  engine.positionIterations = 12;
  engine.velocityIterations = 10;
  engine.constraintIterations = 5;

  installPhysicsEvents();
  rebuildFloor();
}

function rebuildFloor(){

  if(!engine) return;

  const oldFloor = Composite.allBodies(engine.world)
    .filter(b => b.isGroundBedrock);

  oldFloor.forEach(b => {
    Composite.remove(engine.world,b);
  });

  if(canvasWidth <= 0 || canvasHeight <= 0){
    return;
  }

  const floor = Bodies.rectangle(
    canvasWidth / 2,
    canvasHeight - FLOOR_HEIGHT / 2,
    canvasWidth + 100,
    FLOOR_HEIGHT,
    {
      label:"groundBedrock",
      isStatic:true,
      isGroundBedrock:true,
      restitution:0,
      friction:1.5,
      frictionStatic:5,
      density:1,
      slop:0
    }
  );

  Composite.add(engine.world,floor);
}

function installPhysicsEvents(){

  Events.on(engine,"collisionStart",event => {

    event.pairs.forEach(pair => {

      let a = pair.bodyA;
      let b = pair.bodyB;

      handleCollision(a,b);
      handleCollision(b,a);

    });

  });

  Events.on(engine,"collisionEnd",event => {

    event.pairs.forEach(pair => {

      releaseMultiplier(pair.bodyA,pair.bodyB);
      releaseMultiplier(pair.bodyB,pair.bodyA);

    });

  });

  /*
    編集中はブロックのHPを回復する。
    つまり動くが壊れない。
  */

  Events.on(engine,"beforeUpdate",() => {

    if(mode !== "editor"){
      return;
    }

    bodies.forEach(body => {

      if(!body || body.isGroundBedrock){
        return;
      }

      if(body.blockType === "wood"){
        body.hp = body.maxHp;
      }

      if(body.blockType === "glass"){
        body.hp = body.maxHp;
      }

      if(body.blockType === "stone"){
        body.hp = body.maxHp;
      }

      if(body.blockType === "slime"){
        body.hp = body.maxHp;
      }

      if(body.blockType === "bedrock"){
        body.hp = body.maxHp;
      }

    });

  });
}

function handleCollision(a,b){

  if(!a || !b){
    return;
  }

  /*
    倍ブロックとの衝突。
    sensorなので物理的には通過する。
  */

  if(a.blockType === "bomb" && b.blockType === "multiply"){

    if(!multiplierInside.has(a)){
      multiplierInside.set(a,new Set());
    }

    const set = multiplierInside.get(a);

    if(!set.has(b.multiplierId)){

      set.add(b.multiplierId);

      multiplyBomb(
        a,
        Number(b.factor) || 2
      );
    }

    return;
  }

  /*
    倍ブロック以外との衝突だけ爆発させる。
    これが重要。
    倍ブロックに触れただけでは爆発しない。
  */

  if(a.blockType === "bomb"){

    if(b.blockType === "multiply"){
      return;
    }

    if(b.isGroundBedrock){
      return;
    }

    if(!a.exploded){
      explodeBomb(a);
    }
  }

  /*
    爆弾同士
  */

  if(a.blockType === "bomb" && b.blockType === "bomb"){

    if(!a.exploded){
      explodeBomb(a);
    }

    if(!b.exploded){
      explodeBomb(b);
    }
  }
}

function releaseMultiplier(a,b){

  if(!a || !b){
    return;
  }

  if(a.blockType !== "bomb"){
    return;
  }

  if(b.blockType !== "multiply"){
    return;
  }

  const set = multiplierInside.get(a);

  if(set){
    set.delete(b.multiplierId);
  }
}

/* =========================
   OBJECT CREATION
========================= */

function createObject(type,x,y){

  if(!engine){
    return null;
  }

  let body;

  let w = 70;
  let h = 45;

  /*
    床にめり込まないように配置位置を補正
  */

  if(type === "slime"){
    const r = 25;

    y = Math.min(
      y,
      canvasHeight - FLOOR_HEIGHT - r - 3
    );

    y = Math.max(r + 2,y);

    body = Bodies.circle(
      x,
      y,
      r,
      {
        label:"slime",
        blockType:"slime",
        restitution:0,
        friction:.9,
        frictionStatic:2,
        frictionAir:.025,
        density:.002
      }
    );

    body.baseW = r * 2;
    body.baseH = r * 2;
    body.maxHp = 100;
    body.hp = 100;

  }else{

    if(type === "bomb"){
      w = 34;
      h = 34;
    }

    if(type === "multiply"){
      w = 76;
      h = 54;
    }

    if(type === "bedrock"){
      w = 80;
      h = 48;
    }

    y = Math.min(
      y,
      canvasHeight - FLOOR_HEIGHT - h / 2 - 3
    );

    y = Math.max(
      h / 2 + 2,
      y
    );

    /*
      倍ブロックだけ isStatic:true。
      これによって絶対に落ちない。
    */

    const options = {
      label:type,
      blockType:type,

      restitution:0,
      friction:1,
      frictionStatic:2,
      frictionAir:.025,
      density:.001,

      isStatic:
        type === "multiply" ||
        type === "bedrock",

      isSensor:
        type === "multiply"
    };

    body = Bodies.rectangle(
      x,
      y,
      w,
      h,
      options
    );

    body.baseW = w;
    body.baseH = h;

    body.maxHp =
      type === "wood" ? 100 :
      type === "glass" ? 60 :
      type === "stone" ? 220 :
      type === "bedrock" ? Infinity :
      type === "bomb" ? 1 :
      100;

    body.hp = body.maxHp;

    if(type === "multiply"){

      body.factor =
        Math.max(
          2,
          Math.min(
            20,
            Number(factorInput.value) || 2
          )
        );

      body.multiplierId =
        "multiplier_" +
        multiplierId++;

      /*
        staticなのでここで止まる。
        センサーなので爆弾は通過できる。
      */
    }
  }

  bodies.push(body);
  Composite.add(engine.world,body);

  return body;
}

/* =========================
   MULTIPLY
========================= */

function multiplyBomb(original,factor){

  if(!original || original.exploded){
    return;
  }

  const x = original.position.x;
  const y = original.position.y;

  /*
    元の爆弾と同じ場所に生成。
  */

  for(let i=0;i<factor-1;i++){

    const bomb = createObject(
      "bomb",
      x,
      y
    );

    if(!bomb){
      continue;
    }

    /*
      生成直後に同じ倍ブロックで
      再増殖しないようにする。
    */

    const set = new Set();

    set.add(
      ...(
        multiplierInside.has(original)
          ? multiplierInside.get(original)
          : []
      )
    );

    multiplierInside.set(
      bomb,
      set
    );

    Body.setVelocity(
      bomb,
      {
        x:(Math.random()-.5)*1.2,
        y:Math.random()*1.2
      }
    );
  }
}

/* =========================
   EXPLOSION
========================= */

function explodeBomb(bomb){

  if(!bomb || bomb.exploded){
    return;
  }

  bomb.exploded = true;

  const x = bomb.position.x;
  const y = bomb.position.y;

  explosions.push({
    x,
    y,
    start:performance.now(),
    duration:520
  });

  /*
    爆発力。
    ここでは物理演算自体を止めない。
  */

  const all = Composite.allBodies(engine.world);

  all.forEach(body => {

    if(body === bomb){
      return;
    }

    if(body.isStatic){
      return;
    }

    if(body.isGroundBedrock){
      return;
    }

    const dx = body.position.x - x;
    const dy = body.position.y - y;

    const dist = Math.sqrt(dx*dx + dy*dy);

    if(dist > 230 || dist < 1){
      return;
    }

    const power =
      (1 - dist / 230) * .045;

    Body.applyForce(
      body,
      body.position,
      {
        x:(dx/dist)*power,
        y:(dy/dist)*power
      }
    );

    if(body.blockType !== "bomb"){

      if(mode === "play"){

        const damage =
          (1 - dist / 230) * 80;

        body.hp =
          Math.max(
            0,
            (body.hp ?? 100) - damage
          );

        if(body.hp <= 0){
          destroyBody(body);
        }

      }
    }
  });

  destroyBody(bomb);
}

function destroyBody(body){

  if(!body || body.isGroundBedrock){
    return;
  }

  Composite.remove(
    engine.world,
    body
  );

  bodies = bodies.filter(
    b => b !== body
  );

  if(selectedBody === body){
    selectedBody = null;
  }
}

/* =========================
   CLEAR
========================= */

function clearObjects(){

  const all = [...bodies];

  all.forEach(body => {

    if(body.isGroundBedrock){
      return;
    }

    Composite.remove(
      engine.world,
      body
    );
  });

  bodies = [];
  selectedBody = null;
}

/* =========================
   POINTER
========================= */

function getPointer(e){

  const rect = canvas.getBoundingClientRect();

  const source =
    e.touches && e.touches.length
      ? e.touches[0]
      : e;

  return {
    x:source.clientX - rect.left,
    y:source.clientY - rect.top
  };
}

function getBodyAt(point){

  const all =
    Composite.allBodies(engine.world);

  for(let i=all.length-1;i>=0;i--){

    const body = all[i];

    if(body.isGroundBedrock){
      continue;
    }

    if(
      Matter.Bounds.contains(
        body.bounds,
        point
      )
    ){

      if(body.blockType === "multiply"){
        return body;
      }

      if(body.blockType === "bedrock"){
        return body;
      }

      return body;
    }
  }

  return null;
}

function getHandleAt(body,point){

  if(!body){
    return null;
  }

  if(
    body.isStatic ||
    body.blockType === "multiply" ||
    body.blockType === "bedrock" ||
    body.blockType === "slime" ||
    body.blockType === "bomb"
  ){
    return null;
  }

  const hw = body.bounds.max.x - body.bounds.min.x;
  const hh = body.bounds.max.y - body.bounds.min.y;

  const handles = [
    {
      name:"tl",
      x:body.position.x-hw/2,
      y:body.position.y-hh/2
    },
    {
      name:"tr",
      x:body.position.x+hw/2,
      y:body.position.y-hh/2
    },
    {
      name:"bl",
      x:body.position.x-hw/2,
      y:body.position.y+hh/2
    },
    {
      name:"br",
      x:body.position.x+hw/2,
      y:body.position.y+hh/2
    }
  ];

  for(const h of handles){

    if(
      Math.abs(point.x-h.x)<14 &&
      Math.abs(point.y-h.y)<14
    ){
      return h.name;
    }
  }

  return null;
}

function getRotateHandle(body,point){

  if(!body){
    return false;
  }

  if(
    body.isStatic ||
    body.blockType === "multiply" ||
    body.blockType === "bedrock"
  ){
    return false;
  }

  const distance =
    Math.hypot(
      point.x-body.position.x,
      point.y-body.position.y
    );

  const target =
    Math.max(
      body.bounds.max.y-body.position.y,
      30
    ) + 34;

  return Math.abs(distance-target)<13;
}

/* =========================
   POINTER DOWN
========================= */

function pointerDown(e){

  e.preventDefault();

  if(!engine){
    return;
  }

  const p = getPointer(e);

  /*
    PLAY:
    クリックするだけで爆弾を置く。
  */

  if(mode === "play"){

    createObject(
      "bomb",
      p.x,
      p.y
    );

    return;
  }

  /*
    EDITOR:
    ツールが選択されていたら配置。
    何個置いてもツールは解除しない。
  */

  if(currentTool){

    if(currentTool === "delete"){

      const body = getBodyAt(p);

      if(
        body &&
        !body.isGroundBedrock
      ){
        destroyBody(body);
      }

      return;
    }

    createObject(
      currentTool,
      p.x,
      p.y
    );

    return;
  }

  /*
    ツール未選択なら編集操作。
  */

  const body = getBodyAt(p);

  if(!body){
    selectedBody = null;
    return;
  }

  selectedBody = body;

  const handle = getHandleAt(body,p);

  if(handle){

    dragging = true;
    dragType = "resize_" + handle;
    return;
  }

  if(getRotateHandle(body,p)){

    dragging = true;
    dragType = "rotate";
    return;
  }

  dragging = true;
  dragType = "move";

  dragOffset.x =
    p.x-body.position.x;

  dragOffset.y =
    p.y-body.position.y;

  Body.setSleeping(
    body,
    false
  );
}

/* =========================
   POINTER MOVE
========================= */

function pointerMove(e){

  if(!dragging || !selectedBody){
    return;
  }

  e.preventDefault();

  const p = getPointer(e);
  const body = selectedBody;

  Body.setSleeping(
    body,
    false
  );

  if(dragType === "move"){

    Body.setPosition(
      body,
      {
        x:p.x-dragOffset.x,
        y:p.y-dragOffset.y
      }
    );

    Body.setVelocity(
      body,
      {x:0,y:0}
    );

    Body.setAngularVelocity(
      body,
      0
    );

    return;
  }

  if(dragType === "rotate"){

    const angle =
      Math.atan2(
        p.y-body.position.y,
        p.x-body.position.x
      ) + Math.PI/2;

    Body.setAngle(
      body,
      angle
    );

    Body.setAngularVelocity(
      body,
      0
    );

    return;
  }

  if(dragType.startsWith("resize_")){

    resizeFromCenter(
      body,
      p
    );
  }
}

/* =========================
   RESIZE
   対角固定なし
   中心固定
========================= */

function resizeFromCenter(body,p){

  const dx =
    Math.abs(
      p.x-body.position.x
    );

  const dy =
    Math.abs(
      p.y-body.position.y
    );

  const newW =
    Math.max(
      25,
      Math.min(
        300,
        dx*2
      )
    );

  const newH =
    Math.max(
      25,
      Math.min(
        250,
        dy*2
      )
    );

  const oldW =
    body.baseW || 70;

  const oldH =
    body.baseH || 45;

  const scaleX =
    newW/oldW;

  const scaleY =
    newH/oldH;

  Body.scale(
    body,
    scaleX,
    scaleY
  );

  body.baseW = newW;
  body.baseH = newH;

  Body.setVelocity(
    body,
    {x:0,y:0}
  );

  Body.setAngularVelocity(
    body,
    0
  );
}

function pointerUp(e){

  dragging = false;
  dragType = null;

  if(selectedBody){
    Body.setSleeping(
      selectedBody,
      false
    );
  }
}

canvas.addEventListener(
  "pointerdown",
  pointerDown,
  {passive:false}
);

canvas.addEventListener(
  "pointermove",
  pointerMove,
  {passive:false}
);

canvas.addEventListener(
  "pointerup",
  pointerUp,
  {passive:false}
);

canvas.addEventListener(
  "pointercancel",
  pointerUp,
  {passive:false}
);

/* =========================
   DRAW
========================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    canvasWidth,
    canvasHeight
  );

  /*
    空
  */

  const sky =
    ctx.createLinearGradient(
      0,0,
      0,canvasHeight
    );

  sky.addColorStop(0,"#dff5ff");
  sky.addColorStop(1,"#f4fbff");

  ctx.fillStyle = sky;
  ctx.fillRect(
    0,
    0,
    canvasWidth,
    canvasHeight
  );

  drawFloor();

  const all =
    Composite.allBodies(engine.world);

  all.forEach(body => {

    if(body.isGroundBedrock){
      return;
    }

    drawBody(body);
  });

  drawSelection();
  drawExplosions();
}

function drawFloor(){

  const y =
    canvasHeight-FLOOR_HEIGHT;

  /*
    岩盤の床
  */

  ctx.fillStyle="#59606a";

  ctx.fillRect(
    0,
    y,
    canvasWidth,
    FLOOR_HEIGHT
  );

  ctx.fillStyle="#737b85";

  for(let x=0;x<canvasWidth;x+=38){

    ctx.beginPath();
    ctx.moveTo(x,y+10);
    ctx.lineTo(x+17,y+4);
    ctx.lineTo(x+31,y+17);
    ctx.lineTo(x+16,y+29);
    ctx.lineTo(x+2,y+24);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle="#444b54";

  ctx.fillRect(
    0,
    y,
    canvasWidth,
    5
  );

  ctx.fillStyle="#fff";

  ctx.font="bold 12px sans-serif";
  ctx.textAlign="right";

  ctx.fillText(
    "消せない岩盤",
    canvasWidth-10,
    y+25
  );
}

function drawBody(body){

  const x = body.position.x;
  const y = body.position.y;

  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(body.angle);

  if(body.blockType === "wood"){
    drawWood(body);
  }
  else if(body.blockType === "glass"){
    drawGlass(body);
  }
  else if(body.blockType === "stone"){
    drawStone(body);
  }
  else if(body.blockType === "slime"){
    drawSlime(body);
  }
  else if(body.blockType === "bomb"){
    drawBomb(body);
  }
  else if(body.blockType === "multiply"){
    drawMultiply(body);
  }
  else if(body.blockType === "bedrock"){
    drawBedrock(body);
  }

  ctx.restore();
}

function drawRoundedRect(x,y,w,h,r){

  ctx.beginPath();

  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);

  ctx.quadraticCurveTo(
    x+w,y,
    x+w,y+r
  );

  ctx.lineTo(x+w,y+h-r);

  ctx.quadraticCurveTo(
    x+w,y+h,
    x+w-r,y+h
  );

  ctx.lineTo(x+r,y+h);

  ctx.quadraticCurveTo(
    x,y+h,
    x,y+h-r
  );

  ctx.lineTo(x,y+r);

  ctx.quadraticCurveTo(
    x,y,
    x+r,y
  );

  ctx.closePath();
}

function drawWood(body){

  const w=body.baseW || 70;
  const h=body.baseH || 45;

  drawRoundedRect(
    -w/2,
    -h/2,
    w,
    h,
    9
  );

  ctx.fillStyle="#c9853c";
  ctx.fill();

  ctx.lineWidth=3;
  ctx.strokeStyle="#8d5723";
  ctx.stroke();

  ctx.strokeStyle="rgba(100,50,10,.35)";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.moveTo(-w*.3,-h*.15);
  ctx.quadraticCurveTo(
    0,
    0,
    w*.3,
    h*.12
  );
  ctx.stroke();
}

function drawGlass(body){

  const w=body.baseW || 70;
  const h=body.baseH || 45;

  drawRoundedRect(
    -w/2,
    -h/2,
    w,
    h,
    8
  );

  ctx.fillStyle="rgba(170,225,255,.62)";
  ctx.fill();

  ctx.strokeStyle="#78b9dc";
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.strokeStyle="rgba(255,255,255,.8)";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(-w*.3,-h*.25);
  ctx.lineTo(w*.25,h*.25);
  ctx.stroke();
}

function drawStone(body){

  const w=body.baseW || 70;
  const h=body.baseH || 45;

  drawRoundedRect(
    -w/2,
    -h/2,
    w,
    h,
    7
  );

  ctx.fillStyle="#888";
  ctx.fill();

  ctx.strokeStyle="#5d5d5d";
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.fillStyle="#aaa";

  for(let i=0;i<4;i++){

    const xx =
      -w/2 +
      (i+1)*w/5;

    const yy =
      -h/2 +
      (i%2)*h*.35;

    ctx.beginPath();
    ctx.arc(
      xx,
      yy,
      4,
      0,
      Math.PI*2
    );
    ctx.fill();
  }
}

function drawSlime(body){

  const r =
    (body.baseW || 50)/2;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#69cf65";
  ctx.fill();

  ctx.strokeStyle="#3e9d45";
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.fillStyle="#222";

  ctx.beginPath();
  ctx.arc(-r*.3,-r*.12,4,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(r*.3,-r*.12,4,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#276c2d";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.arc(
    0,
    r*.02,
    r*.35,
    0,
    Math.PI
  );

  ctx.stroke();
}

function drawBomb(body){

  const r =
    (body.baseW || 34)/2;

  ctx.beginPath();
  ctx.arc(
    0,
    0,
    r,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#333";
  ctx.fill();

  ctx.strokeStyle="#111";
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.strokeStyle="#e99b32";
  ctx.lineWidth=4;

  ctx.beginPath();
  ctx.moveTo(3,-r);
  ctx.quadraticCurveTo(
    12,
    -r-12,
    18,
    -r-5
  );
  ctx.stroke();

  ctx.fillStyle="#ffbd38";

  ctx.beginPath();
  ctx.arc(
    18,
    -r-5,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();
}

function drawMultiply(body){

  const w=body.baseW || 76;
  const h=body.baseH || 54;

  /*
    倍ブロックは固定。
  */

  drawRoundedRect(
    -w/2,
    -h/2,
    w,
    h,
    12
  );

  ctx.fillStyle="#79d68b";
  ctx.fill();

  ctx.strokeStyle="#3ca85b";
  ctx.lineWidth=4;
  ctx.stroke();

  ctx.fillStyle="#fff";
  ctx.font="900 23px sans-serif";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    "×"+body.factor,
    0,
    1
  );
}

function drawBedrock(body){

  const w=body.baseW || 80;
  const h=body.baseH || 48;

  drawRoundedRect(
    -w/2,
    -h/2,
    w,
    h,
    7
  );

  ctx.fillStyle="#555d66";
  ctx.fill();

  ctx.strokeStyle="#343a40";
  ctx.lineWidth=4;
  ctx.stroke();

  ctx.fillStyle="#9299a0";
  ctx.font="900 13px sans-serif";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    "岩盤",
    0,
    0
  );
}

/* =========================
   SELECTION
========================= */

function drawSelection(){

  const body = selectedBody;

  if(!body){
    return;
  }

  if(body.isGroundBedrock){
    return;
  }

  const w =
    body.bounds.max.x-body.bounds.min.x;

  const h =
    body.bounds.max.y-body.bounds.min.y;

  ctx.save();

  ctx.strokeStyle="#f07b1a";
  ctx.lineWidth=2;
  ctx.setLineDash([6,5]);

  ctx.strokeRect(
    body.bounds.min.x-5,
    body.bounds.min.y-5,
    w+10,
    h+10
  );

  ctx.setLineDash([]);

  if(
    !body.isStatic &&
    body.blockType !== "multiply" &&
    body.blockType !== "bedrock" &&
    body.blockType !== "slime" &&
    body.blockType !== "bomb"
  ){

    const points=[
      [body.bounds.min.x,body.bounds.min.y],
      [body.bounds.max.x,body.bounds.min.y],
      [body.bounds.min.x,body.bounds.max.y],
      [body.bounds.max.x,body.bounds.max.y]
    ];

    ctx.fillStyle="#fff";
    ctx.strokeStyle="#e96e15";
    ctx.lineWidth=2;

    points.forEach(p=>{
      ctx.beginPath();
      ctx.arc(
        p[0],
        p[1],
        7,
        0,
        Math.PI*2
      );
      ctx.fill();
      ctx.stroke();
    });
  }

  if(
    !body.isStatic &&
    body.blockType !== "multiply" &&
    body.blockType !== "bedrock"
  ){

    const lineTop =
      body.bounds.min.y-42;

    ctx.strokeStyle="#e96e15";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
      body.position.x,
      body.bounds.min.y
    );

    ctx.lineTo(
      body.position.x,
      lineTop
    );

    ctx.stroke();

    ctx.fillStyle="#fff";
    ctx.strokeStyle="#e96e15";

    ctx.beginPath();
    ctx.arc(
      body.position.x,
      lineTop,
      8,
      0,
      Math.PI*2
    );

    ctx.fill();
    ctx.stroke();
  }

  ctx.restore();
}

/* =========================
   EXPLOSION DRAW
========================= */

function drawExplosions(){

  const now=performance.now();

  explosions =
    explosions.filter(ex => {

      const elapsed =
        now-ex.start;

      if(elapsed>=ex.duration){
        return false;
      }

      const t =
        elapsed/ex.duration;

      const radius =
        20+135*t;

      const alpha =
        1-t;

      const gradient =
        ctx.createRadialGradient(
          ex.x,
          ex.y,
          0,
          ex.x,
          ex.y,
          radius
        );

      gradient.addColorStop(
        0,
        "rgba(255,255,180,"+
        (0.95*alpha)+")"
      );

      gradient.addColorStop(
        .35,
        "rgba(255,175,45,"+
        (0.7*alpha)+")"
      );

      gradient.addColorStop(
        1,
        "rgba(255,80,20,0)"
      );

      ctx.fillStyle=gradient;

      ctx.beginPath();

      ctx.arc(
        ex.x,
        ex.y,
        radius,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.strokeStyle=
        "rgba(255,100,20,"+
        alpha+")";

      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.arc(
        ex.x,
        ex.y,
        radius*.72,
        0,
        Math.PI*2
      );

      ctx.stroke();

      return true;
    });
}

/* =========================
   GAME LOOP
========================= */

function gameLoop(now){

  if(engine){

    const dt =
      Math.min(
        50,
        now-lastTime
      );

    lastTime=now;

    /*
      ここではエンジンを止めない。
      1個のブロックが床についた後も
      他のブロックは普通に動き続ける。
    */

    Engine.update(
      engine,
      dt
    );

    draw();
  }

  animationFrame =
    requestAnimationFrame(
      gameLoop
    );
}

function startGameLoop(){

  if(animationFrame === null){

    lastTime=performance.now();

    animationFrame =
      requestAnimationFrame(
        gameLoop
      );
  }
}

startGameLoop();

function saveStage(){

  const name =
    stageNameInput.value.trim() ||
    "無題のステージ";

  const data =
    bodies
      .filter(
        b=>!b.isGroundBedrock
      )
      .map(b=>({

        type:b.blockType,

        x:b.position.x,
        y:b.position.y,

        angle:b.angle,

        width:
          b.baseW ||
          (b.bounds.max.x-b.bounds.min.x),

        height:
          b.baseH ||
          (b.bounds.max.y-b.bounds.min.y),

        factor:
          b.blockType==="multiply"
            ? b.factor
            : null
      }));

  const stages =
    JSON.parse(
      localStorage.getItem(SAVE_KEY) ||
      "[]"
    );

  stages.push({
    id:newId(),
    name,
    created:Date.now(),
    objects:data
  });

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(stages)
  );

  saveModal.classList.add("hidden");
}

  const stages =
    JSON.parse(
      localStorage.getItem(SAVE_KEY) ||
      "[]"
    );

  stageList.innerHTML="";

  if(stages.length===0){

    const empty =
      document.createElement("div");

    empty.className="empty";
    empty.textContent=
      "保存されたステージはありません。";

    stageList.appendChild(empty);

  }else{

    [...stages]
      .reverse()
      .forEach(stage=>{

        const item =
          document.createElement("div");

        item.className="stage-item";

        const name =
          document.createElement("div");

        name.className="stage-name";
        name.textContent=stage.name;

        const play =
          document.createElement("button");

        play.textContent="遊ぶ";

        play.addEventListener(
          "click",
          ()=>{
            loadStage(
              stage,
              "play"
            );
          }
        );

        const edit =
          document.createElement("button");

        edit.textContent="編集";

        edit.addEventListener(
          "click",
          ()=>{
            loadStage(
              stage,
              "editor"
            );
          }
        );

        const del =
          document.createElement("button");

        del.textContent="削除";

        del.addEventListener(
          "click",
          ()=>{
            deleteStage(stage.id);
          }
        );

        item.appendChild(name);
        item.appendChild(play);
        item.appendChild(edit);
        item.appendChild(del);

        stageList.appendChild(item);
      });
  }

  showScreen(stageListScreen);
}

function loadStage(stage,newMode){

  showScreen(gameScreen);

  setTimeout(()=>{

    resizeCanvas();

    if(!engine){
      createEngine();
    }

    clearObjects();

    resizeCanvas();

    stage.objects.forEach(obj=>{

      const body =
        createObject(
          obj.type,
          obj.x,
          obj.y
        );

      if(!body){
        return;
      }

      Body.setAngle(
        body,
        obj.angle || 0
      );

      if(
        obj.width &&
        obj.height &&
        body.blockType !== "bomb" &&
        body.blockType !== "slime"
      ){

        const oldW =
          body.baseW ||
          (body.bounds.max.x-body.bounds.min.x);

        const oldH =
          body.baseH ||
          (body.bounds.max.y-body.bounds.min.y);

        Body.scale(
          body,
          obj.width/oldW,
          obj.height/oldH
        );

        body.baseW=obj.width;
        body.baseH=obj.height;
      }

      if(body.blockType==="multiply"){

        body.factor =
          Math.max(
            2,
            Math.min(
              20,
              Number(obj.factor)||2
            )
          );
      }

      Body.setSleeping(
        body,
        false
      );
    });

    setMode(newMode);

  },30);
}

function deleteStage(id){

  const stages =
    JSON.parse(
      localStorage.getItem(SAVE_KEY) ||
      "[]"
    );

  const newStages =
    stages.filter(
      s=>s.id!==id
    );

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(newStages)
  );

  showStageList();
}

listBackBtn.addEventListener(
  "click",
  ()=>{
    showScreen(titleScreen);
  }
);

/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  ()=>{
    resizeCanvas();
  }
);

/* =========================
   FACTOR
========================= */

factorInput.addEventListener(
  "change",
  ()=>{

    let value =
      Number(factorInput.value);

    if(!Number.isFinite(value)){
      value=2;
    }

    value =
      Math.max(
        2,
        Math.min(
          20,
          Math.floor(value)
        )
      );

    factorInput.value=value;
  }
);

/* =========================
   START
========================= */

showScreen(titleScreen);
</script>
