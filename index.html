<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>スライム城メーカー</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  background:#f7ead3;
  color:#33251c;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.screen{
  display:none;
  position:absolute;
  inset:0;
}

.screen.active{
  display:flex;
}

/* =========================
   START
========================= */

#startScreen{
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:
    radial-gradient(
      circle at 50% 20%,
      #fff8e9 0,
      #f7ead3 55%,
      #ead1aa 100%
    );
}

.logo{
  font-size:clamp(32px,7vw,72px);
  font-weight:900;
  color:#7d3f18;
  text-shadow:
    0 4px 0 #fff,
    0 7px 0 rgba(90,50,20,.12);
  margin-bottom:45px;
  text-align:center;
}

.startButtons{
  display:flex;
  flex-direction:column;
  gap:18px;
  width:min(520px,85vw);
}

.mainButton{
  min-height:72px;
  border-radius:18px;
  background:#e77d28;
  color:#fff;
  font-weight:900;
  font-size:22px;
  box-shadow:
    0 5px 0 #a84e16,
    0 9px 18px rgba(90,50,20,.18);
}

.mainButton:active{
  transform:translateY(4px);
  box-shadow:
    0 1px 0 #a84e16,
    0 4px 10px rgba(90,50,20,.18);
}

/* =========================
   COMMON
========================= */

#editorScreen,
#playScreen{
  flex-direction:column;
}

.topbar{
  height:64px;
  min-height:64px;
  background:#713b1b;
  color:white;
  display:flex;
  align-items:center;
  gap:9px;
  padding:7px 10px;
  z-index:20;
  box-shadow:0 3px 8px rgba(0,0,0,.25);
}

.topTitle{
  font-weight:900;
  font-size:19px;
  margin-right:auto;
  white-space:nowrap;
}

.topButton{
  background:#fff3df;
  color:#5e3218;
  border-radius:10px;
  padding:9px 13px;
  font-weight:800;
  white-space:nowrap;
}

.topButton.orange{
  background:#f80;
  color:#fff;
}

.topButton.red{
  background:#bd3327;
  color:white;
}

.editorArea,
.playArea{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  background:#e9d0a5;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

/* =========================
   EDITOR TOOLBAR
========================= */

.editorToolbar{
  position:absolute;
  left:10px;
  top:10px;
  z-index:10;
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  max-width:min(850px,calc(100vw - 20px));
  pointer-events:none;
}

.tool{
  pointer-events:auto;
  min-width:62px;
  min-height:52px;
  border-radius:11px;
  background:#fff5e2;
  border:2px solid #c38b52;
  color:#563019;
  box-shadow:0 3px 5px rgba(60,30,10,.2);
  font-weight:900;
}

.tool.selected{
  background:#f80;
  color:white;
  border-color:#a94e00;
}

.toolIcon{
  font-size:20px;
  line-height:20px;
}

.tool small{
  display:block;
  font-size:10px;
  opacity:.8;
}

.editorInfo{
  position:absolute;
  right:10px;
  top:10px;
  z-index:10;
  background:rgba(255,248,232,.92);
  border:2px solid #bd8b58;
  border-radius:10px;
  padding:9px 12px;
  font-size:12px;
  font-weight:700;
  pointer-events:none;
}

.zoomBox{
  position:absolute;
  right:10px;
  bottom:10px;
  z-index:10;
  display:flex;
  gap:6px;
}

.zoomBox button{
  width:45px;
  height:45px;
  border-radius:10px;
  background:#fff5e2;
  border:2px solid #bd8b58;
  font-size:23px;
  font-weight:900;
  color:#57311a;
}

.stageNameBox{
  position:absolute;
  left:10px;
  bottom:10px;
  z-index:10;
  background:rgba(255,248,232,.95);
  border:2px solid #bd8b58;
  border-radius:10px;
  padding:7px;
  display:flex;
  gap:6px;
}

.stageNameBox input{
  width:180px;
  border:2px solid #c9945c;
  border-radius:7px;
  padding:7px;
  background:#fff;
}

.stageNameBox button{
  background:#e77d28;
  color:#fff;
  border-radius:7px;
  padding:7px 10px;
  font-weight:900;
}

/* =========================
   PLAY
========================= */

.playInfo{
  position:absolute;
  left:10px;
  top:10px;
  z-index:10;
  background:rgba(255,248,232,.92);
  border:2px solid #bd8b58;
  border-radius:10px;
  padding:8px 12px;
  font-weight:800;
  pointer-events:none;
}

.playHelp{
  position:absolute;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:10;
  background:rgba(80,40,20,.82);
  color:white;
  padding:9px 16px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
  pointer-events:none;
  white-space:nowrap;
}

/* =========================
   SELECT
========================= */

#selectScreen{
  flex-direction:column;
  background:#f7ead3;
}

.selectHeader{
  height:72px;
  min-height:72px;
  background:#713b1b;
  color:white;
  display:flex;
  align-items:center;
  padding:0 15px;
  gap:10px;
}

.selectHeader h1{
  margin:0;
  font-size:24px;
}

.selectHeader button{
  margin-left:auto;
  padding:10px 16px;
  border-radius:9px;
  background:#fff2dc;
  color:#663516;
  font-weight:900;
}

.stageList{
  flex:1;
  overflow:auto;
  padding:20px;
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(230px,1fr));
  gap:15px;
  align-content:start;
}

.stageCard{
  background:#fff7e8;
  border:3px solid #d2a06d;
  border-radius:15px;
  padding:16px;
  box-shadow:
    0 4px 8px rgba(80,40,10,.15);
}

.stageCard h2{
  margin:0 0 8px;
  font-size:19px;
}

.stageMeta{
  font-size:12px;
  color:#76533c;
  margin-bottom:13px;
}

.stageActions{
  display:flex;
  gap:7px;
}

.stageActions button{
  flex:1;
  padding:9px;
  border-radius:8px;
  background:#e77d28;
  color:#fff;
  font-weight:900;
}

.stageActions .delete{
  background:#bd3327;
}

.noStages{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:#79563e;
  font-weight:800;
}

@media(max-width:700px){

  .topbar{
    height:58px;
    min-height:58px;
    padding:5px;
    gap:5px;
  }

  .topTitle{
    font-size:14px;
  }

  .topButton{
    padding:7px 8px;
    font-size:12px;
  }

  .editorInfo{
    display:none;
  }

  .tool{
    min-width:55px;
    min-height:48px;
  }

  .stageNameBox input{
    width:130px;
  }

  .playHelp{
    font-size:11px;
    bottom:7px;
  }
}
</style>
</head>

<body>

<!-- =========================
     START
========================= -->

<section id="startScreen" class="screen active">

  <div class="logo">
    スライム城メーカー
  </div>

  <div class="startButtons">

    <button class="mainButton" id="createStageButton">
      ステージを作る
    </button>

    <button class="mainButton" id="playStageButton">
      ステージで遊ぶ
    </button>

  </div>

</section>


<!-- =========================
     SELECT
========================= -->

<section id="selectScreen" class="screen">

  <div class="selectHeader">

    <h1>ステージを選択</h1>

    <button id="selectBackButton">
      戻る
    </button>

  </div>

  <div id="stageList" class="stageList"></div>

</section>


<!-- =========================
     EDITOR
========================= -->

<section id="editorScreen" class="screen">

  <div class="topbar">

    <div class="topTitle">
      ステージ作成
    </div>

    <button class="topButton" id="editorTestButton">
      テストプレイ
    </button>

    <button class="topButton orange" id="saveStageButton">
      保存
    </button>

    <button class="topButton red" id="editorExitButton">
      終了
    </button>

  </div>


  <div class="editorArea">

    <canvas id="editorCanvas"></canvas>


    <div class="editorToolbar">

      <button class="tool selected"
        data-tool="wood">
        <span class="toolIcon">🪵</span>
        <small>木</small>
      </button>

      <button class="tool"
        data-tool="glass">
        <span class="toolIcon">▱</span>
        <small>ガラス</small>
      </button>

      <button class="tool"
        data-tool="stone">
        <span class="toolIcon">⬛</span>
        <small>石</small>
      </button>

      <button class="tool"
        data-tool="enemy">
        <span class="toolIcon">●</span>
        <small>敵</small>
      </button>

      <button class="tool"
        data-tool="bomb">
        <span class="toolIcon">💣</span>
        <small>爆弾</small>
      </button>

      <button class="tool"
        data-tool="multiply">
        <span class="toolIcon">×2</span>
        <small>増殖</small>
      </button>

      <button class="tool"
        data-tool="erase">
        <span class="toolIcon">⌫</span>
        <small>消す</small>
      </button>

      <button class="tool"
        data-tool="pan">
        <span class="toolIcon">✋</span>
        <small>移動</small>
      </button>

    </div>


    <div class="editorInfo">

      クリック：配置<br>
      移動ツール：ドラッグ<br>
      ホイール：ズーム<br>
      <span id="editorObjectCount">
        物体 0
      </span>

    </div>


    <div class="stageNameBox">

      <input
        id="stageNameInput"
        maxlength="40"
        placeholder="ステージ名"
      >

      <button id="clearStageButton">
        全消去
      </button>

    </div>


    <div class="zoomBox">

      <button id="zoomOut">
        −
      </button>

      <button id="zoomReset">
        100%
      </button>

      <button id="zoomIn">
        ＋
      </button>

    </div>

  </div>

</section>


<!-- =========================
     PLAY
========================= -->

<section id="playScreen" class="screen">

  <div class="topbar">

    <div class="topTitle" id="playTitle">
      プレイ
    </div>

    <button class="topButton orange"
      id="explodeButton">
      全爆破
    </button>

    <button class="topButton"
      id="playRestartButton">
      リセット
    </button>

    <button class="topButton red"
      id="playExitButton">
      終了
    </button>

  </div>


  <div class="playArea">

    <canvas id="playCanvas"></canvas>

    <div class="playInfo">

      爆弾：
      <span id="bombCount">0</span>

    </div>


    <div class="playHelp">
      画面をクリックして爆弾を配置 → 「全爆破」
    </div>

  </div>

</section>


<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>

<script>
"use strict";

/* ============================================================
   Matter.js
============================================================ */

const {
  Engine,
  World,
  Bodies,
  Body,
  Composite
} = Matter;


/* ============================================================
   定数
============================================================ */

const STORAGE_KEY =
  "slimeCastleMaker_v3";

const FLOOR_Y = 1000;

const EXPLOSION_RADIUS = 110;

const EXPLOSION_FORCE_RADIUS = 150;

const EXPLOSION_FORCE = 0.045;

const EXPLOSION_BLOCK_DAMAGE = 150;

const ENEMY_KILL_IMPACT = 9;

const IMPACT_MASS_CAP = 14;


/* ============================================================
   素材
============================================================ */

const MATERIALS = {

  wood:{
    density:0.0035,
    friction:0.4,
    restitution:0.08,
    hp:2,
    threshold:16
  },

  glass:{
    density:0.0028,
    friction:0.15,
    restitution:0.25,
    hp:1,
    threshold:10
  },

  stone:{
    density:0.008,
    friction:0.6,
    restitution:0.02,
    hp:3,
    threshold:48
  }

};


/* ============================================================
   状態
============================================================ */

let currentScreen =
  "start";

let currentTool =
  "wood";

let currentStageId =
  null;

let editorEngine =
  null;

let playEngine =
  null;

let editorCamera = {
  x:0,
  y:500,
  zoom:1
};

let playCamera = {
  x:0,
  y:500,
  zoom:1
};

let editorCanvas =
  document.getElementById(
    "editorCanvas"
  );

let playCanvas =
  document.getElementById(
    "playCanvas"
  );

let editorCtx =
  editorCanvas.getContext("2d");

let playCtx =
  playCanvas.getContext("2d");


/*
  増殖の接触状態。

  multiplyContacts は

  増殖物体ID
       ↓
  Set(現在触れている爆弾ID)

  を管理する。
*/
const multiplyContacts =
  new Map();


const explosionEffects = [];


/* ============================================================
   DOM
============================================================ */

const startScreen =
  document.getElementById(
    "startScreen"
  );

const selectScreen =
  document.getElementById(
    "selectScreen"
  );

const editorScreen =
  document.getElementById(
    "editorScreen"
  );

const playScreen =
  document.getElementById(
    "playScreen"
  );

const stageList =
  document.getElementById(
    "stageList"
  );

const stageNameInput =
  document.getElementById(
    "stageNameInput"
  );

const editorObjectCount =
  document.getElementById(
    "editorObjectCount"
  );

const bombCount =
  document.getElementById(
    "bombCount"
  );

const playTitle =
  document.getElementById(
    "playTitle"
  );


/* ============================================================
   LocalStorage
============================================================ */

function loadStages(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!raw){
      return [];
    }

    const data =
      JSON.parse(raw);

    return Array.isArray(data)
      ? data
      : [];

  }catch(e){

    console.error(e);

    return [];

  }

}


function saveStages(stages){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(stages)
  );

}


function makeId(){

  return (
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


/* ============================================================
   画面
============================================================ */

function showScreen(name){

  [
    startScreen,
    selectScreen,
    editorScreen,
    playScreen
  ].forEach(
    s => s.classList.remove("active")
  );


  if(name === "start"){
    startScreen.classList.add("active");
  }

  if(name === "select"){
    selectScreen.classList.add("active");
    renderStageList();
  }

  if(name === "editor"){
    editorScreen.classList.add("active");
  }

  if(name === "play"){
    playScreen.classList.add("active");
  }


  currentScreen =
    name;


  resizeCanvases();

}


/* ============================================================
   Engine
============================================================ */

function createEngine(){

  const engine =
    Engine.create();

  engine.gravity.x =
    0;

  engine.gravity.y =
    1;

  engine.gravity.scale =
    0.001;

  engine.positionIterations =
    8;

  engine.velocityIterations =
    6;

  engine.constraintIterations =
    2;

  return engine;

}


/* ============================================================
   床
============================================================ */

function createFloor(engine){

  const floor =
    Bodies.rectangle(
      0,
      FLOOR_Y,
      100000,
      100,
      {
        isStatic:true,
        label:"floor"
      }
    );


  floor.plugin = {

    gameType:
      "floor"

  };


  World.add(
    engine.world,
    floor
  );

}


/* ============================================================
   木・ガラス・石
============================================================ */

function createBlock(
  engine,
  material,
  x,
  y,
  w=90,
  h=30,
  angle=0
){

  const m =
    MATERIALS[material];

  if(!m){
    return null;
  }


  const body =
    Bodies.rectangle(
      x,
      y,
      w,
      h,
      {
        angle:angle,
        density:m.density,
        friction:m.friction,
        restitution:m.restitution,
        frictionAir:0.001,
        label:"block"
      }
    );


  body.plugin = {

    gameType:"block",

    material:material,

    hp:m.hp,

    maxHp:m.hp,

    threshold:m.threshold,

    width:w,

    height:h

  };


  World.add(
    engine.world,
    body
  );


  return body;

}


/* ============================================================
   敵
============================================================ */

function createEnemy(
  engine,
  x,
  y,
  radius=23
){

  const body =
    Bodies.circle(
      x,
      y,
      radius,
      {
        density:0.0025,
        friction:0.5,
        restitution:0.1,
        frictionAir:0.002,
        label:"enemy"
      }
    );


  body.plugin = {

    gameType:"enemy",

    radius:radius,

    alive:true,

    hp:1

  };


  World.add(
    engine.world,
    body
  );


  return body;

}


/* ============================================================
   爆弾
============================================================ */

function createBomb(
  engine,
  x,
  y,
  dynamic=false
){

  const body =
    Bodies.circle(
      x,
      y,
      13,
      {
        density:0.003,
        friction:0.4,
        restitution:0.2,
        frictionAir:0.001,
        label:"bomb",
        isStatic:!dynamic
      }
    );


  body.plugin = {

    gameType:"bomb",

    radius:13,

    exploded:false,

    touchingMultiply:false,

    bombId:makeId()

  };


  World.add(
    engine.world,
    body
  );


  return body;

}


/* ============================================================
   増殖
============================================================ */

function createMultiply(
  engine,
  x,
  y
){

  /*
    増殖は床に置いても動かない。
    配置位置を固定する。
  */

  const body =
    Bodies.rectangle(
      x,
      y,
      70,
      45,
      {
        isStatic:true,
        label:"multiply"
      }
    );


  body.plugin = {

    gameType:"multiply",

    width:70,

    height:45,

    multiplyId:makeId()

  };


  World.add(
    engine.world,
    body
  );


  return body;

}


/* ============================================================
   衝突ダメージ
============================================================ */

function computeCollisionImpact(
  a,
  b,
  target
){

  const av =
    a.velocity ||
    {x:0,y:0};

  const bv =
    b.velocity ||
    {x:0,y:0};


  const dx =
    av.x - bv.x;

  const dy =
    av.y - bv.y;


  const speed =
    Math.sqrt(
      dx*dx +
      dy*dy
    );


  const mass =
    Math.min(
      target.mass || 1,
      IMPACT_MASS_CAP
    );


  return speed * mass;

}


/* ============================================================
   衝突イベント
============================================================ */

function setupCollisionEvents(
  engine
){

  Matter.Events.on(
    engine,
    "collisionStart",
    event => {

      event.pairs.forEach(
        pair => {

          handleCollision(
            pair.bodyA,
            pair.bodyB
          );

        }
      );

    }
  );


  Matter.Events.on(
    engine,
    "collisionActive",
    event => {

      event.pairs.forEach(
        pair => {

          handleActiveCollision(
            pair.bodyA,
            pair.bodyB
          );

        }
      );

    }
  );


  Matter.Events.on(
    engine,
    "collisionEnd",
    event => {

      event.pairs.forEach(
        pair => {

          handleCollisionEnd(
            pair.bodyA,
            pair.bodyB
          );

        }
      );

    }
  );

}


/* ============================================================
   衝突開始
============================================================ */

function handleCollision(
  a,
  b
){

  const at =
    a.plugin &&
    a.plugin.gameType;

  const bt =
    b.plugin &&
    b.plugin.gameType;


  /* 爆弾 × 増殖 */

  if(
    at === "bomb" &&
    bt === "multiply"
  ){

    handleMultiplyContact(
      b,
      a
    );

  }


  if(
    bt === "bomb" &&
    at === "multiply"
  ){

    handleMultiplyContact(
      a,
      b
    );

  }


  /* 敵 × 建築物 */

  if(
    at === "enemy" &&
    bt === "block"
  ){

    enemyHitBlock(
      a,
      b
    );

  }


  if(
    bt === "enemy" &&
    at === "block"
  ){

    enemyHitBlock(
      b,
      a
    );

  }


  /* 建築物 × 建築物 */

  if(
    at === "block" &&
    bt === "block"
  ){

    blockHitBlock(
      a,
      b
    );

  }

}


/* ============================================================
   増殖接触
============================================================ */

function handleMultiplyContact(
  multiply,
  bomb
){

  if(
    !multiply ||
    !bomb ||
    !multiply.plugin ||
    !bomb.plugin
  ){
    return;
  }


  /*
    同じ爆弾がすでに触れているなら
    何もしない。

    collisionStartは原則1回だが、
    さらに安全のためSetで管理する。
  */

  let set =
    multiplyContacts.get(
      multiply.plugin.multiplyId
    );


  if(!set){

    set = new Set();

    multiplyContacts.set(
      multiply.plugin.multiplyId,
      set
    );

  }


  const id =
    bomb.plugin.bombId;


  if(set.has(id)){
    return;
  }


  /*
    ここで初めて「触れた」と判定。
  */

  set.add(id);

  bomb.plugin.touchingMultiply =
    true;


  /*
    現在触れている爆弾全体を取得。
  */

  const engine =
    currentScreen === "play"
      ? playEngine
      : editorEngine;


  if(!engine){
    return;
  }


  const bombs =
    Composite.allBodies(
      engine.world
    ).filter(
      body =>
        body.plugin &&
        body.plugin.gameType === "bomb"
    );


  /*
    現在触れている爆弾の数。
    これを同数複製する。

    例：
      1個触れる → 2個
      2個触れる → 4個
      4個触れる → 8個
  */

  const touchingBombs =
    bombs.filter(
      b =>
        isBombTouchingMultiply(
          b,
          multiply
        )
    );


  /*
    今回触れた爆弾がまだ
    配列に入っていない場合も考慮。
  */

  if(
    touchingBombs.indexOf(bomb) === -1
  ){

    touchingBombs.push(
      bomb
    );

  }


  const originals =
    touchingBombs.slice();


  originals.forEach(
    original => {

      const x =
        original.position.x;

      const y =
        original.position.y;


      /*
        元の爆弾と重ならないよう少しずらす。
      */

      const angle =
        Math.random() *
        Math.PI * 2;

      const distance =
        25;


      const nx =
        x +
        Math.cos(angle) *
        distance;

      const ny =
        y +
        Math.sin(angle) *
        distance;


      const newBomb =
        createBomb(
          engine,
          nx,
          ny,
          true
        );


      /*
        元の爆弾とほぼ同じ速度を持たせる。
      */

      Body.setVelocity(
        newBomb,
        {
          x:
            original.velocity.x,

          y:
            original.velocity.y
        }
      );

    }
  );


  /*
    増殖後は元の爆弾を「まだ触れている」状態として
    管理する。

    したがって collisionActive では
    再度増殖しない。
  */

  updateBombCount();

}


/* ============================================================
   増殖物体との接触判定
============================================================ */

function isBombTouchingMultiply(
  bomb,
  multiply
){

  const dx =
    bomb.position.x -
    multiply.position.x;

  const dy =
    bomb.position.y -
    multiply.position.y;


  /*
    円と矩形を簡易的に判定。
    爆弾の半径も加える。
  */

  const halfW =
    multiply.plugin.width / 2;

  const halfH =
    multiply.plugin.height / 2;

  const closestX =
    Math.max(
      multiply.position.x-halfW,
      Math.min(
        bomb.position.x,
        multiply.position.x+halfW
      )
    );

  const closestY =
    Math.max(
      multiply.position.y-halfH,
      Math.min(
        bomb.position.y,
        multiply.position.y+halfH
      )
    );


  const cx =
    bomb.position.x -
    closestX;

  const cy =
    bomb.position.y -
    closestY;


  return (
    cx*cx +
    cy*cy
  ) <=
  bomb.plugin.radius *
  bomb.plugin.radius;

}


/* ============================================================
   接触中
============================================================ */

function handleActiveCollision(
  a,
  b
){

  const at =
    a.plugin &&
    a.plugin.gameType;

  const bt =
    b.plugin &&
    b.plugin.gameType;


  /*
    collisionActiveでは増殖させない。

    「一度離れる→再接触」が必要なので、
    ここでは何もしない。
  */

  if(
    (
      at === "bomb" &&
      bt === "multiply"
    ) ||
    (
      bt === "bomb" &&
      at === "multiply"
    )
  ){

    return;

  }

}


/* ============================================================
   接触終了
============================================================ */

function handleCollisionEnd(
  a,
  b
){

  const at =
    a.plugin &&
    a.plugin.gameType;

  const bt =
    b.plugin &&
    b.plugin.gameType;


  if(
    at === "bomb" &&
    bt === "multiply"
  ){

    removeMultiplyContact(
      b,
      a
    );

  }


  if(
    bt === "bomb" &&
    at === "multiply"
  ){

    removeMultiplyContact(
      a,
      b
    );

  }

}


/* ============================================================
   増殖から離れた
============================================================ */

function removeMultiplyContact(
  multiply,
  bomb
){

  if(
    !multiply.plugin ||
    !bomb.plugin
  ){
    return;
  }


  const id =
    multiply.plugin.multiplyId;


  const set =
    multiplyContacts.get(
      id
    );


  if(set){

    set.delete(
      bomb.plugin.bombId
    );

  }


  bomb.plugin.touchingMultiply =
    false;

}


/* ============================================================
   敵 × ブロック
============================================================ */

function enemyHitBlock(
  enemy,
  block
){

  if(
    !enemy.plugin.alive ||
    block.plugin.hp <= 0
  ){
    return;
  }


  const impact =
    computeCollisionImpact(
      enemy,
      block,
      enemy
    );


  if(
    impact >= ENEMY_KILL_IMPACT
  ){

    killEnemy(
      enemy
    );

  }

}


/* ============================================================
   ブロック × ブロック
============================================================ */

function blockHitBlock(
  a,
  b
){

  damageBlock(
    a,
    b
  );

  damageBlock(
    b,
    a
  );

}


function damageBlock(
  target,
  other
){

  if(
    target.plugin.hp <= 0
  ){
    return;
  }


  const impact =
    computeCollisionImpact(
      target,
      other,
      target
    );


  if(
    impact < 4
  ){
    return;
  }


  const damage =
    Math.max(
      1,
      Math.floor(
        impact /
        target.plugin.threshold
      )
    );


  target.plugin.hp -=
    damage;


  if(
    target.plugin.hp <= 0
  ){

    World.remove(
      currentPhysicsEngine(),
      target
    );

  }

}


/* ============================================================
   敵死亡
============================================================ */

function killEnemy(
  enemy
){

  if(
    !enemy.plugin.alive
  ){
    return;
  }


  enemy.plugin.alive =
    false;

  enemy.plugin.deathTime =
    performance.now();

  Body.setStatic(
    enemy,
    true
  );

}


/* ============================================================
   現在のEngine
============================================================ */

function currentPhysicsEngine(){

  if(
    currentScreen === "editor"
  ){

    return editorEngine;

  }

  return playEngine;

}


/* ============================================================
   爆発
============================================================ */

function explodeAt(
  engine,
  x,
  y
){

  const bodies =
    Composite.allBodies(
      engine.world
    );


  bodies.forEach(
    body => {

      if(
        body.isStatic
      ){
        return;
      }


      const dx =
        body.position.x -
        x;

      const dy =
        body.position.y -
        y;


      const d =
        Math.sqrt(
          dx*dx +
          dy*dy
        );


      if(
        d > EXPLOSION_FORCE_RADIUS ||
        d === 0
      ){
        return;
      }


      const nx =
        dx/d;

      const ny =
        dy/d;


      const strength =
        EXPLOSION_FORCE *
        (
          1 -
          d /
          EXPLOSION_FORCE_RADIUS
        );


      Body.applyForce(
        body,
        body.position,
        {
          x:
            nx *
            strength *
            body.mass,

          y:
            ny *
            strength *
            body.mass
        }
      );


      if(
        body.plugin &&
        body.plugin.gameType === "block"
      ){

        const damage =
          EXPLOSION_BLOCK_DAMAGE *
          (
            1 -
            d /
            EXPLOSION_FORCE_RADIUS
          );


        body.plugin.hp -=
          damage / 100;


        if(
          body.plugin.hp <= 0
        ){

          World.remove(
            engine.world,
            body
          );

        }

      }


      if(
        body.plugin &&
        body.plugin.gameType === "enemy" &&
        body.plugin.alive &&
        d <
        EXPLOSION_RADIUS * 0.95
      ){

        killEnemy(
          body
        );

      }

    }
  );


  explosionEffects.push({

    x:x,

    y:y,

    start:
      performance.now(),

    duration:420

  });

}


/* ============================================================
   全爆破
============================================================ */

function explodeAllBombs(){

  if(!playEngine){
    return;
  }


  const bombs =
    Composite.allBodies(
      playEngine.world
    ).filter(
      b =>
        b.plugin &&
        b.plugin.gameType === "bomb"
    );


  bombs.forEach(
    bomb => {

      explodeAt(
        playEngine,
        bomb.position.x,
        bomb.position.y
      );

    }
  );


  bombs.forEach(
    bomb => {

      World.remove(
        playEngine.world,
        bomb
      );

    }
  );


  multiplyContacts.clear();

  updateBombCount();

}


/* ============================================================
   座標変換
============================================================ */

function screenToWorld(
  canvas,
  camera,
  x,
  y
){

  return {

    x:
      (
        x -
        canvas.clientWidth/2
      ) /
      camera.zoom +
      camera.x,

    y:
      (
        y -
        canvas.clientHeight/2
      ) /
      camera.zoom +
      camera.y

  };

}


function worldToScreen(
  canvas,
  camera,
  x,
  y
){

  return {

    x:
      (
        x -
        camera.x
      ) *
      camera.zoom +
      canvas.clientWidth/2,

    y:
      (
        y -
        camera.y
      ) *
      camera.zoom +
      canvas.clientHeight/2

  };

}


/* ============================================================
   Canvas
============================================================ */

function resizeCanvas(
  canvas
){

  const rect =
    canvas.getBoundingClientRect();


  const dpr =
    Math.max(
      1,
      Math.min(
        2,
        window.devicePixelRatio || 1
      )
    );


  canvas.width =
    Math.max(
      1,
      Math.floor(
        rect.width*dpr
      )
    );


  canvas.height =
    Math.max(
      1,
      Math.floor(
        rect.height*dpr
      )
    );


  const ctx =
    canvas.getContext("2d");


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}


function resizeCanvases(){

  resizeCanvas(
    editorCanvas
  );

  resizeCanvas(
    playCanvas
  );

}


window.addEventListener(
  "resize",
  resizeCanvases
);

   エディタ描画
============================================================ */

function drawEditor(){

  if(
    !editorEngine
  ){

  }

  );

}

/* ============================================================
   グリッド
============================================================ */

function drawGrid(
  ctx,
  canvas,
  camera
){

  const step =
    100 *
    camera.zoom;


  if(step < 8){
    return;
  }


  const origin =
    worldToScreen(
      canvas,
      camera,
      0,
      0
    );


  ctx.beginPath();

  ctx.strokeStyle =
    "rgba(100,70,40,.12)";

  ctx.lineWidth =
    1;


  let sx =
    ((origin.x%step)+step)%step;


  for(
    let x=sx;
    x<canvas.clientWidth;
    x+=step
  ){

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      canvas.clientHeight
    );

  }


  let sy =
    ((origin.y%step)+step)%step;


  for(
    let y=sy;
    y<canvas.clientHeight;
    y+=step
  ){

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      canvas.clientWidth,
      y
    );

  }


  ctx.stroke();

}


/* ============================================================
   床描画
============================================================ */

function drawFloor(
  ctx,
  canvas,
  camera
){

  const p =
    worldToScreen(
      canvas,
      camera,
      0,
      FLOOR_Y
    );


  if(
    p.y >
    canvas.clientHeight+100 ||
    p.y < -100
  ){
    return;
  }


  ctx.fillStyle =
    "#b88a52";

  ctx.fillRect(
    0,
    p.y,
    canvas.clientWidth,
    canvas.clientHeight-p.y
  );


  ctx.strokeStyle =
    "#704821";

  ctx.lineWidth =
    4;


  ctx.beginPath();

  ctx.moveTo(
    0,
    p.y
  );

  ctx.lineTo(
    canvas.clientWidth,
    p.y
  );

  ctx.stroke();


  /*
    床の模様
  */

  ctx.strokeStyle =
    "rgba(80,45,20,.2)";

  ctx.lineWidth =
    2;


  const pattern =
    40 *
    camera.zoom;


  for(
    let x=0;
    x<canvas.clientWidth;
    x+=pattern
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      p.y+8
    );

    ctx.lineTo(
      x+20,
      p.y+25
    );

    ctx.stroke();

  }

}


/* ============================================================
   Body描画
============================================================ */

function drawBodies(
  ctx,
  canvas,
  engine,
  camera
){

  const bodies =
    Composite.allBodies(
      engine.world
    );


  bodies.forEach(
    body => {

      if(
        !body.plugin
      ){
        return;
      }


      const type =
        body.plugin.gameType;


      if(
        type === "floor"
      ){
        return;
      }


      const p =
        worldToScreen(
          canvas,
          camera,
          body.position.x,
          body.position.y
        );


      ctx.save();

      ctx.translate(
        p.x,
        p.y
      );

      ctx.rotate(
        body.angle || 0
      );


      if(
        type === "block"
      ){

        drawBlock(
          ctx,
          body,
          camera.zoom
        );

      }


      if(
        type === "enemy"
      ){

        drawEnemy(
          ctx,
          body,
          camera.zoom
        );

      }


      if(
        type === "bomb"
      ){

        drawBomb(
          ctx,
          body,
          camera.zoom
        );

      }


      if(
        type === "multiply"
      ){

        drawMultiply(
          ctx,
          body,
          camera.zoom
        );

      }


      ctx.restore();

    }
  );

}


/* ============================================================
   ブロック
============================================================ */

function drawBlock(
  ctx,
  body,
  zoom
){

  const p =
    body.plugin;

  const w =
    p.width;

  const h =
    p.height;


  if(
    p.material === "wood"
  ){

    ctx.fillStyle =
      "#a96332";

    ctx.strokeStyle =
      "#673719";

    ctx.lineWidth =
      3;

    ctx.fillRect(
      -w/2,
      -h/2,
      w,
      h
    );

    ctx.strokeRect(
      -w/2,
      -h/2,
      w,
      h
    );


    ctx.strokeStyle =
      "rgba(70,30,10,.35)";

    ctx.lineWidth =
      2;


    for(
      let y=-h/2+8;
      y<h/2;
      y+=10
    ){

      ctx.beginPath();

      ctx.moveTo(
        -w/2+4,
        y
      );

      ctx.lineTo(
        w/2-4,
        y
      );

      ctx.stroke();

    }

  }


  if(
    p.material === "glass"
  ){

    ctx.fillStyle =
      "rgba(190,235,245,.62)";

    ctx.strokeStyle =
      "#4e9aaa";

    ctx.lineWidth =
      3;

    ctx.fillRect(
      -w/2,
      -h/2,
      w,
      h
    );

    ctx.strokeRect(
      -w/2,
      -h/2,
      w,
      h
    );


    ctx.strokeStyle =
      "rgba(255,255,255,.8)";

    ctx.lineWidth =
      2;

    ctx.beginPath();

    ctx.moveTo(
      -w/2+5,
      h/2-5
    );

    ctx.lineTo(
      w/2-5,
      -h/2+5
    );

    ctx.stroke();

  }


  if(
    p.material === "stone"
  ){

    ctx.fillStyle =
      "#77746e";

    ctx.strokeStyle =
      "#484640";

    ctx.lineWidth =
      3;

    ctx.fillRect(
      -w/2,
      -h/2,
      w,
      h
    );

    ctx.strokeRect(
      -w/2,
      -h/2,
      w,
      h
    );

  }


  if(
    p.hp < p.maxHp
  ){

    const ratio =
      Math.max(
        0,
        Math.min(
          1,
          p.hp/p.maxHp
        )
      );


    ctx.fillStyle =
      "rgba(0,0,0,.45)";

    ctx.fillRect(
      -w/2,
      -h/2-9,
      w,
      5
    );


    ctx.fillStyle =
      "#5ca347";

    ctx.fillRect(
      -w/2,
      -h/2-9,
      w*ratio,
      5
    );

  }

}


/* ============================================================
   敵
============================================================ */

function drawEnemy(
  ctx,
  body,
  zoom
){

  const p =
    body.plugin;

  const r =
    p.radius;


  if(
    !p.alive
  ){

    ctx.globalAlpha =
      Math.max(
        0,
        1 -
        (
          performance.now() -
          p.deathTime
        ) /
        500
      );

  }


  ctx.fillStyle =
    "#78a63c";

  ctx.strokeStyle =
    "#476426";

  ctx.lineWidth =
    3;


  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.stroke();


  ctx.fillStyle =
    "#fff";

  ctx.beginPath();

  ctx.arc(
    -r*.34,
    -r*.2,
    r*.23,
    0,
    Math.PI*2
  );

  ctx.arc(
    r*.34,
    -r*.2,
    r*.23,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle =
    "#222";

  ctx.beginPath();

  ctx.arc(
    -r*.30,
    -r*.17,
    r*.10,
    0,
    Math.PI*2
  );

  ctx.arc(
    r*.30,
    -r*.17,
    r*.10,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.strokeStyle =
    "#36501d";

  ctx.lineWidth =
    2;

  ctx.beginPath();

  ctx.arc(
    0,
    r*.05,
    r*.35,
    0,
    Math.PI
  );

  ctx.stroke();

}


/* ============================================================
   爆弾
============================================================ */

function drawBomb(
  ctx,
  body,
  zoom
){

  ctx.fillStyle =
    "#222";

  ctx.strokeStyle =
    "#111";

  ctx.lineWidth =
    2;


  ctx.beginPath();

  ctx.arc(
    0,
    2,
    13,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.stroke();


  ctx.fillStyle =
    "#333";

  ctx.fillRect(
    -3,
    -15,
    6,
    6
  );


  ctx.strokeStyle =
    "#f0a400";

  ctx.lineWidth =
    2;

  ctx.beginPath();

  ctx.moveTo(
    0,
    -15
  );

  ctx.quadraticCurveTo(
    5,
    -22,
    9,
    -18
  );

  ctx.stroke();

}


/* ============================================================
   増殖描画
============================================================ */

function drawMultiply(
  ctx,
  body,
  zoom
){

  const w =
    body.plugin.width;

  const h =
    body.plugin.height;


  /*
    増殖は紫色の装置。
    「×2」を大きく表示。
  */

  ctx.fillStyle =
    "#9b55c8";

  ctx.strokeStyle =
    "#54286e";

  ctx.lineWidth =
    4;


  ctx.fillRect(
    -w/2,
    -h/2,
    w,
    h
  );


  ctx.strokeRect(
    -w/2,
    -h/2,
    w,
    h
  );


  ctx.fillStyle =
    "#fff";

  ctx.font =
    "bold 25px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    "×2",
    0,
    1
  );


  /*
    外側に光る輪郭
  */

  ctx.strokeStyle =
    "rgba(210,150,255,.7)";

  ctx.lineWidth =
    2;

  ctx.strokeRect(
    -w/2-4,
    -h/2-4,
    w+8,
    h+8
  );

}


/* ============================================================
   爆発エフェクト
============================================================ */

function drawExplosions(
  ctx,
  canvas,
  camera
){

  const now =
    performance.now();


  for(
    let i=explosionEffects.length-1;
    i>=0;
    i--
  ){

    const e =
      explosionEffects[i];


    const elapsed =
      now -
      e.start;


    if(
      elapsed >
      e.duration
    ){

      explosionEffects.splice(
        i,
        1
      );

      continue;

    }


    const t =
      elapsed/e.duration;


    const radius =
      EXPLOSION_RADIUS *
      (
        .3 +
        .7*t
      );


    const p =
      worldToScreen(
        canvas,
        camera,
        e.x,
        e.y
      );


    ctx.save();

    ctx.globalAlpha =
      1-t;


    const gradient =
      ctx.createRadialGradient(
        p.x,
        p.y,
        0,
        p.x,
        p.y,
        radius*camera.zoom
      );


    gradient.addColorStop(
      0,
      "rgba(255,250,170,.95)"
    );

    gradient.addColorStop(
      .4,
      "rgba(255,150,20,.7)"
    );

    gradient.addColorStop(
      1,
      "rgba(230,50,10,0)"
    );


    ctx.fillStyle =
      gradient;


    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      radius*camera.zoom,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();

  }

}

){

        obj.type === "glass" ||
        obj.type === "stone"

          obj.x,
          obj.y

/* ============================================================
   ステージデータ化
============================================================ */

function engineToObjects(
  engine
){

  return Composite.allBodies(
    engine.world
  )
  .filter(
    body =>
      body.plugin &&
      body.plugin.gameType !==
      "floor"
  )
  .map(
    body => {

      const type =
        body.plugin.gameType;


      if(
        type === "block"
      ){

        return {

          type:
            body.plugin.material,

          x:
            body.position.x,

          y:
            body.position.y,

          w:
            body.plugin.width,

          h:
            body.plugin.height,

          angle:
            body.angle

        };

      }


      if(
        type === "enemy"
      ){

        return {

          type:"enemy",

          x:
            body.position.x,

          y:
            body.position.y,

          r:
            body.plugin.radius

        };

      }


      if(
        type === "multiply"
      ){

        return {

          type:"multiply",

          x:
            body.position.x,

          y:
            body.position.y

        };

      }


      return null;

    }
  )
  .filter(Boolean);

}

    return;

  const stages =
    loadStages();


  let stage =
    stages.find(
      s => s.id === currentStageId
    );


  if(!stage){

    stage = {

      id:
        currentStageId ||
        makeId(),

      name:"",

      objects:[],

      createdAt:
        Date.now()

    };


    currentStageId =
      stage.id;


    stages.push(
      stage
    );

  }


  stage.name =
    stageNameInput.value.trim() ||
    "無題のステージ";


  stage.objects =
    engineToObjects(
      editorEngine
    );


  stage.updatedAt =
    Date.now();


  saveStages(
    stages
  );


  alert(
    "ステージを保存しました。"
  );

}

  if(

/* ============================================================
   消去
============================================================ */

function eraseAt(
  engine,
  x,
  y
){

  const bodies =
    Composite.allBodies(
      engine.world
    );


  for(
    let i=bodies.length-1;
    i>=0;
    i--
  ){

    const body =
      bodies[i];


    if(
      !body.plugin ||
      body.plugin.gameType ===
      "floor"
    ){
      continue;
    }


    let radius =
      40;


    if(
      body.plugin.gameType ===
      "enemy"
    ){

      radius =
        body.plugin.radius;

    }


    if(
      body.plugin.gameType ===
      "multiply"
    ){

      radius =
        45;

    }


    if(
      body.plugin.gameType ===
      "block"
    ){

      radius =
        Math.max(
          body.plugin.width,
          body.plugin.height
        )/2;

    }


    const dx =
      body.position.x-x;

    const dy =
      body.position.y-y;


    if(
      Math.sqrt(
        dx*dx+
        dy*dy
      ) < radius
    ){

      World.remove(
        engine.world,
        body
      );

      return;

    }

  }

}


/* ============================================================
   エディタ操作
============================================================ */

let editorDown =
  false;

let lastPointerX =
  0;

let lastPointerY =
  0;


editorCanvas.addEventListener(
  "pointerdown",
  e => {

    editorCanvas.setPointerCapture(
      e.pointerId
    );


    editorDown =
      true;


    const rect =
      editorCanvas.getBoundingClientRect();


    const sx =
      e.clientX -
      rect.left;

    const sy =
      e.clientY -
      rect.top;


    lastPointerX =
      sx;

    lastPointerY =
      sy;


    if(
      currentTool !== "pan"
    ){

      const world =
        screenToWorld(
          editorCanvas,
          editorCamera,
          sx,
          sy
        );


      addEditorObject(
        world.x,
        world.y
      );

    }

  }
);


editorCanvas.addEventListener(
  "pointermove",
  e => {

    if(
      !editorDown ||
      currentTool !== "pan"
    ){
      return;
    }


    const rect =
      editorCanvas.getBoundingClientRect();


    const sx =
      e.clientX -
      rect.left;

    const sy =
      e.clientY -
      rect.top;


    const dx =
      sx -
      lastPointerX;

    const dy =
      sy -
      lastPointerY;


    editorCamera.x -=
      dx /
      editorCamera.zoom;

    editorCamera.y -=
      dy /
      editorCamera.zoom;


    lastPointerX =
      sx;

    lastPointerY =
      sy;

  }
);


editorCanvas.addEventListener(
  "pointerup",
  () => {

    editorDown =
      false;

  }
);


editorCanvas.addEventListener(
  "pointercancel",
  () => {

    editorDown =
      false;

  }
);


/* ============================================================
   ズーム
============================================================ */

editorCanvas.addEventListener(
  "wheel",
  e => {

    e.preventDefault();


    const rect =
      editorCanvas.getBoundingClientRect();


    const sx =
      e.clientX -
      rect.left;

    const sy =
      e.clientY -
      rect.top;


    const before =
      screenToWorld(
        editorCanvas,
        editorCamera,
        sx,
        sy
      );


    const factor =
      e.deltaY < 0
        ? 1.12
        : 0.89;


    editorCamera.zoom =
      Math.max(
        .12,
        Math.min(
          4,
          editorCamera.zoom *
          factor
        )
      );


    const after =
      screenToWorld(
        editorCanvas,
        editorCamera,
        sx,
        sy
      );


    editorCamera.x +=
      before.x -
      after.x;

    editorCamera.y +=
      before.y -
      after.y;

  },
  {passive:false}
);

/* ============================================================
   ステージ一覧
============================================================ */

function renderStageList(){

  const stages =
    loadStages();


  stageList.innerHTML =
    "";


  if(
    stages.length === 0
  ){

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "noStages";


    div.innerHTML =
      "保存されたステージはありません。";


    stageList.appendChild(
      div
    );


    return;

  }


  stages.forEach(
    stage => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "stageCard";


      const objects =
        stage.objects || [];


      const enemies =
        objects.filter(
          o => o.type === "enemy"
        ).length;


      const blocks =
        objects.filter(
          o =>
            o.type === "wood" ||
            o.type === "glass" ||
            o.type === "stone"
        ).length;


      const multiply =
        objects.filter(
          o => o.type === "multiply"
        ).length;


      card.innerHTML = `

        <h2>
          ${escapeHtml(
            stage.name ||
            "無題のステージ"
          )}
        </h2>

        <div class="stageMeta">

          物体：${objects.length}<br>
          敵：${enemies}<br>
          建築物：${blocks}<br>
          増殖：${multiply}

        </div>

        <div class="stageActions">

          <button class="play">
            遊ぶ
          </button>

          <button class="edit">
            編集
          </button>

          <button class="delete">
            削除
          </button>

        </div>

      `;


      card
        .querySelector(".play")
        .addEventListener(
          "click",
          () =>
            openPlayStage(
              stage.id
            )
        );


      card
        .querySelector(".edit")
        .addEventListener(
          "click",
          () =>
            openEditor(
              stage.id
            )
        );


      card
        .querySelector(".delete")
        .addEventListener(
          "click",
          () => {

            if(
              !confirm(
                "このステージを削除しますか？"
              )
            ){
              return;
            }


            saveStages(
              loadStages().filter(
                s =>
                  s.id !== stage.id
              )
            );


            renderStageList();

          }
        );


      stageList.appendChild(
        card
      );

    }
  );

}


function escapeHtml(
  text
){

  return String(text)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* ============================================================
   サンプルステージ
============================================================ */

function createSampleStage(){

  const stages =
    loadStages();


  if(
    stages.length > 0
  ){
    return;
  }


  const objects = [];


  /*
    床の高さは1000。
    城をその上に作る。
  */

  const base =
    900;


  /*
    左塔
  */

  for(
    let i=0;
    i<6;
    i++
  ){

    objects.push({

      type:
        i%2 === 0
          ? "stone"
          : "wood",

      x:-230,

      y:
        base -
        i*45,

      w:90,

      h:35,

      angle:0

    });

  }


  /*
    右塔
  */

  for(
    let i=0;
    i<6;
    i++
  ){

    objects.push({

      type:
        i%2 === 0
          ? "stone"
          : "wood",

      x:230,

      y:
        base -
        i*45,

      w:90,

      h:35,

      angle:0

    });

  }


  /*
    中央
  */

  for(
    let row=0;
    row<6;
    row++
  ){

    for(
      let col=0;
      col<3;
      col++
    ){

      objects.push({

        type:
          row%2 === 0
            ? "wood"
            : "glass",

        x:
          -90 +
          col*90,

        y:
          base -
          row*45,

        w:80,

        h:30,

        angle:0

      });

    }

  }


  /*
    敵
  */

  objects.push({

    type:"enemy",

    x:-230,

    y:630,

    r:23

  });


  objects.push({

    type:"enemy",

    x:0,

    y:630,

    r:23

  });


  objects.push({

    type:"enemy",

    x:230,

    y:630,

    r:23

  });


  objects.push({

    type:"enemy",

    x:0,

    y:450,

    r:23

  });


  /*
    増殖
  */

  objects.push({

    type:"multiply",

    x:0,

    y:780

  });


  stages.push({

    id:"sample",

    name:"サンプル城",

    objects:objects,

    createdAt:
      Date.now()

  });


  saveStages(
    stages
  );

}
