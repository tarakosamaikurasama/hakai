<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>スライム城くずし ステージメーカー</title>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
background:#eef1f5;
color:#222;
}

button{
border:0;
border-radius:10px;
padding:10px 14px;
font-size:15px;
font-weight:700;
background:#fff;
color:#222;
box-shadow:0 2px 7px rgba(0,0,0,.15);
cursor:pointer;
touch-action:manipulation;
}

button:active{
transform:scale(.97);
}

.screen{
position:absolute;
inset:0;
display:none;
}

.screen.active{
display:block;
}

#startScreen{
background:linear-gradient(#f7f9fc,#e5eaf1);
align-items:center;
justify-content:center;
}

#startScreen.active{
display:flex;
}

.startBox{
width:min(92%,500px);
text-align:center;
background:white;
padding:35px 25px;
border-radius:22px;
box-shadow:0 8px 30px rgba(0,0,0,.15);
}

.startBox h1{
margin:0 0 28px;
font-size:28px;
}

.startButtons{
display:flex;
flex-direction:column;
gap:14px;
}

.startButtons button{
padding:17px;
font-size:18px;
}

#stageScreen{
background:#eef1f5;
padding:20px;
overflow:auto;
}

.stageHeader{
max-width:900px;
margin:auto;
display:flex;
align-items:center;
gap:10px;
margin-bottom:20px;
}

.stageHeader h2{
flex:1;
margin:0;
}

#stageList{
max-width:900px;
margin:auto;
display:flex;
flex-direction:column;
gap:12px;
}

.stageCard{
background:white;
border-radius:14px;
padding:16px;
box-shadow:0 3px 12px rgba(0,0,0,.1);
display:flex;
align-items:center;
gap:10px;
}

.stageName{
flex:1;
font-weight:700;
font-size:17px;
}

.stageCard button{
padding:8px 11px;
font-size:13px;
}

#gameScreen{
background:#dce3e9;
overflow:hidden;
}

#gameCanvas{
position:absolute;
z-index:1;
left:0;
top:0;
width:100%;
height:100%;
display:block;
touch-action:none;
}

.topbar{
position:absolute;
z-index:100;
left:10px;
right:10px;
top:10px;
min-height:50px;
background:rgba(255,255,255,.95);
border-radius:14px;
box-shadow:0 3px 15px rgba(0,0,0,.16);
display:flex;
align-items:center;
gap:8px;
padding:7px;
pointer-events:auto;
}

.topbar .title{
flex:1;
min-width:0;
text-align:center;
font-weight:800;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}

.topbar button{
padding:8px 11px;
font-size:13px;
}

#editorTools{
position:absolute;
z-index:100;
left:10px;
right:10px;
bottom:10px;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:7px;
pointer-events:auto;
}

.tool{
padding:9px 11px;
font-size:13px;
}

.tool.selected{
background:#222;
color:#fff;
}

#playTools{
position:absolute;
z-index:100;
left:10px;
right:10px;
bottom:10px;
display:flex;
justify-content:center;
gap:10px;
pointer-events:auto;
}

#playTools button{
padding:13px 18px;
}

#message{
position:absolute;
z-index:200;
top:72px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,.75);
color:#fff;
border-radius:20px;
padding:8px 15px;
font-size:13px;
pointer-events:none;
opacity:0;
transition:opacity .2s;
}

#message.show{
opacity:1;
}

.dialogBg{
position:absolute;
z-index:300;
inset:0;
background:rgba(0,0,0,.45);
display:none;
align-items:center;
justify-content:center;
}

.dialogBg.active{
display:flex;
}

.dialog{
width:min(90%,430px);
background:#fff;
border-radius:18px;
padding:22px;
box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.dialog h3{
margin-top:0;
}

#stageNameInput{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
margin-bottom:14px;
}

.dialogButtons{
display:flex;
justify-content:flex-end;
gap:10px;
}

@media(max-width:600px){
.tool{
font-size:12px;
padding:8px 9px;
}

.topbar button{
font-size:12px;
}
}
</style>
</head>

<body>

<div id="app">

<div id="startScreen" class="screen active">
<div class="startBox">
<h1>スライム城くずし</h1>
<div class="startButtons">
<button id="makeStageButton">ステージを作る</button>
<button id="playStageButton">ステージで遊ぶ</button>
</div>
</div>
</div>

<div id="stageScreen" class="screen">
<div class="stageHeader">
<button id="stageBackButton">← 戻る</button>
<h2>ステージを選ぶ</h2>
</div>
<div id="stageList"></div>
</div>

<div id="gameScreen" class="screen">

<canvas id="gameCanvas"></canvas>

<div id="editorTop" class="topbar" style="display:none">
<button id="editorBack">←</button>
<div class="title" id="editorTitle">新しいステージ</div>
<button id="saveButton">保存</button>
<button id="testButton">テスト</button>
<button id="clearButton">全消去</button>
</div>

<div id="playTop" class="topbar" style="display:none">
<button id="playBack">←</button>
<div class="title" id="playTitle">ステージ</div>
<button id="restartButton">やり直す</button>
</div>

<div id="editorTools" style="display:none">
<button class="tool selected" data-tool="move">移動</button>
<button class="tool" data-tool="wood">木</button>
<button class="tool" data-tool="glass">ガラス</button>
<button class="tool" data-tool="stone">石</button>
<button class="tool" data-tool="enemy">スライム</button>
<button class="tool" data-tool="bomb">爆弾</button>
<button class="tool" data-tool="multiply">増殖</button>
<button class="tool" data-tool="bedrock">岩盤</button>
<button class="tool" data-tool="delete">消去</button>
<button class="tool" data-tool="rotate">回転</button>
<button class="tool" data-tool="shape">形変更</button>
</div>

<div id="playTools" style="display:none">
<button id="bombModeButton">💣 爆弾を置く</button>
<button id="explodeButton">💥 全爆破</button>
</div>

<div id="message"></div>

</div>

<div id="nameDialog" class="dialogBg">
<div class="dialog">
<h3>ステージ名</h3>
<input id="stageNameInput" maxlength="40" placeholder="ステージ名">
<div class="dialogButtons">
<button id="nameCancel">キャンセル</button>
<button id="nameOK">決定</button>
</div>
</div>
</div>

</div>

<script>
"use strict";

const MatterLib=Matter;
const Engine=MatterLib.Engine;
const World=MatterLib.World;
const Bodies=MatterLib.Bodies;
const Body=MatterLib.Body;
const Events=MatterLib.Events;
const Composite=MatterLib.Composite;

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

const FLOOR_Y=850;
const SAVE_KEY="slimeCastleMaker_v8";

let engine=null;
let currentMode="none";
let currentTool="move";

let selectedBody=null;
let movingBody=null;
let rotatingBody=null;
let resizing=null;

let moveOffset={x:0,y:0};

let stageId=null;
let stageName="新しいステージ";
let currentStageObjects=[];

let bombMode=false;
let nextId=1;

let canvasWidth=0;
let canvasHeight=0;
let dpr=1;

const camera={
x:0,
y:540,
zoom:.72
};

function resizeCanvas(){

const rect=canvas.getBoundingClientRect();

canvasWidth=rect.width;
canvasHeight=rect.height;

dpr=Math.min(window.devicePixelRatio||1,2);

canvas.width=Math.max(1,Math.floor(canvasWidth*dpr));
canvas.height=Math.max(1,Math.floor(canvasHeight*dpr));

ctx.setTransform(dpr,0,0,dpr,0,0);
}

function refreshCanvasSize(){
resizeCanvas();

requestAnimationFrame(()=>{
resizeCanvas();
});
}

window.addEventListener("resize",resizeCanvas);

function showScreen(id){

document.querySelectorAll(".screen").forEach(el=>{
el.classList.remove("active");
});

document.getElementById(id).classList.add("active");

if(id==="gameScreen"){
refreshCanvasSize();
}
}

function showMessage(text){

const el=document.getElementById("message");

el.textContent=text;
el.classList.add("show");

clearTimeout(showMessage.timer);

showMessage.timer=setTimeout(()=>{
el.classList.remove("show");
},1300);
}

function screenToWorld(x,y){

return{
x:(x-canvasWidth/2)/camera.zoom+camera.x,
y:(y-canvasHeight/2)/camera.zoom+camera.y
};
}

function worldToScreen(x,y){

return{
x:(x-camera.x)*camera.zoom+canvasWidth/2,
y:(y-camera.y)*camera.zoom+canvasHeight/2
};
}

function createEngine(){

const e=Engine.create({
enableSleeping:true
});

e.gravity.y=1;

const floor=Bodies.rectangle(
0,
FLOOR_Y+40,
100000,
80,
{
isStatic:true,
label:"floor",
plugin:{
gameType:"floor"
}
}
);

World.add(e.world,floor);

Events.on(e,"collisionStart",collisionStart);
Events.on(e,"collisionEnd",collisionEnd);

return e;
}

function stopEngine(){

if(engine){
Events.off(engine,"beforeUpdate",editorBeforeUpdate);
Events.off(engine,"collisionStart",collisionStart);
Events.off(engine,"collisionEnd",collisionEnd);
}

engine=null;

selectedBody=null;
movingBody=null;
rotatingBody=null;
resizing=null;
}

function startEditor(objects){

stopEngine();

currentMode="editor";
currentTool="move";

engine=createEngine();

loadObjects(objects||[]);

document.getElementById("editorTop").style.display="flex";
document.getElementById("playTop").style.display="none";
document.getElementById("editorTools").style.display="flex";
document.getElementById("playTools").style.display="none";

document.getElementById("editorTitle").textContent=stageName;

camera.x=0;
camera.y=540;
camera.zoom=.72;

showScreen("gameScreen");

setTool("move");

refreshCanvasSize();
}

function startPlay(objects){

stopEngine();

currentMode="play";

engine=createEngine();

loadObjects(objects||[]);

document.getElementById("editorTop").style.display="none";
document.getElementById("playTop").style.display="flex";
document.getElementById("editorTools").style.display="none";
document.getElementById("playTools").style.display="flex";

document.getElementById("playTitle").textContent=stageName;

camera.x=0;
camera.y=540;
camera.zoom=.72;

showScreen("gameScreen");

refreshCanvasSize();
}

function loadObjects(objects){

objects.forEach(obj=>{

if(obj.type==="block"){
addBlock(
obj.material,
obj.x,
obj.y,
obj.w,
obj.h,
obj.angle||0,
false
);
}

if(obj.type==="enemy"){
addEnemy(obj.x,obj.y,false);
}

if(obj.type==="bomb"){
addBomb(obj.x,obj.y,false);
}

if(obj.type==="multiply"){
addMultiplier(
obj.x,
obj.y,
obj.w||70,
obj.h||50,
false
);
}

if(obj.type==="bedrock"){
addBedrock(
obj.x,
obj.y,
obj.w||120,
obj.h||35,
false
);
}

});
}

function addBlock(material,x,y,w,h,angle,placed){

let density=.0035;
let friction=.4;
let restitution=.08;
let hp=2;

if(material==="glass"){
density=.0028;
friction=.15;
restitution=.25;
hp=1;
}

if(material==="stone"){
density=.008;
friction=.6;
restitution=.02;
hp=3;
}

const body=Bodies.rectangle(
x,y,w||100,h||45,
{
angle:angle||0,
density:density,
friction:friction,
restitution:restitution,
label:"block",
plugin:{
gameType:"block",
material:material,
width:w||100,
height:h||45,
hp:hp,
maxHp:hp,
id:nextId++
}
}
);

World.add(engine.world,body);

return body;
}

function addEnemy(x,y){

const body=Bodies.circle(
x,y,22,
{
density:.0018,
friction:.5,
restitution:.12,
label:"enemy",
plugin:{
gameType:"enemy",
radius:22,
alive:true,
id:nextId++
}
}
);

World.add(engine.world,body);

return body;
}

function addBomb(x,y){

const body=Bodies.circle(
x,y,13,
{
density:.001,
friction:.25,
restitution:.35,
label:"bomb",
plugin:{
gameType:"bomb",
radius:13,
id:nextId++
}
}
);

World.add(engine.world,body);

return body;
}

function addMultiplier(x,y,w,h){

const body=Bodies.rectangle(
x,y,w,h,
{
isStatic:true,
isSensor:true,
label:"multiply",
plugin:{
gameType:"multiply",
width:w,
height:h,
id:nextId++
}
}
);

World.add(engine.world,body);

return body;
}

function addBedrock(x,y,w,h){

const body=Bodies.rectangle(
x,y,w,h,
{
isStatic:true,
label:"bedrock",
plugin:{
gameType:"bedrock",
width:w,
height:h,
id:nextId++
}
}
);

World.add(engine.world,body);

return body;
}

function removeBody(body){

if(!body||!engine)return;

World.remove(engine.world,body);

if(selectedBody===body){
selectedBody=null;
}
}

function getBodies(){

if(!engine)return[];

return Composite.allBodies(engine.world).filter(body=>{
return body.label!=="floor";
});
}

function pointInBody(body,p){

if(!body)return false;

return Matter.Vertices.contains(
body.vertices,
p
);
}

function getBodyAt(p){

const bodies=getBodies();

for(let i=bodies.length-1;i>=0;i--){

if(pointInBody(bodies[i],p)){
return bodies[i];
}

}

return null;
}

function getRectSize(body){

return{
w:body.plugin.width||80,
h:body.plugin.height||40
};
}

function getShapeHandles(body){

const size=getRectSize(body);

const hw=size.w/2;
const hh=size.h/2;

const c=Math.cos(body.angle);
const s=Math.sin(body.angle);

const local=[
{x:-hw,y:-hh},
{x:hw,y:-hh},
{x:hw,y:hh},
{x:-hw,y:hh}
];

return local.map(v=>({
x:body.position.x+v.x*c-v.y*s,
y:body.position.y+v.x*s+v.y*c
}));
}

function getRotateHandle(body){

const size=getRectSize(body);
const d=Math.max(size.w,size.h)/2+42;

return{
x:body.position.x+Math.sin(body.angle)*d,
y:body.position.y-Math.cos(body.angle)*d
};
}

function dist(a,b){
return Math.hypot(a.x-b.x,a.y-b.y);
}

function resizeBodyFromCorner(body,index,pointer){

if(!body||body.label!=="block")return;

const old=getRectSize(body);

const oldW=old.w;
const oldH=old.h;

const angle=body.angle;

const c=Math.cos(angle);
const s=Math.sin(angle);

const hw=oldW/2;
const hh=oldH/2;

const corners=[
{x:-hw,y:-hh},
{x:hw,y:-hh},
{x:hw,y:hh},
{x:-hw,y:hh}
];

const opposite=(index+2)%4;

const fixedLocal=corners[opposite];

const fixedWorld={
x:body.position.x+
fixedLocal.x*c-
fixedLocal.y*s,

y:body.position.y+
fixedLocal.x*s+
fixedLocal.y*c
};

const dx=pointer.x-body.position.x;
const dy=pointer.y-body.position.y;

const localX=
dx*c+
dy*s;

const localY=
-dx*s+
dy*c;

const signX=
(index===0||index===3)?-1:1;

const signY=
(index===0||index===1)?-1:1;

let newW=
Math.abs(localX-fixedLocal.x)*2;

let newH=
Math.abs(localY-fixedLocal.y)*2;

newW=Math.max(30,Math.min(2000,newW));
newH=Math.max(20,Math.min(2000,newH));

const centerLocal={
x:fixedLocal.x+signX*newW/2,
y:fixedLocal.y+signY*newH/2
};

const newCenter={
x:fixedWorld.x+
centerLocal.x*c-
centerLocal.y*s,

y:fixedWorld.y+
centerLocal.x*s+
centerLocal.y*c
};

const newHW=newW/2;
const newHH=newH/2;

const newLocal=[
{x:-newHW,y:-newHH},
{x:newHW,y:-newHH},
{x:newHW,y:newHH},
{x:-newHW,y:newHH}
];

const vertices=newLocal.map(v=>({
x:newCenter.x+
v.x*c-
v.y*s,

y:newCenter.y+
v.x*s+
v.y*c
}));

Body.setVelocity(body,{x:0,y:0});
Body.setAngularVelocity(body,0);

Body.setVertices(body,vertices);

Body.setPosition(body,newCenter);
Body.setAngle(body,angle);

body.plugin.width=newW;
body.plugin.height=newH;

Body.setVelocity(body,{x:0,y:0});
Body.setAngularVelocity(body,0);
}

function rotateBody(body,pointer){

if(!body||body.label==="bedrock")return;

const dx=pointer.x-body.position.x;
const dy=pointer.y-body.position.y;

const angle=Math.atan2(dx,-dy);

Body.setVelocity(body,{x:0,y:0});
Body.setAngularVelocity(body,0);

Body.setAngle(body,angle);

Body.setVelocity(body,{x:0,y:0});
Body.setAngularVelocity(body,0);
}

function setTool(tool){

currentTool=tool;

document.querySelectorAll(".tool").forEach(btn=>{
btn.classList.toggle(
"selected",
btn.dataset.tool===tool
);
});
}

document.querySelectorAll(".tool").forEach(btn=>{
btn.addEventListener("click",()=>{
setTool(btn.dataset.tool);
});
});

function getPointer(e){

const rect=canvas.getBoundingClientRect();

return{
x:e.clientX-rect.left,
y:e.clientY-rect.top
};
}

canvas.addEventListener("pointerdown",function(e){

if(currentMode!=="editor"&&currentMode!=="play"){
return;
}

e.preventDefault();

const screen=getPointer(e);
const p=screenToWorld(screen.x,screen.y);

if(currentMode==="play"){

if(bombMode){
addBomb(p.x,p.y);
}

return;
}

if(currentTool==="shape"){

if(selectedBody&&selectedBody.label==="block"){

const handles=getShapeHandles(selectedBody);

for(let i=0;i<handles.length;i++){

if(dist(handles[i],p)<28/camera.zoom){

resizing={
body:selectedBody,
corner:i
};

Body.setVelocity(
selectedBody,
{x:0,y:0}
);

Body.setAngularVelocity(
selectedBody,
0
);

e.stopPropagation();

return;
}
}
}

const hit=getBodyAt(p);

if(hit&&hit.label==="block"){
selectedBody=hit;
}else{
selectedBody=null;
}

return;
}

if(currentTool==="rotate"){

if(selectedBody){

const handle=getRotateHandle(selectedBody);

if(dist(handle,p)<35/camera.zoom){

rotatingBody=selectedBody;

e.stopPropagation();

return;
}
}

const hit=getBodyAt(p);

if(hit){
selectedBody=hit;
}else{
selectedBody=null;
}

return;
}

if(currentTool==="move"){

const hit=getBodyAt(p);

if(hit){

selectedBody=hit;

if(
hit.label!=="bedrock"&&
hit.label!=="multiply"
){

movingBody=hit;

moveOffset={
x:p.x-hit.position.x,
y:p.y-hit.position.y
};

Body.setVelocity(hit,{x:0,y:0});
Body.setAngularVelocity(hit,0);
}
}else{
selectedBody=null;
}

return;
}

if(currentTool==="delete"){

const hit=getBodyAt(p);

if(hit){
removeBody(hit);
}

return;
}

if(
currentTool==="wood"||
currentTool==="glass"||
currentTool==="stone"
){

addBlock(
currentTool,
p.x,
p.y,
100,
45,
0,
true
);

return;
}

if(currentTool==="enemy"){

addEnemy(p.x,p.y);

return;
}

if(currentTool==="bomb"){

addBomb(p.x,p.y);

return;
}

if(currentTool==="multiply"){

addMultiplier(
p.x,
p.y,
70,
50
);

return;
}

if(currentTool==="bedrock"){

addBedrock(
p.x,
p.y,
120,
35
);

return;
}

});

canvas.addEventListener("pointermove",function(e){

if(currentMode!=="editor")return;

e.preventDefault();

const screen=getPointer(e);
const p=screenToWorld(screen.x,screen.y);

if(resizing){

resizeBodyFromCorner(
resizing.body,
resizing.corner,
p
);

return;
}

if(rotatingBody){

rotateBody(
rotatingBody,
p
);

return;
}

if(movingBody){

Body.setPosition(
movingBody,
{
x:p.x-moveOffset.x,
y:p.y-moveOffset.y
}
);

Body.setVelocity(
movingBody,
{x:0,y:0}
);

Body.setAngularVelocity(
movingBody,
0
);

return;
}

});

function endPointer(){

if(resizing){

Body.setVelocity(
resizing.body,
{x:0,y:0}
);

Body.setAngularVelocity(
resizing.body,
0
);

resizing=null;
}

if(rotatingBody){

Body.setVelocity(
rotatingBody,
{x:0,y:0}
);

Body.setAngularVelocity(
rotatingBody,
0
);

rotatingBody=null;
}

if(movingBody){

Body.setVelocity(
movingBody,
{x:0,y:0}
);

Body.setAngularVelocity(
movingBody,
0
);

movingBody=null;
}
}

canvas.addEventListener("pointerup",endPointer);
canvas.addEventListener("pointercancel",endPointer);

function editorBeforeUpdate(){

if(!engine)return;

getBodies().forEach(body=>{

if(
body.label==="block"&&
body.plugin
){

body.plugin.hp=
body.plugin.maxHp;
}

if(
body.label==="bedrock"
){

Body.setVelocity(
body,
{x:0,y:0}
);

Body.setAngularVelocity(
body,
0
);
}

});

}

const multiplierContacts=new Map();

function getMultiplierPair(a,b){

if(
a.label==="multiply"&&
b.label==="bomb"
){

return{
multi:a,
bomb:b
};
}

if(
b.label==="multiply"&&
a.label==="bomb"
){

return{
multi:b,
bomb:a
};
}

return null;
}

function collisionStart(event){

event.pairs.forEach(pair=>{

const a=pair.bodyA;
const b=pair.bodyB;

const pairData=
getMultiplierPair(a,b);

if(pairData){

const multi=pairData.multi;
const bomb=pairData.bomb;

if(!multiplierContacts.has(multi.id)){
multiplierContacts.set(
multi.id,
new Set()
);
}

const set=
multiplierContacts.get(multi.id);

if(!set.has(bomb.plugin.id)){

set.add(bomb.plugin.id);

spawnMultipliedBomb(
multi,
bomb
);
}
}

if(currentMode==="play"){

if(
(a.label==="bomb"&&b.label==="block")||
(b.label==="bomb"&&a.label==="block")
){

const block=
a.label==="block"?a:b;

damageBlock(block,1);
}

}

});
}

function collisionEnd(event){

event.pairs.forEach(pair=>{

const pairData=
getMultiplierPair(
pair.bodyA,
pair.bodyB
);

if(!pairData)return;

const multi=pairData.multi;
const bomb=pairData.bomb;

const set=
multiplierContacts.get(multi.id);

if(set){
set.delete(bomb.plugin.id);
}

});
}

function spawnMultipliedBomb(multi){

if(!engine)return;

const w=multi.plugin.width||70;
const h=multi.plugin.height||50;

const x=
multi.position.x+
(Math.random()-.5)*w*.6;

const y=
multi.position.y+
h/2+
35;

const bomb=addBomb(x,y);

Body.setVelocity(
bomb,
{
x:(Math.random()-.5)*1,
y:0
}
);
}

function damageBlock(block,amount){

if(currentMode!=="play")return;

if(!block||block.label!=="block")return;

block.plugin.hp-=amount;

if(block.plugin.hp<=0){

const p={
x:block.position.x,
y:block.position.y
};

World.remove(
engine.world,
block
);

createExplosion(
p.x,
p.y
);
}
}

function createExplosion(x,y){

const radius=155;
const force=.045;

getBodies().forEach(body=>{

if(body.isStatic)return;

const dx=body.position.x-x;
const dy=body.position.y-y;

const d=Math.hypot(dx,dy);

if(d>radius||d===0)return;

const power=1-d/radius;

Body.applyForce(
body,
body.position,
{
x:dx/d*force*power,
y:dy/d*force*power
}
);

if(currentMode==="play"){

if(body.label==="block"){
damageBlock(body,2);
}

if(body.label==="enemy"){
World.remove(
engine.world,
body
);
}

}

});
}

function explodeAll(){

if(!engine)return;

const bombs=getBodies().filter(
b=>b.label==="bomb"
);

bombs.forEach(bomb=>{

const p={
x:bomb.position.x,
y:bomb.position.y
};

World.remove(
engine.world,
bomb
);

createExplosion(
p.x,
p.y
);

});
}

function drawBackground(){

ctx.fillStyle="#dce3e9";

ctx.fillRect(
camera.x-canvasWidth/camera.zoom,
camera.y-canvasHeight/camera.zoom,
canvasWidth/camera.zoom*2,
canvasHeight/camera.zoom*2
);

ctx.strokeStyle="rgba(0,0,0,.045)";
ctx.lineWidth=1;

const left=
camera.x-canvasWidth/camera.zoom;

const right=
camera.x+canvasWidth/camera.zoom;

const top=
camera.y-canvasHeight/camera.zoom;

const bottom=
camera.y+canvasHeight/camera.zoom;

for(
let x=Math.floor(left/50)*50;
x<right;
x+=50
){

ctx.beginPath();
ctx.moveTo(x,top);
ctx.lineTo(x,bottom);
ctx.stroke();
}

for(
let y=Math.floor(top/50)*50;
y<bottom;
y+=50
){

ctx.beginPath();
ctx.moveTo(left,y);
ctx.lineTo(right,y);
ctx.stroke();
}
}

function drawFloor(){

ctx.fillStyle="#3b4148";

ctx.fillRect(
-50000,
FLOOR_Y,
100000,
80
);

ctx.fillStyle="#59616a";

ctx.fillRect(
-50000,
FLOOR_Y,
100000,
8
);
}

function drawPolygon(vertices,fill){

ctx.beginPath();

vertices.forEach((v,i)=>{

if(i===0){
ctx.moveTo(v.x,v.y);
}else{
ctx.lineTo(v.x,v.y);
}

});

ctx.closePath();

ctx.fillStyle=fill;
ctx.fill();

ctx.strokeStyle="#30343a";
ctx.lineWidth=2;
ctx.stroke();
}

function drawBlock(body){

let fill="#a86b32";

if(body.plugin.material==="glass"){
fill="rgba(114,201,232,.65)";
}

if(body.plugin.material==="stone"){
fill="#777";
}

drawPolygon(
body.vertices,
fill
);
}

function drawEnemy(body){

const p=body.position;

ctx.beginPath();
ctx.arc(
p.x,
p.y,
22,
0,
Math.PI*2
);

ctx.fillStyle="#56c94d";
ctx.fill();

ctx.strokeStyle="#236523";
ctx.lineWidth=2;
ctx.stroke();

ctx.fillStyle="#111";

ctx.beginPath();

ctx.arc(
p.x-7,
p.y-4,
3,
0,
Math.PI*2
);

ctx.arc(
p.x+7,
p.y-4,
3,
0,
Math.PI*2
);

ctx.fill();

ctx.strokeStyle="#111";
ctx.lineWidth=2;

ctx.beginPath();

ctx.arc(
p.x,
p.y+2,
8,
0,
Math.PI
);

ctx.stroke();
}

function drawBomb(body){

const p=body.position;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
13,
0,
Math.PI*2
);

ctx.fillStyle="#222";
ctx.fill();

ctx.strokeStyle="#111";
ctx.lineWidth=2;
ctx.stroke();

ctx.strokeStyle="#8b4a22";
ctx.lineWidth=4;

ctx.beginPath();

ctx.moveTo(
p.x+7,
p.y-9
);

ctx.quadraticCurveTo(
p.x+12,
p.y-17,
p.x+9,
p.y-22
);

ctx.stroke();

ctx.fillStyle="#ffca28";

ctx.beginPath();

ctx.arc(
p.x+9,
p.y-22,
4,
0,
Math.PI*2
);

ctx.fill();
}

function drawMultiplier(body){

const size=getRectSize(body);

ctx.save();

ctx.translate(
body.position.x,
body.position.y
);

ctx.rotate(body.angle);

ctx.fillStyle="#b17cff";

ctx.fillRect(
-size.w/2,
-size.h/2,
size.w,
size.h
);

ctx.strokeStyle="#5d3c9c";
ctx.lineWidth=3;

ctx.strokeRect(
-size.w/2,
-size.h/2,
size.w,
size.h
);

ctx.fillStyle="#fff";
ctx.font="bold 25px sans-serif";
ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillText("×2",0,0);

ctx.restore();
}

function drawBedrock(body){

const size=getRectSize(body);

ctx.save();

ctx.translate(
body.position.x,
body.position.y
);

ctx.rotate(body.angle);

ctx.fillStyle="#30343b";

ctx.fillRect(
-size.w/2,
-size.h/2,
size.w,
size.h
);

ctx.strokeStyle="#17191d";
ctx.lineWidth=3;

ctx.strokeRect(
-size.w/2,
-size.h/2,
size.w,
size.h
);

ctx.fillStyle="#aaa";
ctx.font="bold 15px sans-serif";
ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillText("岩盤",0,0);

ctx.restore();
}

function drawSelection(body){

if(body.label==="block"){

const handles=getShapeHandles(body);

const size=getRectSize(body);

ctx.save();

ctx.translate(
body.position.x,
body.position.y
);

ctx.rotate(body.angle);

ctx.strokeStyle="#1677ff";
ctx.lineWidth=3;
ctx.setLineDash([7,5]);

ctx.strokeRect(
-size.w/2,
-size.h/2,
size.w,
size.h
);

ctx.restore();

ctx.setLineDash([]);

handles.forEach((p,i)=>{

ctx.beginPath();

ctx.arc(
p.x,
p.y,
9,
0,
Math.PI*2
);

ctx.fillStyle="#fff";
ctx.fill();

ctx.strokeStyle="#1677ff";
ctx.lineWidth=3;
ctx.stroke();

});
}

if(currentTool==="rotate"){

const h=getRotateHandle(body);

ctx.strokeStyle="#f08000";
ctx.lineWidth=3;

ctx.beginPath();

ctx.moveTo(
body.position.x,
body.position.y
);

ctx.lineTo(h.x,h.y);

ctx.stroke();

ctx.beginPath();

ctx.arc(
h.x,
h.y,
10,
0,
Math.PI*2
);

ctx.fillStyle="#fff";
ctx.fill();

ctx.strokeStyle="#f08000";
ctx.stroke();
}
}

function draw(){

requestAnimationFrame(draw);

if(!engine)return;

ctx.clearRect(
0,
0,
canvasWidth,
canvasHeight
);

ctx.save();

ctx.translate(
canvasWidth/2,
canvasHeight/2
);

ctx.scale(
camera.zoom,
camera.zoom
);

ctx.translate(
-camera.x,
-camera.y
);

drawBackground();
drawFloor();

getBodies().forEach(body=>{

if(body.label==="block"){
drawBlock(body);
}

if(body.label==="enemy"){
drawEnemy(body);
}

if(body.label==="bomb"){
drawBomb(body);
}

if(body.label==="multiply"){
drawMultiplier(body);
}

if(body.label==="bedrock"){
drawBedrock(body);
}

});

if(currentMode==="editor"&&selectedBody){
drawSelection(selectedBody);
}

ctx.restore();
}

function serializeStage(){

const objects=[];

getBodies().forEach(body=>{

const type=
body.plugin&&
body.plugin.gameType;

if(type==="block"){

objects.push({
type:"block",
material:body.plugin.material,
x:body.position.x,
y:body.position.y,
w:body.plugin.width,
h:body.plugin.height,
angle:body.angle
});
}

if(type==="enemy"){

objects.push({
type:"enemy",
x:body.position.x,
y:body.position.y
});
}

if(type==="bomb"){

objects.push({
type:"bomb",
x:body.position.x,
y:body.position.y
});
}

if(type==="multiply"){

objects.push({
type:"multiply",
x:body.position.x,
y:body.position.y,
w:body.plugin.width,
h:body.plugin.height
});
}

if(type==="bedrock"){

objects.push({
type:"bedrock",
x:body.position.x,
y:body.position.y,
w:body.plugin.width,
h:body.plugin.height
});
}

});

return objects;
}

function getStages(){

try{

const data=
localStorage.getItem(SAVE_KEY);

if(!data)return[];

const result=JSON.parse(data);

return Array.isArray(result)?result:[];

}catch(e){

return[];
}
}

function saveStages(stages){

localStorage.setItem(
SAVE_KEY,
JSON.stringify(stages)
);
}

function saveCurrentStage(){

if(currentMode!=="editor")return;

const objects=serializeStage();

let stages=getStages();

if(!stageId){

stageId=
Date.now().toString(36)+
Math.random().toString(36).slice(2);
}

const stage={
id:stageId,
name:stageName,
objects:objects
};

const index=
stages.findIndex(
x=>x.id===stageId
);

if(index>=0){
stages[index]=stage;
}else{
stages.push(stage);
}

saveStages(stages);

currentStageObjects=objects;

showMessage("保存しました");
}

function renderStageList(){

const list=
document.getElementById("stageList");

list.innerHTML="";

const stages=getStages();

if(stages.length===0){

const empty=document.createElement("div");

empty.style.background="#fff";
empty.style.padding="25px";
empty.style.borderRadius="15px";
empty.style.textAlign="center";

empty.textContent=
"保存されたステージはありません。";

list.appendChild(empty);

return;
}

stages.forEach(stage=>{

const card=
document.createElement("div");

card.className="stageCard";

const name=
document.createElement("div");

name.className="stageName";
name.textContent=stage.name;

const play=
document.createElement("button");

play.textContent="遊ぶ";

play.onclick=()=>{

stageId=stage.id;
stageName=stage.name;

currentStageObjects=
JSON.parse(
JSON.stringify(stage.objects)
);

startPlay(currentStageObjects);
};

const edit=
document.createElement("button");

edit.textContent="編集";

edit.onclick=()=>{

stageId=stage.id;
stageName=stage.name;

currentStageObjects=
JSON.parse(
JSON.stringify(stage.objects)
);

startEditor(currentStageObjects);
};

const del=
document.createElement("button");

del.textContent="削除";

del.onclick=()=>{

const index=
stages.findIndex(
x=>x.id===stage.id
);

if(index>=0){
stages.splice(index,1);
}

saveStages(stages);

renderStageList();
};

card.appendChild(name);
card.appendChild(play);
card.appendChild(edit);
card.appendChild(del);

list.appendChild(card);

});
}

document.getElementById("makeStageButton")
.onclick=()=>{

stageId=null;
stageName="新しいステージ";
currentStageObjects=[];

document.getElementById(
"stageNameInput"
).value="新しいステージ";

document.getElementById(
"nameDialog"
).classList.add("active");
};

document.getElementById("playStageButton")
.onclick=()=>{

renderStageList();
showScreen("stageScreen");
};

document.getElementById("stageBackButton")
.onclick=()=>{

showScreen("startScreen");
};

document.getElementById("nameCancel")
.onclick=()=>{

document.getElementById(
"nameDialog"
).classList.remove("active");
};

document.getElementById("nameOK")
.onclick=()=>{

const input=
document.getElementById(
"stageNameInput"
);

stageName=
input.value.trim()||
"新しいステージ";

document.getElementById(
"nameDialog"
).classList.remove("active");

startEditor([]);
};

document.getElementById("editorBack")
.onclick=()=>{

saveCurrentStage();

stopEngine();

currentMode="none";

showScreen("startScreen");
};

document.getElementById("saveButton")
.onclick=()=>{

saveCurrentStage();
};

document.getElementById("testButton")
.onclick=()=>{

currentStageObjects=
serializeStage();

startPlay(
JSON.parse(
JSON.stringify(currentStageObjects)
)
);
};

document.getElementById("clearButton")
.onclick=()=>{

getBodies().forEach(body=>{
removeBody(body);
});

selectedBody=null;
};

document.getElementById("playBack")
.onclick=()=>{

stopEngine();

currentMode="none";

renderStageList();

showScreen("stageScreen");
};

document.getElementById("restartButton")
.onclick=()=>{

startPlay(
JSON.parse(
JSON.stringify(currentStageObjects)
)
);
};

document.getElementById("bombModeButton")
.onclick=()=>{

bombMode=!bombMode;

document.getElementById(
"bombModeButton"
).textContent=
bombMode
?"💣 爆弾配置中"
:"💣 爆弾を置く";
};

document.getElementById("explodeButton")
.onclick=()=>{

explodeAll();
};

document.getElementById("nameDialog")
.addEventListener("pointerdown",e=>{

if(e.target===e.currentTarget){

document.getElementById(
"nameDialog"
).classList.remove("active");
}

});

function physicsLoop(){

requestAnimationFrame(physicsLoop);

if(engine){

Engine.update(
engine,
1000/60
);
}
}

resizeCanvas();
draw();
physicsLoop();
</script>
