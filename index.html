<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>スライム城くずし メーカー</title>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,"Noto Sans JP",sans-serif;
 background:#eaf5ff;
}
button,input{
 font:inherit;
}
button{
 border:0;
 cursor:pointer;
}
.screen{
 position:fixed;
 inset:0;
 display:none;
}
.screen.active{
 display:block;
}

/* START */
#startScreen{
 background:linear-gradient(#fff,#e8f5ff);
 display:none;
 align-items:center;
 justify-content:center;
 flex-direction:column;
}
#startScreen.active{
 display:flex;
}
.logo{
 font-size:clamp(30px,7vw,52px);
 font-weight:900;
 text-align:center;
 color:#222;
 margin-bottom:40px;
}
.startButtons{
 width:min(430px,88vw);
 display:flex;
 flex-direction:column;
 gap:18px;
}
.startButtons button{
 height:72px;
 border-radius:18px;
 color:#fff;
 font-size:24px;
 font-weight:900;
 box-shadow:0 6px 0 rgba(0,0,0,.2);
}
.startButtons button:active{
 transform:translateY(4px);
 box-shadow:0 2px 0 rgba(0,0,0,.2);
}
.make{
 background:#f80;
}
.play{
 background:#168cff;
}

/* SELECT */
#selectScreen{
 background:#edf3f8;
 flex-direction:column;
}
#selectScreen.active{
 display:flex;
}
.header{
 height:60px;
 min-height:60px;
 background:#222;
 color:#fff;
 display:flex;
 align-items:center;
 gap:10px;
 padding:7px;
}
.header h1{
 margin:0;
 flex:1;
 font-size:21px;
}
.header button{
 background:#fff;
 border-radius:9px;
 padding:9px 14px;
 font-weight:bold;
}
.stageList{
 flex:1;
 overflow:auto;
 padding:16px;
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
 gap:14px;
}
.stageCard{
 background:#fff;
 border-radius:15px;
 padding:14px;
 box-shadow:0 3px 12px rgba(0,0,0,.13);
 min-height:145px;
 display:flex;
 flex-direction:column;
 gap:7px;
}
.stageCard strong{
 font-size:20px;
 flex:1;
}
.stageCard button{
 border-radius:8px;
 padding:9px;
 background:#168cff;
 color:#fff;
 font-weight:bold;
}
.stageCard .del{
 background:#e33;
}
.empty{
 grid-column:1/-1;
 text-align:center;
 padding:50px;
 color:#777;
}

/* GAME */
.gameCanvas{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 display:block;
 touch-action:none;
 z-index:1;
}
.gameUI{
 position:absolute;
 inset:0;
 z-index:100;
 pointer-events:none;
}
.gameUI button,
.gameUI input,
.gameUI .toolbar,
.gameUI .property{
 pointer-events:auto;
}
.topbar{
 position:absolute;
 left:0;
 right:0;
 top:0;
 min-height:57px;
 display:flex;
 align-items:center;
 gap:6px;
 padding:6px;
 background:rgba(25,25,25,.96);
 overflow-x:auto;
 z-index:150;
}
.topbar button{
 flex-shrink:0;
 background:#fff;
 color:#222;
 border-radius:9px;
 padding:9px 12px;
 font-weight:900;
}
.topbar .orange{
 background:#f80;
 color:#fff;
}
.topbar .red{
 background:#e33;
 color:#fff;
}
.topbar input{
 width:180px;
 flex-shrink:0;
 border:0;
 border-radius:8px;
 padding:9px;
}

.toolbar{
 position:absolute;
 top:57px;
 left:0;
 right:0;
 display:flex;
 gap:6px;
 padding:6px;
 background:rgba(35,35,35,.96);
 overflow-x:auto;
 z-index:150;
}
.tool{
 width:66px;
 min-width:66px;
 height:52px;
 border-radius:10px;
 background:#fff;
 color:#222;
 font-size:11px;
 font-weight:900;
}
.tool.selected{
 outline:4px solid #f80;
}
.toolIcon{
 display:block;
 font-size:21px;
 height:27px;
 line-height:27px;
}

.help{
 position:absolute;
 bottom:10px;
 left:10px;
 z-index:120;
 color:#fff;
 background:rgba(0,0,0,.7);
 border-radius:8px;
 padding:7px 10px;
 font-size:12px;
 pointer-events:none;
}

.message{
 position:absolute;
 left:50%;
 bottom:16px;
 transform:translateX(-50%);
 background:rgba(0,0,0,.84);
 color:#fff;
 border-radius:12px;
 padding:9px 16px;
 z-index:500;
 opacity:0;
 transition:.15s;
 pointer-events:none;
 white-space:nowrap;
}
.message.show{
 opacity:1;
}

/* PROPERTY */
.property{
 position:absolute;
 right:10px;
 top:125px;
 width:245px;
 background:#fff;
 border-radius:15px;
 box-shadow:0 5px 25px rgba(0,0,0,.3);
 padding:13px;
 display:none;
 z-index:400;
}
.property.show{
 display:block;
}
.property h3{
 margin:0 0 10px;
}
.propertyRow{
 display:flex;
 gap:7px;
 align-items:center;
 margin:7px 0;
}
.propertyRow label{
 width:45px;
 font-weight:bold;
 font-size:13px;
}
.propertyRow input{
 width:100%;
 min-width:0;
 padding:6px;
 border:1px solid #bbb;
 border-radius:7px;
}
.propertyButtons{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:6px;
}
.propertyButtons button{
 padding:8px;
 border-radius:8px;
 background:#168cff;
 color:#fff;
 font-weight:bold;
}
</style>
</head>

<body>

<section id="startScreen" class="screen active">
 <div class="logo">スライム城くずし<br>ステージメーカー</div>
 <div class="startButtons">
  <button class="make" id="makeBtn">ステージを作る</button>
  <button class="play" id="playBtn">ステージで遊ぶ</button>
 </div>
</section>

<section id="selectScreen" class="screen">
 <div class="header">
  <button id="selectBack">← 戻る</button>
  <h1>ステージを選択</h1>
 </div>
 <div id="stageList" class="stageList"></div>
</section>

<section id="editorScreen" class="screen">
 <canvas id="editorCanvas" class="gameCanvas"></canvas>

 <div class="gameUI">
  <div class="topbar">
   <button id="editorBack">← 戻る</button>
   <input id="stageName" placeholder="ステージ名">
   <button class="orange" id="saveBtn">保存</button>
   <button id="testBtn">▶ 遊ぶ</button>
   <button class="red" id="clearBtn">全消去</button>
  </div>

  <div class="toolbar">
   <button class="tool selected" data-tool="wood"><span class="toolIcon">🪵</span>木</button>
   <button class="tool" data-tool="glass"><span class="toolIcon">▱</span>ガラス</button>
   <button class="tool" data-tool="stone"><span class="toolIcon">⬛</span>石</button>
   <button class="tool" data-tool="enemy"><span class="toolIcon">🟢</span>敵</button>
   <button class="tool" data-tool="bomb"><span class="toolIcon">💣</span>爆弾</button>
   <button class="tool" data-tool="multiply"><span class="toolIcon">×2</span>増殖</button>
   <button class="tool" data-tool="bedrock"><span class="toolIcon">▰</span>岩盤</button>
   <button class="tool" data-tool="erase"><span class="toolIcon">⌫</span>消す</button>
   <button class="tool" data-tool="move"><span class="toolIcon">✋</span>移動</button>
   <button class="tool" data-tool="rotate"><span class="toolIcon">↻</span>回転</button>
   <button class="tool" data-tool="shape"><span class="toolIcon">⌗</span>形変更</button>
  </div>

  <div class="property" id="property">
   <h3>ブロック設定</h3>

   <div class="propertyRow">
    <label>幅</label>
    <input id="propW" type="number">
   </div>

   <div class="propertyRow">
    <label>高さ</label>
    <input id="propH" type="number">
   </div>

   <div class="propertyButtons">
    <button id="rotateMinus">↶ 90°</button>
    <button id="rotatePlus">↷ 90°</button>
    <button id="thinBtn">細く</button>
    <button id="thickBtn">太く</button>
    <button id="applyBtn">適用</button>
    <button id="closeProp">閉じる</button>
   </div>
  </div>
 </div>

 <div class="help">
  配置：タップ　移動：ドラッグ　回転：中央の線をドラッグ　形変更：4つの角をドラッグ
 </div>
 <div id="editorMessage" class="message"></div>
</section>

<section id="playScreen" class="screen">
 <canvas id="playCanvas" class="gameCanvas"></canvas>

 <div class="gameUI">
  <div class="topbar">
   <button id="playBack">← 戻る</button>
   <span id="playName" style="color:white;font-weight:900;padding:0 5px"></span>
   <button id="bombMode">💣 爆弾を置く</button>
   <button class="red" id="explodeBtn">💥 全爆破</button>
   <button id="restartBtn">↻ リセット</button>
  </div>
 </div>

 <div class="help">「爆弾を置く」を押してから画面をタップ</div>
 <div id="playMessage" class="message"></div>
</section>

<script>
"use strict";

const {
 Engine,
 Runner,
 World,
 Bodies,
 Body,
 Composite,
 Events,
 Bounds,
 Vertices
}=Matter;

const KEY="slimeCastleMaker_v5";

const FLOOR_Y=1000;

const EXPLOSION_RADIUS=110;
const EXPLOSION_FORCE_RADIUS=160;
const EXPLOSION_FORCE=.045;
const EXPLOSION_DAMAGE=150;

const MATERIALS={
 wood:{
  density:.0035,
  friction:.4,
  restitution:.08,
  hp:2,
  threshold:16
 },
 glass:{
  density:.0028,
  friction:.15,
  restitution:.25,
  hp:1,
  threshold:10
 },
 stone:{
  density:.008,
  friction:.6,
  restitution:.02,
  hp:3,
  threshold:48
 }
};

let editorEngine=null;
let playEngine=null;

let editorRunner=null;
let playRunner=null;

let currentTool="wood";
let currentStageId=null;
let stageObjects=[];
let selectedBody=null;

let drag=null;

let editorCamera={
 x:0,
 y:420,
 zoom:.7
};

let playCamera={
 x:0,
 y:450,
 zoom:.75
};

let multiplyContacts=new Map();

let effects=[];

const editorCanvas=document.getElementById("editorCanvas");
const playCanvas=document.getElementById("playCanvas");

/* ======================
  基本
====================== */

function $(id){
 return document.getElementById(id);
}

function screen(id){
 document.querySelectorAll(".screen").forEach(x=>{
  x.classList.remove("active");
 });
 $(id).classList.add("active");
}

function message(text,play=false){
 const el=play?$("playMessage"):$("editorMessage");
 el.textContent=text;
 el.classList.add("show");
 clearTimeout(el._timer);
 el._timer=setTimeout(()=>{
  el.classList.remove("show");
 },1800);
}

function uid(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function stages(){
 try{
  return JSON.parse(localStorage.getItem(KEY)||"[]");
 }catch(e){
  return [];
 }
}

function saveStages(a){
 localStorage.setItem(KEY,JSON.stringify(a));
}

/* ======================
  Canvas
====================== */

function resizeCanvas(c){
 const r=c.getBoundingClientRect();
 c.width=Math.max(1,Math.round(r.width));
 c.height=Math.max(1,Math.round(r.height));
}

function resizeAll(){
 resizeCanvas(editorCanvas);
 resizeCanvas(playCanvas);
}

window.addEventListener("resize",resizeAll);

function pointer(c,e){
 const r=c.getBoundingClientRect();
 return {
  x:e.clientX-r.left,
  y:e.clientY-r.top
 };
}

function toWorld(c,x,y,camera){
 return {
  x:(x-c.clientWidth/2)/camera.zoom+camera.x,
  y:(y-c.clientHeight/2)/camera.zoom+camera.y
 };
}

function toScreen(c,x,y,camera){
 return {
  x:(x-camera.x)*camera.zoom+c.clientWidth/2,
  y:(y-camera.y)*camera.zoom+c.clientHeight/2
 };
}

/* ======================
  オブジェクト作成
====================== */

function floor(){
 return Bodies.rectangle(
  0,
  FLOOR_Y+50,
  100000,
  100,
  {
   isStatic:true,
   label:"floor",
   plugin:{
    gameType:"floor"
   }
  }
 );
}

function block(type,x,y,w=150,h=35,angle=0){
 const m=MATERIALS[type];

 return Bodies.rectangle(
  x,
  y,
  w,
  h,
  {
   angle:angle*Math.PI/180,
   density:m.density,
   friction:m.friction,
   restitution:m.restitution,
   label:"block",
   plugin:{
    gameType:"block",
    material:type,
    width:w,
    height:h,
    hp:m.hp,
    maxHp:m.hp,
    threshold:m.threshold,
    id:uid()
   }
  }
 );
}

function enemy(x,y){
 return Bodies.circle(
  x,
  y,
  22,
  {
   density:.0018,
   friction:.4,
   restitution:.03,
   label:"enemy",
   plugin:{
    gameType:"enemy",
    alive:true,
    preVY:0,
    id:uid()
   }
  }
 );
}

function bomb(x,y){
 return Bodies.circle(
  x,
  y,
  16,
  {
   isStatic:false,
   density:.002,
   friction:.4,
   restitution:.15,
   label:"bomb",
   plugin:{
    gameType:"bomb",
    id:uid()
   }
  }
 );
}

function multiply(x,y,w=75,h=45){
 return Bodies.rectangle(
  x,
  y,
  w,
  h,
  {
   isStatic:true,

   /*
    * ここが重要。
    * 爆弾は完全に通り抜ける。
    * しかしcollisionイベントは発生する。
    */
   isSensor:true,

   label:"multiply",
   plugin:{
    gameType:"multiply",
    width:w,
    height:h,
    id:uid()
   }
  }
 );
}

function bedrock(x,y,w=300,h=50){
 return Bodies.rectangle(
  x,
  y,
  w,
  h,
  {
   isStatic:true,
   angle:0,
   label:"bedrock",
   plugin:{
    gameType:"bedrock",
    width:w,
    height:h,
    id:uid()
   }
  }
 );
}

/* ======================
  Engine
====================== */

function setup(engine){

 Events.on(engine,"beforeUpdate",()=>{
  Composite.allBodies(engine.world).forEach(b=>{
   if(
    b.label==="enemy" &&
    b.plugin.alive
   ){
    b.plugin.preVY=b.velocity.y;
   }
  });
 });

 Events.on(engine,"collisionStart",e=>{
  e.pairs.forEach(handleCollision);
 });

 Events.on(engine,"collisionActive",e=>{
  e.pairs.forEach(handleActive);
 });

 Events.on(engine,"collisionEnd",e=>{
  e.pairs.forEach(handleEnd);
 });
}

function type(b){
 return b?.plugin?.gameType||b?.label;
}

/* ======================
  衝突
====================== */

function handleCollision(pair){

 const a=pair.bodyA;
 const b=pair.bodyB;

 const ta=type(a);
 const tb=type(b);

 /* 増殖 */
 if(
  (ta==="bomb"&&tb==="multiply")||
  (ta==="multiply"&&tb==="bomb")
 ){
  const bombBody=ta==="bomb"?a:b;
  const multi=ta==="multiply"?a:b;

  multiplyBomb(multi,bombBody);
  return;
 }

 /* スライム */
 let e=null;
 let other=null;

 if(ta==="enemy"){
  e=a;
  other=b;
 }else if(tb==="enemy"){
  e=b;
  other=a;
 }

 if(e&&e.plugin.alive){

  const ot=type(other);

  if(
   (ot==="floor"||ot==="bedrock") &&
   e.plugin.preVY>=10
  ){
   killEnemy(e);
   return;
  }

  if(
   ot==="block"||
   ot==="bedrock"
  ){
   crushCheck(e,other,pair);
  }
 }

 /* ブロック */
 if(
  ta==="block"&&
  tb==="block"
 ){
  const speed=
   Math.abs(a.velocity.y-b.velocity.y)+
   Math.abs(a.velocity.x-b.velocity.x);

  if(speed>1){
   damageBlock(a,speed*3);
   damageBlock(b,speed*3);
  }
 }

 /* 爆弾 */
 if(ta==="bomb"||tb==="bomb"){

  const bo=ta==="bomb"?a:b;
  const otherBody=bo===a?b:a;

  if(type(otherBody)==="block"){
   damageBlock(otherBody,30);
  }
 }
}

function handleActive(pair){

 const a=pair.bodyA;
 const b=pair.bodyB;

 let e=null;
 let other=null;

 if(type(a)==="enemy"){
  e=a;
  other=b;
 }else if(type(b)==="enemy"){
  e=b;
  other=a;
 }

 if(!e||!e.plugin.alive)return;

 if(
  type(other)==="block"||
  type(other)==="bedrock"
 ){
  crushCheck(e,other,pair);
 }
}

function handleEnd(pair){

 const a=pair.bodyA;
 const b=pair.bodyB;

 if(
  (type(a)==="bomb"&&type(b)==="multiply")||
  (type(a)==="multiply"&&type(b)==="bomb")
 ){

  const bo=type(a)==="bomb"?a:b;
  const mu=type(a)==="multiply"?a:b;

  const id=mu.plugin.id;

  if(!multiplyContacts.has(id)){
   return;
  }

  multiplyContacts
   .get(id)
   .delete(bo.plugin.id);
 }
}

/* ======================
  増殖
====================== */

function multiplyBomb(multi,bo){

 const mid=multi.plugin.id;

 if(!multiplyContacts.has(mid)){
  multiplyContacts.set(mid,new Set());
 }

 const set=multiplyContacts.get(mid);

 /*
  * すでに接触中なら増殖しない。
  */
 if(set.has(bo.plugin.id)){
  return;
 }

 /*
  * 「触れた」と登録。
  * 離れるまで再発火しない。
  */
 set.add(bo.plugin.id);

 const engine=
  editorEngine&&
  $("editorScreen").classList.contains("active")
   ?editorEngine
   :playEngine;

 if(!engine)return;

 const x=multi.position.x+
   (Math.random()-.5)*60;

 /*
  * 必ず増殖ブロックの下側。
  */
 const y=
  multi.position.y+
  multi.plugin.height/2+
  38;

 const nb=bomb(x,y);

 World.add(engine.world,nb);

 /*
  * 下向きに少し初速。
  */
 Body.setVelocity(nb,{
  x:(Math.random()-.5)*1.5,
  y:1
 });

 if(engine===editorEngine){
  stageObjects.push(nb);
 }
}

/* ======================
  Damage
====================== */

function damageBlock(b,dmg){

 if(!b||type(b)!=="block")return;

 const p=b.plugin;

 if(dmg<p.threshold)return;

 p.hp--;

 if(p.hp<=0){

  const engine=
   editorEngine&&
   $("editorScreen").classList.contains("active")
    ?editorEngine
    :playEngine;

  World.remove(engine.world,b);

  const i=stageObjects.indexOf(b);

  if(i>=0){
   stageObjects.splice(i,1);
  }

  if(selectedBody===b){
   selectedBody=null;
  }
 }
}

/* ======================
  スライム
====================== */

function crushCheck(e,other,pair){

 if(!e.plugin.alive)return;

 const depth=pair.collision?.depth||0;

 const above=
  other.position.y<
  e.position.y;

 const downward=
  other.isStatic||
  other.velocity.y>3;

 const relative=
  Math.abs(
   e.plugin.preVY-
   (other.velocity?.y||0)
  );

 /*
  * 上から物体が落ちてきて
  * 重なりが大きければ圧し潰し。
  */
 if(
  above&&
  downward&&
  depth>5
 ){
  killEnemy(e);
  return;
 }

 if(relative>9){
  killEnemy(e);
 }
}

function killEnemy(e){

 if(!e||!e.plugin.alive)return;

 e.plugin.alive=false;

 const engine=
  editorEngine&&
  $("editorScreen").classList.contains("active")
   ?editorEngine
   :playEngine;

 World.remove(engine.world,e);

 const i=stageObjects.indexOf(e);

 if(i>=0){
  stageObjects.splice(i,1);
 }

 if(selectedBody===e){
  selectedBody=null;
 }
}

/* ======================
  爆発
====================== */

function explodeAt(engine,x,y){

 effects.push({
  engine,
  x,
  y,
  t:performance.now()
 });

 Composite.allBodies(engine.world)
 .forEach(b=>{

  const t=type(b);

  /*
   * 床と岩盤は爆発の影響を受けない。
   */
  if(
   t==="floor"||
   t==="bedrock"||
   t==="multiply"
  ){
   return;
  }

  const dx=b.position.x-x;
  const dy=b.position.y-y;
  const d=Math.sqrt(dx*dx+dy*dy);

  if(d>EXPLOSION_FORCE_RADIUS)return;

  const p=1-d/EXPLOSION_FORCE_RADIUS;
  const len=Math.max(d,1);

  if(!b.isStatic){

   Body.applyForce(
    b,
    b.position,
    {
     x:dx/len*EXPLOSION_FORCE*p,
     y:dy/len*EXPLOSION_FORCE*p
    }
   );
  }

  if(t==="block"){
   damageBlock(
    b,
    EXPLOSION_DAMAGE*p
   );
  }

  if(
   t==="enemy"&&
   d<EXPLOSION_RADIUS
  ){
   killEnemy(b);
  }
 });
}

function explodeAll(engine){

 const bombs=Composite
  .allBodies(engine.world)
  .filter(b=>type(b)==="bomb");

 bombs.forEach(b=>{
  explodeAt(
   engine,
   b.position.x,
   b.position.y
  );
 });

 bombs.forEach(b=>{
  World.remove(engine.world,b);
 });

 if(engine===editorEngine){
  stageObjects=
   stageObjects.filter(
    b=>type(b)!=="bomb"
   );
 }
}

/* ======================
  body検索
====================== */

function bodyAt(engine,p){

 const bodies=
  Composite.allBodies(engine.world);

 for(let i=bodies.length-1;i>=0;i--){

  const b=bodies[i];

  if(type(b)==="floor")continue;

  if(
   Bounds.contains(b.bounds,p) &&
   Vertices.contains(b.vertices,p)
  ){
   return b;
  }
 }

 return null;
}

 World.add(

 );

    );

   }

   }

   if(o.type==="multiply"){
    b=multiply(
     o.x,o.y,
     o.w,o.h
    );
   }

   if(o.type==="bedrock"){
    b=bedrock(
     o.x,o.y,
     o.w,o.h
    );
   }

   if(b){

     editorEngine.world,

    );

   }
  });
 }

 Runner.run(

 );

 editorCamera={

 };

 }

 editorRunner=null;

 stageObjects=[];

}

/* ======================
  Editor Pointer
====================== */

editorCanvas.addEventListener(
 "pointerdown",
 e=>{

  if(!editorEngine)return;

  e.preventDefault();

  const s=pointer(
   editorCanvas,
   e
  );

  const p=toWorld(
   editorCanvas,
   s.x,s.y,
   editorCamera
  );

  /*
   * 回転ハンドル
   */
  if(
   currentTool==="rotate"&&
   selectedBody
  ){

   const dx=p.x-selectedBody.position.x;
   const dy=p.y-selectedBody.position.y;

   const dist=Math.sqrt(dx*dx+dy*dy);

   const w=selectedBody.plugin.width||50;

   if(
    dist>w*.35&&
    dist<w*1.2
   ){

    drag={
     mode:"rotate",
     body:selectedBody
    };

    return;
   }
  }

  /*
   * 形変更の4頂点
   */
  if(
   currentTool==="shape"&&
   selectedBody&&
   selectedBody.label==="block"
  ){

   const handles=
    shapeHandles(selectedBody);

   let nearest=null;
   let nd=Infinity;

   handles.forEach(h=>{

    const dx=p.x-h.x;
    const dy=p.y-h.y;
    const d=Math.sqrt(dx*dx+dy*dy);

    if(d<nd){
     nd=d;
     nearest=h;
    }
   });

   if(nearest&&nd<30){

    drag={
     mode:"shape",
     body:selectedBody,
     corner:nearest.corner
    };

    return;
   }
  }

  /*
   * 移動
   */
  if(currentTool==="move"){

   const b=bodyAt(
    editorEngine,
    p
   );

   if(b){

    selectedBody=b;

    drag={
     mode:"move",
     body:b,
     dx:b.position.x-p.x,
     dy:b.position.y-p.y
    };
   }

   return;
  }

  /*
   * 消去
   */
  if(currentTool==="erase"){

   const b=bodyAt(
    editorEngine,
    p
   );

   if(b){

    World.remove(
     editorEngine.world,
     b
    );

    const i=
     stageObjects.indexOf(b);

    if(i>=0){
     stageObjects.splice(i,1);
    }

    if(selectedBody===b){
     selectedBody=null;
    }
   }

   return;
  }

  /*
   * 回転ツールで
   * ブロックを選択
   */
  if(currentTool==="rotate"){

   const b=bodyAt(
    editorEngine,
    p
   );

   if(b){

    selectedBody=b;

    if(
     b.label!=="bedrock"
    ){
     drag={
      mode:"rotate",
      body:b
     };
    }
   }

   return;
  }

  /*
   * 形変更ツールで選択
   */
  if(currentTool==="shape"){

   const b=bodyAt(
    editorEngine,
    p
   );

   if(b){
    selectedBody=b;
   }

   return;
  }

  /*
   * 既存選択
   */
  const existing=
   bodyAt(
    editorEngine,
    p
   );

  if(existing){

   if(
    ["block","enemy","bomb","multiply","bedrock"]
    .includes(type(existing))
   ){

    selectedBody=existing;

    /*
     * 通常の配置ツールで
     * 既存物体を選択するだけ。
     */
    if(
     currentTool==="wood"||
     currentTool==="glass"||
     currentTool==="stone"||
     currentTool==="enemy"||
     currentTool==="bomb"||
     currentTool==="multiply"||
     currentTool==="bedrock"
    ){
     return;
    }
   }
  }

  /*
   * 新規配置
   */
  let b=null;

  if(
   ["wood","glass","stone"]
   .includes(currentTool)
  ){

   b=block(
    currentTool,
    p.x,p.y,
    150,35,0
   );
  }

  if(currentTool==="enemy"){
   b=enemy(p.x,p.y);
  }

  if(currentTool==="bomb"){
   b=bomb(p.x,p.y);
  }

  if(currentTool==="multiply"){
   b=multiply(p.x,p.y);
  }

  if(currentTool==="bedrock"){
   b=bedrock(p.x,p.y);
  }

  if(b){

   World.add(
    editorEngine.world,
    b
   );

   stageObjects.push(b);
   selectedBody=b;
  }
 }
);

editorCanvas.addEventListener(
 "pointermove",
 e=>{

  if(!drag||!editorEngine)return;

  e.preventDefault();

  const s=pointer(
   editorCanvas,
   e
  );

  const p=toWorld(
   editorCanvas,
   s.x,s.y,
   editorCamera
  );

  const b=drag.body;

  if(drag.mode==="move"){

   Body.setPosition(
    b,
    {
     x:p.x+drag.dx,
     y:p.y+drag.dy
    }
   );

   if(type(b)==="bedrock"){
    Body.setAngle(b,0);
   }
  }

  if(drag.mode==="rotate"){

   if(type(b)==="bedrock")return;

   const dx=p.x-b.position.x;
   const dy=p.y-b.position.y;

   /*
    * 中心→タッチ位置の角度。
    * 垂直線を基準にして回転。
    */
   let angle=
    Math.atan2(dx,-dy);

   Body.setAngle(
    b,
    angle
   );
  }

  if(drag.mode==="shape"){

   resizeFromCorner(
    b,
    drag.corner,
    p
   );
  }
 }
);

function endDrag(){
 drag=null;
}

editorCanvas.addEventListener(
 "pointerup",
 endDrag
);

editorCanvas.addEventListener(
 "pointercancel",
 endDrag
);

/* ======================
  回転・形変更
====================== */

function localCorners(b){

 const w=b.plugin.width;
 const h=b.plugin.height;

 return [
  {x:-w/2,y:-h/2,corner:"tl"},
  {x:w/2,y:-h/2,corner:"tr"},
  {x:w/2,y:h/2,corner:"br"},
  {x:-w/2,y:h/2,corner:"bl"}
 ];
}

function shapeHandles(b){

 const c=localCorners(b);

 const cos=Math.cos(b.angle);
 const sin=Math.sin(b.angle);

 return c.map(q=>{

  return {
   corner:q.corner,

   x:b.position.x+
     q.x*cos-
     q.y*sin,

   y:b.position.y+
     q.x*sin+
     q.y*cos
  };

 });
}

function resizeFromCorner(
 b,
 corner,
 p
){

 /*
  * ドラッグしている頂点の反対側を固定。
  * そのため常に長方形になる。
  */

 const cos=Math.cos(b.angle);
 const sin=Math.sin(b.angle);

 const dx=p.x-b.position.x;
 const dy=p.y-b.position.y;

 const localX=
  dx*cos+
  dy*sin;

 const localY=
  -dx*sin+
  dy*cos;

 let opposite;

 if(corner==="tr"){
  opposite={x:-b.plugin.width/2,y:b.plugin.height/2};
 }
 if(corner==="tl"){
  opposite={x:b.plugin.width/2,y:b.plugin.height/2};
 }
 if(corner==="br"){
  opposite={x:-b.plugin.width/2,y:-b.plugin.height/2};
 }
 if(corner==="bl"){
  opposite={x:b.plugin.width/2,y:-b.plugin.height/2};
 }

 let minX=Math.min(
  localX,
  opposite.x
 );

 let maxX=Math.max(
  localX,
  opposite.x
 );

 let minY=Math.min(
  localY,
  opposite.y
 );

 let maxY=Math.max(
  localY,
  opposite.y
 );

 const w=Math.max(
  15,
  maxX-minX
 );

 const h=Math.max(
  15,
  maxY-minY
 );

 /*
  * 固定側を維持しながら
  * 中心位置を移動。
  */
 const centerLocalX=
  (localX+opposite.x)/2;

 const centerLocalY=
  (localY+opposite.y)/2;

 const worldCX=
  b.position.x+
  centerLocalX*cos-
  centerLocalY*sin;

 const worldCY=
  b.position.y+
  centerLocalX*sin+
  centerLocalY*cos;

 const oldW=b.plugin.width;
 const oldH=b.plugin.height;

 Body.scale(
  b,
  w/oldW,
  h/oldH
 );

 Body.setPosition(
  b,
  {
   x:worldCX,
   y:worldCY
  }
 );

 b.plugin.width=w;
 b.plugin.height=h;
}

/* ======================
  保存
====================== */

function serialize(){

 return {
  id:currentStageId,
  name:
   $("stageName").value.trim()||
   "無題のステージ",

  objects:
   stageObjects
   .filter(b=>{
    return [
     "block",
     "enemy",
     "bomb",
     "multiply",
     "bedrock"
    ].includes(type(b));
   })
   .map(b=>{

    const t=type(b);

    if(t==="block"){
     return {
      type:"block",
      material:b.plugin.material,
      x:b.position.x,
      y:b.position.y,
      w:b.plugin.width,
      h:b.plugin.height,
      angle:b.angle*180/Math.PI
     };
    }

    if(t==="enemy"){
     return {
      type:"enemy",
      x:b.position.x,
      y:b.position.y
     };
    }

    if(t==="bomb"){
     return {
      type:"bomb",
      x:b.position.x,
      y:b.position.y
     };
    }

    if(t==="multiply"){
     return {
      type:"multiply",
      x:b.position.x,
      y:b.position.y,
      w:b.plugin.width,
      h:b.plugin.height
     };
    }

    if(t==="bedrock"){
     return {
      type:"bedrock",
      x:b.position.x,
      y:b.position.y,
      w:b.plugin.width,
      h:b.plugin.height,
      angle:0
     };
    }

   })
 };
}

/* ======================
  Draw
====================== */

function draw(
 canvas,
 engine,
 camera,
 editor
){

 const ctx=canvas.getContext("2d");

 ctx.clearRect(
  0,0,
  canvas.width,
  canvas.height
 );

 ctx.save();

 ctx.translate(
  canvas.clientWidth/2,
  canvas.clientHeight/2
 );

 ctx.scale(
  camera.zoom,
  camera.zoom
 );

 ctx.translate(
  -camera.x,
  -camera.y
 );

 /*
  * 背景
  */
 ctx.fillStyle="#d9edff";

 const left=
  camera.x-
  canvas.clientWidth/
  camera.zoom/2-
  500;

 const top=
  camera.y-
  canvas.clientHeight/
  camera.zoom/2-
  500;

 ctx.fillRect(
  left,
  top,
  canvas.clientWidth/camera.zoom+1000,
  canvas.clientHeight/camera.zoom+1000
 );

 const bodies=
  Composite.allBodies(
   engine.world
  );

 bodies.forEach(b=>{

  const t=type(b);

  if(t==="floor"){

   ctx.fillStyle="#737373";

   ctx.fillRect(
    b.bounds.min.x,
    b.bounds.min.y,
    b.bounds.max.x-b.bounds.min.x,
    b.bounds.max.y-b.bounds.min.y
   );

   /*
    * 床の線
    */
   ctx.strokeStyle="#444";
   ctx.lineWidth=5;

   ctx.beginPath();

   ctx.moveTo(
    b.bounds.min.x,
    b.bounds.min.y
   );

   ctx.lineTo(
    b.bounds.max.x,
    b.bounds.min.y
   );

   ctx.stroke();

   return;
  }

  ctx.save();

  ctx.translate(
   b.position.x,
   b.position.y
  );

  ctx.rotate(
   b.angle
  );

  if(t==="block"){

   const w=b.plugin.width;
   const h=b.plugin.height;

   if(b.plugin.material==="wood"){
    ctx.fillStyle="#c98a46";
   }

   if(b.plugin.material==="glass"){
    ctx.fillStyle="#7ed8e8";
   }

   if(b.plugin.material==="stone"){
    ctx.fillStyle="#777";
   }

   ctx.fillRect(
    -w/2,
    -h/2,
    w,h
   );

   ctx.strokeStyle="#333";
   ctx.lineWidth=2;

   ctx.strokeRect(
    -w/2,
    -h/2,
    w,h
   );
  }

  if(t==="bedrock"){

   const w=b.plugin.width;
   const h=b.plugin.height;

   ctx.fillStyle="#30343a";

   ctx.fillRect(
    -w/2,
    -h/2,
    w,h
   );

   ctx.strokeStyle="#111";
   ctx.lineWidth=3;

   ctx.strokeRect(
    -w/2,
    -h/2,
    w,h
   );

   ctx.strokeStyle="#555";
   ctx.lineWidth=2;

   for(
    let x=-w/2;
    x<w/2;
    x+=35
   ){

    ctx.beginPath();

    ctx.moveTo(
     x,-h/2
    );

    ctx.lineTo(
     x+20,h/2
    );

    ctx.stroke();
   }
  }

  if(t==="multiply"){

   const w=b.plugin.width;
   const h=b.plugin.height;

   /*
    * 透過していることが分かる表示
    */
   ctx.fillStyle=
    "rgba(255,200,30,.48)";

   ctx.fillRect(
    -w/2,
    -h/2,
    w,h
   );

   ctx.strokeStyle="#b57900";
   ctx.lineWidth=3;

   ctx.strokeRect(
    -w/2,
    -h/2,
    w,h
   );

   ctx.fillStyle="#222";
   ctx.font="bold 28px Arial";
   ctx.textAlign="center";
   ctx.textBaseline="middle";

   ctx.fillText("×2",0,0);
  }

  if(t==="enemy"){

   ctx.fillStyle="#55c94a";

   ctx.beginPath();

   ctx.arc(
    0,0,22,
    0,Math.PI*2
   );

   ctx.fill();

   ctx.fillStyle="#fff";

   ctx.beginPath();

   ctx.arc(-7,-4,5,0,Math.PI*2);
   ctx.arc(7,-4,5,0,Math.PI*2);

   ctx.fill();

   ctx.fillStyle="#222";

   ctx.beginPath();

   ctx.arc(-7,-4,2,0,Math.PI*2);
   ctx.arc(7,-4,2,0,Math.PI*2);

   ctx.fill();
  }

  if(t==="bomb"){

   ctx.fillStyle="#222";

   ctx.beginPath();

   ctx.arc(
    0,0,16,
    0,Math.PI*2
   );

   ctx.fill();

   ctx.strokeStyle="#333";
   ctx.lineWidth=4;

   ctx.beginPath();

   ctx.moveTo(8,-12);

   ctx.quadraticCurveTo(
    17,-22,
    20,-13
   );

   ctx.stroke();
  }

  ctx.restore();
 });

 /*
  * 選択中
  */
 if(editor&&selectedBody){

  const b=selectedBody;

  if(
   type(b)==="block"||
   type(b)==="bedrock"||
   type(b)==="multiply"
  ){

   const w=b.plugin.width;
   const h=b.plugin.height;

   ctx.save();

   ctx.translate(
    b.position.x,
    b.position.y
   );

   ctx.rotate(b.angle);

   ctx.strokeStyle="#f80";
   ctx.lineWidth=4/camera.zoom;
   ctx.setLineDash([
    8/camera.zoom,
    5/camera.zoom
   ]);

   ctx.strokeRect(
    -w/2-5,
    -h/2-5,
    w+10,
    h+10
   );

   ctx.restore();
  }

  /*
   * 回転用の垂直線
   */
  if(
   currentTool==="rotate" &&
   type(b)!=="bedrock"
  ){

   const top=
    toScreen(
     canvas,
     b.position.x,
     b.position.y-
      Math.max(
       b.plugin.height||30,
       50
      ),
     camera
    );

   const center=
    toScreen(
     canvas,
     b.position.x,
     b.position.y,
     camera
    );

   ctx.strokeStyle="#f80";
   ctx.lineWidth=4;

   ctx.beginPath();

   ctx.moveTo(
    center.x,
    center.y
   );

   ctx.lineTo(
    top.x,
    top.y
   );

   ctx.stroke();

   ctx.fillStyle="#f80";

   ctx.beginPath();

   ctx.arc(
    top.x,
    top.y,
    8,
    0,
    Math.PI*2
   );

   ctx.fill();
  }

  /*
   * 形変更の4頂点
   */
  if(
   currentTool==="shape" &&
   type(b)==="block"
  ){

   shapeHandles(b)
   .forEach(h=>{

    const s=
     toScreen(
      canvas,
      h.x,
      h.y,
      camera
     );

    ctx.fillStyle="#fff";
    ctx.strokeStyle="#f80";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.rect(
     s.x-7,
     s.y-7,
     14,
     14
    );

    ctx.fill();
    ctx.stroke();
   });
  }
 }

 ctx.restore();

 /*
  * 爆発エフェクト
  */
 const now=performance.now();

 effects=effects.filter(
  x=>now-x.t<300
 );

 effects.forEach(x=>{

  if(x.engine!==engine)return;

  const s=toScreen(
   canvas,
   x.x,x.y,
   camera
  );

  const p=(now-x.t)/300;

  ctx.strokeStyle="#f80";
  ctx.lineWidth=8;
  ctx.globalAlpha=1-p;

  ctx.beginPath();

  ctx.arc(
   s.x,
   s.y,
   p*130*camera.zoom,
   0,
   Math.PI*2
  );

  ctx.stroke();

  ctx.globalAlpha=1;
 });
}

/* ======================
  Animation
====================== */

function loopEditor(){

 if(
  editorEngine&&
  $("editorScreen")
   .classList
   .contains("active")
 ){

  draw(
   editorCanvas,
   editorEngine,
   editorCamera,
   true
  );
 }

 requestAnimationFrame(
  loopEditor
 );
}

function loopPlay(){

 if(
  playEngine&&
  $("playScreen")
   .classList
   .contains("active")
 ){

  draw(
   playCanvas,
   playEngine,
   playCamera,
   false
  );
 }

 requestAnimationFrame(
  loopPlay
 );
}

/* ======================
  岩盤角度固定
====================== */

setInterval(()=>{

 [
  editorEngine,
  playEngine
 ].forEach(engine=>{

  if(!engine)return;

  Composite.allBodies(
   engine.world
  ).forEach(b=>{

   if(type(b)==="bedrock"){
    Body.setAngle(b,0);
   }
  });
 });

},50);

resizeAll();

loopEditor();
loopPlay();

</script>
</body>
