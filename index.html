<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スライム城くずしメーカー</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    "Trebuchet MS",
    "Arial Rounded MT Bold",
    "Hiragino Maru Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background:#f5f0df;
  color:#493d32;
}

button{
  font-family:inherit;
  border:0;
  cursor:pointer;
  touch-action:manipulation;
}

/* =========================================
   画面
========================================= */

.screen{
  position:absolute;
  inset:0;
  display:none;
  overflow:hidden;
}

.screen.active{
  display:block;
}

/* =========================================
   スタート画面
========================================= */

#startScreen{
  background:
    radial-gradient(circle at 15% 15%,rgba(255,255,255,.8) 0 5%,transparent 6%),
    radial-gradient(circle at 85% 25%,rgba(255,255,255,.55) 0 4%,transparent 5%),
    linear-gradient(
      180deg,
      #fff8dc 0%,
      #fff3c6 55%,
      #e8d29b 100%
    );
}

#startScreen::before{
  content:"";
  position:absolute;
  left:-10%;
  right:-10%;
  bottom:-100px;
  height:260px;
  background:#b7d87a;
  border-radius:50% 50% 0 0;
  box-shadow:
    0 -12px 0 #91bc5c,
    inset 0 18px 0 rgba(255,255,255,.2);
}

#startContent{
  position:absolute;
  z-index:20;
  left:50%;
  top:50%;
  transform:translate(-50%,-55%);
  width:min(720px,92vw);
  text-align:center;
}

.logo{
  display:inline-block;
  position:relative;
  margin-bottom:34px;
}

.logoMain{
  font-size:clamp(36px,7vw,68px);
  font-weight:900;
  color:#70b93e;
  letter-spacing:2px;
  text-shadow:
    0 5px 0 #fff,
    0 8px 0 #4e8d2c,
    3px 8px 0 #4e8d2c,
    -3px 8px 0 #4e8d2c;
}

.logoSub{
  margin-top:12px;
  font-size:clamp(16px,3vw,25px);
  font-weight:bold;
  color:#806a4f;
}

.startButtons{
  display:flex;
  justify-content:center;
  gap:25px;
  flex-wrap:wrap;
}

.mainButton{
  position:relative;
  min-width:230px;
  padding:19px 30px 23px;
  border-radius:18px;
  font-size:23px;
  font-weight:900;
  color:#fff;
  border:4px solid rgba(0,0,0,.13);
  box-shadow:
    0 8px 0 rgba(0,0,0,.2),
    inset 0 3px 0 rgba(255,255,255,.35);
  transition:
    transform .08s,
    box-shadow .08s;
}

.mainButton:active{
  transform:translateY(7px);
  box-shadow:
    0 1px 0 rgba(0,0,0,.2),
    inset 0 3px 0 rgba(255,255,255,.25);
}

.makeButton{
  background:linear-gradient(#ffb94d,#ef8d2e);
  border-color:#c66d22;
}

.playButton{
  background:linear-gradient(#72c95a,#4da53b);
  border-color:#397d2d;
}

.buttonIcon{
  font-size:30px;
  margin-right:8px;
  vertical-align:-3px;
}

/* =========================================
   ステージ選択
========================================= */

#selectScreen{
  background:
    linear-gradient(180deg,#fff9e7,#e9d9a9);
  overflow:auto;
  padding-bottom:40px;
}

.selectHeader{
  width:min(1000px,94vw);
  margin:0 auto;
  padding:25px 0 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.selectTitle{
  font-size:clamp(28px,5vw,45px);
  color:#609b3d;
  text-shadow:0 3px 0 #fff;
  font-weight:900;
}

.backButton{
  background:#fff;
  color:#6d5b46;
  border:3px solid #d2bc8c;
  border-radius:13px;
  padding:10px 18px;
  font-size:16px;
  font-weight:bold;
  box-shadow:0 4px 0 #b29b70;
}

.backButton:active{
  transform:translateY(4px);
  box-shadow:0 0 0 #b29b70;
}

#stageList{
  width:min(1000px,94vw);
  margin:auto;
}

.stageCard{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin:14px 0;
  padding:20px;
  background:#fffdf4;
  border:4px solid #d5bd88;
  border-radius:20px;
  box-shadow:
    0 7px 0 #b59d70,
    0 12px 20px rgba(75,50,20,.12);
}

.stageInfo strong{
  display:block;
  color:#5d943c;
  font-size:24px;
  margin-bottom:6px;
}

.stageInfo span{
  color:#806f58;
}

.stageButtons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.stageButton{
  padding:11px 17px;
  border-radius:11px;
  font-weight:bold;
  color:#fff;
  box-shadow:0 4px 0 rgba(0,0,0,.2);
}

.stageButton:active{
  transform:translateY(4px);
  box-shadow:none;
}

.stagePlay{
  background:#62b84a;
}

.stageEdit{
  background:#e99b3b;
}

.stageDelete{
  background:#d76557;
}

/* =========================================
   エディター・プレイ
========================================= */

#editorScreen,
#playScreen{
  background:#dfe9bd;
}

.gameCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  display:block;
}

/* =========================================
   エディターツール
========================================= */

#editorUI{
  position:absolute;
  z-index:50;
  left:12px;
  top:12px;
  max-width:calc(100% - 24px);
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.tool{
  min-width:52px;
  padding:9px 12px;
  border-radius:11px;
  background:#fffdf1;
  color:#594b3a;
  border:3px solid #c8b582;
  font-size:14px;
  font-weight:bold;
  box-shadow:
    0 4px 0 #a7956c,
    0 4px 10px rgba(0,0,0,.1);
}

.tool:active{
  transform:translateY(4px);
  box-shadow:0 0 0 #a7956c;
}

.tool.selected{
  color:#fff;
  background:#68ae45;
  border-color:#43852c;
  box-shadow:
    0 4px 0 #356e25;
}

#editorTop{
  position:absolute;
  z-index:50;
  right:12px;
  top:12px;
  display:flex;
  gap:8px;
}

.topButton{
  padding:10px 17px;
  border-radius:11px;
  color:#fff;
  font-weight:bold;
  border:3px solid rgba(0,0,0,.15);
  box-shadow:0 4px 0 rgba(0,0,0,.25);
}

.topButton:active{
  transform:translateY(4px);
  box-shadow:none;
}

.saveButton{
  background:#61aa43;
}

.exitButton{
  background:#8b7254;
}

#editorHint{
  position:absolute;
  z-index:50;
  left:50%;
  transform:translateX(-50%);
  bottom:12px;
  max-width:calc(100% - 24px);
  padding:8px 15px;
  border-radius:12px;
  background:rgba(75,61,43,.83);
  color:#fff8dc;
  font-size:13px;
  text-align:center;
  pointer-events:none;
}

/* =========================================
   プレイUI
========================================= */

#playUI{
  position:absolute;
  z-index:50;
  left:12px;
  top:12px;
  display:flex;
  gap:8px;
}

.playControl{
  padding:11px 17px;
  border-radius:12px;
  color:#fff;
  font-weight:bold;
  border:3px solid rgba(0,0,0,.15);
  box-shadow:0 4px 0 rgba(0,0,0,.25);
}

.playControl:active{
  transform:translateY(4px);
  box-shadow:none;
}

.bombButton{
  background:#dc6950;
}

.bombButton.selected{
  background:#b83d2d;
  box-shadow:
    0 0 0 3px #fff,
    0 4px 0 rgba(0,0,0,.25);
}

.explodeButton{
  background:#ef8d2e;
}

.restartButton{
  background:#708b61;
}

#playInfo{
  position:absolute;
  z-index:50;
  right:12px;
  top:12px;
  padding:11px 17px;
  border-radius:12px;
  background:#fffdf0;
  border:3px solid #c7b47f;
  color:#584936;
  font-size:17px;
  font-weight:bold;
  box-shadow:0 4px 0 #a28e62;
}

#backPlay{
  position:absolute;
  z-index:50;
  right:12px;
  bottom:12px;
  padding:10px 16px;
  border-radius:11px;
  background:#fffdf1;
  color:#5c4d39;
  border:3px solid #c8b582;
  font-weight:bold;
  box-shadow:0 4px 0 #a7956c;
}

#backPlay:active{
  transform:translateY(4px);
  box-shadow:none;
}

/* =========================================
   スマホ
========================================= */

@media(max-width:600px){

  .startButtons{
    flex-direction:column;
    align-items:center;
    gap:16px;
  }

  .mainButton{
    width:min(320px,85vw);
    min-width:0;
  }

  .stageCard{
    align-items:flex-start;
    flex-direction:column;
  }

  .stageButtons{
    width:100%;
    justify-content:flex-start;
  }

  #editorTop{
    top:65px;
  }

  #playInfo{
    top:65px;
  }

  #playUI{
    max-width:calc(100% - 24px);
    flex-wrap:wrap;
  }

}
</style>
</head>

<body>

<!-- =====================================================
     スタート
===================================================== -->

<div id="startScreen" class="screen active">

  <div id="startContent">

    <div class="logo">
      <div class="logoMain">
        スライム城くずし
      </div>

      <div class="logoSub">
        オリジナルステージメーカー
      </div>
    </div>

    <div class="startButtons">

      <button
        type="button"
        id="makeStageBtn"
        class="mainButton makeButton"
      >
        <span class="buttonIcon">🔨</span>
        ステージを作る
      </button>

      <button
        type="button"
        id="playStageBtn"
        class="mainButton playButton"
      >
        <span class="buttonIcon">▶</span>
        ステージで遊ぶ
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     ステージ選択
===================================================== -->

<div id="selectScreen" class="screen">

  <div class="selectHeader">

    <div class="selectTitle">
      ステージを選択
    </div>

    <button
      type="button"
      class="backButton"
      id="selectBackBtn"
    >
      ← 戻る
    </button>

  </div>

  <div id="stageList"></div>

</div>


<!-- =====================================================
     エディター
===================================================== -->

<div id="editorScreen" class="screen">

  <canvas
    id="editorCanvas"
    class="gameCanvas"
  ></canvas>

  <div id="editorUI">

    <button class="tool selected" data-tool="wood">
      🪵 木
    </button>

    <button class="tool" data-tool="glass">
      🧊 ガラス
    </button>

    <button class="tool" data-tool="stone">
      🪨 石
    </button>

    <button class="tool" data-tool="bedrock">
      ⛰ 岩盤
    </button>

    <button class="tool" data-tool="enemy">
      🟢 敵
    </button>

    <button class="tool" data-tool="bomb">
      💣 爆弾
    </button>

    <button class="tool" data-tool="multiply">
      ×2 増殖
    </button>

    <button class="tool" data-tool="erase">
      🗑 消す
    </button>

    <button class="tool" data-tool="move">
      ✋ 移動
    </button>

  </div>

  <div id="editorTop">

    <button
      type="button"
      id="saveStageBtn"
      class="topButton saveButton"
    >
      💾 保存
    </button>

    <button
      type="button"
      id="editorBackBtn"
      class="topButton exitButton"
    >
      戻る
    </button>

  </div>

  <div id="editorHint">
    クリック：配置　　ドラッグ：画面移動　　ホイール：ズーム
  </div>

</div>


<!-- =====================================================
     プレイ
===================================================== -->

<div id="playScreen" class="screen">

  <canvas
    id="playCanvas"
    class="gameCanvas"
  ></canvas>

  <div id="playUI">

    <button
      type="button"
      id="playBombBtn"
      class="playControl bombButton"
    >
      💣 爆弾を置く
    </button>

    <button
      type="button"
      id="explodeAllBtn"
      class="playControl explodeButton"
    >
      💥 全爆破
    </button>

    <button
      type="button"
      id="restartBtn"
      class="playControl restartButton"
    >
      ↻ やり直す
    </button>

  </div>

  <div id="playInfo">
    💣 爆弾：<span id="bombCount">0</span>
  </div>

  <button
    type="button"
    id="backPlay"
  >
    ← ステージ選択へ
  </button>

</div>


<script>
"use strict";

const {
  Engine,
  Bodies,
  Body,
  Composite,
  Events,
  Bounds
} = Matter;


/* =====================================================
   設定
===================================================== */

const STORAGE_KEY =
  "slimeCastleMaker_v5";

const FLOOR_Y = 1000;

const EXPLOSION_RADIUS = 110;
const EXPLOSION_FORCE_RADIUS = 150;
const EXPLOSION_FORCE = 0.045;
const EXPLOSION_BLOCK_DAMAGE = 150;

const IMPACT_MASS_CAP = 14;


/* =====================================================
   マテリアル
===================================================== */

const MATERIALS = {

  wood:{
    density:0.0035,
    friction:0.4,
    restitution:0.08,
    hp:2,
    threshold:16
  },

  glass:{
    density:0.0028,
    friction:0.15,
    restitution:0.25,
    hp:1,
    threshold:10
  },

  stone:{
    density:0.008,
    friction:0.6,
    restitution:0.02,
    hp:3,
    threshold:48
  }

};


/* =====================================================
   状態
===================================================== */

let currentScreen = "start";
let currentTool = "wood";
let currentStageId = null;

let editorEngine = null;
let playEngine = null;

let editorRunning = false;
let playRunning = false;

let editorCamera = {
  x:0,
  y:500,
  zoom:0.65
};

let playCamera = {
  x:0,
  y:500,
  zoom:0.75
};

let editorCanvas =
  document.getElementById("editorCanvas");

let editorCtx =
  editorCanvas.getContext("2d");

let playCanvas =
  document.getElementById("playCanvas");

let playCtx =
  playCanvas.getContext("2d");

let editorPointer = {
  down:false,
  moved:false,
  lastX:0,
  lastY:0
};

let playBombMode = false;

let explosionEffects = [];

let multiplyContacts = new Map();


/* =====================================================
   画面切り替え
===================================================== */

function showScreen(name){

  document
    .querySelectorAll(".screen")
    .forEach(screen=>{
      screen.classList.remove("active");
    });

  const target =
    document.getElementById(
      name+"Screen"
    );

  if(target){
    target.classList.add("active");
  }

  currentScreen=name;
}


/* =====================================================
   Engine
===================================================== */

function createEngine(){

  const engine =
    Engine.create();

  engine.gravity.x=0;
  engine.gravity.y=1;
  engine.gravity.scale=0.001;

  engine.positionIterations=8;
  engine.velocityIterations=6;
  engine.constraintIterations=2;

  return engine;
}


/* =====================================================
   床
===================================================== */

function createFloor(engine){

  const floor =
    Bodies.rectangle(
      0,
      FLOOR_Y,
      100000,
      100,
      {
        isStatic:true,
        label:"floor"
      }
    );

  floor.plugin={
    gameType:"floor",
    width:100000,
    height:100
  };

  Composite.add(
    engine.world,
    floor
  );

  return floor;
}


/* =====================================================
   ブロック
===================================================== */

function createBlock(
  engine,
  type,
  x,
  y,
  w=80,
  h=40,
  angle=0
){

  const material =
    MATERIALS[type];

  const body =
    Bodies.rectangle(
      x,
      y,
      w,
      h,
      {
        density:material.density,
        friction:material.friction,
        restitution:material.restitution,
        angle:angle,
        label:"block"
      }
    );

  body.plugin={
    gameType:"block",
    material:type,
    width:w,
    height:h,
    hp:material.hp,
    maxHp:material.hp,
    threshold:material.threshold
  };

  Composite.add(
    engine.world,
    body
  );

  return body;
}


/* =====================================================
   岩盤
===================================================== */

function createBedrock(
  engine,
  x,
  y,
  w=300,
  h=50
){

  const body =
    Bodies.rectangle(
      x,
      y,
      w,
      h,
      {
        isStatic:true,
        angle:0,
        label:"bedrock"
      }
    );

  body.plugin={
    gameType:"bedrock",
    width:w,
    height:h
  };

  /*
   * 岩盤は絶対に回転させない
   */
  Body.setAngle(
    body,
    0
  );

  Body.setAngularVelocity(
    body,
    0
  );

  Body.setVelocity(
    body,
    {
      x:0,
      y:0
    }
  );

  Composite.add(
    engine.world,
    body
  );

  return body;
}


/* =====================================================
   敵
===================================================== */

function createEnemy(
  engine,
  x,
  y,
  r=22
){

  const body =
    Bodies.circle(
      x,
      y,
      r,
      {
        density:0.0025,
        friction:0.5,
        restitution:0.1,
        label:"enemy"
      }
    );

  body.plugin={
    gameType:"enemy",
    radius:r,
    alive:true
  };

  Composite.add(
    engine.world,
    body
  );

  return body;
}


/* =====================================================
   爆弾
===================================================== */

function createBomb(
  engine,
  x,
  y,
  dynamic=true
){

  const body =
    Bodies.circle(
      x,
      y,
      12,
      {
        isStatic:!dynamic,
        density:0.002,
        friction:0.2,
        restitution:0.2,
        label:"bomb"
      }
    );

  body.plugin={
    gameType:"bomb",
    radius:12
  };

  Composite.add(
    engine.world,
    body
  );

  return body;
}


/* =====================================================
   増殖
===================================================== */

function createMultiply(
  engine,
  x,
  y,
  w=70,
  h=45
){

  const body =
    Bodies.rectangle(
      x,
      y,
      w,
      h,
      {
        isStatic:true,
        label:"multiply"
      }
    );

  body.plugin={
    gameType:"multiply",
    width:w,
    height:h
  };

  Composite.add(
    engine.world,
    body
  );

  return body;
}


/* =====================================================
   衝突イベント
===================================================== */

function setupCollisionEvents(engine){

  Events.on(
    engine,
    "collisionStart",
    event=>{

      const multipliers =
        new Set();

      for(
        const pair of event.pairs
      ){

        handleCollision(
          pair.bodyA,
          pair.bodyB,
          engine
        );

        const a=pair.bodyA;
        const b=pair.bodyB;

        const ga =
          a.plugin &&
          a.plugin.gameType;

        const gb =
          b.plugin &&
          b.plugin.gameType;

        if(
          (ga==="bomb" &&
           gb==="multiply") ||
          (ga==="multiply" &&
           gb==="bomb")
        ){

          const bomb =
            ga==="bomb" ? a : b;

          const multiply =
            ga==="multiply" ? a : b;

          if(
            !multiplyContacts.has(
              multiply.id
            )
          ){

            multiplyContacts.set(
              multiply.id,
              new Set()
            );
          }

          const set =
            multiplyContacts.get(
              multiply.id
            );

          if(!set.has(bomb.id)){

            set.add(bomb.id);

            multipliers.add(
              multiply
            );
          }
        }

      }

      for(
        const multiply of multipliers
      ){

        multiplyBombsAtMultiply(
          multiply,
          engine
        );

      }

    }
  );


  Events.on(
    engine,
    "collisionEnd",
    event=>{

      for(
        const pair of event.pairs
      ){

        const a=pair.bodyA;
        const b=pair.bodyB;

        const ga =
          a.plugin &&
          a.plugin.gameType;

        const gb =
          b.plugin &&
          b.plugin.gameType;

        if(
          (ga==="bomb" &&
           gb==="multiply") ||
          (ga==="multiply" &&
           gb==="bomb")
        ){

          const bomb =
            ga==="bomb" ? a : b;

          const multiply =
            ga==="multiply" ? a : b;

          const set =
            multiplyContacts.get(
              multiply.id
            );

          if(set){

            set.delete(
              bomb.id
            );

            if(set.size===0){

              multiplyContacts.delete(
                multiply.id
              );

            }
          }
        }

      }

    }
  );

}


/* =====================================================
   衝突処理
===================================================== */

function handleCollision(
  a,
  b,
  engine
){

  const ga =
    a.plugin &&
    a.plugin.gameType;

  const gb =
    b.plugin &&
    b.plugin.gameType;

  /*
   * 岩盤は壊れない
   */
  if(
    ga==="bedrock" ||
    gb==="bedrock"
  ){
    return;
  }

  if(
    ga==="enemy" &&
    gb==="block"
  ){

    enemyHitBlock(
      a,
      b
    );
  }

  if(
    gb==="enemy" &&
    ga==="block"
  ){

    enemyHitBlock(
      b,
      a
    );
  }

  if(
    ga==="block" &&
    gb==="block"
  ){

    blockHitBlock(
      a,
      b
    );
  }

  if(
    ga==="bomb" &&
    gb==="enemy"
  ){

    killEnemy(
      b,
      engine
    );
  }

  if(
    gb==="bomb" &&
    ga==="enemy"
  ){

    killEnemy(
      a,
      engine
    );
  }

}


/* =====================================================
   増殖
===================================================== */

function isBombTouchingMultiply(
  bomb,
  multiply
){

  const dx =
    bomb.position.x -
    multiply.position.x;

  const dy =
    bomb.position.y -
    multiply.position.y;

  const distance =
    Math.sqrt(
      dx*dx+
      dy*dy
    );

  return distance < 65;
}


function multiplyBombsAtMultiply(
  multiply,
  engine
){

  const bombs =
    Composite
      .allBodies(engine.world)
      .filter(body=>
        body.plugin &&
        body.plugin.gameType==="bomb" &&
        isBombTouchingMultiply(
          body,
          multiply
        )
      );

  if(
    bombs.length===0
  ){
    return;
  }

  bombs.forEach(
    (bomb,index)=>{

      let dx =
        bomb.position.x -
        multiply.position.x;

      let dy =
        bomb.position.y -
        multiply.position.y;

      let length =
        Math.sqrt(
          dx*dx+
          dy*dy
        );

      if(length<0.01){

        const angle =
          index*
          Math.PI*2/
          Math.max(
            1,
            bombs.length
          );

        dx=Math.cos(angle);
        dy=Math.sin(angle);
        length=1;
      }

      dx/=length;
      dy/=length;

      const newBomb =
        createBomb(
          engine,
          bomb.position.x+dx*75,
          bomb.position.y+dy*75,
          true
        );

      Body.setVelocity(
        newBomb,
        {
          x:bomb.velocity.x,
          y:bomb.velocity.y
        }
      );

    }
  );

}


/* =====================================================
   ブロックダメージ
===================================================== */

function damageBlock(
  block,
  amount
){

  if(
    !block.plugin ||
    block.plugin.gameType!=="block"
  ){
    return;
  }

  block.plugin.hp -= amount;

  if(
    block.plugin.hp<=0
  ){

    const engine =
      currentScreen==="editor"
        ? editorEngine
        : playEngine;

    if(engine){

      Composite.remove(
        engine.world,
        block
      );

    }

  }

}


function enemyHitBlock(
  enemy,
  block
){

  const dx =
    enemy.velocity.x -
    block.velocity.x;

  const dy =
    enemy.velocity.y -
    block.velocity.y;

  const speed =
    Math.sqrt(
      dx*dx+
      dy*dy
    );

  const mass =
    Math.min(
      IMPACT_MASS_CAP,
      enemy.mass
    );

  if(
    speed*mass >=
    block.plugin.threshold
  ){

    damageBlock(
      block,
      1
    );

  }

}


function blockHitBlock(
  a,
  b
){

  const dx =
    a.velocity.x -
    b.velocity.x;

  const dy =
    a.velocity.y -
    b.velocity.y;

  const speed =
    Math.sqrt(
      dx*dx+
      dy*dy
    );

  if(speed<0.01){
    return;
  }

  damageBlockByImpact(
    a,
    speed,
    b.mass
  );

  damageBlockByImpact(
    b,
    speed,
    a.mass
  );

}


function damageBlockByImpact(
  block,
  speed,
  otherMass
){

  if(
    !block.plugin ||
    block.plugin.gameType!=="block"
  ){
    return;
  }

  const mass =
    Math.min(
      IMPACT_MASS_CAP,
      otherMass||1
    );

  if(
    speed*mass >=
    block.plugin.threshold
  ){

    damageBlock(
      block,
      1
    );

  }

}


/* =====================================================
   敵を倒す
===================================================== */

function killEnemy(
  enemy,
  engine
){

  if(
    !enemy.plugin ||
    !enemy.plugin.alive
  ){
    return;
  }

  enemy.plugin.alive=false;

  Composite.remove(
    engine.world,
    enemy
  );

}


/* =====================================================
   爆発
===================================================== */

function explodeAt(
  engine,
  x,
  y
){

  explosionEffects.push({
    x:x,
    y:y,
    life:25
  });

  const bodies =
    Composite.allBodies(
      engine.world
    );

  for(
    const body of bodies
  ){

    const p=body.plugin;

    if(!p){
      continue;
    }

    /*
     * 岩盤・床など静的なものには
     * 爆発の力を加えない
     */
    if(
      body.isStatic ||
      p.gameType==="bedrock" ||
      p.gameType==="floor"
    ){
      continue;
    }

    const dx =
      body.position.x-x;

    const dy =
      body.position.y-y;

    const distance =
      Math.sqrt(
        dx*dx+
        dy*dy
      );

    if(
      distance >
      EXPLOSION_FORCE_RADIUS
    ){
      continue;
    }

    const safeDistance =
      Math.max(
        distance,
        10
      );

    const nx =
      dx/safeDistance;

    const ny =
      dy/safeDistance;

    const power =
      1-
      distance/
      EXPLOSION_FORCE_RADIUS;

    Body.applyForce(
      body,
      body.position,
      {
        x:
          nx*
          EXPLOSION_FORCE*
          power*
          body.mass,

        y:
          ny*
          EXPLOSION_FORCE*
          power*
          body.mass
      }
    );

    if(
      p.gameType==="block" &&
      distance<=EXPLOSION_RADIUS
    ){

      damageBlock(
        body,
        EXPLOSION_BLOCK_DAMAGE
      );

    }

    if(
      p.gameType==="enemy" &&
      distance<=EXPLOSION_RADIUS
    ){

      killEnemy(
        body,
        engine
      );

    }

  }

}


function explodeAllBombs(
  engine
){

  const bombs =
    Composite
      .allBodies(engine.world)
      .filter(body=>
        body.plugin &&
        body.plugin.gameType==="bomb"
      );

  bombs.forEach(
    bomb=>{

      explodeAt(
        engine,
        bomb.position.x,
        bomb.position.y
      );

      Composite.remove(
        engine.world,
        bomb
      );

    }
  );

}


/* =====================================================
   座標
===================================================== */

function screenToWorld(
  canvas,
  camera,
  sx,
  sy
){

  return {
    x:
      (sx-canvas.width/2)/
      camera.zoom+
      camera.x,

    y:
      (sy-canvas.height/2)/
      camera.zoom+
      camera.y
  };

}


function worldToScreen(
  canvas,
  camera,
  x,
  y
){

  return {
    x:
      (x-camera.x)*
      camera.zoom+
      canvas.width/2,

    y:
      (y-camera.y)*
      camera.zoom+
      canvas.height/2
  };

}


/* =====================================================
   Canvasサイズ
===================================================== */

function resizeCanvas(
  canvas
){

  const dpr =
    window.devicePixelRatio||1;

  canvas.width =
    innerWidth*dpr;

  canvas.height =
    innerHeight*dpr;

  canvas.style.width =
    innerWidth+"px";

  canvas.style.height =
    innerHeight+"px";

}


/* =====================================================
   グリッド
===================================================== */

function drawGrid(
  ctx,
  canvas,
  camera
){

  const step=100;

  const left =
    camera.x-
    canvas.width/
    camera.zoom;

  const right =
    camera.x+
    canvas.width/
    camera.zoom;

  const top =
    camera.y-
    canvas.height/
    camera.zoom;

  const bottom =
    camera.y+
    canvas.height/
    camera.zoom;

  ctx.save();

  ctx.strokeStyle=
    "rgba(90,110,60,.12)";

  ctx.lineWidth=1;

  for(
    let x=
      Math.floor(left/step)*
      step;
    x<right;
    x+=step
  ){

    const s=
      worldToScreen(
        canvas,
        camera,
        x,
        0
      );

    ctx.beginPath();
    ctx.moveTo(s.x,0);
    ctx.lineTo(
      s.x,
      canvas.height
    );
    ctx.stroke();

  }

  for(
    let y=
      Math.floor(top/step)*
      step;
    y<bottom;
    y+=step
  ){

    const s=
      worldToScreen(
        canvas,
        camera,
        0,
        y
      );

    ctx.beginPath();
    ctx.moveTo(
      0,
      s.y
    );

    ctx.lineTo(
      canvas.width,
      s.y
    );

    ctx.stroke();

  }

  ctx.restore();

}


/* =====================================================
   床
===================================================== */

function drawFloor(
  ctx,
  canvas,
  camera,
  body
){

  const s=
    worldToScreen(
      canvas,
      camera,
      body.position.x,
      body.position.y
    );

  const w=
    body.plugin.width*
    camera.zoom;

  const h=
    body.plugin.height*
    camera.zoom;

  ctx.save();

  ctx.translate(
    s.x,
    s.y
  );

  ctx.fillStyle="#789052";

  ctx.fillRect(
    -w/2,
    -h/2,
    w,
    h
  );

  ctx.fillStyle=
    "rgba(255,255,255,.16)";

  ctx.fillRect(
    -w/2,
    -h/2,
    w,
    9*camera.zoom
  );

  ctx.restore();

}


/* =====================================================
   ブロック
===================================================== */

function drawBlock(
  ctx,
  canvas,
  camera,
  body
){

  const s=
    worldToScreen(
      canvas,
      camera,
      body.position.x,
      body.position.y
    );

  const w=
    body.plugin.width*
    camera.zoom;

  const h=
    body.plugin.height*
    camera.zoom;

  ctx.save();

  ctx.translate(
    s.x,
    s.y
  );

  ctx.rotate(
    body.angle
  );

  let fill;
  let stroke;

  if(
    body.plugin.material==="wood"
  ){

    fill="#b97839";
    stroke="#7f4c20";

  }
  else if(
    body.plugin.material==="glass"
  ){

    fill="rgba(119,205,237,.55)";
    stroke="#54a5c6";

  }
  else{

    fill="#77736c";
    stroke="#4f4c47";

  }

  ctx.fillStyle=fill;
  ctx.strokeStyle=stroke;
  ctx.lineWidth=3;

  ctx.fillRect(
    -w/2,
    -h/2,
    w,
    h
  );

  ctx.strokeRect(
    -w/2,
    -h/2,
    w,
    h
  );

  /*
   * 木目
   */
  if(
    body.plugin.material==="wood"
  ){

    ctx.strokeStyle=
      "rgba(80,40,15,.35)";

    ctx.lineWidth=1.5;

    for(
      let i=-2;
      i<=2;
      i++
    ){

      ctx.beginPath();

      ctx.moveTo(
        -w*.4,
        i*h*.16
      );

      ctx.quadraticCurveTo(
        0,
        i*h*.08,
        w*.4,
        i*h*.16
      );

      ctx.stroke();

    }

  }

  /*
   * ガラスの反射
   */
  if(
    body.plugin.material==="glass"
  ){

    ctx.strokeStyle=
      "rgba(255,255,255,.65)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
      -w*.35,
      h*.3
    );

    ctx.lineTo(
      w*.2,
      -h*.3
    );

    ctx.stroke();

  }

  if(
    body.plugin.maxHp &&
    camera.zoom>.3
  ){

    ctx.fillStyle="#fff";

    ctx.font=
      Math.max(
        10,
        14*camera.zoom
      )+
      "px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
      body.plugin.hp,
      0,
      0
    );

  }

  ctx.restore();

}


/* =====================================================
   岩盤
===================================================== */

function drawBedrock(
  ctx,
  canvas,
  camera,
  body
){

  const s=
    worldToScreen(
      canvas,
      camera,
      body.position.x,
      body.position.y
    );

  const w=
    body.plugin.width*
    camera.zoom;

  const h=
    body.plugin.height*
    camera.zoom;

  ctx.save();

  /*
   * 岩盤は描画時にも絶対に回転させない
   */
  ctx.translate(
    s.x,
    s.y
  );

  ctx.fillStyle="#3f403d";
  ctx.strokeStyle="#252623";
  ctx.lineWidth=4;

  ctx.fillRect(
    -w/2,
    -h/2,
    w,
    h
  );

  ctx.strokeRect(
    -w/2,
    -h/2,
    w,
    h
  );

  ctx.strokeStyle="#60615b";
  ctx.lineWidth=2;

  for(
    let i=-2;
    i<=2;
    i++
  ){

    ctx.beginPath();

    ctx.moveTo(
      i*w*.17-w*.05,
      -h*.28
    );

    ctx.lineTo(
      i*w*.17+w*.04,
      h*.3
    );

    ctx.stroke();

  }

  ctx.fillStyle="#e3e0d1";

  ctx.font=
    Math.max(
      11,
      16*camera.zoom
    )+
    "px Arial";

  ctx.fontWeight="bold";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    "岩盤",
    0,
    0
  );

  ctx.restore();

}


/* =====================================================
   敵
===================================================== */

function drawEnemy(
  ctx,
  canvas,
  camera,
  body
){

  const s=
    worldToScreen(
      canvas,
      camera,
      body.position.x,
      body.position.y
    );

  const r=
    body.plugin.radius*
    camera.zoom;

  ctx.save();

  ctx.fillStyle="#72c84f";
  ctx.strokeStyle="#477e32";
  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.arc(
    s.x,
    s.y,
    r,
    0,
    Math.PI*2
  );

  ctx.fill();
  ctx.stroke();

  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.arc(
    s.x-r*.32,
    s.y-r*.15,
    r*.22,
    0,
    Math.PI*2
  );

  ctx.arc(
    s.x+r*.32,
    s.y-r*.15,
    r*.22,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#333";

  ctx.beginPath();

  ctx.arc(
    s.x-r*.28,
    s.y-r*.13,
    r*.09,
    0,
    Math.PI*2
  );

  ctx.arc(
    s.x+r*.28,
    s.y-r*.13,
    r*.09,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

}


/* =====================================================
   爆弾
===================================================== */

function drawBomb(
  ctx,
  canvas,
  camera,
  body
){

  const s=
    worldToScreen(
      canvas,
      camera,
      body.position.x,
      body.position.y
    );

  const r=
    12*
    camera.zoom;

  ctx.save();

  ctx.fillStyle="#252525";
  ctx.strokeStyle="#111";
  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.arc(
    s.x,
    s.y,
    r,
    0,
    Math.PI*2
  );

  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle="#ef8d2e";
  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(
    s.x+r*.45,
    s.y-r*.7
  );

  ctx.lineTo(
    s.x+r*.9,
    s.y-r*1.15
  );

  ctx.stroke();

  ctx.restore();

}

function drawMultiply(

){

/* =====================================================
   Body描画
===================================================== */

function drawBody(
  ctx,
  canvas,
  camera,
  body
){

  const type =
    body.plugin &&
    body.plugin.gameType;

  if(type==="floor"){

    drawFloor(
      ctx,
      canvas,
      camera,
      body
    );

  }
  else if(type==="block"){

    drawBlock(
      ctx,
      canvas,
      camera,
      body
    );

  }
  else if(type==="bedrock"){

    drawBedrock(
      ctx,
      canvas,
      camera,
      body
    );

  }
  else if(type==="enemy"){

    drawEnemy(
      ctx,
      canvas,
      camera,
      body
    );

  }
  else if(type==="bomb"){

    drawBomb(
      ctx,
      canvas,
      camera,
      body
    );

  }
  else if(type==="multiply"){

    drawMultiply(
      ctx,
      canvas,
      camera,
      body
    );

  }

}


/* =====================================================
   爆発エフェクト
===================================================== */

function drawExplosions(
  ctx,
  canvas,
  camera
){

  for(
    let i=
      explosionEffects.length-1;
    i>=0;
    i--
  ){

    const effect=
      explosionEffects[i];

    const s=
      worldToScreen(
        canvas,
        camera,
        effect.x,
        effect.y
      );

    const progress=
      1-
      effect.life/25;

    const radius=
      EXPLOSION_RADIUS*
      progress*
      camera.zoom;

    ctx.save();

    ctx.globalAlpha=
      effect.life/25;

    ctx.strokeStyle="#ef8d2e";
    ctx.lineWidth=
      9*camera.zoom;

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      radius,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.restore();

    effect.life--;

    if(
      effect.life<=0
    ){

      explosionEffects.splice(
        i,
        1
      );

    }

  }

}

/* =====================================================
   ステージ保存
===================================================== */

function serializeStage(
  engine
){

  const objects=[];

  for(
    const body of
    Composite.allBodies(
      engine.world
    )
  ){

    const p=body.plugin;

    if(!p){
      continue;
    }

    if(
      p.gameType==="floor" ||
      p.gameType==="bomb"
    ){
      continue;
    }

    if(
      p.gameType==="block"
    ){

      objects.push({
        type:p.material,
        x:body.position.x,
        y:body.position.y,
        w:p.width,
        h:p.height,
        angle:body.angle
      });

    }

    else if(
      p.gameType==="bedrock"
    ){

      objects.push({
        type:"bedrock",
        x:body.position.x,
        y:body.position.y,
        w:p.width,
        h:p.height
      });

    }

    else if(
      p.gameType==="enemy"
    ){

      objects.push({
        type:"enemy",
        x:body.position.x,
        y:body.position.y,
        r:p.radius
      });

    }

    else if(
      p.gameType==="multiply"
    ){

      objects.push({
        type:"multiply",
        x:body.position.x,
        y:body.position.y,
        w:p.width,
        h:p.height
      });

    }

  }

  return objects;

}


/* =====================================================
   ロード
===================================================== */

function loadObjectsIntoEngine(
  engine,
  objects
){

  for(
    const object of objects
  ){

    if(
      object.type==="wood" ||
      object.type==="glass" ||
      object.type==="stone"
    ){

      createBlock(
        engine,
        object.type,
        object.x,
        object.y,
        object.w||80,
        object.h||40,
        object.angle||0
      );

    }

    else if(
      object.type==="bedrock"
    ){

      /*
       * 岩盤は保存された角度を一切使用しない
       */
      createBedrock(
        engine,
        object.x,
        object.y,
        object.w||300,
        object.h||50
      );

    }

    else if(
      object.type==="enemy"
    ){

      createEnemy(
        engine,
        object.x,
        object.y,
        object.r||22
      );

    }

    else if(
      object.type==="multiply"
    ){

      createMultiply(
        engine,
        object.x,
        object.y,
        object.w||70,
        object.h||45
      );

    }

  }

}

/* =====================================================
   保存
===================================================== */

function saveCurrentStage(){

  if(!editorEngine){
    return;
  }

  const name=
    prompt(
      "ステージ名を入力してください",
      "自作ステージ"
    );

  if(name===null){
    return;
  }

  const stages=
    getStages();

  const stage={
    id:currentStageId,
    name:
      name.trim()||
      "自作ステージ",
    objects:
      serializeStage(
        editorEngine
      ),
    updatedAt:
      Date.now()
  };

  const index=
    stages.findIndex(
      s=>s.id===currentStageId
    );

  if(index>=0){
    stages[index]=stage;
  }else{
    stages.push(stage);
  }

  saveStages(
    stages
  );

  alert(
    "ステージを保存しました！"
  );

}

        );

        );

        );

      title.textContent=

        );

      info.appendChild(

      );

      const buttons=

          "div"
        );

        document.createElement(
          "button"
        );

      play.type="button";
      play.textContent=
        "▶ 遊ぶ";
      play.className=
        "stageButton stagePlay";

      play.onclick=()=>{
        startPlay(stage);
      };

      const edit=
        document.createElement(
          "button"
        );

      edit.type="button";
      edit.textContent=
        "🔨 編集";
      edit.className=
        "stageButton stageEdit";

      edit.onclick=()=>{
        editStage(stage);
      };

      const del=
        document.createElement(
          "button"
        );

      del.type="button";
      del.textContent=
        "削除";
      del.className=

      del.onclick=()=>{

        if(
          confirm(
            "このステージを削除しますか？"

            getStages().filter(

      buttons.appendChild(play);
      buttons.appendChild(edit);
      buttons.appendChild(del);

      card.appendChild(info);
      card.appendChild(buttons);

/* =====================================================
   爆弾数
===================================================== */

function updateBombCount(){

  if(!playEngine){
    return;
  }

  const count=
    Composite
      .allBodies(playEngine.world)
      .filter(
        body=>
          body.plugin &&
          body.plugin.gameType==="bomb"
      )
      .length;

  document
    .getElementById(
      "bombCount"
    )
    .textContent=count;

}


/* =====================================================
   エディター配置
===================================================== */

function placeEditorObject(
  x,
  y
){

  if(!editorEngine){
    return;
  }

  switch(currentTool){

    case "wood":

      createBlock(
        editorEngine,
        "wood",
        x,
        y
      );

      break;

    case "glass":

      createBlock(
        editorEngine,
        "glass",
        x,
        y
      );

      break;

    case "stone":

      createBlock(
        editorEngine,
        "stone",
        x,
        y
      );

      break;

    case "bedrock":

      createBedrock(
        editorEngine,
        x,
        y
      );

      break;

    case "enemy":

      createEnemy(
        editorEngine,
        x,
        y
      );

      break;

    case "bomb":

      createBomb(
        editorEngine,
        x,
        y,
        true
      );

      break;

    case "multiply":

      createMultiply(
        editorEngine,
        x,
        y
      );

      break;

    case "erase":

      eraseAt(
        editorEngine,
        x,
        y
      );

      break;

  }

}


/* =====================================================
   消去
===================================================== */

function eraseAt(
  engine,
  x,
  y
){

  const bodies=
    Composite.allBodies(
      engine.world
    );

  for(
    let i=bodies.length-1;
    i>=0;
    i--
  ){

    const body=
      bodies[i];

    if(
      !body.plugin ||
      body.plugin.gameType==="floor"
    ){
      continue;
    }

    if(
      Bounds.contains(
        body.bounds,
        {
          x:x,
          y:y
        }
      )
    ){

      Composite.remove(
        engine.world,
        body
      );

      multiplyContacts.delete(
        body.id
      );

      return;
    }

  }

}


/* =====================================================
   エディターマウス
===================================================== */

function getPointerPosition(
  canvas,
  event
){

  const rect=
    canvas.getBoundingClientRect();

  return {
    x:
      event.clientX-
      rect.left,

    y:
      event.clientY-
      rect.top
  };

}


editorCanvas.addEventListener(
  "pointerdown",
  event=>{

    editorPointer.down=true;
    editorPointer.moved=false;

    editorPointer.lastX=
      event.clientX;

    editorPointer.lastY=
      event.clientY;

    editorCanvas.setPointerCapture(
      event.pointerId
    );

  }
);


editorCanvas.addEventListener(
  "pointermove",
  event=>{

    if(!editorPointer.down){
      return;
    }

    const dx=
      event.clientX-
      editorPointer.lastX;

    const dy=
      event.clientY-
      editorPointer.lastY;

    if(
      Math.abs(dx)>3 ||
      Math.abs(dy)>3
    ){

      editorPointer.moved=true;

    }

    if(
      currentTool==="move"
    ){

      editorCamera.x -=
        dx/
        editorCamera.zoom;

      editorCamera.y -=
        dy/
        editorCamera.zoom;

    }

    editorPointer.lastX=
      event.clientX;

    editorPointer.lastY=
      event.clientY;

  }
);


editorCanvas.addEventListener(
  "pointerup",
  event=>{

    if(
      !editorPointer.down
    ){
      return;
    }

    editorPointer.down=false;

    if(
      !editorPointer.moved &&
      currentTool!=="move"
    ){

      const pointer=
        getPointerPosition(
          editorCanvas,
          event
        );

      const world=
        screenToWorld(
          editorCanvas,
          editorCamera,
          pointer.x,
          pointer.y
        );

      placeEditorObject(
        world.x,
        world.y
      );

    }

  }
);


editorCanvas.addEventListener(
  "wheel",
  event=>{

    event.preventDefault();

    const oldZoom=
      editorCamera.zoom;

    const factor=
      event.deltaY<0
        ? 1.1
        : .9;

    const rect=
      editorCanvas.getBoundingClientRect();

    const sx=
      event.clientX-
      rect.left;

    const sy=
      event.clientY-
      rect.top;

    const before=
      screenToWorld(
        editorCanvas,
        editorCamera,
        sx,
        sy
      );

    editorCamera.zoom=
      Math.max(
        .15,
        Math.min(
          3,
          oldZoom*factor
        )
      );

    const after=
      screenToWorld(
        editorCanvas,
        editorCamera,
        sx,
        sy
      );

    editorCamera.x +=
      before.x-
      after.x;

    editorCamera.y +=
      before.y-
      after.y;

  },
  {
    passive:false
  }
);


/* =====================================================
   プレイ中の爆弾配置
===================================================== */

playCanvas.addEventListener(
  "pointerdown",
  event=>{

    if(!playBombMode){
      return;
    }

    const rect=
      playCanvas.getBoundingClientRect();

    const sx=
      event.clientX-
      rect.left;

    const sy=
      event.clientY-
      rect.top;

    const world=
      screenToWorld(
        playCanvas,
        playCamera,
        sx,
        sy
      );

    createBomb(
      playEngine,
      world.x,
      world.y,
      false
    );

    updateBombCount();

  }
);

/* =====================================================
   初期化
===================================================== */

function init(){

  resizeCanvas(
    editorCanvas
  );

  resizeCanvas(
    playCanvas
  );

  const stages=
    getStages();

  if(
    !stages.some(
      s=>s.id==="sample_stage"
    )
  ){

    stages.unshift(
      createSampleStage()
    );

    saveStages(
      stages
    );

  }

}
