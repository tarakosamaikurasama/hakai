<!DOCTYPE html>
<html lang="ja">
<head>

<title>線を二等分する方法</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:#fff7ec;
  color:#333;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

.hidden{
  display:none!important;
}

.screen{
  width:100%;
  height:100%;
}

/* タイトル */

#titleScreen{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow:auto;
}

.title-card{
  width:min(700px,100%);
  padding:40px 25px;
  border-radius:25px;
  background:#fff;
  box-shadow:0 10px 35px rgba(100,60,20,.15);
  text-align:center;
}

.title-card h1{
  margin:0 0 10px;
  font-size:clamp(28px,7vw,48px);
  line-height:1.2;
}

.title-card p{
  margin:0 0 28px;
  color:#888;
}

.menu-buttons{
  display:flex;
  flex-direction:column;
  gap:15px;
  width:min(430px,100%);
  margin:auto;
}

.primary-btn{
  min-height:54px;
  padding:11px 22px;
  border:0;
  border-radius:18px;
  color:#fff;
  font-weight:800;
  background:linear-gradient(#ffad4b,#e66d16);
  box-shadow:

.primary-btn:active{

.secondary-btn{
  min-height:48px;
  padding:9px 19px;
  border:2px solid #eaded2;
  border-radius:16px;
  color:#555;
  background:#fff;
  font-weight:800;
  box-shadow:0 4px 12px rgba(80,50,20,.08);
}

/* ステージ選択 */

#stageSelectScreen{
  padding:20px;
  overflow:auto;
}

.stage-select-card{
  width:min(850px,100%);
  margin:auto;
  padding:25px;
  border-radius:24px;
  background:#fff;
  box-shadow:0 10px 35px rgba(100,60,20,.15);
}

.stage-select-card h2{
  margin-top:0;
}

#stageList{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:12px;
  margin:20px 0;
}

.stage-item{
  padding:15px;
  border-radius:17px;
  background:#fff8f0;
  border:2px solid #eee0d1;
}

.stage-item strong{
  display:block;
  margin-bottom:10px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.stage-item button{
  width:100%;
}

/* ゲーム */

#gameScreen{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#f5eadc;
  isolation:isolate;
}

#gameCanvas{
  position:absolute;
  left:0;
  top:0;
  z-index:1;
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

/* 操作バー */

#editorBar,
#playBar{
  position:absolute;
  left:50%;
  top:9px;
  transform:translateX(-50%);
  z-index:1000;
  width:min(1120px,calc(100% - 14px));
  display:flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap;
  padding:8px;
  border-radius:19px;
  background:rgba(255,255,255,.97);
  box-shadow:0 7px 25px rgba(70,45,20,.18);
  pointer-events:auto;
}

.tool-btn{
  position:relative;
  z-index:1001;
  min-height:39px;
  padding:5px 9px;
  border:2px solid #eaded2;

  background:#fff;
  color:#4d4239;

}

.tool-btn.active{
  color:#fff;

}

.tool-btn.danger{
  color:#fff;

}

.tool-label{
  color:#8b7764;
  font-size:12px;

}

.factor-box{
  display:flex;
  align-items:center;
  gap:4px;

}

#multiplyFactor{

}

/* ヒント */

#hint{

  border-radius:13px;
  background:rgba(255,255,255,.92);
  color:#725f4e;
  font-size:12px;
  font-weight:700;

/* 保存 */

#stageNameBox{

<script>
"use strict";

const Engine=Matter.Engine;
const World=Matter.World;
const Bodies=Matter.Bodies;
const Body=Matter.Body;
const Composite=Matter.Composite;
const Events=Matter.Events;

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

const titleScreen=document.getElementById("titleScreen");
const stageSelectScreen=document.getElementById("stageSelectScreen");
const gameScreen=document.getElementById("gameScreen");
const editorBar=document.getElementById("editorBar");
const playBar=document.getElementById("playBar");
const hint=document.getElementById("hint");
const stageNameBox=document.getElementById("stageNameBox");
const stageNameInput=document.getElementById("stageName");
const multiplyFactorInput=document.getElementById("multiplyFactor");

const SAVE_KEY="slimeCastleMaker_v13";

const FLOOR_HEIGHT=50;
const MIN_SIZE=20;

let engine=null;
let floorBody=null;

let mode=null;
let currentTool=null;
let selectedBody=null;
let pointerData=null;

let objects=[];
let explosions=[];

let canvasWidth=1;
let canvasHeight=1;

let animationFrame=null;
let lastTime=performance.now();

let explosionQueue=[];
let insideMultipliers=new WeakMap();


function newId(){

  if(
    window.crypto &&
    typeof window.crypto.randomUUID==="function"
  ){
    return window.crypto.randomUUID();
  }

  return Date.now().toString(36)+Math.random().toString(36).slice(2);
}


/* =========================
   Canvas
========================= */

function resizeCanvas(){

  if(gameScreen.classList.contains("hidden")){
    return;
  }

  const rect=gameScreen.getBoundingClientRect();

  const width=Math.max(1,Math.floor(rect.width));
  const height=Math.max(1,Math.floor(rect.height));

  canvasWidth=width;
  canvasHeight=height;

  const dpr=Math.min(window.devicePixelRatio||1,2);

  canvas.width=Math.floor(width*dpr);
  canvas.height=Math.floor(height*dpr);

  canvas.style.width=width+"px";
  canvas.style.height=height+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);

  rebuildFloor();

  render(performance.now());
}


window.addEventListener("resize",resizeCanvas);


/* =========================
   床
   必ず物理床を作り直す
========================= */

function rebuildFloor(){

  if(!engine){
    return;
  }

  if(floorBody){
    World.remove(engine.world,floorBody);
  }

  floorBody=Bodies.rectangle(
    canvasWidth/2,
    canvasHeight-FLOOR_HEIGHT/2,
    canvasWidth+100,
    FLOOR_HEIGHT,
    {
      label:"groundBedrock",
      isStatic:true,
      isGroundBedrock:true,
      restitution:0,
      friction:1.2,
      frictionStatic:3,
      density:1,
      slop:.01
    }
  );

  World.add(
    engine.world,
    floorBody
  );
}


/* =========================
   Engine
========================= */

function createEngine(){

  engine=Engine.create({
    enableSleeping:false
  });

  engine.gravity.x=0;
  engine.gravity.y=1;

  engine.positionIterations=12;
  engine.velocityIterations=10;
  engine.constraintIterations=5;

  rebuildFloor();

  installEngineEvents();
}


function stopEngine(){

  if(engine){

    Composite.clear(
      engine.world,
      false,
      true
    );

    engine=null;
  }

  floorBody=null;
  objects=[];
  selectedBody=null;
  pointerData=null;
  explosions=[];
  explosionQueue=[];
  insideMultipliers=new WeakMap();
}


function wakeBody(body){

  if(!body){
    return;
  }

  Body.setSleeping(body,false);

  body.isSleeping=false;
}


/* =========================
   オブジェクト作成
========================= */

function createObject(
  type,
  x,
  y,
  w=70,
  h=50,
  angle=0,
  extra={}
){

  if(!engine){
    return null;
  }

  const options={
    label:type,
    restitution:0,
    friction:1,
    frictionStatic:2,
    frictionAir:.025,
    density:.001,
    slop:.01
  };

  if(type==="multiply"){
    options.isSensor=true;
  }

  if(type==="bedrock"){
    options.isStatic=true;
  }

  let body;

  if(type==="slime"){

    const radius=Math.max(10,Math.min(w,h)/2);

    body=Bodies.circle(
      x,
      y,
      radius,
      options
    );

    body.baseW=radius*2;
    body.baseH=radius*2;

  }else{

    body=Bodies.rectangle(
      x,
      y,
      Math.max(MIN_SIZE,w),
      Math.max(MIN_SIZE,h),
      options
    );

    body.baseW=Math.max(MIN_SIZE,w);
    body.baseH=Math.max(MIN_SIZE,h);
  }

  Body.setAngle(body,angle);

  body.gameId=newId();

  body.maxHp=100;
  body.hp=100;

  if(type==="wood"){
    body.maxHp=80;
    body.hp=80;
  }

  if(type==="glass"){
    body.maxHp=40;
    body.hp=40;
  }

  if(type==="stone"){
    body.maxHp=150;
    body.hp=150;
  }

  if(type==="slime"){
    body.maxHp=70;
    body.hp=70;
  }

  if(type==="bomb"){
    body.maxHp=1;
    body.hp=1;
    body.frictionAir=.015;
  }

  if(type==="multiply"){

    body.maxHp=Infinity;
    body.hp=Infinity;

    body.multiplyFactor=Math.max(
      1,
      Math.min(
        20,
        Math.floor(
          Number(extra.multiplyFactor)||2
        )
      )
    );
  }

  if(type==="bedrock"){

    body.maxHp=Infinity;
    body.hp=Infinity;
  }

  World.add(
    engine.world,
    body
  );

  objects.push(body);

  wakeBody(body);

  Body.setVelocity(
    body,
    {
      x:0,
      y:0
    }
  );

  Body.setAngularVelocity(
    body,
    0
  );

  return body;
}


/* =========================
   データ
========================= */

function bodyToData(body){

  return {
    id:body.gameId,
    type:body.label,
    x:body.position.x,
    y:body.position.y,
    w:body.baseW,
    h:body.baseH,
    angle:body.angle,
    multiplyFactor:
      body.label==="multiply"
      ? body.multiplyFactor
      : undefined
  };
}


function loadData(data){

  clearObjects();

  if(!Array.isArray(data)){
    return;
  }

  for(const item of data){

    const body=createObject(
      item.type,
      Number(item.x)||canvasWidth/2,
      Number(item.y)||100,
      Number(item.w)||70,
      Number(item.h)||50,
      Number(item.angle)||0,
      {
        multiplyFactor:
          Number(item.multiplyFactor)||2
      }
    );

    if(body && item.id){
      body.gameId=item.id;
    }
  }
}


/* =========================
   ゲーム開始
========================= */

function openGame(newMode,data=[]){

  titleScreen.classList.add("hidden");
  stageSelectScreen.classList.add("hidden");

  gameScreen.classList.remove("hidden");

  editorBar.classList.add("hidden");
  playBar.classList.add("hidden");

  mode=newMode;

  stopEngine();

  resizeCanvas();

  createEngine();

  resizeCanvas();

  loadData(data);

  if(mode==="editor"){

    editorBar.classList.remove("hidden");

    hint.textContent=
      "配置ボタンを選んで何個でも配置できます。選択したブロックは移動・回転・サイズ変更できます。";

  }else{

    playBar.classList.remove("hidden");

    hint.textContent=
      "画面をタップして爆弾を置き、「全爆破」で爆発します。";
  }

  render(performance.now());
}


function backToTitle(){

  stageNameBox.classList.add("hidden");

  stopEngine();

  mode=null;

  gameScreen.classList.add("hidden");
  stageSelectScreen.classList.add("hidden");
  titleScreen.classList.remove("hidden");
}


/* =========================
   メニュー
========================= */

document.getElementById("makeStageBtn").addEventListener(
  "click",
  ()=>{
    openGame("editor",[]);
  }
);


document.getElementById("playStageBtn").addEventListener(
  "click",
  showStageList
);


document.getElementById("backFromSelectBtn").addEventListener(
  "click",
  ()=>{
    stageSelectScreen.classList.add("hidden");
    titleScreen.classList.remove("hidden");
  }
);


document.getElementById("backEditorBtn").addEventListener(
  "click",
  backToTitle
);


document.getElementById("backPlayBtn").addEventListener(
  "click",
  backToTitle
);


/* =========================
   ツール
========================= */

document.querySelectorAll("[data-tool]").forEach(
  button=>{

    button.addEventListener(
      "click",
      event=>{

        event.stopPropagation();

        currentTool=button.dataset.tool;

        document.querySelectorAll("[data-tool]").forEach(
          b=>b.classList.remove("active")
        );

        button.classList.add("active");

        if(currentTool==="multiply"){

          hint.textContent=
            "倍率を入力してから画面をタップ。×1～×20まで指定できます。";

        }else{

          hint.textContent=
            "画面をタップすると「"+
            button.textContent+
            "」を配置します。続けて何個でも置けます。";
        }
      }
    );
  }
);


/* =========================
   Canvas座標
========================= */

function getCanvasPoint(event){

  const rect=canvas.getBoundingClientRect();

  return {
    x:event.clientX-rect.left,
    y:event.clientY-rect.top
  };
}


/* =========================
   Body判定
========================= */

function pointInBody(point,body){

  const vertices=body.vertices;

  let inside=false;

  for(
    let i=0,j=vertices.length-1;
    i<vertices.length;
    j=i++
  ){

    const xi=vertices[i].x;
    const yi=vertices[i].y;
    const xj=vertices[j].x;
    const yj=vertices[j].y;

    const intersect=
      ((yi>point.y)!==(yj>point.y)) &&
      (
        point.x<
        (xj-xi)*
        (point.y-yi)/
        (yj-yi)+
        xi
      );

    if(intersect){
      inside=!inside;
    }
  }

  return inside;
}


function localPoint(point,body){

  const dx=point.x-body.position.x;
  const dy=point.y-body.position.y;

  const c=Math.cos(-body.angle);
  const s=Math.sin(-body.angle);

  return {
    x:dx*c-dy*s,
    y:dx*s+dy*c
  };
}


/* =========================
   ハンドル
========================= */

function getHandleAt(point,body){

  if(
    body.label==="bedrock" ||
    body.label==="multiply"
  ){
    return null;
  }

  const local=localPoint(point,body);

  const w=body.baseW;
  const h=body.baseH;

  const handles=[
    {name:"nw",x:-w/2,y:-h/2},
    {name:"ne",x:w/2,y:-h/2},
    {name:"sw",x:-w/2,y:h/2},
    {name:"se",x:w/2,y:h/2}
  ];

  for(const handle of handles){

    if(
      Math.hypot(
        local.x-handle.x,
        local.y-handle.y
      )<21
    ){
      return handle.name;
    }
  }

  const rotateY=-h/2-52;

  if(
    Math.hypot(
      local.x,
      local.y-rotateY
    )<23
  ){
    return "rotate";
  }

  return null;
}


/* =========================
   サイズ変更
   中心固定
========================= */

function resizeBodyFromCenter(body,point){

  if(
    body.label==="bedrock" ||
    body.label==="multiply"
  ){
    return;
  }

  const local=localPoint(point,body);

  const width=Math.max(
    MIN_SIZE,
    Math.abs(local.x)*2
  );

  const height=Math.max(
    MIN_SIZE,
    Math.abs(local.y)*2
  );

  const oldW=Math.max(
    MIN_SIZE,
    body.baseW
  );

  const oldH=Math.max(
    MIN_SIZE,
    body.baseH
  );

  Body.scale(
    body,
    width/oldW,
    height/oldH
  );

  body.baseW=width;
  body.baseH=height;

  Body.setVelocity(
    body,
    {
      x:0,
      y:0
    }
  );

  Body.setAngularVelocity(
    body,
    0
  );

  wakeBody(body);
}


/* =========================
   回転
========================= */

function rotateBody(body,point){

  if(body.label==="bedrock"){
    return;
  }

  const dx=point.x-body.position.x;
  const dy=point.y-body.position.y;

  Body.setAngle(
    body,
    Math.atan2(dy,dx)+Math.PI/2
  );

  Body.setVelocity(
    body,
    {
      x:0,
      y:0
    }
  );

  Body.setAngularVelocity(
    body,
    0
  );

  wakeBody(body);
}


/* =========================
   Pointer Down
========================= */

canvas.addEventListener(
  "pointerdown",
  event=>{

    if(!engine){
      return;
    }

    const point=getCanvasPoint(event);

    /* プレイ中 */

    if(mode==="play"){

      const bomb=createObject(
        "bomb",
        point.x,
        Math.max(
          5,
          point.y
        ),
        34,
        34
      );

      if(bomb){

        Body.setVelocity(
          bomb,
          {
            x:0,
            y:0
          }
        );

        wakeBody(bomb);
      }

      return;
    }


    /* エディター */

    if(mode!=="editor"){
      return;
    }


    /* ツールが選択されている場合は必ず配置 */

    if(currentTool){

      let w=70;
      let h=50;

      if(currentTool==="slime"){
        w=54;
        h=54;
      }

      if(currentTool==="bomb"){
        w=34;
        h=34;
      }

      const factor=
        Math.max(
          1,
          Math.min(
            20,
            Math.floor(
              Number(
                multiplyFactorInput.value
              )||2
            )
          )
        );

      const body=createObject(
        currentTool,
        point.x,
        point.y,
        w,
        h,
        0,
        {
          multiplyFactor:factor
        }
      );

      if(body){

        selectedBody=body;

        /*
          重要:
          ツールを解除しない。
          これで2個目以降も置ける。
        */

        Body.setVelocity(
          body,
          {
            x:0,
            y:0
          }
        );

        Body.setAngularVelocity(
          body,
          0
        );

        wakeBody(body);
      }

      return;
    }


    /* 選択中のハンドル */

    if(selectedBody){

      const handle=getHandleAt(
        point,
        selectedBody
      );

      if(handle){

        pointerData={
          type:
            handle==="rotate"
            ? "rotate"
            : "resize",

          corner:handle,

          startX:point.x,
          startY:point.y,

          originalW:selectedBody.baseW,
          originalH:selectedBody.baseH,
          originalAngle:selectedBody.angle
        };

        wakeBody(selectedBody);

        return;
      }
    }


    /* 通常選択 */

    let found=null;

    for(
      let i=objects.length-1;
      i>=0;
      i--
    ){

      const body=objects[i];

      if(
        pointInBody(
          point,
          body
        )
      ){

        found=body;
        break;
      }
    }

    selectedBody=found;

    if(found){

      pointerData={
        type:"move",

        startX:point.x,
        startY:point.y,

        bodyX:found.position.x,
        bodyY:found.position.y
      };

      wakeBody(found);

    }else{

      pointerData=null;
    }
  }
);


/* =========================
   Pointer Move
========================= */

canvas.addEventListener(
  "pointermove",
  event=>{

    if(
      !pointerData ||
      !selectedBody ||
      !engine
    ){
      return;
    }

    const point=getCanvasPoint(event);
    const body=selectedBody;

    if(pointerData.type==="move"){

      const dx=point.x-pointerData.startX;
      const dy=point.y-pointerData.startY;

      Body.setPosition(
        body,
        {
          x:pointerData.bodyX+dx,
          y:pointerData.bodyY+dy
        }
      );

      Body.setVelocity(
        body,
        {
          x:0,
          y:0
        }
      );

      Body.setAngularVelocity(
        body,
        0
      );

      wakeBody(body);

      return;
    }

    if(pointerData.type==="resize"){

      resizeBodyFromCenter(
        body,
        point
      );

      return;
    }

    if(pointerData.type==="rotate"){

      rotateBody(
        body,
        point
      );
    }
  }
);


canvas.addEventListener(
  "pointerup",
  ()=>{
    if(selectedBody){
      wakeBody(selectedBody);
    }

    pointerData=null;
  }
);


canvas.addEventListener(
  "pointercancel",
  ()=>{
    pointerData=null;
  }
);

/* =========================
   爆発
========================= */

function createExplosion(x,y){

  explosions.push({

    x:x,
    y:y,

    start:performance.now(),

    duration:550
  });

  if(!engine){
    return;
  }

  const radius=250;
  const power=.055;

  for(const body of [...objects]){

    if(
      body.label==="bedrock" ||
      body.label==="multiply"
    ){
      continue;
    }

    const dx=body.position.x-x;
    const dy=body.position.y-y;

    const distance=Math.hypot(dx,dy);

    if(
      distance>radius ||
      distance<1
    ){
      continue;
    }

    const force=
      power*
      (1-distance/radius);

    Body.applyForce(
      body,
      body.position,
      {
        x:dx/distance*force,
        y:dy/distance*force
      }
    );

    wakeBody(body);
  }
}


/* =========================
   爆弾
========================= */

function explodeBomb(bomb){

  if(
    !bomb ||
    !engine ||
    bomb._exploded
  ){
    return;
  }

  bomb._exploded=true;

  const x=bomb.position.x;
  const y=bomb.position.y;

  World.remove(
    engine.world,
    bomb
  );

  const index=objects.indexOf(bomb);

  if(index>=0){
    objects.splice(index,1);
  }

  createExplosion(x,y);

  if(mode==="play"){
    damageObjects(x,y);
  }
}


/* =========================
   ダメージ
========================= */

function damageObjects(x,y){

  const radius=200;

  for(const body of [...objects]){

    if(
      body.label==="bomb" ||
      body.label==="bedrock" ||
      body.label==="multiply"
    ){
      continue;
    }

    const dx=body.position.x-x;
    const dy=body.position.y-y;

    const distance=Math.hypot(dx,dy);

    if(distance>radius){
      continue;
    }

    const damage=
      110*
      (1-distance/radius);

    body.hp-=damage;

    if(body.hp<=0){
      destroyBody(body);
    }
  }
}


function destroyBody(body){

  if(
    !engine ||
    body.isGroundBedrock
  ){
    return;
  }

  World.remove(
    engine.world,
    body
  );

  const index=objects.indexOf(body);

  if(index>=0){
    objects.splice(index,1);
  }

  if(selectedBody===body){
    selectedBody=null;
  }
}


/* =========================
   増殖
========================= */

function getInsideSet(bomb){

  let set=insideMultipliers.get(bomb);

  if(!set){

    set=new Set();

    insideMultipliers.set(
      bomb,
      set
    );
  }

  return set;
}


function multiplyBomb(multiplier,bomb){

  if(
    !multiplier ||
    !bomb ||
    bomb.label!=="bomb" ||
    bomb._exploded
  ){
    return;
  }

  const set=getInsideSet(bomb);

  /*
    まだこの増殖ブロックに入っている間は
    二度目を発生させない。
  */

  if(set.has(multiplier.gameId)){
    return;
  }

  set.add(
    multiplier.gameId
  );

  const factor=Math.max(
    1,
    Math.min(
      20,
      Math.floor(
        Number(multiplier.multiplyFactor)||2
      )
    )
  );

  /*
    元の爆弾と完全に同じ場所。
  */

  const x=bomb.position.x;
  const y=bomb.position.y;

  /*
    「×2」なら追加で1個。
    「×3」なら追加で2個。
  */

  const additional=Math.max(
    0,
    factor-1
  );

  for(let i=0;i<additional;i++){

    const newBomb=createObject(
      "bomb",
      x,
      y,
      34,
      34
    );

    if(newBomb){

      Body.setVelocity(
        newBomb,
        {
          x:bomb.velocity.x,
          y:bomb.velocity.y
        }
      );

      Body.setAngularVelocity(
        newBomb,
        bomb.angularVelocity
      );

      /*
        今この瞬間はすでに
        増殖ブロックの内部なので、
        直後の衝突で再増殖しない。
      */

      getInsideSet(newBomb).add(
        multiplier.gameId
      );

      wakeBody(newBomb);
    }
  }
}


/* =========================
   Matterイベント
========================= */

function installEngineEvents(){

  Events.on(
    engine,
    "collisionStart",
    event=>{

      for(const pair of event.pairs){

        const a=pair.bodyA;
        const b=pair.bodyB;

        /*
          爆弾
        */

        if(a.label==="bomb"){

          explodeBomb(a);
        }

        if(b.label==="bomb"){

          explodeBomb(b);
        }


        /*
          増殖
        */

        if(
          a.label==="multiply" &&
          b.label==="bomb"
        ){

          multiplyBomb(a,b);
        }

        if(
          b.label==="multiply" &&
          a.label==="bomb"
        ){

          multiplyBomb(b,a);
        }


        /*
          床との接触。
          上向きに跳ね返らない。
        */

        if(
          a.label==="groundBedrock" ||
          b.label==="groundBedrock"
        ){

          const body=
            a.label==="groundBedrock"
            ? b
            : a;

          if(
            body &&
            !body.isStatic
          ){

            if(body.velocity.y>0){

              Body.setVelocity(
                body,
                {
                  x:body.velocity.x*.9,
                  y:0
                }
              );
            }

            Body.setAngularVelocity(
              body,
              body.angularVelocity*.4
            );

            wakeBody(body);
          }
        }
      }
    }
  );


  /*
    増殖ブロックから離れたら
    再び増殖可能にする。
  */

  Events.on(
    engine,
    "collisionEnd",
    event=>{

      for(const pair of event.pairs){

        const a=pair.bodyA;
        const b=pair.bodyB;

        if(
          a.label==="multiply" &&
          b.label==="bomb"
        ){

          const set=insideMultipliers.get(b);

          if(set){
            set.delete(a.gameId);
          }
        }

        if(
          b.label==="multiply" &&
          a.label==="bomb"
        ){

          const set=insideMultipliers.get(a);

          if(set){
            set.delete(b.gameId);
          }
        }
      }
    }
  );


  /*
    エディターでは壊れない。
  */

  Events.on(
    engine,
    "beforeUpdate",
    ()=>{

      if(mode!=="editor"){
        return;
      }

      for(const body of objects){

        if(
          body.label!=="bedrock" &&
          body.label!=="multiply" &&
          body.label!=="bomb"
        ){

          body.hp=body.maxHp;
        }
      }
    }
  );
}

/* =========================

========================= */

function drawBackground(){

  ctx.clearRect(
    0,
    0,
    canvasWidth,
    canvasHeight
  );

  ctx.fillStyle="#f5eadc";

  ctx.fillRect(
    0,
    0,
    canvasWidth,
    canvasHeight
  );

  ctx.globalAlpha=.22;

  for(let i=0;i<12;i++){

    const x=
      (i*191)%
      Math.max(canvasWidth,1);

    const y=
      90+
      (i*103)%
      Math.max(canvasHeight-160,1);

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      45,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#fff";

    ctx.fill();
  }

  ctx.globalAlpha=1;
}


/* =========================
   床描画
========================= */

function drawFloor(){

  const y=canvasHeight-FLOOR_HEIGHT;

  ctx.fillStyle="#363636";

  ctx.fillRect(
    0,
    y,
    canvasWidth,
    FLOOR_HEIGHT
  );

  ctx.fillStyle="#555";

  ctx.fillRect(
    0,
    y,
    canvasWidth,
    7
  );

  ctx.strokeStyle="rgba(255,255,255,.1)";
  ctx.lineWidth=2;

  for(let x=0;x<canvasWidth;x+=38){

    ctx.beginPath();

    ctx.moveTo(
      x,
      y+10
    );

    ctx.lineTo(
      x+20,
      y+FLOOR_HEIGHT
    );

    ctx.stroke();
  }
}


/* =========================
   Body描画
========================= */

function drawBody(body){

  if(body.label==="slime"){
    drawSlime(body);
    return;
  }

  if(body.label==="bomb"){
    drawBomb(body);
    return;
  }

  if(body.label==="multiply"){
    drawMultiply(body);
    return;
  }

  if(body.label==="bedrock"){
    drawBedrock(body);
    return;
  }

  const vertices=body.vertices;

  ctx.save();

  ctx.beginPath();

  ctx.moveTo(
    vertices[0].x,
    vertices[0].y
  );

  for(let i=1;i<vertices.length;i++){

    ctx.lineTo(
      vertices[i].x,
      vertices[i].y
    );
  }

  ctx.closePath();

  if(body.label==="wood"){
    ctx.fillStyle="#a96b35";
  }else if(body.label==="glass"){
    ctx.fillStyle="rgba(120,200,255,.48)";
  }else if(body.label==="stone"){
    ctx.fillStyle="#858585";
  }else{
    ctx.fillStyle="#999";
  }

  ctx.fill();

  ctx.strokeStyle="rgba(60,40,20,.45)";
  ctx.lineWidth=2;

  ctx.stroke();

  if(body.label==="glass"){

    ctx.fillStyle="rgba(255,255,255,.35)";
    ctx.fill();
  }

  ctx.restore();
}


/* =========================
   スライム
========================= */

function drawSlime(body){

  const x=body.position.x;
  const y=body.position.y;
  const r=body.baseW/2;

  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(body.angle);

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#73c957";
  ctx.fill();

  ctx.strokeStyle="#478e39";
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.fillStyle="#222";

  ctx.beginPath();

  ctx.arc(
    -r*.3,
    -r*.12,
    Math.max(2,r*.09),
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    r*.3,
    -r*.12,
    Math.max(2,r*.09),
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}


/* =========================
   爆弾
========================= */

function drawBomb(body){

  const x=body.position.x;
  const y=body.position.y;

========================= */

function drawMultiply(body){

========================= */

function drawSelection(){

  ){

  }

  );

  ctx.moveTo(

  );

  ctx.lineTo(

    -h/2-45
  );

  ctx.strokeStyle="#ed7920";
  ctx.lineWidth=2;

  ctx.arc(

/* =========================
   爆発アニメーション
========================= */

function drawExplosions(now){

  const alive=[];

  for(const explosion of explosions){

    const elapsed=
      now-explosion.start;

    const progress=
      Math.min(
        1,
        elapsed/explosion.duration
      );

    if(progress>=1){
      continue;
    }

    alive.push(explosion);

    const radius=
      20+
      160*
      Math.sin(
        progress*Math.PI/2
      );

    const alpha=1-progress;

    const gradient=
      ctx.createRadialGradient(
        explosion.x,
        explosion.y,
        0,
        explosion.x,
        explosion.y,
        radius
      );

    gradient.addColorStop(
      0,
      "rgba(255,240,120,"+
      (.85*alpha)+
      ")"
    );

    gradient.addColorStop(
      .35,
      "rgba(255,150,30,"+
      (.65*alpha)+
      ")"
    );

    gradient.addColorStop(
      .75,
      "rgba(255,90,20,"+
      (.25*alpha)+
      ")"
    );

    gradient.addColorStop(
      1,
      "rgba(255,80,0,0)"
    );

    ctx.fillStyle=gradient;

    ctx.beginPath();

    ctx.arc(
      explosion.x,
      explosion.y,
      radius,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  explosions=alive;
}


/* =========================
   Render
========================= */

function render(now){

  if(gameScreen.classList.contains("hidden")){
    return;
  }

  drawBackground();

  /*
    床を先に描く。
  */

  drawFloor();

  if(engine){

    for(const body of objects){

      if(
        body.position.y>canvasHeight+300 ||
        body.position.x<-300 ||
        body.position.x>canvasWidth+300
      ){
        continue;
      }

      drawBody(body);
    }

    drawSelection();
  }

  drawExplosions(now);
}


/* =========================
   メインループ
========================= */

function gameLoop(now){

  const dt=Math.min(
    50,
    Math.max(
      0,
      now-lastTime
    )
  );

  lastTime=now;

  if(engine){

    Engine.update(
      engine,
      dt
    );
  }

  render(now);

  animationFrame=
    requestAnimationFrame(
      gameLoop
    );
}


function startGameLoop(){

  if(animationFrame!==null){
    return;
  }

  lastTime=performance.now();

  animationFrame=
    requestAnimationFrame(
      gameLoop
    );
}


/* =========================
   初期状態
========================= */

titleScreen.classList.remove("hidden");
stageSelectScreen.classList.add("hidden");
gameScreen.classList.add("hidden");

startGameLoop();

</script>
