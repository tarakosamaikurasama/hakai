<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>日野市の街並みに歴史</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f3f3f3;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.screen{display:none;min-height:100vh;padding:10px}
.screen.active{display:block}

.home{
 max-width:650px;
 margin:35px auto;
 background:#fff;
 border-radius:25px;
 padding:30px;
 box-shadow:0 8px 30px #0002;
 text-align:center
}

.home h1{
 font-size:32px;
 margin:5px 0 30px
}

.home button{
 display:block;
 width:100%;
 padding:16px;
 margin:10px 0;
 border:0;
 border-radius:15px;
 background:#f80;
 color:#fff;
 font-weight:bold;
 box-shadow:0 4px 0 #c60
}

.home button.white{
 background:#fff;
 color:#222;
 border:1px solid #ddd;
 box-shadow:none
}

.workspace{
 width:min(1200px,100%);
 margin:auto
}

.topbar{
 display:flex;
 align-items:center;
 gap:7px;
 flex-wrap:wrap;
 background:#fff;
 border-radius:16px;
 padding:9px;
 box-shadow:0 5px 20px #0001;
 margin-bottom:9px
}

.topbar h2{
 margin:0 10px 0 3px;
 font-size:20px
}

.btn{
 border:0;
 padding:8px 12px;
 border-radius:10px;
 background:#f80;
 color:#fff;
 font-weight:bold;
 box-shadow:0 3px 0 #c60
}

.btn.white{
 background:#fff;
 color:#222;
 border:1px solid #ddd;
 box-shadow:none
}

.btn.red{
 background:#d33;
 box-shadow:0 3px 0 #922
}

.stageWrap{
 position:relative;
 background:#fff;
 padding:9px;
 border-radius:22px;
 box-shadow:0 8px 28px #0002;
 overflow:hidden
}

canvas{
 display:block;
 width:100%;
 height:min(70vh,700px);
 min-height:400px;
 border-radius:16px;
 background:#eaf7ff;
 touch-action:none
}

.editorBar,.playBar{
 margin-top:9px;
 background:#fff;
 border-radius:16px;
 padding:9px;
 box-shadow:0 5px 20px #0001
}

.palette{
 display:flex;
 flex-wrap:wrap;
 gap:6px
}

.palette button{
 padding:7px 10px;
 border:1px solid #ddd;
 border-radius:9px;
 background:#fafafa;
 font-weight:bold
}

.palette button.active{
 background:#f80;
 color:#fff;
 border-color:#f80
}

.actions{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:8px
}

.actions button{
 padding:7px 10px;
 border:1px solid #ddd;
 border-radius:9px;
 background:#fff
}

.actions button.active{
 background:#222;
 color:#fff
}

.playBar{
 display:flex;
 flex-wrap:wrap;
 align-items:center;
 gap:6px
}

.playInfo{
 margin-left:auto;
 font-size:13px;
 font-weight:bold
}

.panel{
 position:absolute;
 left:12px;
 right:12px;
 top:12px;
 z-index:20;
 background:#fffffff5;
 backdrop-filter:blur(10px);
 border:1px solid #ddd;
 border-radius:12px;
 padding:8px;
 box-shadow:0 7px 25px #0003
}

.panelLine{
 display:flex;
 align-items:center;
 gap:5px;
 overflow-x:auto;
 white-space:nowrap
}

.panel input,.panel select{
 padding:5px;
 border:1px solid #ccc;
 border-radius:7px
}

.panel button{
 border:0;
 padding:6px 9px;
 border-radius:8px;
 background:#f80;
 color:#fff;
 font-weight:bold
}

.selectInfo{
 position:absolute;
 right:13px;
 bottom:13px;
 z-index:20;
 min-width:190px;
 background:#fffffff5;
 border-radius:12px;
 padding:9px;
 box-shadow:0 5px 18px #0003;
 font-size:13px
}

.modal{
 position:fixed;
 inset:0;
 z-index:100;
 background:#0006;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:12px
}

.modalBox{
 width:min(650px,100%);
 max-height:90vh;
 overflow:auto;
 background:#fff;
 border-radius:20px;
 padding:18px;
 box-shadow:0 12px 50px #0005
}

.modalBox h3{
 margin:0 0 13px
}

.row{
 display:flex;
 flex-wrap:wrap;
 align-items:center;
 gap:7px;
 margin:9px 0
}

.row input,.row select{
 min-width:90px;
 flex:1;
 padding:8px;
 border:1px solid #ccc;
 border-radius:8px
}

.stageItem{
 border:1px solid #ddd;
 border-radius:12px;
 padding:10px;
 margin:8px 0
}

.stageItem strong{
 display:block;
 margin-bottom:7px
}

.stageItem button{
 padding:7px 10px;
 border:0;
 border-radius:8px;
 background:#f80;
 color:#fff;
 font-weight:bold;
 margin-right:4px
}

.stageItem button.white{
 background:#fff;
 color:#222;
 border:1px solid #ddd
}

.notice{
 background:#fff4e5;
 padding:9px;
 border-radius:9px;
 font-size:13px
}

@media(max-width:600px){
 .screen{padding:6px}
 .home{margin:15px auto;padding:22px}
 .home h1{font-size:27px}
 canvas{height:62vh;min-height:390px}
 .topbar h2{width:100%}
}
</style>
</head>

<body>

<section id="home" class="screen active">
<div class="home">
<h1>街並みクラッシュ</h1>

<button id="startCreate">ステージを作る</button>
<button id="startPlay">ステージで遊ぶ</button>
<button id="startData" class="white">保存データ</button>

</div>
</section>

<section id="editor" class="screen">

<div class="workspace">

<div class="topbar">
<h2>ステージ編集</h2>
<button class="btn white" id="editorHome">ホーム</button>
<button class="btn" id="saveNewButton">新しく保存</button>
<button class="btn" id="overwriteButton">上書き保存</button>
<button class="btn white" id="exportButton">書き出す</button>
<button class="btn white" id="importButton">読み込む</button>
</div>

<div class="stageWrap">
<canvas id="editorCanvas"></canvas>
</div>

<div class="editorBar">

<div class="palette">

<button data-tool="select">選択</button>
<button data-tool="wood">木</button>
<button data-tool="glass">ガラス</button>
<button data-tool="stone">石</button>

<button data-tool="houseWood">木の家</button>
<button data-tool="houseGlass">ガラスの家</button>
<button data-tool="houseStone">石の家</button>
<button data-tool="houseBedrock">岩盤の家</button>

<button data-tool="multiplier">倍ブロック</button>
<button data-tool="bedrock">岩盤</button>
<button data-tool="bomb">爆弾</button>

<button data-tool="dog">犬</button>
<button data-tool="bigDog">巨大犬</button>
<button data-tool="armorDog">よろい犬</button>
<button data-tool="movingDog">動く犬</button>

<button data-tool="bombDropper">爆弾投下機</button>
<button data-tool="dogSpawner">自動犬生成機</button>

</div>

<div class="actions">

<button data-action="move">移動</button>
<button data-action="resize">形変更</button>
<button data-action="rotate">回転</button>
<button id="duplicateButton">複製</button>
<button id="deleteButton">個別削除</button>
<button id="machineButton">生成機設定</button>
<button id="manualBombButton">手動爆弾設定</button>
<button id="zoomOut">ズーム−</button>
<button id="zoomIn">ズーム＋</button>

</div>

</div>

</div>
</section>

<section id="play" class="screen">

<div class="workspace">

<div class="topbar">
<h2>ステージで遊ぶ</h2>
<button class="btn white" id="playHome">ホーム</button>
</div>

<div class="stageWrap">

<canvas id="playCanvas"></canvas>

<div id="selectInfo" class="selectInfo hidden"></div>

</div>

<div class="playBar">

<button class="btn" id="resetButton">リセット（やり直す）</button>
<button class="btn red" id="explodeButton">全爆破</button>
<button class="btn white" id="playSelectButton">選択</button>
<button class="btn white" id="playBombButton">爆弾を置く</button>
<button class="btn white" id="playMachineButton">生成機設定</button>
<button class="btn white" id="playManualBombButton">手動爆弾設定</button>
<button class="btn white" id="playZoomOut">ズーム−</button>
<button class="btn white" id="playZoomIn">ズーム＋</button>

<span id="playInfo" class="playInfo"></span>

</div>

</div>
</section>

<div id="modal" class="modal hidden">
<div id="modalBox" class="modalBox"></div>
</div>

<input id="fileInput" type="file" accept=".json,application/json" class="hidden">

<script>

const STORAGE_KEY="street_history_stages";

let MatterLoaded=false;
let engine=null;
let mode="editor";
let stage=null;
let sourceStage=null;
let selected=null;
let selectedTool="select";
let editAction=null;
let zoom=1;
let pointerState=null;
let explosions=[];
let machineTimers={};
let manualBombTimer=5;
let lastTime=performance.now();

const editorCanvas=document.getElementById("editorCanvas");
const playCanvas=document.getElementById("playCanvas");

const MATERIALS={
 wood:{hp:4,color:"#a96832"},
 glass:{hp:1,color:"#9edff5"},
 stone:{hp:8,color:"#858585"},
 bedrock:{hp:Infinity,color:"#30343b"}
};

function newId(){
 return "id_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9);
}

function deepCopy(v){
 return JSON.parse(JSON.stringify(v));
}

function esc(v){
 return String(v).replace(/[&<>"']/g,function(c){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c];
 });
}

function savedStages(){
 try{
  return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
 }catch(e){
  return [];
 }
}

function writeStages(v){
 localStorage.setItem(STORAGE_KEY,JSON.stringify(v));
}

function showScreen(id){
 document.querySelectorAll(".screen").forEach(function(x){
  x.classList.remove("active");
 });

 document.getElementById(id).classList.add("active");

 setTimeout(function(){
  resizeCanvas();
 },50);
}

function loadMatter(){
 return new Promise(function(resolve,reject){

  if(window.Matter){
   MatterLoaded=true;
   resolve();
   return;
  }

  const s=document.createElement("script");

  s.src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js";

  s.onload=function(){
   if(window.Matter){
    MatterLoaded=true;
    resolve();
   }else{
    reject();
   }
  };

  s.onerror=function(){
   reject();
  };

  document.head.appendChild(s);
 });
}

async function ensureMatter(){
 if(MatterLoaded&&window.Matter)return true;

 try{
  await loadMatter();
  return true;
 }catch(e){

  openModal(
   "<h3>読み込みエラー</h3>"+
   "<p>Matter.jsを読み込めませんでした。</p>"+
   "<p>インターネット接続を確認して、もう一度試してください。</p>"+
   '<button class="btn" id="closeError">閉じる</button>'
  );

  document.getElementById("closeError").onclick=closeModal;

  return false;
 }
}

async function startEditor(){

 const ok=await ensureMatter();
 if(!ok)return;

 stage={
  id:newId(),
  name:"ステージ",
  objects:[]
 };

 sourceStage=null;
 selected=null;
 zoom=1;

 createEngine();

 showScreen("editor");

 chooseTool("select");
}

async function openSavedPlay(){

 const data=savedStages();

 if(!data.length){
  openModal(
   "<h3>保存データ</h3>"+
   "<p>保存されたステージがありません。</p>"+
   '<button class="btn" id="emptyClose">閉じる</button>'
  );

  document.getElementById("emptyClose").onclick=closeModal;

  return;
 }

 openStageList("play");
}

async function openSavedData(){

 const data=savedStages();

 let html="<h3>保存データ</h3>";

 if(!data.length){
  html+="<p>保存されたステージはありません。</p>";
 }else{

  data.forEach(function(s){

   html+=
   '<div class="stageItem">'+
   "<strong>"+esc(s.name)+"</strong>"+
   '<button data-play="'+s.id+'">遊ぶ</button>'+
   '<button class="white" data-edit="'+s.id+'">編集</button>'+
   '<button class="white" data-delete="'+s.id+'">削除</button>'+
   "</div>";

  });
 }

 html+='<div class="row"><button class="btn white" id="dataClose">閉じる</button></div>';

 openModal(html);

 document.getElementById("dataClose").onclick=closeModal;

 document.querySelectorAll("[data-play]").forEach(function(b){
  b.onclick=function(){
   playSaved(b.dataset.play);
  };
 });

 document.querySelectorAll("[data-edit]").forEach(function(b){
  b.onclick=function(){
   editSaved(b.dataset.edit);
  };
 });

 document.querySelectorAll("[data-delete]").forEach(function(b){
  b.onclick=function(){

   const d=savedStages().filter(function(x){
    return x.id!==b.dataset.delete;
   });

   writeStages(d);
   openSavedData();
  };
 });
}

function openStageList(type){

 const data=savedStages();

 let html="<h3>"+(type==="overwrite"?"上書き保存":"保存データ")+"</h3>";

 if(type==="overwrite"){
  html+=
  '<div class="notice">'+
  "選択したステージの名前は変更せず、現在の編集内容だけを上書きします。"+
  "</div>";
 }

 if(!data.length){
  html+="<p>保存されたステージはありません。</p>";
 }else{

  data.forEach(function(s){

   if(type==="overwrite"){

    html+=
    '<div class="stageItem">'+
    "<strong>"+esc(s.name)+"</strong>"+
    '<button data-overwrite="'+s.id+'">このステージに上書き</button>'+
    "</div>";

   }else{

    html+=
    '<div class="stageItem">'+
    "<strong>"+esc(s.name)+"</strong>"+
    '<button data-play="'+s.id+'">遊ぶ</button>"+
    '<button class="white" data-edit="'+s.id+'">編集</button>'+
    '<button class="white" data-delete="'+s.id+'">削除</button>'+
    "</div>";
   }
  });
 }

 html+='<div class="row"><button class="btn white" id="listClose">閉じる</button></div>';

 openModal(html);

 document.getElementById("listClose").onclick=closeModal;

 if(type==="overwrite"){

  document.querySelectorAll("[data-overwrite]").forEach(function(b){
   b.onclick=function(){
    overwriteStage(b.dataset.overwrite);
   };
  });

 }else{

  document.querySelectorAll("[data-play]").forEach(function(b){
   b.onclick=function(){
    playSaved(b.dataset.play);
   };
  });

  document.querySelectorAll("[data-edit]").forEach(function(b){
   b.onclick=function(){
    editSaved(b.dataset.edit);
   };
  });

  document.querySelectorAll("[data-delete]").forEach(function(b){
   b.onclick=function(){

    writeStages(
     savedStages().filter(function(x){
      return x.id!==b.dataset.delete;
     })
    );

    openStageList(type);
   };
  });
 }
}

async function editSaved(id){

 const s=savedStages().find(function(x){
  return x.id===id;
 });

 if(!s)return;

 const ok=await ensureMatter();
 if(!ok)return;

 stage=deepCopy(s);
 sourceStage=null;
 selected=null;
 zoom=1;

 closeModal();
 createEngine();
 showScreen("editor");
 chooseTool("select");
}

async function playSaved(id){

 const s=savedStages().find(function(x){
  return x.id===id;
 });

 if(!s)return;

 const ok=await ensureMatter();
 if(!ok)return;

 sourceStage=deepCopy(s);
 stage=deepCopy(s);

 selected=null;
 zoom=1;
 selectedTool="bomb";
 editAction=null;

 closeModal();
 createEngine();
 showScreen("play");

 setTimeout(function(){
  resizeCanvas();
  rebuildPhysics();
 },80);
}

function createEngine(){

 if(engine){

  try{
   Matter.Events.off(engine,"collisionStart",collisionStart);
  }catch(e){}
 }

 engine=Matter.Engine.create({
  enableSleeping:false
 });

 engine.gravity.y=1;
 engine.gravity.scale=.001;

 Matter.Events.on(engine,"collisionStart",collisionStart);

 machineTimers={};
 explosions=[];
}

function currentCanvas(){
 return mode==="editor"?editorCanvas:playCanvas;
}

function resizeCanvas(){

 const c=currentCanvas();
 if(!c)return;

 const r=c.getBoundingClientRect();

 if(r.width<1||r.height<1)return;

 const d=Math.min(devicePixelRatio||1,2);

 c.width=Math.floor(r.width*d);
 c.height=Math.floor(r.height*d);

 if(engine){
  rebuildGround();
  rebuildPhysicsObjects();
 }
}

function canvasSize(){

 const c=currentCanvas();
 const r=c.getBoundingClientRect();

 return {
  w:r.width,
  h:r.height
 };
}

function floorY(){
 return canvasSize().h-36;
}

function rebuildGround(){

 if(!engine)return;

 Matter.Composite.allBodies(engine.world)
 .filter(function(b){
  return b.label==="ground";
 })
 .forEach(function(b){
  Matter.World.remove(engine.world,b);
 });

 const s=canvasSize();

 const g=Matter.Bodies.rectangle(
  s.w/2,
  s.h-18,
  s.w,
  36,
  {
   isStatic:true,
   label:"ground",
   friction:1,
   restitution:0
  }
 );

 g.plugin={kind:"ground"};

 Matter.World.add(engine.world,g);
}

function rebuildPhysicsObjects(){

 if(!engine||!stage)return;

 Matter.Composite.allBodies(engine.world)
 .filter(function(b){
  return b.label!=="ground";
 })
 .forEach(function(b){
  Matter.World.remove(engine.world,b);
 });

 stage.objects.forEach(function(o){

  const b=createBody(o);

  if(b){
   Matter.World.add(engine.world,b);
  }
 });
}

function rebuildPhysics(){

 rebuildGround();
 rebuildPhysicsObjects();
}

function materialType(o){

 if(o.type==="wood"||o.type==="houseWood")return "wood";
 if(o.type==="glass"||o.type==="houseGlass")return "glass";
 if(o.type==="stone"||o.type==="houseStone")return "stone";
 if(o.type==="bedrock"||o.type==="houseBedrock")return "bedrock";

 return null;
}

function isHouse(o){
 return [
  "houseWood",
  "houseGlass",
  "houseStone",
  "houseBedrock"
 ].includes(o.type);
}

function maxHP(type){

 if(type==="dog")return 2;
 if(type==="bigDog")return 4;
 if(type==="armorDog")return 2;
 if(type==="movingDog")return 2;

 const m=materialType({type:type});

 if(m)return MATERIALS[m].hp;

 if(type==="multiplier")return 5;

 return Infinity;
}

function createBody(o){

 let b;

 if(isHouse(o)){

  const w=o.width||130;
  const h=o.height||100;
  const t=Math.max(8,Math.min(w,h)*.18);

  const a=Matter.Bodies.rectangle(
   o.x,o.y-h/2+t/2,w,t
  );

  const c=Matter.Bodies.rectangle(
   o.x,o.y+h/2-t/2,w,t
  );

  const l=Matter.Bodies.rectangle(
   o.x-w/2+t/2,o.y,t,h-2*t
  );

  const r=Matter.Bodies.rectangle(
   o.x+w/2-t/2,o.y,t,h-2*t
  );

  b=Matter.Body.create({
   parts:[a,c,l,r],
   angle:o.angle||0,
   label:o.type,
   isStatic:o.type==="houseBedrock"
  });

 }else if(o.type==="bomb"){

  b=Matter.Bodies.circle(
   o.x,o.y,o.radius||13,
   {
    label:"bomb",
    friction:.7,
    restitution:.1
   }
  );

 }else if([
  "dog",
  "bigDog",
  "armorDog",
  "movingDog"
 ].includes(o.type)){

  const r=o.type==="bigDog"?24:15;

  b=Matter.Bodies.circle(
   o.x,o.y,r,
   {
    label:o.type,
    friction:.9,
    restitution:.02
   }
  );

 }else if(
  o.type==="bombDropper"||
  o.type==="dogSpawner"
 ){

  b=Matter.Bodies.rectangle(
   o.x,o.y,
   o.width||105,
   o.height||35,
   {
    isStatic:true,
    label:o.type
   }
  );

 }else{

  b=Matter.Bodies.rectangle(
   o.x,o.y,
   o.width||80,
   o.height||45,
   {
    angle:o.angle||0,
    label:o.type,
    isStatic:o.type==="bedrock",
    isSensor:o.type==="multiplier",
    friction:.8,
    restitution:.03
   }
  );
 }

 b.plugin=b.plugin||{};

 b.plugin.objectId=o.id;
 b.plugin.kind=o.type;
 b.plugin.hp=o.hp==null?maxHP(o.type):o.hp;
 b.plugin.maxHp=maxHP(o.type);

 if(o.type==="bomb"){

  b.plugin.createdAt=o.createdAt||performance.now();
  b.plugin.bombDuration=o.bombDuration||manualBombTimer;
  b.plugin.blockedMultiplierId=o.blockedMultiplierId||null;
 }

 if(
  o.type==="bombDropper"||
  o.type==="dogSpawner"
 ){
  b.plugin.enabled=o.enabled!==false;
 }

 if(o.type==="movingDog"){

  b.plugin.targetX=o.targetX;
  b.plugin.targetY=o.targetY;
  b.plugin.stuck=0;
  b.plugin.lastX=o.x;
  b.plugin.lastY=o.y;
  b.plugin.lastCheck=performance.now();
 }

 return b;
}

function objectFromBody(b){

 if(!b)return null;

 const root=b.parent||b;

 if(!root.plugin)return null;

 return stage?.objects.find(function(o){
  return o.id===root.plugin.objectId;
 });
}

function chooseTool(t){

 selectedTool=t;
 editAction=null;

 document.querySelectorAll(".palette button")
 .forEach(function(b){
  b.classList.remove("active");
 });

 const el=document.querySelector('[data-tool="'+t+'"]');

 if(el)el.classList.add("active");

 document.querySelectorAll(".actions button")
 .forEach(function(b){
  b.classList.remove("active");
 });
}

function pointerPosition(e){

 const r=currentCanvas().getBoundingClientRect();

 return {
  x:e.clientX-r.left,
  y:e.clientY-r.top
 };
}

function toWorld(p){

 const s=canvasSize();

 return {
  x:s.w/2+(p.x-s.w/2)/zoom,
  y:s.h+(p.y-s.h)/zoom
 };
}

function toScreen(p){

 const s=canvasSize();

 return {
  x:s.w/2+(p.x-s.w/2)*zoom,
  y:s.h+(p.y-s.h)*zoom
 };
}

function bodyAt(p){

 const w=toWorld(p);

 const bodies=Matter.Composite.allBodies(engine.world)
 .filter(function(b){
  return b.label!=="ground";
 });

 for(let i=bodies.length-1;i>=0;i--){

  const b=bodies[i];

  if(
   Matter.Bounds.contains(b.bounds,w)&&
   Matter.Vertices.contains(b.vertices,w)
  ){
   return b.parent||b;
  }
 }

 return null;
}

function pointerDown(e){

 if(!engine)return;

 const p=pointerPosition(e);
 const w=toWorld(p);

 if(mode==="play"){

  const b=bodyAt(p);

  if(b){

   const o=objectFromBody(b);

   if(o&&(
    o.type==="bombDropper"||
    o.type==="dogSpawner"
   )){

    o.enabled=o.enabled===false;

    b.plugin.enabled=o.enabled;

    selected=b;
    showPlaySelection();

    return;
   }

   if(selectedTool==="select"){

    selected=b;
    showPlaySelection();

    return;
   }

   return;
  }

  if(selectedTool==="bomb"){
   spawnBomb(w.x,w.y,manualBombTimer);
  }

  return;
 }

 if(selectedTool!=="select"){

  addObject(selectedTool,w.x,w.y);
  return;
 }

 const b=bodyAt(p);

 if(!b){
  selected=null;
  return;
 }

 selected=b;

 if(editAction==="move"){

  pointerState={
   kind:"move",
   body:b,
   dx:b.position.x-w.x,
   dy:b.position.y-w.y
  };
 }

 if(editAction==="resize"){

  const o=objectFromBody(b);

  if(
   o&&
   o.type!=="bombDropper"&&
   o.type!=="dogSpawner"
  ){

   pointerState={
    kind:"resize",
    body:b
   };
  }
 }

 if(editAction==="rotate"){

  const o=objectFromBody(b);

  if(
   o&&
   o.type!=="bombDropper"&&
   o.type!=="dogSpawner"
  ){

   pointerState={
    kind:"rotate",
    body:b
   };
  }
 }
}

function pointerMove(e){

 if(!pointerState)return;

 const p=pointerPosition(e);
 const w=toWorld(p);

 const b=pointerState.body;
 const o=objectFromBody(b);

 if(!o)return;

 if(pointerState.kind==="move"){

  Matter.Body.setPosition(
   b,
   {
    x:w.x+pointerState.dx,
    y:w.y+pointerState.dy
   }
  );

  o.x=b.position.x;
  o.y=b.position.y;
 }

 if(pointerState.kind==="rotate"){

  const a=Math.atan2(
   w.y-b.position.y,
   w.x-b.position.x
  )+Math.PI/2;

  Matter.Body.setAngle(b,a);
  o.angle=a;
 }

 if(pointerState.kind==="resize"){

  const local=Matter.Vector.rotate(
   {
    x:w.x-b.position.x,
    y:w.y-b.position.y
   },
   -(b.angle||0)
  );

  const nw=Math.max(20,Math.abs(local.x)*2);
  const nh=Math.max(20,Math.abs(local.y)*2);

  const ow=o.width||80;
  const oh=o.height||45;

  Matter.Body.scale(
   b,
   nw/ow,
   nh/oh
  );

  Matter.Body.setVelocity(b,{x:0,y:0});
  Matter.Body.setAngularVelocity(b,0);

  o.width=nw;
  o.height=nh;
 }
}

function pointerUp(){
 pointerState=null;
}

function spawnBomb(x,y,timer,blocked){

 const o={
  id:newId(),
  type:"bomb",
  x:x,
  y:y,
  width:26,
  height:26,
  radius:13,
  angle:0,
  bombDuration:timer||manualBombTimer,
  createdAt:performance.now(),
  blockedMultiplierId:blocked||null
 };

 stage.objects.push(o);

 const b=createBody(o);

 Matter.World.add(engine.world,b);

 return b;
}

function bombRemaining(b,now){

 const total=(b.plugin.bombDuration||5)*1000;

 return Math.max(
  0,
  (total-(now-b.plugin.createdAt))/1000
 );
}

function collisionStart(e){

 e.pairs.forEach(function(pair){

  const a=pair.bodyA.parent||pair.bodyA;
  const b=pair.bodyB.parent||pair.bodyB;

  if(
   a.plugin?.kind==="bomb"&&
   b.plugin?.kind==="multiplier"
  ){
   multiplyBomb(a,b);
  }

  if(
   b.plugin?.kind==="bomb"&&
   a.plugin?.kind==="multiplier"
  ){
   multiplyBomb(b,a);
  }
 });
}

function multiplyBomb(bomb,mult){

 const source=mult.plugin.objectId;

 if(bomb.plugin.blockedMultiplierId===source){
  return;
 }

 const mo=objectFromBody(mult);

 if(!mo)return;

 const factor=Math.max(
  2,
  Math.min(20,parseInt(mo.factor)||2)
 );

 const remaining=bombRemaining(
  bomb,
  performance.now()
 );

 bomb.plugin.blockedMultiplierId=source;

 const bo=objectFromBody(bomb);

 if(bo){
  bo.blockedMultiplierId=source;
 }

 for(let i=1;i<factor;i++){

  spawnBomb(
   bomb.position.x,
   bomb.position.y,
   remaining,
   source
  );
 }
}

function explodeBomb(b){

 if(!b||!b.world)return;

 const x=b.position.x;
 const y=b.position.y;

 explosions.push({
  x:x,
  y:y,
  start:performance.now(),
  duration:500,
  max:120
 });

 Matter.Composite.allBodies(engine.world)
 .forEach(function(t){

  if(t===b||t.label==="ground")return;

  const dx=t.position.x-x;
  const dy=t.position.y-y;
  const d=Math.hypot(dx,dy);

  if(d<1||d>180)return;

  const f=(1-d/180)*.06;

  Matter.Body.applyForce(
   t,
   t.position,
   {
    x:dx/d*f,
    y:dy/d*f-.008
   }
  );

  if(mode==="play"){
   damage(t,1);
  }
 });

 const o=objectFromBody(b);

 if(o){
  stage.objects=stage.objects.filter(function(x){
   return x.id!==o.id;
  });
 }

 Matter.World.remove(engine.world,b);

 if(selected===b){
  selected=null;

  document.getElementById("selectInfo")
  .classList.add("hidden");
 }
}

function damage(b,n){

 const o=objectFromBody(b);

 if(!o)return;

 if(
  o.type==="bedrock"||
  o.type==="houseBedrock"
 ){
  return;
 }

 let defense=1;

 if(o.type==="armorDog"){
  defense=2;
 }

 b.plugin.hp-=n/defense;
 o.hp=b.plugin.hp;

 if(b.plugin.hp<=0){

  stage.objects=stage.objects.filter(function(x){
   return x.id!==o.id;
  });

  Matter.World.remove(engine.world,b);

  if(selected===b){
   selected=null;
   document.getElementById("selectInfo")
   .classList.add("hidden");
  }
 }
}

function updateMachines(now){

  if(

  )return;

  if(o.enabled===false)return;

  if(machineTimers[o.id]==null){

   machineTimers[o.id]=
   now+(o.interval||3)*1000;

   return;
  }

  if(now<machineTimers[o.id])return;

  if(o.type==="bombDropper"){

   const x=o.x;
   const y=o.y+(o.height||35)/2+25;

   for(
    let i=0;
    i<Math.max(1,o.count||1);
    i++
   ){

    spawnBomb(
     x+(i-(o.count-1)/2)*18,
     y,
     o.bombTimer||5
    );
   }
  }

  if(o.type==="dogSpawner"){

   for(
    let i=0;
    i<Math.max(1,o.count||1);
    i++
   ){
    spawnDog(o);
   }
  }

  machineTimers[o.id]=
  now+(o.interval||3)*1000;
 });
}

function spawnDog(machine){

 const s=canvasSize();
 const w=machine.width||105;
 const h=machine.height||35;

 let x=machine.x;
 let y=machine.y;

 if(machine.direction==="left"){
  x=machine.x-w/2-25;
 }

 if(machine.direction==="right"){
  x=machine.x+w/2+25;
 }

 if(machine.direction==="up"){
  y=machine.y-h/2-25;
 }

 if(machine.direction==="down"){
  y=machine.y+h/2+25;
 }

 const type=machine.dogType||"dog";

 const r=type==="bigDog"?24:15;

 x=Math.max(r,Math.min(s.w-r,x));
 y=Math.max(r,Math.min(floorY()-r,y));

 const o={
  id:newId(),
  type:type,
  x:x,
  y:y,
  width:type==="bigDog"?48:30,
  height:type==="bigDog"?48:30,
  angle:0,
  hp:maxHP(type)
 };

 stage.objects.push(o);

 const b=createBody(o);

 Matter.World.add(engine.world,b);

 if(type==="movingDog"){
  chooseTarget(b);
 }
}

function chooseTarget(b){

 const s=canvasSize();
 const r=b.plugin.kind==="bigDog"?24:15;

 b.plugin.targetX=
  r+Math.random()*Math.max(1,s.w-r*2);

 b.plugin.targetY=
  r+Math.random()*
  Math.max(
   1,
   floorY()-r*2
  );

 b.plugin.stuck=0;
 b.plugin.lastX=b.position.x;
 b.plugin.lastY=b.position.y;
 b.plugin.lastCheck=performance.now();
}

function updateMovingDogs(now){

 if(mode!=="play")return;

 const s=canvasSize();

 Matter.Composite.allBodies(engine.world)
 .forEach(function(b){

  if(b.plugin?.kind!=="movingDog")return;

  if(
   b.plugin.targetX==null||
   b.plugin.targetY==null
  ){
   chooseTarget(b);
   return;
  }

  const r=15;

  const tx=Math.max(
   r,
   Math.min(s.w-r,b.plugin.targetX)
  );

  const ty=Math.max(
   r,
   Math.min(floorY()-r,b.plugin.targetY)
  );

  const dx=tx-b.position.x;
  const dy=ty-b.position.y;
  const d=Math.hypot(dx,dy);

  if(d<12){
   chooseTarget(b);
   return;
  }

  const speed=1.5;

  Matter.Body.setVelocity(
   b,
   {
    x:dx/d*speed,
    y:dy/d*speed
   }
  );

  const moved=Math.hypot(
   b.position.x-b.plugin.lastX,
   b.position.y-b.plugin.lastY
  );

  if(moved<.4){
   b.plugin.stuck++;
  }else{
   b.plugin.stuck=0;
  }

  b.plugin.lastX=b.position.x;
  b.plugin.lastY=b.position.y;

  if(b.plugin.stuck>45){
   chooseTarget(b);
  }

  if(b.position.x<r){
   Matter.Body.setPosition(
    b,
    {x:r,y:b.position.y}
   );
   chooseTarget(b);
  }

  if(b.position.x>s.w-r){
   Matter.Body.setPosition(
    b,
    {x:s.w-r,y:b.position.y}
   );
   chooseTarget(b);
  }

  if(b.position.y<r){
   Matter.Body.setPosition(
    b,
    {x:b.position.x,y:r}
   );
   chooseTarget(b);
  }

  if(b.position.y>floorY()-r){
   Matter.Body.setPosition(
    b,
    {
     x:b.position.x,
     y:floorY()-r
    }
   );
   chooseTarget(b);
  }
 });
}

function updateBombs(now){

 Matter.Composite.allBodies(engine.world)
 .forEach(function(b){

  if(b.plugin?.kind!=="bomb")return;

  if(bombRemaining(b,now)<=0){
   explodeBomb(b);
  }
 });
}

function draw(){

 if(!engine)return;

 const c=currentCanvas();
 const ctx=c.getContext("2d");
 const d=Math.min(devicePixelRatio||1,2);
 const s=canvasSize();

 ctx.setTransform(d,0,0,d,0,0);
 ctx.clearRect(0,0,s.w,s.h);

 ctx.save();

 ctx.translate(s.w/2,s.h);
 ctx.scale(zoom,zoom);
 ctx.translate(-s.w/2,-s.h);

 Matter.Composite.allBodies(engine.world)
 .forEach(function(b){

  if(b.label==="ground")return;

  const o=objectFromBody(b);

  if(!o)return;

  drawObject(ctx,b,o);
 });

 ctx.fillStyle="#594637";
 ctx.fillRect(
  0,
  s.h-36,
  s.w,
  36
 );

 ctx.restore();

 drawBombTimers(ctx);
 drawExplosions(ctx);

 if(mode==="editor"&&selected){
  drawEditorSelection(ctx,selected);
 }

 if(mode==="play"&&selected){
  drawPlaySelection(ctx,selected);
 }
}

function drawObject(ctx,b,o){

 const w=o.width||80;
 const h=o.height||45;

 ctx.save();

 ctx.translate(
  b.position.x,
  b.position.y
 );

 ctx.rotate(b.angle||0);

 if(isHouse(o)){

  const m=MATERIALS[materialType(o)];
  const t=Math.max(8,Math.min(w,h)*.18);

  ctx.fillStyle=m.color;

  if(materialType(o)==="glass"){
   ctx.globalAlpha=.5;
  }

  ctx.fillRect(-w/2,-h/2,w,t);
  ctx.fillRect(-w/2,h/2-t,w,t);
  ctx.fillRect(-w/2,-h/2,t,h);
  ctx.fillRect(w/2-t,-h/2,t,h);

  ctx.globalAlpha=1;

  ctx.strokeStyle="#222";
  ctx.strokeRect(-w/2,-h/2,w,h);

 }else if(o.type==="wood"){

  ctx.fillStyle=MATERIALS.wood.color;
  ctx.fillRect(-w/2,-h/2,w,h);

 }else if(o.type==="glass"){

  ctx.fillStyle=MATERIALS.glass.color;
  ctx.globalAlpha=.45;
  ctx.fillRect(-w/2,-h/2,w,h);
  ctx.globalAlpha=1;

  ctx.strokeStyle="#55a9cf";
  ctx.strokeRect(-w/2,-h/2,w,h);

 }else if(o.type==="stone"){

  ctx.fillStyle=MATERIALS.stone.color;
  ctx.fillRect(-w/2,-h/2,w,h);

 }else if(o.type==="bedrock"){

  ctx.fillStyle=MATERIALS.bedrock.color;
  ctx.fillRect(-w/2,-h/2,w,h);

 }else if(o.type==="multiplier"){

  ctx.fillStyle="#bd73df";
  ctx.fillRect(-w/2,-h/2,w,h);

  ctx.fillStyle="#fff";
  ctx.font="bold 24px sans-serif";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText("×"+(o.factor||2),0,0);

 }else if(o.type==="bomb"){

  ctx.fillStyle="#252525";

  ctx.beginPath();
  ctx.arc(0,0,13,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#a8652d";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.moveTo(7,-10);
  ctx.quadraticCurveTo(15,-19,10,-25);
  ctx.stroke();

 }else if([
  "dog",
  "bigDog",
  "armorDog",
  "movingDog"
 ].includes(o.type)){

  const r=o.type==="bigDog"?24:15;

  ctx.fillStyle=
   o.type==="armorDog"?
   "#737983":
   "#d39b63";

  ctx.beginPath();
  ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#222";

  ctx.beginPath();
  ctx.arc(-r*.35,-r*.12,2.5,0,Math.PI*2);
  ctx.arc(r*.35,-r*.12,2.5,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#f3c0a0";

  ctx.beginPath();
  ctx.arc(0,r*.25,r*.34,0,Math.PI*2);
  ctx.fill();

  if(o.type==="armorDog"){
   ctx.strokeStyle="#444";
   ctx.lineWidth=4;
   ctx.stroke();
  }

 }else if(
  o.type==="bombDropper"||
  o.type==="dogSpawner"
 ){

  ctx.fillStyle=
   o.enabled===false?
   "#777":
   o.type==="bombDropper"?
   "#4c718b":
   "#76548f";

  ctx.fillRect(-w/2,-h/2,w,h);

  ctx.fillStyle=
   o.enabled===false?
   "#e22":
   "#36c95a";

  ctx.beginPath();
  ctx.arc(
   w/2-12,
   -h/2+10,
   6,
   0,
   Math.PI*2
  );
  ctx.fill();

  ctx.fillStyle="#fff";
  ctx.font="bold 11px sans-serif";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  if(o.type==="bombDropper"){
   ctx.fillText(
    o.enabled===false?"OFF":"ON",
    0,
    2
   );
  }else{
   ctx.fillText(
    o.enabled===false?"OFF":"犬生成",
    0,
    2
   );
  }
 }

 ctx.restore();
}

function drawEditorSelection(ctx,b){

 const o=objectFromBody(b);
 if(!o)return;

 const p=toScreen(b.position);

 ctx.save();

 ctx.translate(p.x,p.y);
 ctx.rotate(b.angle||0);

 const w=(o.width||50)*zoom;
 const h=(o.height||40)*zoom;

 ctx.strokeStyle="#f80";
 ctx.lineWidth=3;

 ctx.strokeRect(
  -w/2-4,
  -h/2-4,
  w+8,
  h+8
 );

 if(editAction==="resize"){

  ctx.fillStyle="#fff";

  [
   [-w/2,-h/2],
   [w/2,-h/2],
   [-w/2,h/2],
   [w/2,h/2]
  ].forEach(function(q){

   ctx.fillRect(
    q[0]-6,
    q[1]-6,
    12,
    12
   );

   ctx.strokeRect(
    q[0]-6,
    q[1]-6,
    12,
    12
   );
  });
 }

 if(editAction==="rotate"){

  ctx.beginPath();
  ctx.moveTo(0,-h/2);
  ctx.lineTo(0,-h/2-40);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(
   0,
   -h/2-40,
   8,
   0,
   Math.PI*2
  );

  ctx.fill();
  ctx.stroke();
 }

 ctx.restore();
}

function drawPlaySelection(ctx,b){

 const o=objectFromBody(b);

 if(!o)return;

 const p=toScreen(b.position);

 ctx.save();

 ctx.translate(p.x,p.y);
 ctx.rotate(b.angle||0);

 const w=(o.width||30)*zoom;
 const h=(o.height||30)*zoom;

 ctx.strokeStyle="#f80";
 ctx.lineWidth=3;

 ctx.strokeRect(
  -w/2-4,
  -h/2-4,
  w+8,
  h+8
 );

 ctx.restore();
}

function drawBombTimers(ctx){

 const now=performance.now();

 Matter.Composite.allBodies(engine.world)
 .filter(function(b){
  return b.plugin?.kind==="bomb";
 })
 .forEach(function(b){

  const p=toScreen({
   x:b.position.x,
   y:b.position.y+20
  });

  const remain=bombRemaining(b,now);
  const text=remain.toFixed(1)+"秒";

  ctx.save();

  ctx.font="bold 13px sans-serif";
  ctx.textAlign="center";
  ctx.textBaseline="top";

  const width=ctx.measureText(text).width+10;

  ctx.fillStyle="#ffffffeF";

  ctx.fillRect(
   p.x-width/2,
   p.y,
   width,
   19
  );

  ctx.fillStyle=
   remain<=1?
   "#d22":
   "#222";

  ctx.fillText(
   text,
   p.x,
   p.y+2
  );

  ctx.restore();
 });
}

function drawExplosions(ctx){

 const now=performance.now();

 explosions.forEach(function(e){

  const q=(now-e.start)/e.duration;

  if(q>=1)return;

  const p=toScreen({
   x:e.x,
   y:e.y
  });

  const r=e.max*q*zoom;

  ctx.save();

  ctx.globalAlpha=1-q;

  const g=ctx.createRadialGradient(
   p.x,p.y,0,
   p.x,p.y,r
  );

  g.addColorStop(0,"#fff");
  g.addColorStop(.25,"#ffd45a");
  g.addColorStop(1,"transparent");

  ctx.fillStyle=g;

  ctx.beginPath();
  ctx.arc(
   p.x,
   p.y,
   r,
   0,
   Math.PI*2
  );

  ctx.fill();

  ctx.restore();
 });
}

function openModal(html){

 document.getElementById("modalBox").innerHTML=html;
 document.getElementById("modal").classList.remove("hidden");
}

function closeModal(){

 document.getElementById("modal").classList.add("hidden");
 document.getElementById("modalBox").innerHTML="";
}

function saveNew(){

 openModal(
  "<h3>新しく保存</h3>"+
  '<div class="row">'+
  "ステージ名"+
  '<input id="newName" value="'+esc(stage.name||"ステージ")+'">'+
  "</div>"+
  '<div class="row">'+
  '<button class="btn" id="doNewSave">保存</button>'+
  '<button class="btn white" id="cancelNewSave">閉じる</button>'+
  "</div>"
 );

 document.getElementById("doNewSave").onclick=function(){

  const n=deepCopy(stage);

  n.id=newId();

  n.name=
   document.getElementById("newName").value.trim()||
   "ステージ";

  const data=savedStages();

  data.push(n);

  writeStages(data);

  stage=deepCopy(n);

  closeModal();
 };

 document.getElementById("cancelNewSave").onclick=closeModal;
}

function overwriteSave(){

 openStageList("overwrite");
}

function overwriteStage(id){

 const data=savedStages();

 const index=data.findIndex(function(x){
  return x.id===id;
 });

 if(index<0)return;

 const oldName=data[index].name;

 const n=deepCopy(stage);

 n.id=id;
 n.name=oldName;

 data[index]=n;

 writeStages(data);

 stage=deepCopy(n);

 closeModal();
}

function exportData(){

 const blob=new Blob(
  [
   JSON.stringify(
    {
     version:5,
     stages:savedStages()
    },
    null,
    2
   )
  ],
  {
   type:"application/json"
  }
 );

 const a=document.createElement("a");

 a.href=URL.createObjectURL(blob);
 a.download="stage-data.json";

 document.body.appendChild(a);
 a.click();
 a.remove();

 setTimeout(function(){
  URL.revokeObjectURL(a.href);
 },1000);
}

function importData(){

 document.getElementById("fileInput").click();
}

document.getElementById("fileInput").addEventListener(
 "change",
 async function(e){

  const file=e.target.files[0];

  if(!file)return;

  try{

   const d=JSON.parse(await file.text());

   if(!Array.isArray(d.stages)){
    throw new Error();
   }

   const data=savedStages();

   d.stages.forEach(function(s){

    if(!s.id)s.id=newId();

    data.push(s);
   });

   writeStages(data);

   openModal(
    "<h3>読み込み完了</h3>"+
    "<p>ステージデータを読み込みました。</p>"+
    '<button class="btn" id="importOK">閉じる</button>'
   );

   document.getElementById("importOK").onclick=closeModal;

  }catch(err){

   openModal(
    "<h3>読み込み失敗</h3>"+
    "<p>ステージデータを読み込めませんでした。</p>"+
    '<button class="btn" id="importNG">閉じる</button>'
   );

   document.getElementById("importNG").onclick=closeModal;
  }

  e.target.value="";
 }
);

function changeZoom(v){

 zoom=Math.max(
  .65,
  Math.min(1.5,zoom+v)
 );
}

function loop(now){

 const dt=Math.min(
  33,
  now-lastTime
 );

 lastTime=now;

 if(engine){

  updateBombs(now);
  updateMachines(now);
  updateMovingDogs(now);

  Matter.Engine.update(
   engine,
   dt
  );

  explosions=
   explosions.filter(function(x){
    return now-x.start<x.duration;
   });

  draw();

  if(mode==="play"){

   const count=
    Matter.Composite.allBodies(engine.world)
    .filter(function(b){
     return b.plugin?.kind==="bomb";
    }).length;

   document.getElementById("playInfo").textContent=
    "爆弾 "+count+"個";
  }
 }

 requestAnimationFrame(loop);
}
