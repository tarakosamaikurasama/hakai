<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>日野市の街並みに歴史</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
width:100%;
min-height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
background:#fff7ee;
color:#333;
}

body{
overflow-x:hidden;
}

button,input{
font:inherit;
}

button{
border:0;
cursor:pointer;
touch-action:manipulation;
}

.hidden{
display:none!important;
}

.screen{
width:100%;
min-height:100vh;
}

/* =========================
TOP
========================= */

#titleScreen{
display:flex;
align-items:center;
justify-content:center;
padding:25px 16px;
}

.title-card{
width:min(700px,100%);
background:#fff;
border-radius:24px;
padding:35px 22px;
box-shadow:0 8px 30px rgba(120,70,20,.15);
text-align:center;
}

.logo{
font-size:clamp(27px,7vw,50px);
font-weight:900;
color:#f27b19;
text-shadow:0 3px 0 #ffd2a7;
margin-bottom:10px;
}

.subtitle{
color:#777;
font-size:15px;
margin-bottom:28px;
}

.menu-buttons{
display:flex;
flex-direction:column;
gap:14px;
}

.main-button{
min-height:62px;
border-radius:18px;
color:#fff;
font-size:20px;
font-weight:900;
background:linear-gradient(#ffad50,#ed7316);
box-shadow:0 5px 0 #c85d0b,0 8px 15px rgba(230,105,20,.22);
}

.main-button:active{
transform:translateY(4px);
box-shadow:0 1px 0 #c85d0b;
}

.sub-button{
min-height:52px;
border-radius:16px;
background:#fff;
border:2px solid #eee;
color:#555;
font-weight:800;
box-shadow:0 3px 8px rgba(0,0,0,.08);
}

.sub-button:active{
transform:translateY(2px);
}

/* =========================
GAME
========================= */

#gameScreen{
min-height:100vh;
padding:10px;
}

.game-wrapper{
width:min(1100px,100%);
margin:auto;
}

.topbar{
background:#fff;
border-radius:18px;
box-shadow:0 5px 20px rgba(100,60,20,.12);
padding:10px 12px;
margin-bottom:10px;
display:flex;
align-items:center;
gap:8px;
flex-wrap:wrap;
position:relative;
z-index:100;
}

.topbar-title{
font-weight:900;
color:#e96d15;
margin-right:auto;
}

.topbar button{
padding:9px 14px;
border-radius:13px;
background:#fff;
border:1px solid #eee;
font-weight:800;
}

.stage-wrapper{
position:relative;
width:100%;
height:min(70vh,680px);
min-height:420px;
background:#dff3ff;
border-radius:18px;
overflow:hidden;
box-shadow:0 8px 25px rgba(70,100,120,.16);
}

#gameCanvas{
display:block;
width:100%;
height:100%;
touch-action:none;
}

.toolbar{
margin-top:10px;
background:#fff;
border-radius:20px;
padding:12px;
box-shadow:0 5px 20px rgba(100,60,20,.12);
position:relative;
z-index:200;
}

.tool-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
}

/* 木の左に選択 */
.tool-row{
display:flex;
gap:6px;
}

.tool-row .tool{
flex:1;
}

.select-tool{
width:72px;
min-height:48px;
border-radius:15px;
background:#fff;
border:2px solid #eee;
font-weight:900;
color:#555;
}

.select-tool.active{
border-color:#f18a2c;
background:#fff2e4;
color:#df6811;
}

.tool{
min-height:48px;
border-radius:15px;
background:#fff;
border:2px solid #eee;
font-weight:900;
color:#555;
}

.tool.active{
border-color:#f18a2c;
background:#fff2e4;
color:#df6811;
box-shadow:inset 0 0 0 2px #ffd09e;
}

/* 操作3ボタン */
.edit-actions{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-top:8px;
padding:9px;
background:#fff8f0;
border-radius:16px;
}

.edit-action{
min-height:44px;
border-radius:13px;
background:#fff;
border:2px solid #eee;
font-weight:900;
color:#555;
}

.edit-action.active{
background:#ffe9d0;
border-color:#f18a2c;
color:#dc6810;
}

.action-row{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:10px;
}

.action-row button{
flex:1 1 150px;
min-height:48px;
border-radius:16px;
font-weight:900;
}

.explode{
color:#fff;
background:linear-gradient(#ff9f45,#e66b12);
box-shadow:0 4px 0 #c45a0b;
}

.back{
background:#fff;
border:2px solid #eee;
}

.factor-area,
.timer-area{
display:flex;
align-items:center;
gap:8px;
margin-top:10px;
padding:10px;
border-radius:15px;
background:#fff8f0;
}

.factor-area input,
.timer-area input{
width:90px;
height:42px;
border:2px solid #ffd2a6;
border-radius:12px;
text-align:center;
font-size:18px;
font-weight:900;
background:#fff;
}

/* =========================
LIST
========================= */

#stageListScreen{
padding:18px;
}

.list-wrapper{
width:min(700px,100%);
margin:auto;
}

.list-card{
background:#fff;
border-radius:22px;
padding:20px;
box-shadow:0 7px 25px rgba(100,60,20,.12);
}

.list-card h2{
margin-top:0;
color:#ed7519;
}

.stage-item{
display:flex;
gap:8px;
align-items:center;
margin-bottom:10px;
padding:12px;
border-radius:16px;
background:#fff8f0;
}

.stage-name{
flex:1;
font-weight:900;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.stage-item button{
border-radius:12px;
padding:9px 12px;
background:#fff;
border:1px solid #eee;
font-weight:800;
}

.empty{
color:#888;
text-align:center;
padding:25px;
}

/* =========================
MODAL
========================= */

.modal{
position:fixed;
inset:0;
background:rgba(40,25,10,.32);
backdrop-filter:blur(5px);
-webkit-backdrop-filter:blur(5px);
display:flex;
align-items:center;
justify-content:center;
padding:18px;
z-index:1000;
}

.modal-card{
width:min(500px,100%);
background:#fff;
border-radius:24px;
padding:22px;
box-shadow:0 12px 40px rgba(0,0,0,.22);
}

.modal-card h3{
margin-top:0;
color:#e96f15;
}

.modal-card input{
width:100%;
height:48px;
border:2px solid #eee;
border-radius:14px;
padding:0 13px;
margin-bottom:12px;
}

.modal-buttons{
display:flex;
gap:8px;
}

.modal-buttons button{
flex:1;
min-height:48px;
border-radius:15px;
font-weight:900;
}

@media(max-width:600px){

#gameScreen{
padding:7px;
}

.stage-wrapper{
height:55vh;
min-height:360px;
}

.topbar-title{
width:100%;
}

.logo{
font-size:31px;
}

.edit-actions{
grid-template-columns:repeat(3,1fr);
}

.edit-action{
font-size:13px;
}

.select-tool{
width:70px;
}
}
</style>
</head>

<body>

<section id="titleScreen" class="screen">
<div class="title-card">
<div class="logo">日野市の街並みに歴史</div>
<div class="subtitle">ステージメーカー</div>

<div class="menu-buttons">
<button class="main-button" id="makeStageBtn">ステージを作る</button>
<button class="sub-button" id="playStageBtn">ステージで遊ぶ</button>
</div>
</div>
</section>

<section id="gameScreen" class="screen hidden">

<div class="game-wrapper">

<div class="topbar">
<div class="topbar-title" id="modeTitle">ステージ作成</div>
<button id="saveBtn">保存</button>
<button id="stageListBtn">ステージ一覧</button>
<button id="homeBtn">ホーム</button>
</div>

<div class="stage-wrapper">
<canvas id="gameCanvas"></canvas>
</div>

<div class="toolbar">

<div class="tool-grid" id="editorTools">

<div class="tool-row">
<button class="tool" data-tool="wood">木</button>
<button class="select-tool" id="selectTool">選択</button>
</div>

<button class="tool" data-tool="glass">ガラス</button>
<button class="tool" data-tool="stone">石</button>
<button class="tool" data-tool="slime">スライム</button>
<button class="tool" data-tool="bomb">爆弾</button>
<button class="tool" data-tool="multiply">倍ブロック</button>
<button class="tool" data-tool="bedrock">岩盤</button>
<button class="tool" data-tool="delete">削除</button>

</div>

<div id="editActions" class="edit-actions hidden">

<button class="edit-action" data-action="move">移動</button>
<button class="edit-action" data-action="resize">形変更</button>
<button class="edit-action" data-action="rotate">回転</button>

</div>

<div class="factor-area">
<strong>倍数</strong>
<span>×</span>
<input id="factorInput" type="number" min="2" max="20" value="2">
</div>

<div class="timer-area">
<strong>爆発時間</strong>
<input id="timerInput" type="number" min="0.5" max="60" step="0.5" value="3">
<span>秒</span>
</div>

<div class="action-row">
<button class="explode" id="explodeBtn">全爆破</button>
<button class="back" id="clearBtn">すべて消す</button>
</div>

<div class="action-row">
<button class="back" id="editModeBtn">編集</button>
<button class="back" id="playModeBtn">遊ぶ</button>
</div>

</div>
</div>
</section>

<section id="stageListScreen" class="screen hidden">

<div class="list-wrapper">
<div class="list-card">

<h2>保存したステージ</h2>

<div id="stageList"></div>

<button class="sub-button" id="listBackBtn" style="width:100%;margin-top:10px;">
戻る
</button>

</div>
</div>

</section>

<div id="saveModal" class="modal hidden">

<div class="modal-card">

<h3>ステージを保存</h3>

<input id="stageNameInput" type="text" maxlength="40" placeholder="ステージ名">

<div class="modal-buttons">
<button class="sub-button" id="saveCancelBtn">キャンセル</button>
<button class="main-button" id="saveConfirmBtn">保存</button>
</div>

</div>

</div>

<script>
const {
Engine,
Bodies,
Body,
Composite,
Events,
Bounds,
Vector
}=Matter;

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

const titleScreen=document.getElementById("titleScreen");
const gameScreen=document.getElementById("gameScreen");
const stageListScreen=document.getElementById("stageListScreen");
const saveModal=document.getElementById("saveModal");

const FLOOR_HEIGHT=42;
const SAVE_KEY="hino_history_street_final";

let engine=null;
let bodies=[];
let selectedBody=null;

let currentTool=null;
let editAction=null;
let mode="editor";

let canvasWidth=0;
let canvasHeight=0;

let animationFrame=null;
let lastTime=performance.now();

let dragging=false;
let dragType=null;
let dragOffset={x:0,y:0};

let resizeCorner=null;

let explosions=[];

let multiplierId=1;

/*
  各爆弾について、
  「現在接触中の倍ブロック」
  を管理する。

  同じ倍ブロックから増えた爆弾は、
  その倍ブロックから離れるまで
  再び増殖できない。
*/
const activeMultipliers=new WeakMap();

function newId(){
return "m"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

/* =========================
CANVAS
========================= */

function resizeCanvas(){

if(gameScreen.classList.contains("hidden"))return;

const rect=canvas.getBoundingClientRect();

canvasWidth=Math.max(1,Math.floor(rect.width));
canvasHeight=Math.max(1,Math.floor(rect.height));

const dpr=Math.max(
1,
window.devicePixelRatio||1
);

canvas.width=canvasWidth*dpr;
canvas.height=canvasHeight*dpr;

ctx.setTransform(
dpr,
0,
0,
dpr,
0,
0
);

rebuildFloor();
}

/* =========================
SCREEN
========================= */

function showScreen(screen){

titleScreen.classList.add("hidden");
gameScreen.classList.add("hidden");
stageListScreen.classList.add("hidden");

screen.classList.remove("hidden");
}

/* =========================
ENGINE
========================= */

function createEngine(){

engine=Engine.create({
enableSleeping:false
});

engine.gravity.x=0;
engine.gravity.y=1;

engine.positionIterations=12;
engine.velocityIterations=10;
engine.constraintIterations=5;

installPhysicsEvents();

rebuildFloor();
}

function rebuildFloor(){

if(!engine)return;

Composite.allBodies(engine.world)
.filter(b=>b.isGroundBedrock)
.forEach(b=>{
Composite.remove(
engine.world,
b
);
});

if(canvasWidth<=0||canvasHeight<=0)return;

const floor=Bodies.rectangle(
canvasWidth/2,
canvasHeight-FLOOR_HEIGHT/2,
canvasWidth+100,
FLOOR_HEIGHT,
{
label:"groundBedrock",
isStatic:true,
isGroundBedrock:true,
restitution:0,
friction:1.5,
frictionStatic:5,
slop:0
}
);

Composite.add(
engine.world,
floor
);
}

/* =========================
PHYSICS EVENTS
========================= */

function installPhysicsEvents(){

Events.on(
engine,
"collisionStart",
event=>{

event.pairs.forEach(pair=>{

handleMultiplierCollision(
pair.bodyA,
pair.bodyB
);

handleMultiplierCollision(
pair.bodyB,
pair.bodyA
);

});
}
);

Events.on(
engine,
"collisionEnd",
event=>{

releaseMultiplier(
pairBodyA(pair),
pairBodyB(pair)
);

releaseMultiplier(
pairBodyB(pair),
pairBodyA(pair)
);

function pairBodyA(p){
return p.bodyA;
}

function pairBodyB(p){
return p.bodyB;
}

});
}

/*
  倍ブロックだけを処理。
  爆弾の衝撃による爆発処理は一切しない。
*/

function handleMultiplierCollision(a,b){

if(!a||!b)return;

if(a.blockType!=="bomb")return;
if(b.blockType!=="multiply")return;

if(!activeMultipliers.has(a)){
activeMultipliers.set(
a,
new Set()
);
}

const set=activeMultipliers.get(a);

if(set.has(b.multiplierId)){
return;
}

/*
  この瞬間に登録。
  生成された爆弾にも同じ登録を渡す。
*/

set.add(b.multiplierId);

multiplyBomb(
a,
b.factor,
b.multiplierId
);
}

function releaseMultiplier(a,b){

if(!a||!b)return;

if(a.blockType!=="bomb")return;
if(b.blockType!=="multiply")return;

const set=activeMultipliers.get(a);

if(set){
set.delete(
b.multiplierId
);
}
}

/* =========================
OBJECT CREATION
========================= */

function createObject(
type,
x,
y,
options={}
){

if(!engine)return null;

let w=70;
let h=45;

if(type==="bomb"){
w=34;
h=34;
}

if(type==="multiply"){
w=76;
h=54;
}

if(type==="bedrock"){
w=80;
h=48;
}

let body;

if(type==="slime"){

const r=25;

y=Math.min(
y,
canvasHeight-FLOOR_HEIGHT-r-3
);

y=Math.max(
r+2,
y
);

body=Bodies.circle(
x,
y,
r,
{
label:"slime",
blockType:"slime",
restitution:0,
friction:.9,
frictionStatic:2,
frictionAir:.025,
density:.002
}
);

body.baseW=r*2;
body.baseH=r*2;

}else{

y=Math.min(
y,
canvasHeight-FLOOR_HEIGHT-h/2-3
);

y=Math.max(
h/2+2,
y
);

body=Bodies.rectangle(
x,
y,
w,
h,
{
label:type,
blockType:type,

restitution:0,
friction:1,
frictionStatic:2,
frictionAir:.025,
density:.001,

/*
  倍ブロックは固定。
  岩盤も固定。
*/

isStatic:
type==="multiply"||
type==="bedrock",

/*
  倍ブロックはセンサー。
*/

isSensor:
type==="multiply"
}
);

body.baseW=w;
body.baseH=h;
}

body.maxHp=
type==="wood"?100:
type==="glass"?60:
type==="stone"?220:
type==="bedrock"?Infinity:
100;

body.hp=body.maxHp;

/* 倍ブロック */

if(type==="multiply"){

body.factor=Math.max(
2,
Math.min(
20,
Number(
options.factor ??
document.getElementById("factorInput").value
)||2
)
);

body.multiplierId=
"multiplier_"+multiplierId++;
}

/* 爆弾 */

if(type==="bomb"){

body.timerDuration=
(
Number(
options.timerDuration ??
document.getElementById("timerInput").value
)||3
)*1000;

body.createdAt=
performance.now();

body.exploded=false;

body.fromMultiplierId=
options.fromMultiplierId||
null;
}

bodies.push(body);

Composite.add(
engine.world,
body
);

return body;
}

/* =========================
MULTIPLY
========================= */

function multiplyBomb(
original,
factor,
sourceMultiplierId
){

if(!original||original.exploded){
return;
}

const x=original.position.x;
const y=original.position.y;

/*
  元爆弾が現在接触している
  すべての倍ブロックを取得。
*/

const originalSet=
activeMultipliers.has(original)
?activeMultipliers.get(original)
:new Set();

/*
  増殖した爆弾は元爆弾と同じ
  接触状態を引き継ぐ。

  これによって、生成直後に
  collisionStartが発生しても
  同じ倍ブロックでは再増殖しない。
*/

for(
let i=0;
i<factor-1;
i++
){

const bomb=createObject(
"bomb",
x,
y
);

if(!bomb)continue;

const newSet=new Set(
originalSet
);

activeMultipliers.set(
bomb,
newSet
);

bomb.fromMultiplierId=
sourceMultiplierId;

/*
  同じ場所に生成。
  少しずつ速度をずらすだけで、
  生成場所は完全に同じ。
*/

Body.setVelocity(
bomb,
{
x:(Math.random()-.5)*1.2,
y:(Math.random()-.5)*1.2
}
);
}
}

/* =========================
BOMB TIMER
========================= */

function updateBombTimers(now){

const bombs=bodies.filter(
b=>b.blockType==="bomb"
);

bombs.forEach(bomb=>{

if(bomb.exploded)return;

if(
now-bomb.createdAt>=
bomb.timerDuration
){

explodeBomb(bomb);
}
});
}

/* =========================
EXPLOSION
========================= */

function explodeBomb(bomb){

if(!bomb||bomb.exploded){
return;
}

bomb.exploded=true;

const x=bomb.position.x;
const y=bomb.position.y;

explosions.push({
x,
y,
start:performance.now(),
duration:520
});

const all=
Composite.allBodies(
engine.world
);

all.forEach(body=>{

if(body===bomb)return;
if(body.isStatic)return;
if(body.isGroundBedrock)return;

const dx=
body.position.x-x;

const dy=
body.position.y-y;

const dist=
Math.hypot(dx,dy);

if(dist>230||dist<1){
return;
}

const power=
(1-dist/230)*.045;

Body.applyForce(
body,
body.position,
{
x:dx/dist*power,
y:dy/dist*power
}
);

if(
mode==="play"&&
body.blockType!=="bomb"
){

const damage=
(1-dist/230)*80;

body.hp=Math.max(
0,
(body.hp??100)-damage
);

if(body.hp<=0){
destroyBody(body);
}
}
});

destroyBody(bomb);
}

/* =========================
DESTROY
========================= */

function destroyBody(body){

if(!body)return;

if(body.isGroundBedrock){
return;
}

Composite.remove(
engine.world,
body
);

bodies=bodies.filter(
b=>b!==body
);

if(selectedBody===body){
selectedBody=null;
}
}

/* =========================
CLEAR
========================= */

function clearObjects(){

[...bodies].forEach(body=>{

if(body.isGroundBedrock){
return;
}

Composite.remove(
engine.world,
body
);
});

bodies=[];
selectedBody=null;
}

/* =========================
POINTER
========================= */

function getPointer(e){

const rect=
canvas.getBoundingClientRect();

return{
x:e.clientX-rect.left,
y:e.clientY-rect.top
};
}

function pointInBody(body,p){

if(body.circleRadius){

return Math.hypot(
p.x-body.position.x,
p.y-body.position.y
)<=body.circleRadius+10;
}

const local=Vector.rotate(
{
x:p.x-body.position.x,
y:p.y-body.position.y
},
-body.angle
);

return(
Math.abs(local.x)<=body.baseW/2+8&&
Math.abs(local.y)<=body.baseH/2+8
);
}

function getBodyAt(p){

const all=
Composite.allBodies(
engine.world
);

for(
let i=all.length-1;
i>=0;
i--
){

const body=all[i];

if(body.isGroundBedrock){
continue;
}

if(pointInBody(body,p)){
return body;
}
}

return null;
}

/* =========================
ROTATION
========================= */

function getRotationHandle(body){

if(!body)return null;
if(body.isGroundBedrock)return null;

const distance=
Math.max(
body.baseH/2,
body.baseW/2
)+42;

const local={
x:0,
y:-distance
};

const rotated=
Vector.rotate(
local,
body.angle
);

return{
x:body.position.x+rotated.x,
y:body.position.y+rotated.y
};
}

function hitRotationHandle(body,p){

const h=
getRotationHandle(body);

if(!h)return false;

return Math.hypot(
p.x-h.x,
p.y-h.y
)<16;
}

/* =========================
RESIZE
========================= */

function getResizeHandles(body){

if(!body)return[];

if(
body.isGroundBedrock||
body.blockType==="slime"||
body.blockType==="bomb"
){
return[];
}

const hw=body.baseW/2;
const hh=body.baseH/2;

const points=[
{x:-hw,y:-hh,name:"tl"},
{x:hw,y:-hh,name:"tr"},
{x:-hw,y:hh,name:"bl"},
{x:hw,y:hh,name:"br"}
];

return points.map(point=>{

const rotated=
Vector.rotate(
{
x:point.x,
y:point.y
},
body.angle
);

return{
name:point.name,
x:body.position.x+rotated.x,
y:body.position.y+rotated.y
};
});
}

function getResizeHandle(body,p){

const handles=
getResizeHandles(body);

for(
const handle of handles
){

if(
Math.hypot(
p.x-handle.x,
p.y-handle.y
)<16
){
return handle.name;
}
}

return null;
}

/* =========================
POINTER DOWN
========================= */

function pointerDown(e){

e.preventDefault();

if(!engine)return;

const p=getPointer(e);

/*
  プレイモード
*/

if(mode==="play"){

createObject(
"bomb",
p.x,
p.y
);

return;
}

/*
  選択ボタンで
  編集操作モードに入っている場合
*/

if(currentTool==="select"){
return;
}

/*
  通常ツール
*/

if(currentTool){

if(currentTool==="delete"){

const body=getBodyAt(p);

if(
body&&
!body.isGroundBedrock
){
destroyBody(body);
}

return;
}

createObject(
currentTool,
p.x,
p.y
);

return;
}

/*
  選択操作
*/

if(!editAction){
return;
}

const body=getBodyAt(p);

if(!body){
selectedBody=null;
return;
}

selectedBody=body;

if(editAction==="move"){

dragging=true;
dragType="move";

dragOffset={
x:p.x-body.position.x,
y:p.y-body.position.y
};

Body.setSleeping(
body,
false
);

return;
}

if(editAction==="resize"){

const handle=
getResizeHandle(body,p);

if(handle){

resizeCorner=handle;
dragging=true;
dragType="resize";

Body.setSleeping(
body,
false
);

}

return;
}

if(editAction==="rotate"){

if(hitRotationHandle(body,p)){

dragging=true;
dragType="rotate";

Body.setSleeping(
body,
false
);
}

return;
}
}

/* =========================
POINTER MOVE
========================= */

function pointerMove(e){

if(
!dragging||
!selectedBody
){
return;
}

e.preventDefault();

const body=selectedBody;
const p=getPointer(e);

Body.setSleeping(
body,
false
);

if(dragType==="move"){

Body.setPosition(
body,
{
x:p.x-dragOffset.x,
y:p.y-dragOffset.y
}
);

Body.setVelocity(
body,
{x:0,y:0}
);

Body.setAngularVelocity(
body,
0
);

return;
}

if(dragType==="rotate"){

const angle=
Math.atan2(
p.y-body.position.y,
p.x-body.position.x
)+Math.PI/2;

Body.setAngle(
body,
angle
);

Body.setAngularVelocity(
body,
0
);

return;
}

if(dragType==="resize"){

resizeBody(
body,
p
);
}
}

/* =========================
RESIZE
========================= */

function resizeBody(body,p){

const dx=
p.x-body.position.x;

const dy=
p.y-body.position.y;

const local=
Vector.rotate(
{
x:dx,
y:dy
},
-body.angle
);

let newW=
Math.abs(local.x)*2;

let newH=
Math.abs(local.y)*2;

newW=Math.max(
25,
Math.min(
350,
newW
)
);

newH=Math.max(
25,
Math.min(
300,
newH
)
);

const oldW=
body.baseW||70;

const oldH=
body.baseH||45;

if(oldW<=0||oldH<=0){
return;
}

const sx=newW/oldW;
const sy=newH/oldH;

Body.scale(
body,
sx,
sy
);

body.baseW=newW;
body.baseH=newH;

Body.setVelocity(
body,
{x:0,y:0}
);

Body.setAngularVelocity(
body,
0
);

Body.setSleeping(
body,
false
);
}

/* =========================
POINTER UP
========================= */

function pointerUp(){

dragging=false;
dragType=null;
resizeCorner=null;

if(selectedBody){

Body.setSleeping(
selectedBody,
false
);
}
}

/* =========================
BODY
========================= */

function drawBody(body){

ctx.save();

ctx.translate(
body.position.x,
body.position.y
);

ctx.rotate(body.angle);

if(body.blockType==="wood"){
drawWood(body);
}
else if(body.blockType==="glass"){
drawGlass(body);
}
else if(body.blockType==="stone"){
drawStone(body);
}
else if(body.blockType==="slime"){
drawSlime(body);
}
else if(body.blockType==="bomb"){
drawBomb(body);
}
else if(body.blockType==="multiply"){
drawMultiply(body);
}
else if(body.blockType==="bedrock"){
drawBedrock(body);
}

ctx.restore();
}

/*
  丸角を使わず、
  角っとした形。
*/

function drawWood(body){

const w=body.baseW;
const h=body.baseH;

ctx.fillStyle="#c9853c";

ctx.fillRect(
-w/2,
-h/2,
w,
h
);

ctx.strokeStyle="#8d5723";
ctx.lineWidth=3;

ctx.strokeRect(
-w/2,
-h/2,
w,
h
);

ctx.strokeStyle="rgba(100,50,10,.35)";
ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(
-w*.3,
-h*.15
);

ctx.quadraticCurveTo(
0,
0,
w*.3,
h*.12
);

ctx.stroke();
}

function drawGlass(body){

const w=body.baseW;
const h=body.baseH;

ctx.fillStyle="rgba(170,225,255,.62)";

ctx.fillRect(
-w/2,
-h/2,
w,
h
);

ctx.strokeStyle="#78b9dc";
ctx.lineWidth=3;

ctx.strokeRect(
-w/2,
-h/2,
w,
h
);

ctx.strokeStyle="rgba(255,255,255,.8)";
ctx.lineWidth=3;

ctx.beginPath();

ctx.moveTo(
-w*.3,
-h*.25
);

ctx.lineTo(
w*.25,
h*.25
);

ctx.stroke();
}

function drawStone(body){

const w=body.baseW;
const h=body.baseH;

ctx.fillStyle="#888";

ctx.fillRect(
-w/2,
-h/2,
w,
h
);

ctx.strokeStyle="#5d5d5d";
ctx.lineWidth=3;

ctx.strokeRect(
-w/2,
-h/2,
w,
h
);

ctx.fillStyle="#aaa";

for(let i=0;i<4;i++){

const xx=
-w/2+(i+1)*w/5;

const yy=
-h/2+(i%2)*h*.35;

ctx.beginPath();

ctx.arc(
xx,
yy,
4,
0,
Math.PI*2
);

ctx.fill();
}
}

function drawSlime(body){

const r=
body.circleRadius||25;

ctx.beginPath();

ctx.arc(
0,
0,
r,
0,
Math.PI*2
);

ctx.fillStyle="#69cf65";
ctx.fill();

ctx.strokeStyle="#3e9d45";
ctx.lineWidth=3;
ctx.stroke();

ctx.fillStyle="#222";

ctx.beginPath();

ctx.arc(
-r*.3,
-r*.12,
4,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
r*.3,
-r*.12,
4,
0,
Math.PI*2
);

ctx.fill();
}

function drawBomb(body){

const r=
body.circleRadius||17;

ctx.beginPath();

ctx.arc(
0,
0,
r,
0,
Math.PI*2
);

ctx.fillStyle="#333";
ctx.fill();

ctx.strokeStyle="#111";
ctx.lineWidth=3;
ctx.stroke();

ctx.strokeStyle="#e99b32";
ctx.lineWidth=4;

ctx.beginPath();

ctx.moveTo(
3,
-r
);

ctx.quadraticCurveTo(
12,
-r-12,
18,
-r-5
);

ctx.stroke();

ctx.fillStyle="#ffbd38";

ctx.beginPath();

ctx.arc(
18,
-r-5,
4,
0,
Math.PI*2
);

ctx.fill();

const remaining=
Math.max(
0,
body.timerDuration-
(performance.now()-body.createdAt)
);

ctx.fillStyle="#222";
ctx.font="900 10px sans-serif";
ctx.textAlign="center";

ctx.fillText(
(remaining/1000).toFixed(1),
0,
r+14
);
}

function drawMultiply(body){

const w=body.baseW;
const h=body.baseH;

ctx.fillStyle="#79d68b";

ctx.fillRect(

/* =========================
SELECTION
========================= */

function drawSelection(){

const body=selectedBody;

if(!body)return;
if(body.isGroundBedrock)return;

ctx.save();

if(
editAction==="resize"
){

const handles=
getResizeHandles(body);

ctx.strokeStyle="#f07b1a";
ctx.lineWidth=2;
ctx.setLineDash([6,5]);

ctx.save();

ctx.translate(
body.position.x,
body.position.y
);

ctx.rotate(body.angle);

ctx.strokeRect(
-body.baseW/2-5,
-body.baseH/2-5,
body.baseW+10,
body.baseH+10
);

ctx.restore();

ctx.setLineDash([]);

handles.forEach(handle=>{

ctx.fillStyle="#fff";
ctx.strokeStyle="#e96e15";
ctx.lineWidth=2;

ctx.beginPath();

ctx.arc(
handle.x,
handle.y,
7,
0,
Math.PI*2
);

ctx.fill();
ctx.stroke();
});
}

if(
editAction==="rotate"
){

const rh=
getRotationHandle(body);

ctx.strokeStyle="#e96e15";
ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(
body.position.x,
body.position.y
);

ctx.lineTo(
rh.x,
rh.y
);

ctx.stroke();

ctx.fillStyle="#fff";
ctx.strokeStyle="#e96e15";
ctx.lineWidth=2;

ctx.beginPath();

ctx.arc(
rh.x,
rh.y,
8,
0,
Math.PI*2
);

ctx.fill();
ctx.stroke();
}

if(
editAction==="move"
){

ctx.strokeStyle="#f07b1a";
ctx.lineWidth=3;
ctx.setLineDash([7,5]);

ctx.save();

ctx.translate(
body.position.x,
body.position.y
);

ctx.rotate(body.angle);

ctx.strokeRect(
-body.baseW/2-5,
-body.baseH/2-5,
body.baseW+10,
body.baseH+10
);

ctx.restore();

ctx.setLineDash([]);
}

ctx.restore();
}

/* =========================
EXPLOSION
========================= */

function drawExplosions(){

const now=performance.now();

explosions=
explosions.filter(ex=>{

const elapsed=
now-ex.start;

if(
elapsed>=ex.duration
){
return false;
}

const t=
elapsed/ex.duration;

const radius=
20+135*t;

const alpha=1-t;

const gradient=
ctx.createRadialGradient(
ex.x,
ex.y,
0,
ex.x,
ex.y,
radius
);

gradient.addColorStop(
0,
"rgba(255,255,180,"+
(.95*alpha)+")"
);

gradient.addColorStop(
.35,
"rgba(255,175,45,"+
(.7*alpha)+")"
);

gradient.addColorStop(
1,
"rgba(255,80,20,0)"
);

ctx.fillStyle=gradient;

ctx.beginPath();

ctx.arc(
ex.x,
ex.y,
radius,
0,
Math.PI*2
);

ctx.fill();

ctx.strokeStyle=
"rgba(255,100,20,"+
alpha+")";

ctx.lineWidth=5;

ctx.beginPath();

ctx.arc(
ex.x,
ex.y,
radius*.72,
0,
Math.PI*2
);

ctx.stroke();

return true;
});
}

function loadStage(
stage,
newMode
){

showScreen(gameScreen);

setTimeout(()=>{

resizeCanvas();

if(!engine){
createEngine();
}

clearObjects();

resizeCanvas();

stage.objects.forEach(obj=>{

const body=
createObject(
obj.type,
obj.x,
obj.y,
{
factor:obj.factor,
timerDuration:obj.timer
}
);

if(!body)return;

Body.setAngle(
body,
obj.angle||0
);

if(
obj.width&&
obj.height&&
body.blockType!=="bomb"&&
body.blockType!=="slime"
){

const oldW=body.baseW;
const oldH=body.baseH;

Body.scale(
body,
obj.width/oldW,
obj.height/oldH
);

body.baseW=obj.width;
body.baseH=obj.height;
}

if(body.blockType==="multiply"){

body.factor=Math.max(
2,
Math.min(
20,
Number(obj.factor)||2
)
);
}

if(body.blockType==="bomb"){

body.timerDuration=
Number(obj.timer||3)*1000;

body.createdAt=
performance.now();
}

Body.setSleeping(
body,
false
);

});

setMode(newMode);

},30);
}

localStorage.setItem(

JSON.stringify(
stages.filter(
s=>s.id!==id
)
)
);

showStageList();
}

document.getElementById(
"listBackBtn"
).addEventListener(
"click",
()=>showScreen(titleScreen)
);

/* =========================
INPUT
========================= */

document.getElementById(
"factorInput"
).addEventListener(
"change",
e=>{

let v=
Math.floor(
Number(e.target.value)||2
);

v=Math.max(
2,
Math.min(
20,
v
)
);

e.target.value=v;

}
);

document.getElementById(
"timerInput"
).addEventListener(
"change",
e=>{

let v=
Number(e.target.value)||3;

v=Math.max(
.5,
Math.min(
60,
v
)
);

e.target.value=v;

}
);

window.addEventListener(
"resize",
resizeCanvas
);

showScreen(titleScreen);
</script>

</body>
</html>
