<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>日野市の街並みに歴史</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:#f4f4f4;
  color:#222;
  overflow:hidden;
}

button{
  border:0;
  cursor:pointer;
  font:inherit;
  touch-action:manipulation;
  position:relative;
  z-index:20;
}

button:active{
  transform:translateY(1px);
}

#app{
  width:100%;
  height:100%;
}

.screen{
  width:100%;
  height:100%;
  display:none;
}

.screen.active{
  display:flex;
}

/* =========================
   スタート画面
========================= */

#startScreen{
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 20%,#fff 0,#f7f7f7 45%,#ededed 100%);
}

.startBox{
  width:min(92%,600px);
  text-align:center;
}

.startTitle{
  font-size:clamp(32px,8vw,62px);
  font-weight:900;
  letter-spacing:.04em;
  margin:0 0 36px;
  text-shadow:0 3px 0 #fff;
}

.startSub{
  font-size:15px;
  color:#777;
  margin-bottom:24px;
}

.startButtons{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.mainButton{
  min-height:64px;
  padding:15px 24px;
  border-radius:18px;
  background:#f80;
  color:white;
  font-size:21px;
  font-weight:800;
  box-shadow:0 5px 0 #c96500;
}

.mainButton.white{
  background:white;
  color:#333;
  box-shadow:0 4px 0 #ccc;
}

/* =========================
   ゲーム画面
========================= */

#gameScreen{
  flex-direction:column;
  background:#eaeaea;
}

.topbar{
  flex:0 0 auto;
  height:64px;
  background:white;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
  z-index:100;
}

.topTitle{
  font-weight:900;
  font-size:20px;
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.smallButton{
  min-height:44px;
  padding:8px 14px;
  border-radius:13px;
  background:white;
  box-shadow:0 3px 0 #ccc;
  font-weight:800;
}

.orangeButton{
  background:#f80;
  color:white;
  box-shadow:0 3px 0 #c96500;
}

#gameArea{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
}

#canvasWrap{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:
    linear-gradient(#dceff8 0%,#eaf7fb 72%,#d7d7d7 72%,#d7d7d7 100%);
}

#gameCanvas{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  display:block;
}

/* =========================
   設置メニュー
========================= */

#editorPanel{
  position:absolute;
  left:10px;
  top:10px;
  width:min(280px,calc(100% - 20px));
  max-height:calc(100% - 20px);
  overflow:auto;
  background:rgba(255,255,255,.96);
  border-radius:18px;
  padding:12px;
  box-shadow:0 5px 25px rgba(0,0,0,.18);
  z-index:50;
  overscroll-behavior:contain;
}

.panelTitle{
  font-weight:900;
  font-size:17px;
  margin-bottom:9px;
}

#blockSelectArea{
  display:flex;
  align-items:stretch;
  gap:7px;
}

#selectButton{
  width:70px;
  flex:0 0 70px;
  border-radius:13px;
  background:#f80;
  color:white;
  font-weight:900;
  box-shadow:0 3px 0 #c96500;
  z-index:100;
}

.blockList{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.blockButton{
  min-height:42px;
  border-radius:11px;
  background:#fff;
  border:2px solid #ddd;
  font-size:14px;
  font-weight:800;
  z-index:100;
}

.blockButton.selected{
  border-color:#f80;
  background:#fff4e8;
  color:#d66a00;
}

#editActions{
  display:none;
  margin-top:12px;
  padding-top:11px;
  border-top:2px solid #eee;
}

#editActions.visible{
  display:block;
}

.actionTitle{
  font-size:14px;
  font-weight:900;
  margin-bottom:7px;
}

.actionButtons{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
}

.actionButton{
  min-height:42px;
  border-radius:11px;
  background:#fff;
  border:2px solid #ddd;
  font-weight:800;
  font-size:14px;
}

.actionButton.active{
  background:#f80;
  color:white;
  border-color:#f80;
}

#factorBox,
#timerBox{
  margin-top:9px;
  display:none;
}

#factorBox.visible,
#timerBox.visible{
  display:block;
}

.controlRow{
  display:flex;
  align-items:center;
  gap:7px;
}

.controlRow input{
  width:75px;
  padding:7px;
  border:2px solid #ddd;
  border-radius:9px;
  font-size:16px;
}

.panelButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:11px;
}

.panelButton{
  min-height:43px;
  border-radius:12px;
  background:#fff;
  box-shadow:0 2px 0 #ccc;
  font-weight:800;
}

.panelButton.orange{
  background:#f80;
  color:#fff;
  box-shadow:0 3px 0 #c96500;
}

#status{
  position:absolute;
  right:10px;
  top:10px;
  z-index:40;
  background:rgba(255,255,255,.94);
  border-radius:13px;
  padding:9px 13px;
  font-size:13px;
  font-weight:800;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

#playControls{
  display:none;
  position:absolute;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  z-index:60;
  gap:10px;
}

#playControls button{
  min-height:52px;
  padding:10px 20px;
  border-radius:16px;
  font-weight:900;
  background:white;
  box-shadow:0 4px 0 #ccc;
}

#playControls .danger{
  background:#f80;
  color:#fff;
  box-shadow:0 4px 0 #c96500;
}

#message{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:200;
  display:none;
  background:rgba(255,255,255,.97);
  padding:22px 28px;
  border-radius:20px;
  box-shadow:0 8px 30px rgba(0,0,0,.2);
  font-weight:900;
  text-align:center;
}

/* スマホ */
@media(max-width:600px){
  .topbar{
    height:56px;
  }

  .topTitle{
    font-size:16px;
  }

  .smallButton{
    font-size:12px;
    padding:7px 10px;
  }

  #editorPanel{
    width:270px;
  }

  #status{
    top:auto;
    bottom:10px;
    right:10px;
  }
}
</style>
</head>

<body>
<div id="app">

  <!-- スタート画面 -->
  <section id="startScreen" class="screen active">
    <div class="startBox">
      <h1 class="startTitle">スライム城崩しメーカー</h1>
      <div class="startSub">日野市の街並みに歴史</div>

      <div class="startButtons">
        <button id="makeStageButton" class="mainButton">
          ステージを作る
        </button>

        <button id="playStageButton" class="mainButton white">
          ステージで遊ぶ
        </button>
      </div>
    </div>
  </section>

  <!-- ゲーム画面 -->
  <section id="gameScreen" class="screen">

    <div class="topbar">
      <div class="topTitle">日野市の街並みに歴史</div>
      <button id="backButton" class="smallButton">戻る</button>
      <button id="clearButton" class="smallButton">全消去</button>
      <button id="saveButton" class="smallButton orangeButton">保存</button>
    </div>

    <div id="gameArea">

      <div id="canvasWrap">
        <canvas id="gameCanvas"></canvas>
      </div>

      <!-- 設置メニュー -->
      <div id="editorPanel">

        <div class="panelTitle">設置するブロックを選ぶ</div>

        <div id="blockSelectArea">

          <button id="selectButton">選択</button>

          <div class="blockList">
            <button class="blockButton" data-type="wood">木</button>
            <button class="blockButton" data-type="glass">ガラス</button>
            <button class="blockButton" data-type="stone">石</button>
            <button class="blockButton" data-type="slime">スライム</button>
            <button class="blockButton" data-type="bomb">爆弾</button>
            <button class="blockButton" data-type="multiply">倍ブロック</button>
            <button class="blockButton" data-type="bedrock">岩盤</button>
          </div>

        </div>

        <!-- 選択後の操作 -->
        <div id="editActions">

          <div class="actionTitle">選択したブロックの操作</div>

          <div class="actionButtons">
            <button class="actionButton" data-action="move">移動</button>
            <button class="actionButton" data-action="resize">形変更</button>
            <button class="actionButton" data-action="rotate">回転</button>
          </div>

        </div>

        <div id="factorBox">
          <div class="controlRow">
            <span>倍率</span>
            <input id="factorInput" type="number" min="2" max="20" value="2">
          </div>
        </div>

        <div id="timerBox">
          <div class="controlRow">
            <span>爆発秒数</span>
            <input id="timerInput" type="number" min="0.5" max="60" step="0.5" value="5">
          </div>
        </div>

        <div class="panelButtons">
          <button id="deleteButton" class="panelButton">選択削除</button>
          <button id="testButton" class="panelButton orange">試す</button>
        </div>

      </div>

      <div id="status">設置モード</div>

      <div id="playControls">
        <button id="bombButton">爆弾を設置</button>
        <button id="explodeAllButton" class="danger">全爆破</button>
      </div>

      <div id="message"></div>

    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>

<script>
(function(){

"use strict";

const {
  Engine,
  Bodies,
  Body,
  Composite,
  Events,
  Vector
} = Matter;

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const gameScreen = document.getElementById("gameScreen");
const gameArea = document.getElementById("gameArea");

const editorPanel = document.getElementById("editorPanel");
const selectButton = document.getElementById("selectButton");
const editActions = document.getElementById("editActions");

const status = document.getElementById("status");
const factorBox = document.getElementById("factorBox");
const timerBox = document.getElementById("timerBox");

const factorInput = document.getElementById("factorInput");
const timerInput = document.getElementById("timerInput");

const playControls = document.getElementById("playControls");

let engine = null;
let canvasWidth = 0;
let canvasHeight = 0;

let animationFrame = 0;
let lastTime = performance.now();

let mode = "editor";
let currentTool = "wood";
let editAction = null;

let selectedBody = null;
let dragging = false;
let dragOffset = {x:0,y:0};
let rotateStart = 0;
let resizeStart = null;

let explosions = [];

const activeMultipliers = new WeakMap();

const FLOOR_HEIGHT = 44;
const STORAGE_KEY = "hino_history_street_final_v2";

/* =========================
   ID
========================= */

function newId(){
  return "id_" +
    Date.now().toString(36) +
    "_" +
    Math.random().toString(36).slice(2,10);
}

/* =========================
   エンジン
========================= */

function createEngine(){

  engine = Engine.create({
    enableSleeping:false
  });

  engine.gravity.y = 1;

  engine.positionIterations = 12;
  engine.velocityIterations = 10;
  engine.constraintIterations = 5;

  installPhysicsEvents();

  rebuildFloor();
}

/* =========================
   キャンバス
========================= */

function resizeCanvas(){

  const rect = gameArea.getBoundingClientRect();

  canvasWidth = Math.max(1,Math.floor(rect.width));
  canvasHeight = Math.max(1,Math.floor(rect.height));

  const dpr = Math.min(window.devicePixelRatio || 1,2);

  canvas.width = canvasWidth * dpr;
  canvas.height = canvasHeight * dpr;

  canvas.style.width = canvasWidth + "px";
  canvas.style.height = canvasHeight + "px";

  ctx.setTransform(dpr,0,0,dpr,0,0);

  if(engine){
    rebuildFloor();
  }
}

/* =========================
   床
========================= */

function rebuildFloor(){

  if(!engine) return;

  const oldFloor = Composite.allBodies(engine.world)
    .filter(b => b.isGroundBedrock);

  oldFloor.forEach(b => Composite.remove(engine.world,b));

  const floor = Bodies.rectangle(
    canvasWidth / 2,
    canvasHeight - FLOOR_HEIGHT / 2,
    canvasWidth + 100,
    FLOOR_HEIGHT,
    {
      label:"groundBedrock",
      isStatic:true,
      isGroundBedrock:true,
      restitution:0,
      friction:1.5,
      frictionStatic:5,
      slop:0
    }
  );

  Composite.add(engine.world,floor);
}

/* =========================
   ブロック作成
========================= */

function createObject(type,x,y,options={}){

  let w = options.width || 70;
  let h = options.height || 45;

  if(type === "bomb"){
    w = options.width || 34;
    h = options.height || 34;
  }

  if(type === "slime"){
    w = options.width || 50;
    h = options.height || 42;
  }

  if(type === "multiply"){
    w = options.width || 76;
    h = options.height || 54;
  }

  if(type === "bedrock"){
    w = options.width || 80;
    h = options.height || 48;
  }

  const common = {
    label:type,
    angle:options.angle || 0,
    restitution:0.05,
    friction:.8,
    frictionStatic:1,
    density:0.002,
    chamfer:{radius:0}
  };

  let body;

  if(type === "slime"){
    body = Bodies.circle(
      x,
      y,
      Math.min(w,h)/2,
      common
    );
  }else{
    body = Bodies.rectangle(
      x,
      y,
      w,
      h,
      common
    );
  }

  body.myId = options.id || newId();
  body.objectType = type;

  body.baseW = w;
  body.baseH = h;

  body.factor = Number(options.factor || 2);

  body.timerDuration =
    Number(options.timer || 5) * 1000;

  body.createdAt = performance.now();
  body.exploded = false;

  body.fromMultiplierId =
    options.fromMultiplierId || null;

  if(type === "multiply"){

    body.isStatic = true;
    body.isSensor = true;

    body.restitution = 0;
    body.friction = 0;

  }

  if(type === "bedrock"){

    body.isStatic = true;

    body.restitution = 0;
    body.friction = 1.5;

  }

  Composite.add(engine.world,body);

  activeMultipliers.set(
    body,
    new Set()
  );

  return body;
}

/* =========================
   物理イベント
========================= */

function installPhysicsEvents(){

  Events.on(engine,"collisionStart",event => {

    for(const pair of event.pairs){

      const a = pair.bodyA;
      const b = pair.bodyB;

      checkMultiplier(a,b);
      checkMultiplier(b,a);
    }

  });

  Events.on(engine,"collisionEnd",event => {

    for(const pair of event.pairs){

      releaseMultiplier(pair.bodyA,pair.bodyB);
      releaseMultiplier(pair.bodyB,pair.bodyA);
    }

  });
}

function isBomb(body){
  return body && body.objectType === "bomb";
}

function isMultiplier(body){
  return body && body.objectType === "multiply";
}

function checkMultiplier(bomb,other){

  if(!isBomb(bomb) || !isMultiplier(other)){
    return;
  }

  let set = activeMultipliers.get(bomb);

  if(!set){
    set = new Set();
    activeMultipliers.set(bomb,set);
  }

  if(set.has(other.myId)){
    return;
  }

  set.add(other.myId);

  multiplyBomb(
    bomb,
    other.factor,
    other.myId
  );
}

function releaseMultiplier(bomb,other){

  if(!isBomb(bomb) || !isMultiplier(other)){
    return;
  }

  const set = activeMultipliers.get(bomb);

  if(set){
    set.delete(other.myId);
  }
}

/* =========================
   倍ブロック
========================= */

function multiplyBomb(original,factor,sourceId){

  factor = Math.max(2,Math.min(20,Math.floor(factor)));

  const set =
    activeMultipliers.get(original) ||
    new Set();

  for(let i=0;i<factor-1;i++){

    const bomb = createObject(
      "bomb",
      original.position.x,
      original.position.y,
      {
        width:original.baseW,
        height:original.baseH,
        angle:original.angle,
        timer:original.timerDuration / 1000,
        fromMultiplierId:sourceId
      }
    );

    /*
      元の爆弾が現在接触している倍ブロックを
      生成された爆弾にも記録する。

      これにより、
      倍ブロックの中に生成された瞬間に
      無限増殖することを防ぐ。
    */
    const newSet = new Set(set);
    newSet.add(sourceId);

    activeMultipliers.set(
      bomb,
      newSet
    );
  }
}

/* =========================
   爆発
========================= */

function explodeBomb(bomb){

  if(!bomb || bomb.exploded){
    return;
  }

  bomb.exploded = true;

  const center = {
    x:bomb.position.x,
    y:bomb.position.y
  };

  const bodies =
    Composite.allBodies(engine.world);

  for(const body of bodies){

    if(
      body === bomb ||
      body.isStatic ||
      body.isGroundBedrock ||
      body.objectType === "multiply"
    ){
      continue;
    }

    const dx =
      body.position.x - center.x;

    const dy =
      body.position.y - center.y;

    const distance =
      Math.sqrt(dx*dx + dy*dy);

    const radius = 230;

    if(distance > radius){
      continue;
    }

    const power =
      (1 - distance/radius) * 0.08;

    const length =
      Math.sqrt(dx*dx + dy*dy) || 1;

    Body.applyForce(
      body,
      body.position,
      {
        x:(dx/length) * power,
        y:(dy/length) * power
      }
    );

    if(mode === "play"){
      damageBody(body);
    }
  }

  explosions.push({
    x:center.x,
    y:center.y,
    start:performance.now()
  });

  Composite.remove(
    engine.world,
    bomb
  );
}

/* =========================
   ダメージ
========================= */

function damageBody(body){

  if(
    body.objectType === "bomb" ||
    body.objectType === "multiply" ||
    body.objectType === "bedrock" ||
    body.isGroundBedrock
  ){
    return;
  }

  body.damage =
    (body.damage || 0) + 1;

  if(body.damage >= 1){

    Composite.remove(
      engine.world,
      body
    );

    if(selectedBody === body){
      selectedBody = null;
    }
  }
}

/* =========================
   タイマー
========================= */

function updateBombTimers(now){

  const bodies =
    Composite.allBodies(engine.world);

  for(const body of bodies){

    if(!isBomb(body)){
      continue;
    }

    if(body.exploded){
      continue;
    }

    /*
      爆弾が爆発する条件は時間だけ。
      衝撃・落下・ブロック接触では爆発しない。
    */

    if(
      now - body.createdAt >=
      body.timerDuration
    ){

      explodeBomb(body);
    }
  }
}

/* =========================
   爆発エフェクト
========================= */

function drawExplosions(now){

  explosions =
    explosions.filter(e =>
      now - e.start < 550
    );

  for(const e of explosions){

    const t =
      (now-e.start)/550;

    const radius =
      20 + t*120;

    ctx.save();

    const gradient =
      ctx.createRadialGradient(
        e.x,e.y,0,
        e.x,e.y,radius
      );

    gradient.addColorStop(0,"rgba(255,255,255,"+(1-t)+")");
    gradient.addColorStop(.3,"rgba(255,170,40,"+(1-t)+")");
    gradient.addColorStop(1,"rgba(255,80,0,0)");

    ctx.fillStyle = gradient;

    ctx.beginPath();
    ctx.arc(
      e.x,
      e.y,
      radius,
      0,
      Math.PI*2
    );
    ctx.fill();

    ctx.restore();
  }
}

/* =========================
   描画
========================= */

function render(){

  ctx.clearRect(
    0,
    0,
    canvasWidth,
    canvasHeight
  );

  drawBackground();

  if(!engine){
    return;
  }

  const bodies =
    Composite.allBodies(engine.world);

  for(const body of bodies){

    if(body.isGroundBedrock){
      drawFloor(body);
      continue;
    }

    drawBody(body);
  }

  drawSelection();

  drawExplosions(
    performance.now()
  );
}

function drawBackground(){

  const gradient =
    ctx.createLinearGradient(
      0,0,
      0,canvasHeight
    );

  gradient.addColorStop(0,"#dff3fb");
  gradient.addColorStop(.72,"#edf9fc");
  gradient.addColorStop(.72,"#d8d8d8");
  gradient.addColorStop(1,"#c9c9c9");

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,0,
    canvasWidth,
    canvasHeight
  );
}

function drawFloor(body){

  ctx.save();

  ctx.fillStyle = "#777";

  ctx.fillRect(
    0,
    canvasHeight-FLOOR_HEIGHT,
    canvasWidth,
    FLOOR_HEIGHT
  );

  ctx.strokeStyle = "#555";
  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.moveTo(
    0,
    canvasHeight-FLOOR_HEIGHT
  );

  ctx.lineTo(
    canvasWidth,
    canvasHeight-FLOOR_HEIGHT
  );

  ctx.stroke();

  ctx.fillStyle = "#eee";
  ctx.font = "bold 14px sans-serif";
  ctx.textAlign = "center";

  ctx.fillText(
    "消せない岩盤",
    canvasWidth/2,
    canvasHeight-16
  );

  ctx.restore();
}

function drawBody(body){

  const type =
    body.objectType;

  const pos =
    body.position;

  ctx.save();

  ctx.translate(
    pos.x,
    pos.y
  );

  ctx.rotate(body.angle);

  let w = body.baseW;
  let h = body.baseH;

  if(type === "wood"){

    ctx.fillStyle = "#9b5b2b";
    ctx.strokeStyle = "#633512";
    ctx.lineWidth = 3;

    ctx.fillRect(
      -w/2,
      -h/2,
      w,
      h
    );

    ctx.strokeRect(
      -w/2,
      -h/2,
      w,
      h
    );

    ctx.strokeStyle = "rgba(255,255,255,.2)";
    ctx.lineWidth = 2;

    for(let y=-h/3;y<h/2;y+=10){

      ctx.beginPath();
      ctx.moveTo(-w/2,y);
      ctx.lineTo(w/2,y+2);
      ctx.stroke();
    }

  }else if(type === "glass"){

    ctx.fillStyle = "rgba(110,205,240,.55)";
    ctx.strokeStyle = "#429ab8";
    ctx.lineWidth = 3;

    ctx.fillRect(
      -w/2,
      -h/2,
      w,
      h
    );

    ctx.strokeRect(
      -w/2,
      -h/2,
      w,
      h
    );

  }else if(type === "stone"){

    ctx.fillStyle = "#858585";
    ctx.strokeStyle = "#4f4f4f";
    ctx.lineWidth = 3;

    ctx.fillRect(
      -w/2,
      -h/2,
      w,
      h
    );

    ctx.strokeRect(
      -w/2,
      -h/2,
      w,
      h
    );

  }else if(type === "bedrock"){

    ctx.fillStyle = "#454545";
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 4;

    ctx.fillRect(
      -w/2,
      -h/2,
      w,
      h
    );

    ctx.strokeRect(
      -w/2,
      -h/2,
      w,
      h
    );

  }else if(type === "multiply"){

    ctx.fillStyle = "#ffd84a";
    ctx.strokeStyle = "#b38a00";
    ctx.lineWidth = 3;

    ctx.fillRect(
      -w/2,
      -h/2,
      w,
      h
    );

    ctx.strokeRect(
      -w/2,
      -h/2,
      w,
      h
    );

    ctx.fillStyle = "#5c4800";
    ctx.font = "900 20px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
      "×"+body.factor,
      0,
      0
    );

  }else if(type === "bomb"){

    ctx.fillStyle = "#222";
    ctx.strokeStyle = "#111";
    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      Math.min(w,h)/2,
      0,
      Math.PI*2
    );

    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(
      -7,
      -7,
      4,
      0,
      Math.PI*2
    );
    ctx.fill();

  }else if(type === "slime"){

    ctx.fillStyle = "#72d45a";
    ctx.strokeStyle = "#388c2a";
    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.arc(
      0,
      4,
      Math.min(w,h)/2,
      Math.PI,
      0
    );

    ctx.lineTo(
      w/2,
      h/2
    );

    ctx.lineTo(
      -w/2,
      h/2
    );

    ctx.closePath();

    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#111";

    ctx.beginPath();
    ctx.arc(-8,-2,3,0,Math.PI*2);
    ctx.arc(8,-2,3,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

/* =========================
   選択表示
========================= */

function getResizeHandles(body){

  if(
    !body ||
    body.objectType === "bomb" ||
    body.objectType === "slime"
  ){
    return [];
  }

  const w = body.baseW;
  const h = body.baseH;

  const corners = [
    {x:-w/2,y:-h/2},
    {x:w/2,y:-h/2},
    {x:w/2,y:h/2},
    {x:-w/2,y:h/2}
  ];

  return corners.map(p =>
    Vector.add(
      body.position,
      Vector.rotate(p,body.angle)
    )
  );
}

function getRotationHandle(body){

  const distance =
    Math.max(body.baseW,body.baseH)/2 + 35;

  const local = {
    x:0,
    y:-distance
  };

  return Vector.add(
    body.position,
    Vector.rotate(local,body.angle)
  );
}

function drawSelection(){

  if(!selectedBody){
    return;
  }

  if(
    !Composite.get(
      engine.world,
      selectedBody.myId,
      "body"
    )
  ){
    selectedBody = null;
    return;
  }

  const body =
    selectedBody;

  ctx.save();

  const handles =
    getResizeHandles(body);

  if(
    editAction === "resize" &&
    handles.length === 4
  ){

    ctx.strokeStyle = "#f80";
    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
      handles[0].x,
      handles[0].y
    );

    for(let i=1;i<handles.length;i++){

      ctx.lineTo(
        handles[i].x,
        handles[i].y
      );
    }

    ctx.closePath();
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "#f80";

    handles.forEach(p => {

      ctx.beginPath();
      ctx.arc(
        p.x,
        p.y,
        7,
        0,
        Math.PI*2
      );
      ctx.fill();
      ctx.stroke();
    });
  }

  if(editAction === "rotate"){

    const handle =
      getRotationHandle(body);

    ctx.strokeStyle = "#f80";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(
      body.position.x,
      body.position.y
    );
    ctx.lineTo(
      handle.x,
      handle.y
    );
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "#f80";

    ctx.beginPath();
    ctx.arc(
      handle.x,
      handle.y,
      8,
      0,
      Math.PI*2
    );
    ctx.fill();
    ctx.stroke();
  }

  ctx.restore();
}

/* =========================
   ヒット判定
========================= */

function getPointerPosition(e){

  const rect =
    canvas.getBoundingClientRect();

  return {
    x:e.clientX-rect.left,
    y:e.clientY-rect.top
  };
}

function getBodyAt(point){

  const bodies =
    Composite.allBodies(engine.world);

  for(let i=bodies.length-1;i>=0;i--){

    const body = bodies[i];

    if(body.isGroundBedrock){
      continue;
    }

    const local =
      Vector.rotate(
        {
          x:point.x-body.position.x,
          y:point.y-body.position.y
        },
        -body.angle
      );

    if(body.objectType === "slime" ||
       body.objectType === "bomb"){

      const r =
        Math.min(body.baseW,body.baseH)/2;

      if(
        local.x*local.x+
        local.y*local.y <= r*r
      ){
        return body;
      }

    }else{

      if(
        Math.abs(local.x)<=body.baseW/2 &&
        Math.abs(local.y)<=body.baseH/2
      ){
        return body;
      }
    }
  }

  return null;
}

function nearPoint(a,b,d=14){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  ) <= d;
}

/* =========================
   マウス・タッチ操作
========================= */

canvas.addEventListener(
  "pointerdown",
  e => {

    if(mode !== "editor"){
      return;
    }

    e.preventDefault();

    const p =
      getPointerPosition(e);

    /*
      「選択」ボタンを押しているだけでは
      currentToolがselectでも、
      ここをreturnしてしまわない。
      これが前回の操作不能の原因。
    */

    if(currentTool === "select"){

      if(!selectedBody){
        return;
      }

      if(editAction === "rotate"){

        const handle =
          getRotationHandle(selectedBody);

        if(nearPoint(p,handle,18)){

          dragging = true;

          rotateStart =
            Math.atan2(
              p.y-selectedBody.position.y,
              p.x-selectedBody.position.x
            ) -
            selectedBody.angle;

          return;
        }
      }

      if(editAction === "resize"){

        const handles =
          getResizeHandles(selectedBody);

        for(let i=0;i<handles.length;i++){

          if(nearPoint(p,handles[i],18)){

            dragging = true;

            resizeStart = {
              body:selectedBody,
              startX:p.x,
              startY:p.y,
              startW:selectedBody.baseW,
              startH:selectedBody.baseH,
              corner:i,
              angle:selectedBody.angle
            };

            return;
          }
        }
      }

      if(editAction === "move"){

        const hit =
          getBodyAt(p);

        if(hit === selectedBody){

          dragging = true;

          dragOffset = {
            x:p.x-selectedBody.position.x,
            y:p.y-selectedBody.position.y
          };

          Body.setVelocity(
            selectedBody,
            {x:0,y:0}
          );

          Body.setAngularVelocity(
            selectedBody,
            0
          );

          return;
        }
      }

      /*
        選択モードなら、通常のクリックで
        ブロックそのものを選択できる。
      */
      if(!editAction){

        const hit =
          getBodyAt(p);

        if(hit){

          selectedBody = hit;

          status.textContent =
            "ブロックを選択中";

          return;
        }
      }

      return;
    }

    /*
      ブロック設置
    */

    if(
      ["wood","glass","stone","slime",
       "bomb","multiply","bedrock"]
      .includes(currentTool)
    ){

      let y = p.y;

      const h =
        currentTool === "bomb" ? 34 :
        currentTool === "slime" ? 42 :
        currentTool === "multiply" ? 54 :
        currentTool === "bedrock" ? 48 :
        45;

      y =
        Math.min(
          y,
          canvasHeight-FLOOR_HEIGHT-h/2
        );

      const body =
        createObject(
          currentTool,
          p.x,
          y,
          {
            factor:Number(factorInput.value),
            timer:Number(timerInput.value)
          }
        );

      selectedBody = body;

      return;
    }
  },
  {passive:false}
);

canvas.addEventListener(
  "pointermove",
  e => {

    if(!dragging || !selectedBody){
      return;
    }

    e.preventDefault();

    const p =
      getPointerPosition(e);

    if(editAction === "move"){

      Body.setPosition(
        selectedBody,
        {
          x:p.x-dragOffset.x,
          y:p.y-dragOffset.y
        }
      );

      Body.setVelocity(
        selectedBody,
        {x:0,y:0}
      );

      Body.setAngularVelocity(
        selectedBody,
        0
      );
    }

    if(editAction === "rotate"){

      const angle =
        Math.atan2(
          p.y-selectedBody.position.y,
          p.x-selectedBody.position.x
        ) -
        rotateStart;

      Body.setAngle(
        selectedBody,
        angle
      );

      Body.setVelocity(
        selectedBody,
        {x:0,y:0}
      );

      Body.setAngularVelocity(
        selectedBody,
        0
      );
    }

    if(editAction === "resize"){

      resizeBody(
        selectedBody,
        p
      );
    }
  },
  {passive:false}
);

window.addEventListener(
  "pointerup",
  () => {

    if(!dragging){
      return;
    }

    dragging = false;

    if(selectedBody){

      Body.setVelocity(
        selectedBody,
        {x:0,y:0}
      );

      Body.setAngularVelocity(
        selectedBody,
        0
      );

      Body.setSleeping(
        selectedBody,
        false
      );
    }
  }
);

/* =========================
   形変更
   対角固定なし
   中心固定
========================= */

function resizeBody(body,p){

  if(
    body.objectType === "bomb" ||
    body.objectType === "slime"
  ){
    return;
  }

  if(!resizeStart){
    return;
  }

  const rs =
    resizeStart;

  const dx =
    p.x-body.position.x;

  const dy =
    p.y-body.position.y;

  const local =
    Vector.rotate(
      {x:dx,y:dy},
      -body.angle
    );

  let newW =
    Math.abs(local.x)*2;

  let newH =
    Math.abs(local.y)*2;

  newW =
    Math.max(20,Math.min(400,newW));

  newH =
    Math.max(20,Math.min(300,newH));

  const scaleX =
    newW/rs.startW;

  const scaleY =
    newH/rs.startH;

  /*
    Matter.jsの現在サイズを基準にしない。
    前回の基準サイズから毎回計算することで
    巨大化・暴走を防ぐ。
  */

  const currentW =
    body.bounds.max.x-body.bounds.min.x;

  const currentH =
    body.bounds.max.y-body.bounds.min.y;

  if(
    currentW <= 0 ||
    currentH <= 0
  ){
    return;
  }

  const sx =
    newW/body.baseW;

  const sy =
    newH/body.baseH;

  /*
    Body.scaleは累積するため、
    現在サイズとの差分だけを掛ける。
  */

  const factorX =
    newW/currentW;

  const factorY =
    newH/currentH;

  Body.scale(
    body,
    factorX,
    factorY
  );

  body.baseW = newW;
  body.baseH = newH;

  Body.setPosition(
    body,
    {
      x:body.position.x,
      y:body.position.y
    }
  );

  Body.setVelocity(
    body,
    {x:0,y:0}
  );

  Body.setAngularVelocity(
    body,
    0
  );

  Body.setSleeping(
    body,
    false
  );
}

function saveStage(){

  const bodies =
    Composite.allBodies(engine.world)
    .filter(b =>
      !b.isGroundBedrock
    );

  const data =
    bodies.map(b => ({
      id:b.myId,
      type:b.objectType,
      x:b.position.x,
      y:b.position.y,
      angle:b.angle,
      width:b.baseW,
      height:b.baseH,
      factor:b.factor,
      timer:b.timerDuration/1000
    }));

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );
}

/* =========================
   読み込み
========================= */

function loadStage(){

  const raw =
    localStorage.getItem(
      STORAGE_KEY
    );

  if(!raw){
    return false;
  }

  try{

    const data =
      JSON.parse(raw);

    data.forEach(o => {

      createObject(
        o.type,
        o.x,
        o.y,
        {
          id:o.id,
          angle:o.angle,
          width:o.width,
          height:o.height,
          factor:o.factor,
          timer:o.timer
        }
      );

    });

    return true;

  }catch(e){

    return false;
  }
}

/* =========================

function showMessage(text){

  const message =
    document.getElementById(
      "message"
    );

  message.textContent =
    text;

  message.style.display =
    "block";

  setTimeout(() => {

    message.style.display =
      "none";

  },1500);
}

/* =========================
   ゲームループ
========================= */

function gameLoop(now){

  const dt =
    Math.min(
      50,
      now-lastTime
    );

  lastTime = now;

  if(engine){

    Engine.update(
      engine,
      dt
    );

    updateBombTimers(now);

    render();
  }

  /*
    ここは絶対に止めない。
    床についたブロックがあっても
    ゲーム全体は動き続ける。
  */

  animationFrame =
    requestAnimationFrame(
      gameLoop
    );
}

animationFrame =
  requestAnimationFrame(
    gameLoop
  );

window.addEventListener(
  "resize",
  () => {

    if(gameScreen.classList.contains("active")){
      resizeCanvas();
    }

  }
);

})();
</script>
