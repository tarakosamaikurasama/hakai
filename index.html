<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>日野市の街並みに歴史</title>

<style>
*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
background:#f3f3f3;
color:#222;
}

button{
appearance:none;
-webkit-appearance:none;
border:none;
outline:none;
font:inherit;
cursor:pointer;
touch-action:manipulation;
-webkit-tap-highlight-color:transparent;
}

.screen{
display:none;
width:100%;
height:100%;
}

.screen.active{
display:flex;
}

/* スタート */
#startScreen{
align-items:center;
justify-content:center;
padding:20px;
}

.startPanel{
width:min(520px,94vw);
padding:32px 26px;
background:#fff;
border-radius:24px;
box-shadow:0 12px 35px rgba(0,0,0,.15);
}

.startTitle{
margin:0 0 28px;
text-align:center;
font-size:30px;
font-weight:800;
}

.startButton{
display:block;
width:100%;
height:58px;
margin:14px 0;
border-radius:14px;
background:#f80;
color:#fff;
font-size:18px;
font-weight:800;
box-shadow:0 5px 0 #c65d00;
}

.startButton:active{
transform:translateY(3px);
box-shadow:0 2px 0 #c65d00;
}

.startButton.sub{
background:#fff;
color:#222;
border:1px solid #ddd;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

/* メイン */
#mainScreen{
flex-direction:column;
}

.topBar{
height:58px;
min-height:58px;
display:flex;
align-items:center;
gap:7px;
padding:7px;
background:#fff;
box-shadow:0 2px 10px rgba(0,0,0,.12);
z-index:20;
overflow-x:auto;
}

.topBar button{
height:42px;
padding:0 13px;
border-radius:10px;
background:#f80;
color:#fff;
font-weight:700;
white-space:nowrap;
}

.topBar button.white{
background:#fff;
color:#222;
border:1px solid #ddd;
}

.stageName{
font-weight:800;
white-space:nowrap;
margin-left:5px;
}

/* 作業エリア */
.workspace{
position:relative;
display:flex;
flex:1;
min-height:0;
width:100%;
}

.sidebar{
width:190px;
min-width:190px;
background:#fff;
border-right:1px solid #ddd;
padding:8px;
overflow-y:auto;
z-index:10;
}

.sidebar h3{
font-size:13px;
margin:7px 3px;
}

.toolGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:5px;
}

.toolGrid button,
.operationGrid button{
padding:8px 4px;
border-radius:8px;
background:#fff;
border:1px solid #ddd;
font-size:12px;
}

.toolGrid button.selected,
.operationGrid button.selected{
background:#f80;
color:#fff;
border-color:#f80;
}

.operationGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:5px;
}

.optionRow{
display:flex;
align-items:center;
gap:5px;
margin:5px 0;
font-size:12px;
}

.optionRow label{
flex:1;
}

.optionRow input,
.optionRow select{
width:78px;
padding:4px;
border:1px solid #ccc;
border-radius:6px;
background:#fff;
}

/* ゲーム */
.gameArea{
position:relative;
flex:1;
min-width:0;
min-height:0;
overflow:hidden;
background:#e9e9e9;
}

#gameCanvas{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
display:block;
touch-action:none;
}

/* プレイ操作 */
.playControls{
position:absolute;
left:8px;
top:8px;
z-index:5;
display:none;
gap:6px;
}

.playControls button{
padding:10px 13px;
border-radius:10px;
background:#f80;
color:#fff;
font-weight:700;
}

.playControls button.white{
background:#fff;
color:#222;
border:1px solid #ddd;
}

.status{
position:absolute;
right:8px;
top:8px;
z-index:5;
padding:7px 10px;
border-radius:10px;
background:#fff;
box-shadow:0 3px 12px rgba(0,0,0,.12);
font-size:12px;
}

/* モーダル */
#modal{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
display:none;
align-items:center;
justify-content:center;
padding:20px;
background:rgba(0,0,0,.5);
backdrop-filter:blur(4px);
z-index:100;
}

.modalBox{
width:min(460px,94vw);
max-height:86vh;
overflow:auto;
background:#fff;
border-radius:18px;
padding:20px;
box-shadow:0 15px 50px rgba(0,0,0,.3);
}

.modalBox h2{
margin:0 0 15px;
font-size:20px;
}

.modalInput{
width:100%;
height:42px;
border:1px solid #ccc;
border-radius:8px;
padding:0 10px;
}

.modalButtons{
display:flex;
justify-content:flex-end;
gap:8px;
margin-top:16px;
}

.modalButtons button{
padding:9px 15px;
border-radius:9px;
background:#f80;
color:#fff;
font-weight:700;
}

.modalButtons button.cancel{
background:#eee;
color:#222;
}

.saveItem{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
padding:9px;
margin:6px 0;
border:1px solid #ddd;
border-radius:9px;
}

.saveItem button{
padding:7px 10px;
border-radius:7px;
background:#f80;
color:#fff;
}

@media(max-width:700px){

.sidebar{
width:145px;
min-width:145px;
}

.topBar{
height:52px;
min-height:52px;
}

.startTitle{
font-size:25px;
}

}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
</head>

<body>

<div id="app">

<!-- スタート画面 -->
<section id="startScreen" class="screen active">

<div class="startPanel">

<h1 class="startTitle">ステージメーカー</h1>

<button
type="button"
id="makeStageButton"
class="startButton"
onclick="openEditor()">
ステージを作る
</button>

<button
type="button"
id="playStageButton"
class="startButton"
onclick="openStageSelector()">
ステージで遊ぶ
</button>

<button
type="button"
id="savedDataButton"
class="startButton sub"
onclick="openSavedData()">
保存データ
</button>

</div>

</section>


<!-- メイン画面 -->
<section id="mainScreen" class="screen">

<div class="topBar">

<button
type="button"
onclick="backToStart()"
class="white">
← スタート
</button>

<button
type="button"
onclick="saveNewStage()">
新しく保存
</button>

<button
type="button"
onclick="overwriteStage()">
上書き保存
</button>

<button
type="button"
onclick="openPlay()">
▶ 遊ぶ
</button>

<button
type="button"
onclick="resetStage()"
class="white">
最初から
</button>

<div id="stageName" class="stageName">
未保存
</div>

</div>


<div class="workspace">

<aside id="sidebar" class="sidebar">

<h3>配置</h3>

<div id="toolGrid" class="toolGrid"></div>

<h3>操作</h3>

<div class="operationGrid">

<button
type="button"
id="selectOperation"
onclick="setOperation('select')"
class="selected">
選択
</button>

<button
type="button"
onclick="setOperation('delete')">
削除
</button>

<button
type="button"
onclick="setOperation('rotate')">
回転
</button>

<button
type="button"
onclick="zoomIn()">
拡大
</button>

<button
type="button"
onclick="zoomOut()">
縮小
</button>

<button
type="button"
onclick="clearObjects()">
全削除
</button>

</div>

<h3>爆弾</h3>

<div class="optionRow">
<label>爆発秒</label>
<input
id="bombTimeInput"
type="number"
min="0.2"
step="0.1"
value="5">
</div>

</aside>


<div class="gameArea">

<canvas id="gameCanvas"></canvas>

<div id="playControls" class="playControls">

<button
type="button"
id="bombModeButton"
onclick="setPlayMode('bomb')">
爆弾を置く
</button>

<button
type="button"
id="selectModeButton"
class="white"
onclick="setPlayMode('select')">
選択
</button>

<button
type="button"
onclick="explodeAllBombs()">
全爆破
</button>

</div>

<div id="status" class="status">
編集
</div>

</div>

</div>

</section>


<div id="modal"></div>

</div>


<script>
"use strict";

const MatterJS=window.Matter;

const Engine=MatterJS.Engine;
const World=MatterJS.World;
const Bodies=MatterJS.Bodies;
const Body=MatterJS.Body;

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

let engine=null;
let world=null;

let screenMode="editor";
let operation="select";
let selectedTool=null;
let playMode="bomb";

let zoom=1;
let selectedObject=null;

let canvasWidth=1;
let canvasHeight=1;
let deviceScale=1;

let idCounter=1;

let stage={
id:null,
name:"未保存",
bombTime:5,
objects:[]
};

const TYPES={

wood:{
name:"木",
hp:4,
dynamic:true,
kind:"block"
},

glass:{
name:"ガラス",
hp:1,
dynamic:true,
kind:"block"
},

stone:{
name:"石",
hp:8,
dynamic:true,
kind:"block"
},

bedrock:{
name:"岩盤",
hp:Infinity,
dynamic:false,
kind:"block"
},

dog:{
name:"犬",
hp:2,
dynamic:true,
kind:"dog"
},

bigdog:{
name:"巨大犬",
hp:4,
dynamic:true,
kind:"dog"
},

armordog:{
name:"よろい犬",
hp:2,
dynamic:true,
kind:"dog",
defense:2
},

movingdog:{
name:"動く犬",
hp:2,
dynamic:true,
kind:"dog",
moving:true
},

bomb:{
name:"爆弾",
hp:1,
dynamic:true,
kind:"bomb"
},

multi:{
name:"倍ブロック",
hp:Infinity,
dynamic:false,
kind:"multi"
},

woodhouse:{
name:"木の家",
hp:4,
dynamic:true,
kind:"house",
material:"wood"
},

glasshouse:{
name:"ガラスの家",
hp:1,
dynamic:true,
kind:"house",
material:"glass"
},

stonehouse:{
name:"石の家",
hp:8,
dynamic:true,
kind:"house",
material:"stone"
},

bedrockhouse:{
name:"岩盤の家",
hp:Infinity,
dynamic:false,
kind:"house",
material:"bedrock"
},

bombgen:{
name:"爆弾発生器",
hp:Infinity,
dynamic:false,
kind:"bombgen"
},

doggen:{
name:"犬発生器",
hp:Infinity,
dynamic:false,
kind:"doggen"
}

};

const TOOL_ORDER=[
"wood",
"glass",
"stone",
"bedrock",
"dog",
"bigdog",
"armordog",
"movingdog",
"bomb",
"multi",
"woodhouse",
"glasshouse",
"stonehouse",
"bedrockhouse",
"bombgen",
"doggen"
];


function newId(){
return "obj_"+(idCounter++)+"_"+Math.random().toString(36).slice(2,7);
}


function showScreen(id){

document.querySelectorAll(".screen").forEach(function(screen){
screen.classList.remove("active");
});

document.getElementById(id).classList.add("active");

}


function openEditor(){

stage={
id:null,
name:"未保存",
bombTime:5,
objects:[]
};

screenMode="editor";
operation="select";
selectedTool=null;
selectedObject=null;
zoom=1;

showScreen("mainScreen");

document.getElementById("sidebar").style.display="block";
document.getElementById("playControls").style.display="none";

document.getElementById("bombTimeInput").value=5;

updateStageName();

rebuildWorld();

resizeCanvas();

}


function backToStart(){

showScreen("startScreen");

}


function openStageSelector(){

const data=getSavedStages();

if(data.length===0){

showModal(
"保存データがありません",
"先にステージを作って保存してください。",
[
{
text:"閉じる",
cancel:true,
action:closeModal
}
]
);

return;
}

let html="<h2>ステージを選択</h2>";

data.forEach(function(item){

html+=
'<div class="saveItem">'+
"<span>"+escapeHTML(item.name)+"</span>"+
'<button type="button" data-play-id="'+escapeHTML(item.id)+'">遊ぶ</button>'+
"</div>";

});

showModalHTML(
html,
[
{
text:"閉じる",
cancel:true,
action:closeModal
}
]
);

document.querySelectorAll("[data-play-id]").forEach(function(button){

button.onclick=function(){

const item=data.find(function(x){
return x.id===button.dataset.playId;
});

if(!item)return;

loadStage(item);

closeModal();

openPlay();

};

});

}


function openPlay(){

screenMode="play";

operation="bomb";
playMode="bomb";

showScreen("mainScreen");

document.getElementById("sidebar").style.display="none";
document.getElementById("playControls").style.display="flex";

document.getElementById("bombModeButton").classList.remove("white");
document.getElementById("selectModeButton").classList.add("white");

rebuildWorld();
resizeCanvas();

}


function setPlayMode(mode){

playMode=mode;

if(mode==="bomb"){

document.getElementById("bombModeButton").classList.remove("white");
document.getElementById("selectModeButton").classList.add("white");

}else{

document.getElementById("bombModeButton").classList.add("white");
document.getElementById("selectModeButton").classList.remove("white");

}

}


function buildTools(){

const grid=document.getElementById("toolGrid");

grid.innerHTML="";

TOOL_ORDER.forEach(function(type){

const button=document.createElement("button");

button.type="button";
button.textContent=TYPES[type].name;

button.onclick=function(){

selectedTool=type;
operation="place";

document.querySelectorAll("#toolGrid button").forEach(function(b){
b.classList.remove("selected");
});

button.classList.add("selected");

document.querySelectorAll(".operationGrid button").forEach(function(b){
b.classList.remove("selected");
});

};

grid.appendChild(button);

});

}


function setOperation(value){

operation=value;
selectedTool=null;

document.querySelectorAll("#toolGrid button").forEach(function(button){
button.classList.remove("selected");
});

document.querySelectorAll(".operationGrid button").forEach(function(button){
button.classList.remove("selected");
});

if(value==="select"){
document.getElementById("selectOperation").classList.add("selected");
}

}


function zoomIn(){

zoom=Math.min(2.5,zoom+0.1);

}


function zoomOut(){

zoom=Math.max(.5,zoom-.1);

}


function clearObjects(){

stage.objects.forEach(function(object){

if(object.body){
World.remove(world,object.body);
}

});

stage.objects=[];

selectedObject=null;

}


function resizeCanvas(){

const game=document.querySelector(".gameArea");

if(!game)return;

const rect=game.getBoundingClientRect();

canvasWidth=Math.max(1,rect.width);
canvasHeight=Math.max(1,rect.height);

deviceScale=Math.min(window.devicePixelRatio||1,2);

canvas.width=Math.round(canvasWidth*deviceScale);
canvas.height=Math.round(canvasHeight*deviceScale);

canvas.style.width=canvasWidth+"px";
canvas.style.height=canvasHeight+"px";

ctx.setTransform(
deviceScale,
0,
0,
deviceScale,
0,
0
);

}


function screenToWorld(clientX,clientY){

const rect=canvas.getBoundingClientRect();

const sx=clientX-rect.left;
const sy=clientY-rect.top;

return{

x:(sx-canvasWidth/2)/zoom+canvasWidth/2,
y:(sy-canvasHeight/2)/zoom+canvasHeight/2

};

}


function createEngine(){

if(!MatterJS)return false;

if(engine){

Engine.clear(engine);
World.clear(world,false);

}

engine=Engine.create({
enableSleeping:false
});

world=engine.world;

const floor=Bodies.rectangle(
0,
100000,
10000000,
100,
{
isStatic:true,
label:"floor"
}
);

World.add(world,floor);

return true;

}


function createObjectBody(object){

const type=TYPES[object.type];

let body;

if(type.kind==="house"){

const w=object.w||150;
const h=object.h||110;
const t=Math.max(10,Math.min(w,h)*.15);

const parts=[

Bodies.rectangle(
object.x,
object.y-h/2+t/2,
w,
t
),

Bodies.rectangle(
object.x,
object.y+h/2-t/2,
w,
t
),

Bodies.rectangle(
object.x-w/2+t/2,
object.y,
t,
h-2*t
),

Bodies.rectangle(
object.x+w/2-t/2,
object.y,
t,
h-2*t
)

];

body=Body.create({
parts:parts,
isStatic:!type.dynamic,
label:object.id
});

}

else if(type.kind==="dog"){

const size=object.type==="bigdog"?44:30;

body=Bodies.rectangle(
object.x,
object.y,
size,
size*.72,
{
isStatic:false,
label:object.id,
friction:.7,
restitution:.03
}
);

}

else if(type.kind==="bomb"){

body=Bodies.circle(
object.x,
object.y,
13,
{
isStatic:false,
label:object.id,
friction:.5,
restitution:.1
}
);

}

else if(type.kind==="multi"){

body=Bodies.rectangle(
object.x,
object.y,
object.w||110,
object.h||28,
{
isStatic:true,
isSensor:true,
label:object.id
}
);

}

else if(
type.kind==="bombgen"||
type.kind==="doggen"
){

body=Bodies.rectangle(
object.x,
object.y,
60,
44,
{
isStatic:true,
label:object.id
}
);

}

else{

body=Bodies.rectangle(
object.x,
object.y,
object.w||90,
object.h||45,
{
isStatic:!type.dynamic,
label:object.id,
friction:.7,
restitution:.02
}
);

}

object.body=body;

Body.setAngle(body,object.angle||0);

World.add(world,body);

return body;

}


function rebuildWorld(){

if(!createEngine())return;

stage.objects.forEach(function(object){

createObjectBody(object);

});

}


function addObject(type,x,y){

const definition=TYPES[type];

const object={

id:newId(),

type:type,

x:x,

y:y,

w:type.includes("house")?150:90,

h:type.includes("house")?110:45,

hp:definition.hp,

angle:0

};

if(type==="multi"){

object.w=110;
object.h=28;

}

if(type==="bomb"){

object.remaining=Number(stage.bombTime)||5;
object.blockedMultiplierId=null;

}

if(type==="bombgen"){

object.on=false;
object.interval=3;
object.count=1;
object.timer=3;
object.bombTime=Number(stage.bombTime)||5;

}

if(type==="doggen"){

object.on=false;
object.interval=3;
object.count=1;
object.timer=3;
object.dogType="dog";
object.direction="down";

}

if(type==="movingdog"){

object.target=null;
object.targetAge=0;

}

stage.objects.push(object);

createObjectBody(object);

return object;

}


function addBomb(x,y){

return addObject("bomb",x,y);

}


function removeObject(object){

if(!object)return;

if(object.body){

World.remove(world,object.body);

}

const index=stage.objects.indexOf(object);

if(index!==-1){

stage.objects.splice(index,1);

}

if(selectedObject===object){

selectedObject=null;

}

}


function findObjectAt(x,y){

let closest=null;
let closestDistance=Infinity;

stage.objects.forEach(function(object){

if(!object.body)return;

const px=object.body.position.x;
const py=object.body.position.y;

const dx=x-px;
const dy=y-py;

const distance=dx*dx+dy*dy;

const radius=Math.max(
object.w||50,
object.h||40,
45
);

if(distance<=radius*radius){

if(distance<closestDistance){

closestDistance=distance;
closest=object;

}

}

});

return closest;

}


canvas.addEventListener(
"pointerdown",
function(event){

event.preventDefault();

const point=screenToWorld(
event.clientX,
event.clientY
);

if(screenMode==="play"){

if(playMode==="bomb"){

addBomb(point.x,point.y);

return;

}

if(playMode==="select"){

const object=findObjectAt(point.x,point.y);

if(object){

selectedObject=object;

}

return;

}

}

if(operation==="place"&&selectedTool){

addObject(
selectedTool,
point.x,
point.y
);

return;

}

const object=findObjectAt(
point.x,
point.y
);

if(!object)return;

if(operation==="select"){

selectedObject=object;

}

else if(operation==="delete"){

removeObject(object);

}

else if(operation==="rotate"){

object.angle=(object.angle||0)+Math.PI/2;

Body.setAngle(
object.body,
object.angle
);

}

},
{
passive:false
}
);


function damageObject(object,damage){

const definition=TYPES[object.type];

if(!definition.dynamic)return;

if(object.hp===Infinity)return;

const actualDamage=
damage/(definition.defense||1);

object.hp-=actualDamage;

if(object.hp<=0){

removeObject(object);

}

}


function multiplyBomb(multiplier,bomb){

if(!stage.objects.includes(multiplier))return;
if(!stage.objects.includes(bomb))return;

if(bomb.blockedMultiplierId===multiplier.id){

return;

}

const x=bomb.body.position.x;
const y=bomb.body.position.y;

for(let i=0;i<2;i++){

const child=addBomb(
x+(i===0?-14:14),
y-12
);

child.blockedMultiplierId=multiplier.id;
child.remaining=bomb.remaining;

}

}


function explodeBomb(bomb){

if(!stage.objects.includes(bomb))return;

const x=bomb.body.position.x;
const y=bomb.body.position.y;

const radius=180;

const nearby=stage.objects.slice();

nearby.forEach(function(object){

if(object===bomb)return;
if(!object.body)return;

const dx=object.body.position.x-x;
const dy=object.body.position.y-y;

const distance=Math.hypot(dx,dy);

if(distance>radius)return;

const power=1-distance/radius;

const definition=TYPES[object.type];

if(
definition.dynamic&&
definition.kind!=="bomb"
){

damageObject(
object,
Math.max(.5,3*power)
);

}

if(stage.objects.includes(object)){

const d=distance||1;

Body.setVelocity(
object.body,
{
x:object.body.velocity.x+
(dx/d)*power*3,

y:object.body.velocity.y+
(dy/d)*power*3
}
);

}

});

stage.objects
.filter(function(object){

return object.type==="multi"&&object.body;

})
.forEach(function(multiplier){

const dx=
multiplier.body.position.x-x;

const dy=
multiplier.body.position.y-y;

if(Math.hypot(dx,dy)<radius){

multiplyBomb(
multiplier,
bomb
);

}

});

removeObject(bomb);

}


function explodeAllBombs(){

stage.objects
.filter(function(object){
return object.type==="bomb";
})
.slice()
.forEach(explodeBomb);

}


function generatorUpdate(object,dt){

if(!object.on)return;

object.timer-=dt;

if(object.timer>0)return;

object.timer=object.interval;

if(object.type==="bombgen"){

for(let i=0;i<object.count;i++){

const x=
object.body.position.x+
(i-(object.count-1)/2)*24;

const bomb=addBomb(
x,
object.body.position.y+35
);

bomb.remaining=object.bombTime;

}

}

if(object.type==="doggen"){

for(let i=0;i<object.count;i++){

const dog=addObject(
object.dogType||"dog",
object.body.position.x,
object.body.position.y+35
);

if(!dog)continue;

const speed=2;

if(object.direction==="down")
Body.setVelocity(dog.body,{x:0,y:speed});

if(object.direction==="up")
Body.setVelocity(dog.body,{x:0,y:-speed});

if(object.direction==="left")
Body.setVelocity(dog.body,{x:-speed,y:0});

if(object.direction==="right")
Body.setVelocity(dog.body,{x:speed,y:0});

}

}

}


function updateMovingDog(object,dt){

if(!object.body)return;

const body=object.body;

if(
!object.target||
object.targetAge>7||
Math.hypot(
object.target.x-body.position.x,
object.target.y-body.position.y
)<15
){

object.target={
x:40+Math.random()*Math.max(40,canvasWidth-80),
y:40+Math.random()*Math.max(40,canvasHeight-80)
};

object.targetAge=0;

}

object.targetAge+=dt;

const dx=object.target.x-body.position.x;
const dy=object.target.y-body.position.y;

const distance=Math.hypot(dx,dy)||1;

Body.setVelocity(
body,
{
x:dx/distance*1.3,
y:dy/distance*1.3
}
);

if(
body.position.x<20||
body.position.x>canvasWidth-20||
body.position.y<20||
body.position.y>canvasHeight-20
){

object.target=null;

}

}


function update(dt){

if(!engine)return;

stage.objects.slice().forEach(function(object){

if(!object.body)return;

if(object.type==="bomb"){

object.remaining-=dt;

if(object.remaining<=0){

explodeBomb(object);

}

}

if(
object.type==="bombgen"||
object.type==="doggen"
){

generatorUpdate(object,dt);

}

if(object.type==="movingdog"){

updateMovingDog(object,dt);

}

});

Engine.update(
engine,
dt*1000
);

}


function draw(){

ctx.setTransform(
deviceScale,
0,
0,
deviceScale,
0,
0
);

ctx.clearRect(
0,
0,
canvasWidth,
canvasHeight
);

ctx.fillStyle="#e9e9e9";

ctx.fillRect(
0,
0,
canvasWidth,
canvasHeight
);

ctx.save();

ctx.translate(
canvasWidth/2,
canvasHeight/2
);

ctx.scale(
zoom,
zoom
);

ctx.translate(
-canvasWidth/2,
-canvasHeight/2
);

stage.objects.forEach(function(object){

drawObject(object);

});

if(
selectedObject&&
stage.objects.includes(selectedObject)
){

drawSelection(selectedObject);

}

ctx.restore();

}


function drawObject(object){

if(!object.body)return;

const type=TYPES[object.type];

const body=object.body;

const x=body.position.x;
const y=body.position.y;

ctx.save();

ctx.translate(x,y);

ctx.rotate(body.angle||0);

if(type.kind==="house"){

ctx.lineWidth=8;

if(object.type==="woodhouse")
ctx.strokeStyle="#a66a32";

if(object.type==="glasshouse")
ctx.strokeStyle="#6ba7b8";

if(object.type==="stonehouse")
ctx.strokeStyle="#888";

if(object.type==="bedrockhouse")
ctx.strokeStyle="#555";

ctx.strokeRect(
-(object.w||150)/2,
-(object.h||110)/2,
object.w||150,
object.h||110
);

ctx.restore();

return;

}


if(type.kind==="dog"){

const scale=
object.type==="bigdog"?1.45:1;

ctx.fillStyle=
object.type==="armordog"
?"#777"
:"#99705a";

ctx.fillRect(
-18*scale,
-11*scale,
36*scale,
22*scale
);

ctx.fillRect(
10*scale,
-17*scale,
13*scale,
15*scale
);

ctx.fillStyle="#222";

ctx.fillRect(
-12*scale,
-14*scale,
5*scale,
5*scale
);

ctx.fillRect(
12*scale,
-13*scale,
4*scale,
4*scale
);

ctx.restore();

return;

}


if(type.kind==="bomb"){

ctx.fillStyle="#222";

ctx.beginPath();

ctx.arc(
0,
0,
13,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="#f80";

ctx.fillRect(
5,
-18,
4,
8
);

ctx.restore();

const screen=worldToScreen(
x,
y+25
);

ctx.save();

ctx.fillStyle="#222";

ctx.font="12px Arial";

ctx.textAlign="center";

ctx.fillText(
Math.max(0,object.remaining).toFixed(1)+"秒",
screen.x,
screen.y
);

ctx.restore();

return;

}


if(type.kind==="multi"){

ctx.strokeStyle="#f80";

ctx.lineWidth=4;

ctx.strokeRect(
-(object.w||110)/2,
-(object.h||28)/2,
object.w||110,
object.h||28
);

ctx.fillStyle="#f80";

ctx.font="bold 15px Arial";

ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillText("×2",0,0);

ctx.restore();

return;

}


if(
type.kind==="bombgen"||
type.kind==="doggen"
){

ctx.fillStyle=object.on?"#f80":"#aaa";

ctx.fillRect(
-30,
-22,
60,
44
);

ctx.fillStyle="#fff";

ctx.font="bold 12px Arial";

ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillText(
type.kind==="bombgen"?"爆弾":"犬",
0,
0
);

ctx.restore();

return;

}


if(object.type==="wood")
ctx.fillStyle="#ad753d";

else if(object.type==="glass")
ctx.fillStyle="#9bcbd6";

else if(object.type==="stone")
ctx.fillStyle="#888";

else
ctx.fillStyle="#555";

ctx.fillRect(
-(object.w||90)/2,
-(object.h||45)/2,
object.w||90,
object.h||45
);

ctx.strokeStyle="#333";

ctx.lineWidth=1;

ctx.strokeRect(
-(object.w||90)/2,
-(object.h||45)/2,
object.w||90,
object.h||45
);

ctx.restore();

}


function worldToScreen(x,y){

return{

x:(x-canvasWidth/2)*zoom+
canvasWidth/2,

y:(y-canvasHeight/2)*zoom+
canvasHeight/2

};

}


function drawSelection(object){

if(!object.body)return;

const point=worldToScreen(
object.body.position.x,
object.body.position.y
);

const size=
Math.max(
object.w||45,
object.h||35,
45
)*.65*zoom;

ctx.save();

ctx.strokeStyle="#f80";

ctx.lineWidth=2;

ctx.setLineDash([5,4]);

ctx.strokeRect(
point.x-size,
point.y-size,
size*2,
size*2
);

ctx.restore();

}


function serializeStage(){

return{

id:stage.id,
name:stage.name,
bombTime:stage.bombTime,

objects:stage.objects.map(function(object){

return{

id:object.id,
type:object.type,

x:object.body?
object.body.position.x:
object.x,

y:object.body?
object.body.position.y:
object.y,

w:object.w,
h:object.h,

hp:object.hp,

angle:object.body?
object.body.angle:
object.angle,

remaining:object.remaining,
blockedMultiplierId:object.blockedMultiplierId,

on:object.on,
interval:object.interval,
count:object.count,
timer:object.timer,
bombTime:object.bombTime,

dogType:object.dogType,
direction:object.direction,

target:object.target,
targetAge:object.targetAge

};

})

};

}


function getSavedStages(){

try{

const data=
JSON.parse(
localStorage.getItem("stageMakerData")||"[]"
);

return Array.isArray(data)?data:[];

}catch(e){

return[];

}

}


function saveNewStage(){

showModalHTML(

"<h2>新しく保存</h2>"+
'<input id="newStageName" class="modalInput" type="text" maxlength="50" placeholder="ステージ名">',

[

{
text:"保存",
action:function(){

const input=document.getElementById("newStageName");

const name=input.value.trim();

if(!name){

input.focus();

return;

}

stage.id=newId();
stage.name=name;

writeCurrentStage();

updateStageName();

closeModal();

}
},

{
text:"キャンセル",
cancel:true,
action:closeModal
}

]

);

}


function overwriteStage(){

const data=getSavedStages();

if(data.length===0){

showModal(
"保存データがありません",
"上書きできるステージがありません。",
[
{
text:"閉じる",
cancel:true,
action:closeModal
}
]
);

return;

}

let html="<h2>上書きするステージを選択</h2>";

data.forEach(function(item){

html+=
'<div class="saveItem">'+
"<span>"+escapeHTML(item.name)+"</span>"+
'<button type="button" data-overwrite-id="'+escapeHTML(item.id)+'">上書き</button>'+
"</div>";

});

showModalHTML(
html,
[
{
text:"閉じる",
cancel:true,
action:closeModal
}
]
);

document.querySelectorAll("[data-overwrite-id]").forEach(function(button){

button.onclick=function(){

const id=button.dataset.overwriteId;

const target=data.find(function(item){
return item.id===id;
});

if(!target)return;

stage.id=target.id;
stage.name=target.name;

writeCurrentStage();

updateStageName();

closeModal();

};

});

}


function writeCurrentStage(){

const data=getSavedStages();

const saved=serializeStage();

const index=data.findIndex(function(item){
return item.id===saved.id;
});

if(index===-1){

data.push(saved);

}else{

data[index]=saved;

}

localStorage.setItem(
"stageMakerData",
JSON.stringify(data)
);

}


function loadStage(data){

stage={
id:data.id||null,
name:data.name||"未保存",
bombTime:Number(data.bombTime)||5,
objects:[]
};

(data.objects||[]).forEach(function(saved){

const object={...saved};

delete object.body;

stage.objects.push(object);

});

rebuildWorld();

stage.objects.forEach(function(object){

if(object.body){

Body.setPosition(
object.body,
{
x:object.x,
y:object.y
}
);

Body.setAngle(
object.body,
object.angle||0
);

}

});

updateStageName();

}


function updateStageName(){

document.getElementById(
"stageName"
).textContent=stage.name;

}


function resetStage(){

if(!stage.id){

rebuildWorld();

return;

}

const data=getSavedStages();

const original=data.find(function(item){
return item.id===stage.id;
});

if(original){

loadStage(original);

}

}


function openSavedData(){

const data=getSavedStages();

let html="<h2>保存データ</h2>";

if(data.length===0){

html+="<p>保存されたステージはありません。</p>";

}else{

data.forEach(function(item){

html+=
'<div class="saveItem">'+
"<span>"+escapeHTML(item.name)+"</span>"+
'<button type="button" data-load-id="'+escapeHTML(item.id)+'">開く</button>'+
'<button type="button" data-delete-id="'+escapeHTML(item.id)+'">削除</button>'+
"</div>";

});

}

showModalHTML(
html,
[
{
text:"閉じる",
cancel:true,
action:closeModal
}
]
);

document.querySelectorAll("[data-load-id]").forEach(function(button){

button.onclick=function(){

const item=data.find(function(x){
return x.id===button.dataset.loadId;
});

if(item){

loadStage(item);

closeModal();

screenMode="editor";
showScreen("mainScreen");

document.getElementById("sidebar").style.display="block";
document.getElementById("playControls").style.display="none";

}

};

});

document.querySelectorAll("[data-delete-id]").forEach(function(button){

button.onclick=function(){

const newData=data.filter(function(x){
return x.id!==button.dataset.deleteId;
});

localStorage.setItem(
"stageMakerData",
JSON.stringify(newData)
);

closeModal();

openSavedData();

};

});

}


function showModal(title,message,buttons){

showModalHTML(
"<h2>"+escapeHTML(title)+"</h2>"+
"<p>"+escapeHTML(message)+"</p>",
buttons
);

}


function showModalHTML(html,buttons){

const modal=document.getElementById("modal");

modal.innerHTML="";

const box=document.createElement("div");

box.className="modalBox";

box.innerHTML=html;

const actions=document.createElement("div");

actions.className="modalButtons";

buttons.forEach(function(item){

const button=document.createElement("button");

button.type="button";
button.textContent=item.text;

if(item.cancel){

button.classList.add("cancel");

}

button.onclick=item.action;

actions.appendChild(button);

});

box.appendChild(actions);

modal.appendChild(box);

modal.style.display="flex";

}


function closeModal(){

const modal=document.getElementById("modal");

modal.style.display="none";
modal.innerHTML="";

}


function escapeHTML(text){

return String(text).replace(
/[&<>"']/g,
function(char){

return{

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[char];

}
);

}


document.getElementById("bombTimeInput").addEventListener(
"change",
function(){

stage.bombTime=Math.max(
.2,
Number(this.value)||5
);

}
);


window.addEventListener(
"resize",
resizeCanvas
);


buildTools();

if(MatterJS){

rebuildWorld();

resizeCanvas();

let lastTime=performance.now();

function loop(now){

const dt=Math.min(
.05,
(now-lastTime)/1000
);

lastTime=now;

update(dt);

draw();

document.getElementById("status").textContent=
screenMode==="editor"
?"編集"
:"遊ぶ: "+(
playMode==="bomb"
?"爆弾を置く"
:"選択"
);

requestAnimationFrame(loop);

}

requestAnimationFrame(loop);

}else{

document.getElementById("status").textContent=
"物理エンジンを読み込めません";

}

})();
</script>

</body>
</html>
