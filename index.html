<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スライム城くずしメーカー</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>

<style>
*{
  box-sizing:border-box;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,"Noto Sans JP",sans-serif;
  background:#111;
  color:#fff;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-size:15px;
  cursor:pointer;
  background:#333;
  color:white;
}

button:hover{
  background:#444;
}

.screen{
  position:absolute;
  inset:0;
  display:none;
}

.screen.active{
  display:block;
}

#startScreen{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:linear-gradient(#171717,#292929);
}

#startScreen h1{
  font-size:42px;
  margin:0 0 40px;
}

.startButtons{
  display:flex;
  gap:20px;
}

.startButtons button{
  font-size:20px;
  padding:18px 35px;
}

#selectScreen{
  padding:30px;
  overflow:auto;
  background:#181818;
}

#selectScreen h2{
  margin-top:0;
}

.stageCard{
  background:#292929;
  border-radius:12px;
  padding:16px;
  margin:10px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.stageInfo{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.stageButtons{
  display:flex;
  gap:8px;
}

#editorScreen,
#playScreen{
  background:#111;
}

canvas{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
}

#editorUI,
#playUI{
  position:absolute;
  z-index:10;
  left:10px;
  top:10px;
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  max-width:calc(100% - 20px);
}

.tool{
  background:#292929;
  border:2px solid transparent;
}

.tool.selected{
  border-color:#fff;
  background:#555;
}

#editorTop{
  position:absolute;
  z-index:11;
  right:10px;
  top:10px;
  display:flex;
  gap:7px;
}

#editorHint{
  position:absolute;
  z-index:10;
  left:10px;
  bottom:10px;
  background:rgba(0,0,0,.65);
  padding:8px 12px;
  border-radius:8px;
  font-size:13px;
}

#playInfo{
  position:absolute;
  z-index:10;
  right:10px;
  top:10px;
  background:rgba(0,0,0,.65);
  padding:10px 14px;
  border-radius:8px;
}

#backPlay{
  position:absolute;
  right:10px;
  bottom:10px;
  z-index:10;
}

.danger{
  background:#8b2020;
}

.danger:hover{
  background:#aa2929;
}

.green{
  background:#226b32;
}

.green:hover{
  background:#2c8540;
}

.blue{
  background:#245b88;
}

.blue:hover{
  background:#2d70a8;
}
</style>
</head>

<body>

<!-- ==================== スタート ==================== -->
<div id="startScreen" class="screen active">
  <h1>スライム城くずしメーカー</h1>

  <div class="startButtons">
    <button class="green" id="makeStageBtn">ステージを作る</button>
    <button class="blue" id="playStageBtn">ステージで遊ぶ</button>
  </div>
</div>

<!-- ==================== ステージ選択 ==================== -->
<div id="selectScreen" class="screen">
  <h2>ステージを選択</h2>
  <div id="stageList"></div>
  <br>
  <button id="selectBackBtn">戻る</button>
</div>

<!-- ==================== エディター ==================== -->
<div id="editorScreen" class="screen">

  <canvas id="editorCanvas"></canvas>

  <div id="editorUI">
    <button class="tool selected" data-tool="wood">木</button>
    <button class="tool" data-tool="glass">ガラス</button>
    <button class="tool" data-tool="stone">石</button>
    <button class="tool" data-tool="bedrock">岩盤</button>
    <button class="tool" data-tool="enemy">敵</button>
    <button class="tool" data-tool="bomb">爆弾</button>
    <button class="tool" data-tool="multiply">増殖</button>
    <button class="tool" data-tool="erase">消す</button>
    <button class="tool" data-tool="move">移動</button>
  </div>

  <div id="editorTop">
    <button id="saveStageBtn" class="green">保存</button>
    <button id="editorBackBtn">戻る</button>
  </div>

  <div id="editorHint">
    クリック：配置　／　ドラッグ：移動・画面移動　／　ホイール：ズーム
  </div>

</div>

<!-- ==================== プレイ ==================== -->
<div id="playScreen" class="screen">

  <canvas id="playCanvas"></canvas>

  <div id="playUI">
    <button id="playBombBtn" class="danger">爆弾を置く</button>
    <button id="explodeAllBtn" class="danger">全爆破</button>
    <button id="restartBtn">やり直す</button>
  </div>

  <div id="playInfo">
    爆弾：<span id="bombCount">0</span>
  </div>

  <button id="backPlay">ステージ選択へ</button>

</div>

<script>
"use strict";

const {
  Engine,
  Bodies,
  Body,
  Composite,
  Events,
  Vector
} = Matter;


/* =========================================================
   設定
========================================================= */

const STORAGE_KEY = "slimeCastleMaker_v4";

const FLOOR_Y = 1000;

const EXPLOSION_RADIUS = 110;
const EXPLOSION_FORCE_RADIUS = 150;
const EXPLOSION_FORCE = 0.045;
const EXPLOSION_BLOCK_DAMAGE = 150;
const ENEMY_KILL_IMPACT = 9;
const IMPACT_MASS_CAP = 14;


/* =========================================================
   マテリアル
========================================================= */

const MATERIALS = {

  wood:{
    density:0.0035,
    friction:0.4,
    restitution:0.08,
    hp:2,
    threshold:16
  },

  glass:{
    density:0.0028,
    friction:0.15,
    restitution:0.25,
    hp:1,
    threshold:10
  },

  stone:{
    density:0.008,
    friction:0.6,
    restitution:0.02,
    hp:3,
    threshold:48
  }

};


/* =========================================================
   状態
========================================================= */

let currentScreen = "start";
let currentTool = "wood";

let currentStageId = null;

let editorEngine = null;
let playEngine = null;

let editorCamera = {
  x:0,
  y:0,
  zoom:0.65
};

let playCamera = {
  x:0,
  y:0,
  zoom:0.75
};

let editorCanvas;
let editorCtx;

let playCanvas;
let playCtx;

let editorRunning = false;
let playRunning = false;

let editorPointer = {
  down:false,
  lastX:0,
  lastY:0,
  moved:false
};

let playBombMode = false;

let explosionEffects = [];

let multiplyContacts = new Map();


/* =========================================================
   画面
========================================================= */

function showScreen(name){

  document.querySelectorAll(".screen").forEach(s=>{
    s.classList.remove("active");
  });

  document.getElementById(name+"Screen").classList.add("active");

  currentScreen = name;
}


/* =========================================================
   Engine
========================================================= */

function createEngine(){

  const engine = Engine.create();

  engine.gravity.x = 0;
  engine.gravity.y = 1;
  engine.gravity.scale = 0.001;

  engine.positionIterations = 8;
  engine.velocityIterations = 6;
  engine.constraintIterations = 2;

  return engine;
}


/* =========================================================
   床
========================================================= */

function createFloor(engine){

  const floor = Bodies.rectangle(
    0,
    FLOOR_Y,
    100000,
    100,
    {
      isStatic:true,
      label:"floor"
    }
  );

  floor.plugin = {
    gameType:"floor",
    width:100000,
    height:100
  };

  Composite.add(engine.world,floor);

  return floor;
}


/* =========================================================
   木・ガラス・石
========================================================= */

function createBlock(engine,type,x,y,w=80,h=40,angle=0){

  const mat = MATERIALS[type];

  const body = Bodies.rectangle(
    x,
    y,
    w,
    h,
    {
      density:mat.density,
      friction:mat.friction,
      restitution:mat.restitution,
      angle:angle,
      label:"block"
    }
  );

  body.plugin = {
    gameType:"block",
    material:type,
    width:w,
    height:h,
    hp:mat.hp,
    maxHp:mat.hp,
    threshold:mat.threshold
  };

  Composite.add(engine.world,body);

  return body;
}


/* =========================================================
   岩盤
   落ちない・傾かない・壊れない
========================================================= */

function createBedrock(engine,x,y,w=300,h=50){

  const body = Bodies.rectangle(
    x,
    y,
    w,
    h,
    {
      isStatic:true,
      angle:0,
      label:"bedrock"
    }
  );

  body.plugin = {
    gameType:"bedrock",
    width:w,
    height:h
  };

  /*
   * 念のため角度を完全に0固定
   */
  Body.setAngle(body,0);
  Body.setAngularVelocity(body,0);
  Body.setVelocity(body,{x:0,y:0});

  Composite.add(engine.world,body);

  return body;
}


/* =========================================================
   敵
========================================================= */

function createEnemy(engine,x,y,r=22){

  const body = Bodies.circle(
    x,
    y,
    r,
    {
      density:0.0025,
      friction:0.5,
      restitution:0.1,
      label:"enemy"
    }
  );

  body.plugin = {
    gameType:"enemy",
    radius:r,
    alive:true
  };

  Composite.add(engine.world,body);

  return body;
}


/* =========================================================
   爆弾
========================================================= */

function createBomb(engine,x,y,dynamic=true){

  const body = Bodies.circle(
    x,
    y,
    12,
    {
      isStatic:!dynamic,
      density:0.002,
      friction:0.2,
      restitution:0.2,
      label:"bomb"
    }
  );

  body.plugin = {
    gameType:"bomb",
    radius:12
  };

  Composite.add(engine.world,body);

  return body;
}


/* =========================================================
   増殖
========================================================= */

function createMultiply(engine,x,y,w=70,h=45){

  const body = Bodies.rectangle(
    x,
    y,
    w,
    h,
    {
      isStatic:true,
      label:"multiply"
    }
  );

  body.plugin = {
    gameType:"multiply",
    width:w,
    height:h
  };

  Composite.add(engine.world,body);

  return body;
}


/* =========================================================
   Collision
========================================================= */

function setupCollisionEvents(engine){

  Events.on(engine,"collisionStart",event=>{

    const multiplySet = new Set();

    for(const pair of event.pairs){

      handleCollision(pair.bodyA,pair.bodyB,engine);

      const a = pair.bodyA;
      const b = pair.bodyB;

      const ga = a.plugin && a.plugin.gameType;
      const gb = b.plugin && b.plugin.gameType;

      if(
        (ga==="bomb" && gb==="multiply") ||
        (ga==="multiply" && gb==="bomb")
      ){

        const bomb = ga==="bomb" ? a : b;
        const multiply = ga==="multiply" ? a : b;

        if(!multiplyContacts.has(multiply.id)){
          multiplyContacts.set(
            multiply.id,
            new Set()
          );
        }

        const set = multiplyContacts.get(multiply.id);

        if(!set.has(bomb.id)){
          set.add(bomb.id);
          multiplySet.add(multiply);
        }
      }
    }

    /*
     * 同じフレームに複数の爆弾が触れても、
     * 増殖判定は増殖オブジェクトごとに1回
     */
    for(const multiply of multiplySet){
      multiplyBombsAtMultiply(multiply,engine);
    }
  });


  Events.on(engine,"collisionActive",event=>{

    for(const pair of event.pairs){
      handleActiveCollision(pair.bodyA,pair.bodyB,engine);
    }

  });


  Events.on(engine,"collisionEnd",event=>{

    for(const pair of event.pairs){

      const a = pair.bodyA;
      const b = pair.bodyB;

      const ga = a.plugin && a.plugin.gameType;
      const gb = b.plugin && b.plugin.gameType;

      if(
        (ga==="bomb" && gb==="multiply") ||
        (ga==="multiply" && gb==="bomb")
      ){

        const bomb = ga==="bomb" ? a : b;
        const multiply = ga==="multiply" ? a : b;

        const set = multiplyContacts.get(multiply.id);

        if(set){
          set.delete(bomb.id);

          if(set.size===0){
            multiplyContacts.delete(multiply.id);
          }
        }
      }
    }

  });

}


/* =========================================================
   通常衝突
========================================================= */

function handleCollision(a,b,engine){

  const ga = a.plugin && a.plugin.gameType;
  const gb = b.plugin && b.plugin.gameType;

  /*
   * 岩盤は壊れない
   */
  if(ga==="bedrock" || gb==="bedrock"){
    return;
  }

  if(ga==="enemy" && gb==="block"){
    enemyHitBlock(a,b);
  }

  if(gb==="enemy" && ga==="block"){
    enemyHitBlock(b,a);
  }

  if(ga==="block" && gb==="block"){
    blockHitBlock(a,b);
  }

  if(ga==="bomb" && gb==="enemy"){
    killEnemy(b);
  }

  if(gb==="bomb" && ga==="enemy"){
    killEnemy(a);
  }
}


function handleActiveCollision(a,b,engine){

  const ga = a.plugin && a.plugin.gameType;
  const gb = b.plugin && b.plugin.gameType;

  if(ga==="bedrock" || gb==="bedrock"){
    return;
  }

}


/* =========================================================
   増殖処理
========================================================= */

function isBombTouchingMultiply(bomb,multiply){

  if(!bomb.position || !multiply.position){
    return false;
  }

  const dx =
    bomb.position.x -
    multiply.position.x;

  const dy =
    bomb.position.y -
    multiply.position.y;

  const dist = Math.sqrt(dx*dx+dy*dy);

  return dist < 65;
}


function multiplyBombsAtMultiply(multiply,engine){

  const bombs = Composite.allBodies(engine.world)
    .filter(b=>{
      return b.plugin &&
             b.plugin.gameType==="bomb" &&
             isBombTouchingMultiply(b,multiply);
    });

  if(bombs.length===0){
    return;
  }

  /*
   * 現在触れている爆弾を1個ずつコピー
   */
  bombs.forEach((bomb,index)=>{

    let dx =
      bomb.position.x -
      multiply.position.x;

    let dy =
      bomb.position.y -
      multiply.position.y;

    let len = Math.sqrt(dx*dx+dy*dy);

    if(len<0.01){

      const angle =
        index * Math.PI * 2 /
        Math.max(1,bombs.length);

      dx=Math.cos(angle);
      dy=Math.sin(angle);

      len=1;
    }

    dx/=len;
    dy/=len;

    /*
     * 増殖した爆弾は元の爆弾から少し離して出す
     */
    const nx =
      bomb.position.x +
      dx*70;

    const ny =
      bomb.position.y +
      dy*70;

    const newBomb =
      createBomb(engine,nx,ny,true);

    Body.setVelocity(
      newBomb,
      {
        x:bomb.velocity.x,
        y:bomb.velocity.y
      }
    );

    Body.setAngularVelocity(
      newBomb,
      bomb.angularVelocity
    );
  });

}


/* =========================================================
   ダメージ
========================================================= */

function enemyHitBlock(enemy,block){

  if(
    !enemy.position ||
    !block.position
  ){
    return;
  }

  const dx =
    enemy.velocity.x -
    block.velocity.x;

  const dy =
    enemy.velocity.y -
    block.velocity.y;

  const speed =
    Math.sqrt(dx*dx+dy*dy);

  const mass =
    Math.min(
      IMPACT_MASS_CAP,
      enemy.mass
    );

  const impact =
    speed * mass;

  if(
    impact >=
    block.plugin.threshold
  ){

    damageBlock(
      block,
      1
    );
  }
}


function blockHitBlock(a,b){

  const va = a.velocity;
  const vb = b.velocity;

  const dx = va.x-vb.x;
  const dy = va.y-vb.y;

  const speed =
    Math.sqrt(dx*dx+dy*dy);

  if(speed<0.01){
    return;
  }

  damageBlockByImpact(a,speed,b.mass);
  damageBlockByImpact(b,speed,a.mass);
}


function damageBlockByImpact(block,speed,otherMass){

  const p = block.plugin;

  if(!p || p.gameType!=="block"){
    return;
  }

  const mass =
    Math.min(
      IMPACT_MASS_CAP,
      otherMass || 1
    );

  const impact =
    speed*mass;

  if(impact>=p.threshold){
    damageBlock(block,1);
  }
}


function damageBlock(block,damage){

  if(!block.plugin){
    return;
  }

  if(block.plugin.gameType!=="block"){
    return;
  }

  block.plugin.hp -= damage;

  if(block.plugin.hp<=0){

    Composite.remove(
      editorEngine && editorEngine.world.includes(block)
        ? editorEngine.world
        : playEngine.world,
      block
    );
  }
}


/* =========================================================
   敵を倒す
========================================================= */

function killEnemy(enemy){

  if(!enemy.plugin || !enemy.plugin.alive){
    return;
  }

  enemy.plugin.alive=false;

  if(
    currentScreen==="editor" &&
    editorEngine
  ){

    Composite.remove(
      editorEngine.world,
      enemy
    );

  }else if(
    currentScreen==="play" &&
    playEngine
  ){

    Composite.remove(
      playEngine.world,
      enemy
    );

  }
}


/* =========================================================
   爆発
========================================================= */

function explodeAt(engine,x,y){

  explosionEffects.push({
    x:x,
    y:y,
    life:25
  });

  const bodies =
    Composite.allBodies(engine.world);

  for(const body of bodies){

    const p = body.plugin;

    if(!p){
      continue;
    }

    /*
     * 岩盤・床には爆発を適用しない
     */
    if(
      p.gameType==="bedrock" ||
      p.gameType==="floor" ||
      body.isStatic
    ){
      continue;
    }

    const dx =
      body.position.x-x;

    const dy =
      body.position.y-y;

    const dist =
      Math.sqrt(dx*dx+dy*dy);

    if(dist>EXPLOSION_FORCE_RADIUS){
      continue;
    }

    const safeDist =
      Math.max(dist,10);

    const nx=dx/safeDist;
    const ny=dy/safeDist;

    const power =
      1-dist/
      EXPLOSION_FORCE_RADIUS;

    Body.applyForce(
      body,
      body.position,
      {
        x:nx*
          EXPLOSION_FORCE*
          power*
          body.mass,

        y:ny*
          EXPLOSION_FORCE*
          power*
          body.mass
      }
    );

    if(
      p.gameType==="block" &&
      dist<=EXPLOSION_RADIUS
    ){

      damageBlock(
        body,
        EXPLOSION_BLOCK_DAMAGE
      );
    }

    if(
      p.gameType==="enemy" &&
      dist<=EXPLOSION_RADIUS
    ){

      killEnemy(body);
    }
  }

}


function explodeAllBombs(engine){

  const bombs =
    Composite.allBodies(engine.world)
      .filter(b=>
        b.plugin &&
        b.plugin.gameType==="bomb"
      );

  bombs.forEach(bomb=>{
    explodeAt(
      engine,
      bomb.position.x,
      bomb.position.y
    );

    Composite.remove(
      engine.world,
      bomb
    );
  });

}


/* =========================================================
   座標変換
========================================================= */

function screenToWorld(
  canvas,
 camera,
 sx,
 sy
){

  return {
    x:
      (sx-canvas.width/2)/
      camera.zoom+
      camera.x,

    y:
      (sy-canvas.height/2)/
      camera.zoom+
      camera.y
  };

}


function worldToScreen(
  canvas,
  camera,
 x,
 y
){

  return {
    x:
      (x-camera.x)*
      camera.zoom+
      canvas.width/2,

    y:
      (y-camera.y)*
      camera.zoom+
      canvas.height/2
  };

}


/* =========================================================
   描画
========================================================= */

function resizeCanvas(canvas){

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    innerWidth*dpr;

  canvas.height =
    innerHeight*dpr;

  canvas.style.width =
    innerWidth+"px";

  canvas.style.height =
    innerHeight+"px";
}


function drawGrid(ctx,canvas,camera){

  const step=100;

  const left =
    camera.x-
    canvas.width/
    camera.zoom;

  const right =
    camera.x+
    canvas.width/
    camera.zoom;

  const top =
    camera.y-
    canvas.height/
    camera.zoom;

  const bottom =
    camera.y+
    canvas.height/
    camera.zoom;

  ctx.save();

  ctx.lineWidth=1;
  ctx.strokeStyle="rgba(255,255,255,.07)";

  for(
    let x=Math.floor(left/step)*step;
    x<right;
    x+=step
  ){

    const s=
      worldToScreen(
        canvas,camera,x,0
      );

    ctx.beginPath();
    ctx.moveTo(s.x,0);
    ctx.lineTo(s.x,canvas.height);
    ctx.stroke();
  }

  for(
    let y=Math.floor(top/step)*step;
    y<bottom;
    y+=step
  ){

    const s=
      worldToScreen(
        canvas,camera,0,y
      );

    ctx.beginPath();
    ctx.moveTo(0,s.y);
    ctx.lineTo(canvas.width,s.y);
    ctx.stroke();
  }

  ctx.restore();
}


function drawFloor(ctx,canvas,camera,body){

  const p=body.position;

  const s=
    worldToScreen(
      canvas,
      camera,
      p.x,
      p.y
    );

  const w=
    body.plugin.width*
    camera.zoom;

  const h=
    body.plugin.height*
    camera.zoom;

  ctx.save();

  ctx.translate(s.x,s.y);
  ctx.fillStyle="#202020";

  ctx.fillRect(
    -w/2,
    -h/2,
    w,
    h
  );

  ctx.restore();
}


/* =========================================================
   Body描画
========================================================= */

function drawBody(
  ctx,
  canvas,
  camera,
  body
){

  const p=body.position;

  const s=
    worldToScreen(
      canvas,
      camera,
      p.x,
      p.y
    );

  const type =
    body.plugin &&
    body.plugin.gameType;

  if(type==="floor"){
    drawFloor(
      ctx,
      canvas,
      camera,
      body
    );
    return;
  }

  if(type==="block"){
    drawBlock(
      ctx,
      canvas,
      camera,
      body
    );
    return;
  }

  if(type==="bedrock"){
    drawBedrock(
      ctx,
      canvas,
      camera,
      body
    );
    return;
  }

  if(type==="enemy"){
    drawEnemy(
      ctx,
      canvas,
      camera,
      body
    );
    return;
  }

  if(type==="bomb"){
    drawBomb(
      ctx,
      canvas,
      camera,
      body
    );
    return;
  }

  if(type==="multiply"){
    drawMultiply(
      ctx,
      canvas,
      camera,
      body
    );
    return;
  }
}


/* =========================================================
   ブロック描画
========================================================= */

function drawBlock(
  ctx,
  canvas,
  camera,
  body
){

  const p=body.position;
  const s=
    worldToScreen(
      canvas,
      camera,
      p.x,
      p.y
    );

  const w=
    body.plugin.width*
    camera.zoom;

  const h=
    body.plugin.height*
    camera.zoom;

  ctx.save();

  ctx.translate(s.x,s.y);
  ctx.rotate(body.angle);

  if(body.plugin.material==="wood"){
    ctx.fillStyle="#9b5a25";
    ctx.strokeStyle="#d48a42";
  }

  if(body.plugin.material==="glass"){
    ctx.fillStyle="rgba(100,190,255,.45)";
    ctx.strokeStyle="#b9eaff";
  }

  if(body.plugin.material==="stone"){
    ctx.fillStyle="#666";
    ctx.strokeStyle="#aaa";
  }

  ctx.lineWidth=2;

  ctx.fillRect(
    -w/2,
    -h/2,
    w,
    h
  );

  ctx.strokeRect(
    -w/2,
    -h/2,
    w,
    h
  );

  /*
   * HP表示
   */
  if(
    body.plugin.maxHp &&
    camera.zoom>.35
  ){

    ctx.fillStyle="#fff";
    ctx.font=
      Math.max(
        10,
        14*camera.zoom
      )+"px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
      body.plugin.hp,
      0,
      0
    );
  }

  ctx.restore();
}


/* =========================================================
   岩盤描画
========================================================= */

function drawBedrock(
  ctx,
  canvas,
  camera,
  body
){

  const p=body.position;

  const s=
    worldToScreen(
      canvas,
      camera,
      p.x,
      p.y
    );

  const w=
    body.plugin.width*
    camera.zoom;

  const h=
    body.plugin.height*
    camera.zoom;

  ctx.save();

  /*
   * 岩盤は必ず水平
   */
  ctx.translate(s.x,s.y);

  ctx.fillStyle="#3a3a3a";
  ctx.strokeStyle="#777";
  ctx.lineWidth=3;

  ctx.fillRect(
    -w/2,
    -h/2,
    w,
    h
  );

  ctx.strokeRect(
    -w/2,
    -h/2,
    w,
    h
  );

  /*
   * 岩っぽい線
   */
  ctx.strokeStyle="#555";
  ctx.lineWidth=2;

  for(let i=-2;i<=2;i++){

    const xx =
      i*w/6;

    ctx.beginPath();

    ctx.moveTo(
      xx-w*.08,
      -h*.35
    );

    ctx.lineTo(
      xx+w*.02,
      h*.35
    );

    ctx.stroke();
  }

  ctx.fillStyle="#ddd";
  ctx.font=
    Math.max(
      11,
      15*camera.zoom
    )+"px Arial";

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    "岩盤",
    0,
    0
  );

  ctx.restore();
}


/* =========================================================
   敵描画
========================================================= */

function drawEnemy(
  ctx,
  canvas,
  camera,
  body
){

  const s=
    worldToScreen(
      canvas,
      camera,
      body.position.x,
      body.position.y
    );

  const r=
    body.plugin.radius*
    camera.zoom;

  ctx.save();

  ctx.fillStyle="#65d44a";
  ctx.strokeStyle="#b7ff9e";
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.arc(
    s.x,
    s.y,
    r,
    0,
    Math.PI*2
  );

  ctx.fill();
  ctx.stroke();

  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(
    s.x-r*.3,
    s.y-r*.15,
    r*.12,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.beginPath();
  ctx.arc(
    s.x+r*.3,
    s.y-r*.15,
    r*.12,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.restore();
}


/* =========================================================
   爆弾描画
========================================================= */

function drawBomb(
  ctx,
  canvas,
  camera,
  body
){

  const s=
    worldToScreen(
      canvas,
      camera,
      body.position.x,
      body.position.y
    );

  const r=
    12*camera.zoom;

  ctx.save();

  ctx.fillStyle="#222";
  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.arc(
    s.x,
    s.y,
    r,
    0,
    Math.PI*2
  );

  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle="#f80";

  ctx.beginPath();

  ctx.moveTo(
    s.x+r*.5,
    s.y-r*.7
  );

  ctx.lineTo(
    s.x+r*.9,
    s.y-r*1.1
  );

  ctx.stroke();

  ctx.restore();
}


/* =========================================================
   増殖描画
========================================================= */

function drawMultiply(

  canvas,
  camera,
  body
){

    -h/2,
    w,
    h
  );

  ctx.strokeRect(
    -w/2,
    -h/2,
    w,
    h
  );

  ctx.fillStyle="#fff";
  ctx.font=
    Math.max(
      12,

    )+"px Arial";

  );

/* =========================================================
   爆発エフェクト
========================================================= */

function drawExplosions(
  ctx,
  canvas,
  camera
){

  for(
    let i=explosionEffects.length-1;
    i>=0;
    i--
  ){

    const e=
      explosionEffects[i];

    const s=
      worldToScreen(
        canvas,
        camera,
        e.x,
        e.y
      );

    const progress=
      1-e.life/25;

    const r=
      EXPLOSION_RADIUS*
      progress*
      camera.zoom;

    ctx.save();

    ctx.globalAlpha=
      e.life/25;

    ctx.strokeStyle="#ffb300";
    ctx.lineWidth=
      8*camera.zoom;

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      r,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.restore();

    e.life--;

    if(e.life<=0){
      explosionEffects.splice(i,1);
    }
  }

}

/* =========================================================
   シリアライズ
========================================================= */

function serializeStage(engine){

  const objects=[];

  for(
    const body of
    Composite.allBodies(
      engine.world
    )
  ){

    const p=body.plugin;

    if(!p){
      continue;
    }

    if(
      p.gameType==="floor" ||
      p.gameType==="bomb"
    ){
      continue;
    }

    if(p.gameType==="block"){

      objects.push({
        type:p.material,
        x:body.position.x,
        y:body.position.y,
        w:p.width,
        h:p.height,
        angle:body.angle
      });

    }

    if(p.gameType==="bedrock"){

      objects.push({
        type:"bedrock",
        x:body.position.x,
        y:body.position.y,
        w:p.width,
        h:p.height
      });

    }

    if(p.gameType==="enemy"){

      objects.push({
        type:"enemy",
        x:body.position.x,
        y:body.position.y,
        r:p.radius
      });

    }

    if(p.gameType==="multiply"){

      objects.push({
        type:"multiply",
        x:body.position.x,
        y:body.position.y,
        w:p.width,
        h:p.height
      });

    }
  }

  return objects;
}


/* =========================================================
   ステージロード
========================================================= */

function loadObjectsIntoEngine(
  engine,
  objects
){

  for(const o of objects){

    if(
      o.type==="wood" ||
      o.type==="glass" ||
      o.type==="stone"
    ){

      createBlock(
        engine,
        o.type,
        o.x,
        o.y,
        o.w,
        o.h,
        o.angle || 0
      );

    }

    else if(o.type==="bedrock"){

      /*
       * 保存データに角度があっても無視。
       * 岩盤は常に水平。
       */
      createBedrock(
        engine,
        o.x,
        o.y,
        o.w || 300,
        o.h || 50
      );

    }

    else if(o.type==="enemy"){

      createEnemy(
        engine,
        o.x,
        o.y,
        o.r || 22
      );

    }

    else if(o.type==="multiply"){

      createMultiply(
        engine,
        o.x,
        o.y,
        o.w || 70,
        o.h || 45
      );

    }

  }

}

function saveCurrentStage(){

  if(!editorEngine){
    return;
  }

  const name=
    prompt(
      "ステージ名を入力してください",
      "自作ステージ"
    );

  if(name===null){
    return;
  }

  const stages=
    getStages();

  const stage={
    id:currentStageId,
    name:
      name.trim() ||
      "自作ステージ",
    objects:
      serializeStage(
        editorEngine
      ),
    updatedAt:
      Date.now()
  };

  const index=
    stages.findIndex(
      s=>s.id===currentStageId
    );

  }else{
    stages.push(stage);
  }

  saveStages(stages);

  alert("保存しました。");
}

        "div"
      );

        "span"
      );

    info.appendChild(count);

    const buttons=
      document.createElement(
        "div"
      );

    buttons.className=
      "stageButtons";

    const play=
      document.createElement(
        "button"
      );

    play.textContent="遊ぶ";
    play.className="green";

    play.onclick=()=>{
      startPlay(stage);
    };

    const edit=
      document.createElement(
        "button"
      );

    edit.textContent="編集";

    edit.onclick=()=>{
      editStage(stage);
    };

    const del=
      document.createElement(
        "button"
      );

    del.textContent="削除";
    del.className="danger";

    del.onclick=()=>{

        confirm(
          "このステージを削除しますか？"

      ){

          getStages().filter(
            s=>s.id!==stage.id

    buttons.appendChild(play);
    buttons.appendChild(edit);
    buttons.appendChild(del);

    card.appendChild(buttons);

/* =========================================================
   消去
========================================================= */

function eraseAt(engine,x,y){

  const bodies=
    Composite.allBodies(
      engine.world
    );

  for(let i=bodies.length-1;i>=0;i--){

    const b=bodies[i];

    if(
      !b.plugin ||
      b.plugin.gameType==="floor"
    ){
      continue;
    }

    if(
      Matter.Bounds.contains(
        b.bounds,
        {x,y}
      )
    ){

      Composite.remove(
        engine.world,
        b
      );

      multiplyContacts.delete(
        b.id
      );

      return;
    }
  }

}


/* =========================================================
   エディター マウス
========================================================= */

function getPointerPosition(
  canvas,
 event
){

  const rect=
    canvas.getBoundingClientRect();

  const x=
    event.clientX-
    rect.left;

  const y=
    event.clientY-
    rect.top;

  return {
    x:x,
    y:y
  };
}


editorCanvas.addEventListener(
  "pointerdown",
  e=>{

    editorPointer.down=true;
    editorPointer.moved=false;

    editorPointer.lastX=e.clientX;
    editorPointer.lastY=e.clientY;

    editorCanvas.setPointerCapture(
      e.pointerId
    );

  }
);


editorCanvas.addEventListener(
  "pointermove",
  e=>{

    if(!editorPointer.down){
      return;
    }

    const dx=
      e.clientX-
      editorPointer.lastX;

    const dy=
      e.clientY-
      editorPointer.lastY;

    if(
      Math.abs(dx)>3 ||
      Math.abs(dy)>3
    ){
      editorPointer.moved=true;
    }

    if(currentTool==="move"){

      editorCamera.x -=
        dx/editorCamera.zoom;

      editorCamera.y -=
        dy/editorCamera.zoom;

    }

    editorPointer.lastX=e.clientX;
    editorPointer.lastY=e.clientY;

  }
);


editorCanvas.addEventListener(
  "pointerup",
  e=>{

    if(!editorPointer.down){
      return;
    }

    editorPointer.down=false;

    if(
      !editorPointer.moved &&
      currentTool!=="move"
    ){

      const p=
        getPointerPosition(
          editorCanvas,
          e
        );

      const world=
        screenToWorld(
          editorCanvas,
          editorCamera,
          p.x,
          p.y
        );

      placeEditorObject(
        world.x,
        world.y
      );
    }

  }
);


editorCanvas.addEventListener(
  "wheel",
  e=>{

    e.preventDefault();

    const oldZoom=
      editorCamera.zoom;

    const factor=
      e.deltaY<0 ? 1.1 : .9;

    const rect=
      editorCanvas.getBoundingClientRect();

    const sx=
      e.clientX-
      rect.left;

    const sy=
      e.clientY-
      rect.top;

    const before=
      screenToWorld(
        editorCanvas,
        editorCamera,
        sx,
        sy
      );

    editorCamera.zoom=
      Math.max(
        .15,
        Math.min(
          3,
          oldZoom*factor
        )
      );

    const after=
      screenToWorld(
        editorCanvas,
        editorCamera,
        sx,
        sy
      );

    editorCamera.x +=
      before.x-after.x;

    editorCamera.y +=
      before.y-after.y;

  },
  {passive:false}
);


/* =========================================================
   プレイ 爆弾配置
========================================================= */

playCanvas.addEventListener(
  "pointerdown",
  e=>{

    if(!playBombMode){
      return;
    }

    const rect=
      playCanvas.getBoundingClientRect();

    const sx=
      e.clientX-
      rect.left;

    const sy=
      e.clientY-
      rect.top;

    const world=
      screenToWorld(
        playCanvas,
        playCamera,
        sx,
        sy
      );

    createBomb(
      playEngine,
      world.x,
      world.y,
      false
    );

    updateBombCount();

  }
);

/* =========================================================
   リサイズ
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    if(editorCanvas){
      resizeCanvas(
        editorCanvas
      );
    }

    if(playCanvas){
      resizeCanvas(
        playCanvas
      );
    }

  }
);


/* =========================================================
   初期化
========================================================= */

function init(){

  editorCanvas=
    document.getElementById(
      "editorCanvas"
    );

  editorCtx=
    editorCanvas.getContext(
      "2d"
    );

  playCanvas=
    document.getElementById(
      "playCanvas"
    );

  playCtx=
    playCanvas.getContext(
      "2d"
    );

  resizeCanvas(
    editorCanvas
  );

  resizeCanvas(
    playCanvas
  );

  /*
   * サンプルステージを保存
   */
  const stages=
    getStages();

  if(
    !stages.some(
      s=>s.id==="sample_stage"
    )
  ){

    stages.unshift(
      createSampleStage()
    );

    saveStages(stages);
  }

}

init();

</script>
