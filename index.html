<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>日野市の街並みに歴史</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#f7f7f7;
    color:#333;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
}

body{
    overflow-x:hidden;
}

button,input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
    touch-action:manipulation;
}

.hidden{
    display:none!important;
}

.screen{
    width:100%;
    min-height:100vh;
}

.start-screen{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.start-card{
    width:min(600px,100%);
    background:#fff;
    border-radius:28px;
    padding:32px 22px;
    box-shadow:0 8px 28px rgba(0,0,0,.14);
    text-align:center;
}

.start-title{
    margin:0 0 8px;
    font-size:clamp(28px,8vw,48px);
    font-weight:900;
    line-height:1.2;
}

.start-description{
    color:#777;
    font-size:13px;
    margin-bottom:25px;
}

.main-button{
    min-height:54px;
    width:100%;
    padding:10px 18px;
    margin:7px 0;
    border-radius:17px;
    background:#f80;
    color:#fff;
    font-weight:900;
    box-shadow:0 4px 0 #c60;
}

.main-button:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #c60;
}

.white-button{
    min-height:45px;
    padding:8px 15px;
    border-radius:14px;
    background:#fff;
    border:2px solid #ddd;
    color:#333;
    font-weight:800;
}

.game{
    padding:8px;
}

.editor-ui,
.play-ui{
    position:relative;
    z-index:20;
    background:#fff;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.13);
    padding:10px;
    margin-bottom:8px;
}

.ui-title{
    font-weight:900;
    font-size:16px;
    margin-bottom:8px;
}

.button-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.orange-button{
    min-height:42px;
    padding:7px 12px;
    border-radius:14px;
    background:#f80;
    color:#fff;
    font-size:14px;
    font-weight:900;
    box-shadow:0 3px 0 #c60;
}

.orange-button:active{
    transform:translateY(2px);
    box-shadow:0 1px 0 #c60;
}

.orange-button.active{
    background:#000;
    box-shadow:0 3px 0 #333;
}

.white-small{
    min-height:40px;
    padding:7px 12px;
    border-radius:13px;
    background:#fff;
    border:2px solid #ddd;
    font-weight:800;
}

.edit-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid #eee;
}

.edit-actions button{
    min-height:39px;
    padding:6px 12px;
    border-radius:12px;
    background:#fff;
    border:2px solid #ddd;
    font-weight:800;
}

.edit-actions button.active{
    background:#f80;
    color:#fff;
    border-color:#f80;
}

.status{
    margin-top:8px;
    padding:7px 10px;
    border-radius:11px;
    background:#f5f5f5;
    font-size:12px;
    font-weight:700;
}

.dropper-line{
    display:flex;
    align-items:center;
    gap:5px;
    flex-wrap:nowrap;
    overflow-x:auto;
    margin-top:7px;
    padding:6px 0 2px;
}

.dropper-line span{
    white-space:nowrap;
    font-size:12px;
    font-weight:800;
}

.dropper-line input{
    width:55px;
    min-width:55px;
    height:32px;
    padding:3px 6px;
    border:2px solid #ddd;
    border-radius:9px;
    text-align:center;
}

.dropper-line button{
    min-height:32px;
    padding:4px 9px;
    border-radius:9px;
    background:#f80;
    color:#fff;
    font-size:12px;
    font-weight:900;
    white-space:nowrap;
}

.dropper-status{
    min-width:45px;
    text-align:center;
    padding:5px 7px;
    border-radius:8px;
    background:#eee;
    font-size:11px;
    font-weight:900;
}

.dropper-status.on{
    background:#f80;
    color:#fff;
}

.stage-area{
    position:relative;
    z-index:1;
    width:100%;
    height:min(72vh,760px);
    min-height:400px;
    overflow:hidden;
    background:#fff;
    border-radius:23px;
    box-shadow:0 7px 25px rgba(0,0,0,.15);
}

#canvas{
    position:absolute;
    left:0;
    top:0;
    display:block;
    touch-action:none;
}

.floor-label{
    position:absolute;
    z-index:4;
    left:0;
    bottom:0;
    width:100%;
    height:42px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.78);
    color:#fff;
    font-weight:900;
    pointer-events:none;
}

.bottom-ui{
    position:relative;
    z-index:20;
    background:#fff;
    border-radius:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.12);
    padding:9px;
    margin-top:8px;
}

.zoom-row{
    display:flex;
    align-items:center;
    gap:7px;
    margin-bottom:8px;
}

.zoom-row button{
    width:42px;
    height:40px;
    border-radius:12px;
    background:#fff;
    border:2px solid #ddd;
    font-size:20px;
    font-weight:900;
}

.zoom-number{
    min-width:65px;
    text-align:center;
    font-weight:900;
}

.modal-bg{
    position:fixed;
    z-index:100;
    inset:0;
    background:rgba(255,255,255,.74);
    backdrop-filter:blur(7px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal{
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:24px;
    box-shadow:0 10px 40px rgba(0,0,0,.22);
    padding:20px;
}

.modal h2{
    margin:0 0 15px;
}

.modal-input{
    width:100%;
    height:45px;
    border:2px solid #ddd;
    border-radius:12px;
    padding:7px 10px;
}

.modal-row{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:12px;
}

.modal-row button{
    flex:1;
    min-width:120px;
}

.stage-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.stage-item{
    border:2px solid #eee;
    border-radius:15px;
    padding:11px;
}

.stage-name{
    font-weight:900;
}

.stage-date{
    color:#888;
    font-size:11px;
    margin-top:3px;
}

.stage-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:8px;
}

.stage-buttons button{
    min-height:36px;
    padding:5px 10px;
    border-radius:10px;
    background:#f80;
    color:#fff;
    font-size:12px;
    font-weight:900;
}

.stage-buttons .delete{
    background:#fff;
    color:#c00;
    border:2px solid #ecc;
}

.play-info{
    font-size:12px;
    color:#666;
    margin-top:7px;
}

@media(max-width:600px){
    .game{
        padding:5px;
    }

    .editor-ui,
    .play-ui{
        border-radius:16px;
        padding:8px;
    }

    .orange-button{
        font-size:12px;
        padding:6px 9px;
        min-height:38px;
    }

    .stage-area{
        min-height:380px;
        height:64vh;
    }
}
</style>
</head>

<body>

<div id="startScreen" class="screen start-screen">
    <div class="start-card">

        <h1 class="start-title">
            スライム城崩しメーカー
        </h1>

        <div class="start-description">
            ステージを作って、爆弾で遊べます。
        </div>

        <button id="newStageButton" class="main-button">
            ステージを作る
        </button>

        <button id="playSavedButton" class="main-button">
            ステージで遊ぶ
        </button>

        <button id="savedButton" class="white-button" style="width:100%;margin-top:8px;">
            保存データ一覧
        </button>

        <button id="migrationButton" class="white-button" style="width:100%;margin-top:7px;">
            データ移行
        </button>

    </div>
</div>


<div id="editorScreen" class="screen game hidden">

    <div class="editor-ui">

        <div class="ui-title">
            ステージを作る
        </div>

        <div class="button-row">

            <button class="orange-button" data-editor-tool="select">
                選択
            </button>

            <button class="orange-button" data-editor-tool="wood">
                木
            </button>

            <button class="orange-button" data-editor-tool="stone">
                石
            </button>

            <button class="orange-button" data-editor-tool="glass">
                ガラス
            </button>

            <button class="orange-button" data-editor-tool="slime">
                スライム
            </button>

            <button class="orange-button" data-editor-tool="bomb">
                爆弾
            </button>

            <button class="orange-button" data-editor-tool="multiply">
                倍
            </button>

            <button class="orange-button" data-editor-tool="bedrock">
                岩盤
            </button>

            <button class="orange-button" data-editor-tool="house">
                家
            </button>

            <button class="orange-button" data-editor-tool="dropper">
                投下機
            </button>

        </div>

        <div id="editorActions" class="edit-actions hidden">

            <button data-editor-action="move">
                移動
            </button>

            <button data-editor-action="resize">
                形変更
            </button>

            <button data-editor-action="rotate">
                回転
            </button>

            <button id="deleteSelectedButton">
                削除
            </button>

        </div>

        <div id="editorDropperSettings" class="dropper-line hidden">

            <span>投下間隔</span>
            <input id="editorInterval" type="number" min=".1" step=".1" value="5">

            <span>秒</span>

            <span>個数</span>
            <input id="editorCount" type="number" min="1" max="100" value="1">

            <span>爆発</span>
            <input id="editorBombTimer" type="number" min=".1" step=".1" value="10">

            <span>秒</span>

            <button id="editorDropperApply">
                反映
            </button>

            <button id="editorDropperToggle">
                ON/OFF
            </button>

            <span id="editorDropperStatus" class="dropper-status">
                OFF
            </span>

        </div>

        <div id="editorStatus" class="status">
            選択してブロックを操作できます。
        </div>

    </div>

    <div class="stage-area">
        <canvas id="canvas"></canvas>
        <div class="floor-label">消せない岩盤</div>
    </div>

    <div class="bottom-ui">

        <div class="zoom-row">
            <button id="editorZoomOut">−</button>
            <div id="editorZoomValue" class="zoom-number">100%</div>
            <button id="editorZoomIn">＋</button>
        </div>

        <div class="button-row">

            <button id="editorSave" class="orange-button">
                ステージを保存
            </button>

            <button id="editorSaved" class="white-small">
                保存データ
            </button>

            <button id="editorBack" class="white-small">
                戻る
            </button>

        </div>

    </div>

</div>


<div id="playScreen" class="screen game hidden">

    <div class="play-ui">

        <div class="ui-title">
            ステージで遊ぶ
        </div>

        <div class="button-row">

            <button id="playBombTool" class="orange-button active">
                爆弾を投下
            </button>

            <button id="playReset" class="orange-button">
                リセット（やり直す）
            </button>

            <button id="playExplodeAll" class="orange-button">
                全爆破
            </button>

            <button id="playSettings" class="white-small">
                自動投下機設定
            </button>

            <button id="playBack" class="white-small">
                戻る
            </button>

        </div>

        <div id="playDropperSettings" class="dropper-line hidden">

            <span>間隔</span>
            <input id="playInterval" type="number" min=".1" step=".1" value="5">

            <span>秒</span>

            <span>個数</span>
            <input id="playCount" type="number" min="1" max="100" value="1">

            <span>爆発</span>
            <input id="playBombTimer" type="number" min=".1" step=".1" value="10">

            <span>秒</span>

            <button id="playDropperApply">
                反映
            </button>

        </div>

        <div class="play-info">
            爆弾をステージ内でタップすると投下します。自動爆弾投下機はステージ上の投下機を直接タップしてON/OFFできます。
        </div>

        <div id="playStatus" class="status">
            爆弾投下モード
        </div>

    </div>

    <div class="stage-area">
        <canvas id="playCanvas"></canvas>
        <div class="floor-label">消せない岩盤</div>
    </div>

    <div class="bottom-ui">

        <div class="zoom-row">
            <button id="playZoomOut">−</button>
            <div id="playZoomValue" class="zoom-number">100%</div>
            <button id="playZoomIn">＋</button>
        </div>

    </div>

</div>


<div id="saveModal" class="modal-bg hidden">

    <div class="modal">

        <h2>ステージを保存</h2>

        <input
            id="stageName"
            class="modal-input"
            maxlength="100"
            placeholder="ステージ名"
        >

        <div class="modal-row">

            <button id="saveConfirm" class="main-button">
                保存
            </button>

            <button id="saveCancel" class="white-button">
                キャンセル
            </button>

        </div>

    </div>

</div>


<div id="savedModal" class="modal-bg hidden">

    <div class="modal">

        <h2>保存データ一覧</h2>

        <div id="stageList" class="stage-list"></div>

        <div class="modal-row">
            <button id="savedClose" class="white-button">
                閉じる
            </button>
        </div>

    </div>

</div>


<div id="migrationModal" class="modal-bg hidden">

    <div class="modal">

        <h2>データ移行</h2>

        <div class="modal-row">

            <button id="exportButton" class="main-button">
                データを書き出す
            </button>

            <button id="importButton" class="white-button">
                データを読み込む
            </button>

            <input
                id="importFile"
                type="file"
                accept=".json,application/json"
                class="hidden"
            >

        </div>

        <div class="modal-row">
            <button id="migrationClose" class="white-button">
                閉じる
            </button>
        </div>

    </div>

</div>


<script>
const {
    Engine,
    Bodies,
    Body,
    Composite,
    Events,
    Vector
} = Matter;

const STORAGE_KEY = "slime_castle_original_stages_v3";

const FLOOR_HEIGHT = 42;

let engine = null;

let editorCanvas = document.getElementById("canvas");
let editorCtx = editorCanvas.getContext("2d");

let playCanvas = document.getElementById("playCanvas");
let playCtx = playCanvas.getContext("2d");

let activeCanvas = editorCanvas;
let activeCtx = editorCtx;

let canvasWidth = 0;
let canvasHeight = 0;

let currentMode = "editor";

let editorTool = "select";
let editorAction = null;

let selectedBody = null;

let pointerData = null;

let zoomEditor = 1;
let zoomPlay = 1;

let animationFrame = null;
let lastTime = performance.now();

let explosions = [];

let idCounter = 0;

let currentPlayStage = null;
let playOriginalObjects = [];

let editorObjectsBeforePlay = [];

const multiplierTouch = new WeakMap();

function newId(){

    idCounter++;

    return (
        "object_" +
        Date.now().toString(36) +
        "_" +
        idCounter.toString(36) +
        "_" +
        Math.random().toString(36).slice(2,8)
    );
}

function clamp(v,min,max){
    return Math.max(min,Math.min(max,v));
}

function createEngine(){

    engine = Engine.create({
        enableSleeping:false
    });

    engine.gravity.y = 1;

    engine.positionIterations = 12;
    engine.velocityIterations = 10;
    engine.constraintIterations = 5;

    installPhysicsEvents();

    if(!animationFrame){

        lastTime = performance.now();

        animationFrame =
            requestAnimationFrame(gameLoop);
    }
}

function gameLoop(now){

    const dt =
        Math.min(
            50,
            now-lastTime
        );

    lastTime = now;

    if(engine){

        Engine.update(
            engine,
            dt
        );

        updateBombTimers(now);

        updateDroppers(now);

        draw();

    }

    animationFrame =
        requestAnimationFrame(gameLoop);
}

function getStageArea(){

    return document.querySelector(
        currentMode === "editor"
            ? "#editorScreen .stage-area"
            : "#playScreen .stage-area"
    );
}

function resizeCanvas(){

    const area =
        getStageArea();

    if(!area){
        return;
    }

    const rect =
        area.getBoundingClientRect();

    canvasWidth =
        Math.max(
            300,
            rect.width
        );

    canvasHeight =
        Math.max(
            400,
            rect.height
        );

    const canvas =
        currentMode === "editor"
            ? editorCanvas
            : playCanvas;

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        Math.floor(
            canvasWidth*dpr
        );

    canvas.height =
        Math.floor(
            canvasHeight*dpr
        );

    canvas.style.width =
        canvasWidth+"px";

    canvas.style.height =
        canvasHeight+"px";

    if(currentMode === "editor"){

        editorCtx =
            editorCanvas.getContext("2d");

        editorCtx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );

        activeCanvas =
            editorCanvas;

        activeCtx =
            editorCtx;

    }else{

        playCtx =
            playCanvas.getContext("2d");

        playCtx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );

        activeCanvas =
            playCanvas;

        activeCtx =
            playCtx;
    }

    rebuildFloor();
}

function rebuildFloor(){

    if(!engine){
        return;
    }

    Composite
        .allBodies(engine.world)
        .filter(
            b=>b.isGroundBedrock
        )
        .forEach(
            b=>Composite.remove(
                engine.world,
                b
            )
        );

    const floor =
        Bodies.rectangle(
            canvasWidth/2,
            canvasHeight-FLOOR_HEIGHT/2,
            canvasWidth+300,
            FLOOR_HEIGHT,
            {
                isStatic:true,
                isGroundBedrock:true,
                label:"groundBedrock",
                friction:1.5,
                frictionStatic:5,
                restitution:0
            }
        );

    Composite.add(
        engine.world,
        floor
    );
}

function objectDefaults(type){

    const data = {

        wood:{
            width:75,
            height:45,
            strength:30
        },

        stone:{
            width:75,
            height:45,
            strength:55
        },

        glass:{
            width:75,
            height:45,
            strength:22
        },

        slime:{
            width:35,
            height:35,
            strength:25
        },

        bomb:{
            width:34,
            height:34,
            strength:999999
        },

        multiply:{
            width:80,
            height:55,
            strength:999999
        },

        bedrock:{
            width:82,
            height:50,
            strength:999999
        },

        house:{
            width:110,
            height:75,
            strength:40
        },

        dropper:{
            width:95,
            height:54,
            strength:999999
        }

    };

    return data[type];
}

function createBody(type,x,y,opt={}){

    const d =
        objectDefaults(type);

    const width =
        opt.width || d.width;

    const height =
        opt.height || d.height;

    const angle =
        opt.angle || 0;

    let body;

    if(type === "slime"){

        body =
            Bodies.circle(
                x,
                y,
                width/2,
                {
                    restitution:.15,
                    friction:.8,
                    density:.002
                }
            );

    }else if(type === "bomb"){

        body =
            Bodies.circle(
                x,
                y,
                width/2,
                {
                    restitution:.2,
                    friction:.7,
                    density:.002
                }
            );

    }else if(type === "house"){

        body =
            createHouseBody(
                x,
                y,
                width,
                height,
                angle
            );

    }else{

        body =
            Bodies.rectangle(
                x,
                y,
                width,
                height,
                {
                    isStatic:
                        type === "multiply" ||
                        type === "bedrock" ||
                        type === "dropper",

                    isSensor:
                        type === "multiply",

                    restitution:
                        type === "glass"
                            ? .05
                            : .1,

                    friction:
                        type === "glass"
                            ? .45
                            : .8,

                    density:.002
                }
            );
    }

    body.objectId =
        opt.objectId || newId();

    body.objectType =
        type;

    body.objectWidth =
        width;

    body.objectHeight =
        height;

    body.baseWidth =
        width;

    body.baseHeight =
        height;

    body.strength =
        opt.strength ?? d.strength;

    body.damage =
        opt.damage || 0;

    body.factor =
        opt.factor || 2;

    body.timerDuration =
        opt.timerDuration || 8;

    body.createdAt =
        performance.now();

    body.exploded =
        false;

    body.fromMultiplierId =
        opt.fromMultiplierId || null;

    body.dropInterval =
        opt.dropInterval || 5;

    body.dropCount =
        opt.dropCount || 1;

    body.dropBombTimer =
        opt.dropBombTimer || 10;

    body.dropperEnabled =
        opt.dropperEnabled !== undefined
            ? opt.dropperEnabled
            : false;

    body.dropperLastDrop =
        performance.now();

    Body.setAngle(
        body,
        angle
    );

    body.objectAngle =
        angle;

    Composite.add(
        engine.world,
        body
    );

    return body;
}

function createHouseBody(
    x,
    y,
    width,
    height,
    angle
){

    const thickness =
        Math.max(
            9,
            Math.min(width,height)*.14
        );

    const top =
        Bodies.rectangle(
            x,
            y-height/2+thickness/2,
            width,
            thickness,
            {
                density:.002,
                friction:.8
            }
        );

    const bottom =
        Bodies.rectangle(
            x,
            y+height/2-thickness/2,
            width,
            thickness,
            {
                density:.002,
                friction:.8
            }
        );

    const left =
        Bodies.rectangle(
            x-width/2+thickness/2,
            y,
            thickness,
            height-thickness*2,
            {
                density:.002,
                friction:.8
            }
        );

    const right =
        Bodies.rectangle(
            x+width/2-thickness/2,
            y,
            thickness,
            height-thickness*2,
            {
                density:.002,
                friction:.8
            }
        );

    const compound =
        Body.create({
            parts:[
                top,
                bottom,
                left,
                right
            ],
            density:.002,
            friction:.8
        });

    Body.setPosition(
        compound,
        {
            x:x,
            y:y
        }
    );

    Body.setAngle(
        compound,
        angle
    );

    return compound;
}

function installPhysicsEvents(){

    Events.on(
        engine,
        "collisionStart",
        event=>{

            event.pairs.forEach(pair=>{

                processMultiplier(
                    pair.bodyA,
                    pair.bodyB
                );

                processMultiplier(
                    pair.bodyB,
                    pair.bodyA
                );
            });
        }
    );

    Events.on(
        engine,
        "collisionEnd",
        event=>{

            event.pairs.forEach(pair=>{

                releaseMultiplier(
                    pair.bodyA,
                    pair.bodyB
                );

                releaseMultiplier(
                    pair.bodyB,
                    pair.bodyA
                );
            });
        }
    );
}

function processMultiplier(
    bomb,
    multiplier
){

    if(
        !bomb ||
        !multiplier ||
        bomb.objectType !== "bomb" ||
        multiplier.objectType !== "multiply"
    ){
        return;
    }

    /*
       重要：

       Aで増殖した爆弾
       ↓
       fromMultiplierId = A

       Aでは増殖不可
       Bでは増殖可能

       Bで増殖した爆弾
       ↓
       fromMultiplierId = B

       Bでは増殖不可
       Aでは増殖可能

       過去にどこを通ったかは記憶しない。
    */

    if(
        bomb.fromMultiplierId ===
        multiplier.objectId
    ){
        return;
    }

    let set =
        multiplierTouch.get(bomb);

    if(!set){

        set = new Set();

        multiplierTouch.set(
            bomb,
            set
        );
    }

    if(
        set.has(
            multiplier.objectId
        )
    ){
        return;
    }

    set.add(
        multiplier.objectId
    );

    const factor =
        clamp(
            Number(multiplier.factor)||2,
            2,
            20
        );

    multiplyBomb(
        bomb,
        factor,
        multiplier.objectId
    );
}

function releaseMultiplier(
    bomb,
    multiplier
){

    if(
        !bomb ||
        !multiplier ||
        bomb.objectType !== "bomb" ||
        multiplier.objectType !== "multiply"
    ){
        return;
    }

    const set =
        multiplierTouch.get(bomb);

    if(!set){
        return;
    }

    set.delete(
        multiplier.objectId
    );
}

function multiplyBomb(
    original,
    factor,
    multiplierId
){

    if(
        !original ||
        original.exploded
    ){
        return;
    }

    const x =
        original.position.x;

    const y =
        original.position.y;

    const timer =
        original.timerDuration;

    /*
       factor=2なら1個追加
       factor=3なら2個追加

       元の爆弾と合わせて
       合計factor個。

       全てに
       「直前の倍ブロック」
       を記録する。
    */

    for(
        let i=0;
        i<factor-1;
        i++
    ){

        const child =
            createBody(
                "bomb",
                x,
                y,
                {
                    timerDuration:timer,
                    fromMultiplierId:multiplierId
                }
            );

        child.createdAt =
            performance.now();
    }

    original.fromMultiplierId =
        multiplierId;

    original.createdAt =
        performance.now();
}

function createBomb(
    x,
    y,
    timer=8
){

    return createBody(
        "bomb",
        x,
        y,
        {
            timerDuration:timer
        }
    );
}

function updateBombTimers(now){

    Composite
        .allBodies(engine.world)
        .forEach(body=>{

            if(
                body.objectType !== "bomb" ||
                body.exploded
            ){
                return;
            }

            const elapsed =
                (now-body.createdAt)/1000;

            if(
                elapsed >=
                body.timerDuration
            ){

                explodeBomb(body);
            }
        });
}

function explodeBomb(bomb){

    if(
        !bomb ||
        bomb.exploded
    ){
        return;
    }

    bomb.exploded =
        true;

    const radius = 150;

    const power = .055;

    Composite
        .allBodies(engine.world)
        .forEach(body=>{

            if(
                body === bomb ||
                body.isStatic ||
                body.isGroundBedrock
            ){
                return;
            }

            const dx =
                body.position.x-
                bomb.position.x;

            const dy =
                body.position.y-
                bomb.position.y;

            const distance =
                Math.max(
                    1,
                    Math.hypot(dx,dy)
                );

            if(distance > radius){
                return;
            }

            const strength =
                (1-distance/radius)*
                power;

            Body.applyForce(
                body,
                body.position,
                {
                    x:dx/distance*strength,
                    y:dy/distance*strength
                }
            );

            if(
                currentMode === "play"
            ){

                damageBody(
                    body,
                    strength*100
                );
            }
        });

    explosions.push({
        x:bomb.position.x,
        y:bomb.position.y,
        start:performance.now(),
        duration:500,
        radius:radius
    });

    Composite.remove(
        engine.world,
        bomb
    );
}

function damageBody(
    body,
    damage
){

    if(
        body.isStatic ||
        body.isGroundBedrock ||
        body.objectType === "bomb" ||
        body.objectType === "multiply" ||
        body.objectType === "dropper"
    ){
        return;
    }

    body.damage =
        (body.damage||0)+damage;

    if(
        body.damage >= body.strength
    ){

        Composite.remove(
            engine.world,
            body
        );

        if(selectedBody === body){
            selectedBody = null;
        }
    }
}

function updateDroppers(now){

    Composite
        .allBodies(engine.world)
        .forEach(body=>{

            if(
                body.objectType !== "dropper" ||
                !body.dropperEnabled
            ){
                return;
            }

            const interval =
                Math.max(
                    .1,
                    Number(
                        body.dropInterval
                    )||5
                )*1000;

            if(
                now-body.dropperLastDrop >=
                interval
            ){

                body.dropperLastDrop =
                    now;

                const count =
                    clamp(
                        Math.floor(
                            Number(
                                body.dropCount
                            )||1
                        ),
                        1,
                        100
                    );

                for(
                    let i=0;
                    i<count;
                    i++
                ){

                    const offset =
                        (i-(count-1)/2)*22;

                    createBomb(
                        body.position.x+offset,
                        body.position.y+
                        body.objectHeight/2+
                        25,
                        Number(
                            body.dropBombTimer
                        )||10
                    );
                }
            }
        });
}

function getZoom(){

    return currentMode === "editor"
        ? zoomEditor
        : zoomPlay;
}

function setZoom(v){

    v =
        clamp(
            v,
            .5,
            2
        );

    if(currentMode === "editor"){

        zoomEditor = v;

        document.getElementById(
            "editorZoomValue"
        ).textContent =
            Math.round(v*100)+"%";

    }else{

        zoomPlay = v;

        document.getElementById(
            "playZoomValue"
        ).textContent =
            Math.round(v*100)+"%";
    }
}

function pointerToWorld(e){

    const rect =
        activeCanvas.getBoundingClientRect();

    const z =
        getZoom();

    return {
        x:
            (e.clientX-rect.left)/z,
        y:
            (e.clientY-rect.top)/z
    };
}

function getBodyAt(x,y){

    const bodies =
        Composite.allBodies(
            engine.world
        );

    for(
        let i=bodies.length-1;
        i>=0;
        i--
    ){

        const body =
            bodies[i];

        if(body.isGroundBedrock){
            continue;
        }

        if(
            body.objectType === "house"
        ){

            if(
                pointInHouse(
                    body,
                    x,
                    y
                )
            ){
                return body;
            }

            continue;
        }

        const local =
            Vector.rotate(
                {
                    x:x-body.position.x,
                    y:y-body.position.y
                },
                -body.angle
            );

        const w =
            body.objectWidth ||
            body.baseWidth ||
            40;

        const h =
            body.objectHeight ||
            body.baseHeight ||
            40;

        if(
            Math.abs(local.x)<=w/2 &&
            Math.abs(local.y)<=h/2
        ){
            return body;
        }
    }

    return null;
}

function pointInHouse(
    body,
    x,
    y
){

    const local =
        Vector.rotate(
            {
                x:x-body.position.x,
                y:y-body.position.y
            },
            -body.angle
        );

    const w =
        body.objectWidth;

    const h =
        body.objectHeight;

    const t =
        Math.max(
            9,
            Math.min(w,h)*.14
        );

    if(
        Math.abs(local.x)>w/2 ||
        Math.abs(local.y)>h/2
    ){
        return false;
    }

    return (
        Math.abs(local.x)>=w/2-t ||
        Math.abs(local.y)>=h/2-t
    );
}

function getResizeHandles(body){

    if(
        !body ||
        body.objectType === "bomb" ||
        body.objectType === "slime" ||
        body.objectType === "dropper"
    ){
        return [];
    }

    const w =
        body.objectWidth;

    const h =
        body.objectHeight;

    const points = [
        {x:-w/2,y:-h/2},
        {x:w/2,y:-h/2},
        {x:w/2,y:h/2},
        {x:-w/2,y:h/2}
    ];

    return points.map(p=>{

        const r =
            Vector.rotate(
                p,
                body.angle
            );

        return {
            x:
                body.position.x+r.x,
            y:
                body.position.y+r.y
        };
    });
}

function getRotateHandle(body){

    const distance =
        Math.max(
            body.objectWidth,
            body.objectHeight
        )/2+45;

    const p =
        Vector.rotate(
            {
                x:0,
                y:-distance
            },
            body.angle
        );

    return {
        x:
            body.position.x+p.x,
        y:
            body.position.y+p.y
    };
}

function selectBody(body){

    if(
        !body ||
        body.isGroundBedrock
    ){
        return;
    }

    selectedBody =
        body;

    editorAction =
        null;

    document
        .querySelectorAll(
            "[data-editor-action]"
        )
        .forEach(btn=>{
            btn.classList.remove(
                "active"
            );
        });

    document
        .getElementById(
            "editorActions"
        )
        .classList.remove(
            "hidden"
        );

    if(
        body.objectType === "dropper"
    ){

        openEditorDropperSettings();

    }else{

        document
            .getElementById(
                "editorDropperSettings"
            )
            .classList.add(
                "hidden"
            );
    }

    document
        .getElementById(
            "editorStatus"
        ).textContent =
        "ブロックを選択しました。操作を選んでください。";
}

function pointerDown(e){

    if(!engine){
        return;
    }

    e.preventDefault();

    const p =
        pointerToWorld(e);

    pointerData = {
        id:e.pointerId,
        start:p,
        body:null,
        handle:null,
        originalWidth:0,
        originalHeight:0,
        originalX:0,
        originalY:0
    };

    try{
        activeCanvas.setPointerCapture(
            e.pointerId
        );
    }catch(_){}

    if(currentMode === "play"){

        const hit =
            getBodyAt(
                p.x,
                p.y
            );

        if(
            hit &&
            hit.objectType === "dropper"
        ){

            toggleDropper(
                hit
            );

            return;
        }

        createBomb(
            p.x,
            p.y,
            8
        );

        return;
    }

    if(editorTool !== "select"){

        if(
            editorTool === "bomb"
        ){

            createBomb(
                p.x,
                p.y,
                8
            );

        }else{

            createBody(
                editorTool,
                p.x,
                p.y
            );
        }

        return;
    }

    if(!selectedBody){

        const hit =
            getBodyAt(
                p.x,
                p.y
            );

        if(hit){
            selectBody(hit);
        }

        return;
    }

    if(editorAction === "move"){

        pointerData.body =
            selectedBody;

        stopBody(
            selectedBody
        );

        return;
    }

    if(editorAction === "resize"){

        const handles =
            getResizeHandles(
                selectedBody
            );

        let nearest = null;
        let best = Infinity;

        handles.forEach((h,i)=>{

            const d =
                Math.hypot(
                    p.x-h.x,
                    p.y-h.y
                );

            if(
                d<28 &&
                d<best
            ){

                best=d;
                nearest=i;
            }
        });

        if(nearest !== null){

            pointerData.body =
                selectedBody;

            pointerData.handle =
                nearest;

            pointerData.originalWidth =
                selectedBody.objectWidth;

            pointerData.originalHeight =
                selectedBody.objectHeight;

            pointerData.originalX =
                selectedBody.position.x;

            pointerData.originalY =
                selectedBody.position.y;

            stopBody(
                selectedBody
            );
        }

        return;
    }

    if(editorAction === "rotate"){

        const handle =
            getRotateHandle(
                selectedBody
            );

        const d =
            Math.hypot(
                p.x-handle.x,
                p.y-handle.y
            );

        if(d<32){

            pointerData.body =
                selectedBody;

            stopBody(
                selectedBody
            );
        }

        return;
    }
}

function pointerMove(e){

    if(!pointerData){
        return;
    }

    if(
        pointerData.id !==
        e.pointerId
    ){
        return;
    }

    e.preventDefault();

    const p =
        pointerToWorld(e);

    const body =
        pointerData.body;

    if(!body){
        return;
    }

    if(
        editorAction === "move"
    ){

        Body.setPosition(
            body,
            {
                x:p.x,
                y:p.y
            }
        );

        stopBody(body);

        return;
    }

    if(
        editorAction === "resize"
    ){

        resizeBody(
            body,
            p
        );

        stopBody(body);

        return;
    }

    if(
        editorAction === "rotate"
    ){

        const angle =
            Math.atan2(
                p.y-body.position.y,
                p.x-body.position.x
            )+
            Math.PI/2;

        Body.setAngle(
            body,
            angle
        );

        body.objectAngle =
            angle;

        stopBody(body);

        return;
    }
}

function pointerUp(e){

    if(
        pointerData &&
        pointerData.body
    ){

        stopBody(
            pointerData.body
        );
    }

    pointerData = null;

    try{
        activeCanvas.releasePointerCapture(
            e.pointerId
        );
    }catch(_){}
}

function stopBody(body){

    Body.setVelocity(
        body,
        {
            x:0,
            y:0
        }
    );

    Body.setAngularVelocity(
        body,
        0
    );

    Body.setSleeping(
        body,
        false
    );
}

function resizeBody(
    body,
    pointer
){

    const local =
        Vector.rotate(
            {
                x:
                    pointer.x-
                    body.position.x,

                y:
                    pointer.y-
                    body.position.y
            },
            -body.angle
        );

    let w =
        Math.abs(local.x)*2;

    let h =
        Math.abs(local.y)*2;

    w =
        clamp(
            w,
            25,
            600
        );

    h =
        clamp(
            h,
            25,
            600
        );

    if(
        body.objectType === "house"
    ){

        rebuildHouse(
            body,
            w,
            h
        );

        return;
    }

    const sx =
        w/body.objectWidth;

    const sy =
        h/body.objectHeight;

    Body.scale(
        body,
        sx,
        sy
    );

    body.objectWidth =
        w;

    body.objectHeight =
        h;

    Body.setPosition(
        body,
        {
            x:pointerData.originalX,
            y:pointerData.originalY
        }
    );
}

function rebuildHouse(
    oldBody,
    width,
    height
){

    const x =
        oldBody.position.x;

    const y =
        oldBody.position.y;

    const angle =
        oldBody.angle;

    const id =
        oldBody.objectId;

    const strength =
        oldBody.strength;

    Composite.remove(
        engine.world,
        oldBody
    );

    const newBody =
        createBody(
            "house",
            x,
            y,
            {
                objectId:id,
                width:width,
                height:height,
                angle:angle,
                strength:strength
            }
        );

    selectedBody =
        newBody;

    pointerData.body =
        newBody;
}

function toggleDropper(body){

    if(
        !body ||
        body.objectType !== "dropper"
    ){
        return;
    }

    body.dropperEnabled =
        !body.dropperEnabled;

    body.dropperLastDrop =
        performance.now();

    if(
        currentMode === "editor"
    ){

        updateEditorDropperStatus();

        document.getElementById(
            "editorStatus"
        ).textContent =
            body.dropperEnabled
                ? "自動爆弾投下機：ON"
                : "自動爆弾投下機：OFF";
    }
}

function openEditorDropperSettings(){

    if(
        !selectedBody ||
        selectedBody.objectType !== "dropper"
    ){
        return;
    }

    document
        .getElementById(
            "editorDropperSettings"
        )
        .classList.remove(
            "hidden"
        );

    document.getElementById(
        "editorInterval"
    ).value =
        selectedBody.dropInterval;

    document.getElementById(
        "editorCount"
    ).value =
        selectedBody.dropCount;

    document.getElementById(
        "editorBombTimer"
    ).value =
        selectedBody.dropBombTimer;

    updateEditorDropperStatus();
}

function updateEditorDropperStatus(){

    if(
        !selectedBody ||
        selectedBody.objectType !== "dropper"
    ){
        return;
    }

    const status =
        document.getElementById(
            "editorDropperStatus"
        );

    status.textContent =
        selectedBody.dropperEnabled
            ? "ON"
            : "OFF";

    status.classList.toggle(
        "on",
        selectedBody.dropperEnabled
    );
}

function applyEditorDropperSettings(){

    if(
        !selectedBody ||
        selectedBody.objectType !== "dropper"
    ){
        return;
    }

    selectedBody.dropInterval =
        clamp(
            Number(
                document.getElementById(
                    "editorInterval"
                ).value
            )||5,
            .1,
            3600
        );

    selectedBody.dropCount =
        clamp(
            Math.floor(
                Number(
                    document.getElementById(
                        "editorCount"
                    ).value
                )||1
            ),
            1,
            100
        );

    selectedBody.dropBombTimer =
        clamp(
            Number(
                document.getElementById(
                    "editorBombTimer"
                ).value
            )||10,
            .1,
            3600
        );

    document.getElementById(
        "editorStatus"
    ).textContent =
        "自動爆弾投下機の設定を反映しました。";
}

document.getElementById(
    "editorDropperApply"
).addEventListener(
    "click",
    applyEditorDropperSettings
);

document.getElementById(
    "editorDropperToggle"
).addEventListener(
    "click",
    ()=>{

        if(selectedBody){
            toggleDropper(
                selectedBody
            );
        }
    }
);

document.querySelectorAll(

            }

});

document.querySelectorAll(
    "[data-editor-action]"
).forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            if(!selectedBody){

                document.getElementById(
                    "editorStatus"
                ).textContent =
                    "先にブロックを選択してください。";

                return;
            }

            const action =
                button.dataset.editorAction;

            if(
                action === "resize" &&
                (
                    selectedBody.objectType === "bomb" ||
                    selectedBody.objectType === "slime" ||
                    selectedBody.objectType === "dropper"
                )
            ){

                document.getElementById(
                    "editorStatus"
                ).textContent =
                    "このブロックは形変更できません。";

                return;
            }

            editorAction =
                action;

            document
                .querySelectorAll(
                    "[data-editor-action]"
                )
                .forEach(b=>{
                    b.classList.toggle(
                        "active",
                        b === button
                    );
                });

            document.getElementById(
                "editorStatus"
            ).textContent =
                action === "move"

function draw(){

    activeCtx.clearRect(
        0,
        0,
        canvasWidth,
        canvasHeight
    );

    activeCtx.save();

    const z =
        getZoom();

    activeCtx.scale(
        z,
        z
    );

    drawBackground();

    Composite
        .allBodies(engine.world)
        .forEach(
            drawBody
        );

    drawExplosions();

    if(
        currentMode === "editor" &&
        selectedBody
    ){

        drawSelection();
    }

    activeCtx.restore();
}

function drawBackground(){

    const ctx =
        activeCtx;

    ctx.fillStyle =
        "#fafafa";

    ctx.fillRect(
        0,
        0,
        canvasWidth/getZoom(),
        canvasHeight/getZoom()
    );

    ctx.strokeStyle =
        "rgba(0,0,0,.035)";

    ctx.lineWidth = 1;

    const grid = 40;

    for(
        let x=0;
        x<canvasWidth/getZoom();
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            canvasHeight/getZoom()
        );

        ctx.stroke();
    }

    for(
        let y=0;
        y<canvasHeight/getZoom();
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            canvasWidth/getZoom(),
            y
        );

        ctx.stroke();
    }
}

function drawBody(body){

    const ctx =
        activeCtx;

    if(body.isGroundBedrock){

        ctx.fillStyle =
            "#3b3b3b";

        ctx.fillRect(
            body.bounds.min.x,
            body.bounds.min.y,
            body.bounds.max.x-
            body.bounds.min.x,
            body.bounds.max.y-
            body.bounds.min.y
        );

        return;
    }

    const type =
        body.objectType;

    if(type === "house"){

        drawHouse(body);
        return;
    }

    ctx.save();

    ctx.translate(
        body.position.x,
        body.position.y
    );

    ctx.rotate(
        body.angle
    );

    const w =
        body.objectWidth;

    const h =
        body.objectHeight;

    if(type === "bomb"){

        ctx.fillStyle =
            "#222";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            w/2,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle =
            "#f80";

        ctx.beginPath();

        ctx.arc(
            0,
            -w*.3,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle =
            "#fff";

        ctx.font =
            "900 10px sans-serif";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        const left =
            Math.max(
                0,
                body.timerDuration-
                (
                    performance.now()-
                    body.createdAt
                )/1000
            );

        ctx.fillText(
            left.toFixed(1),
            0,
            0
        );

    }else if(type === "multiply"){

        ctx.fillStyle =
            "#d56bff";

        ctx.fillRect(
            -w/2,
            -h/2,
            w,
            h
        );

        ctx.strokeStyle =
            "#7b2299";

        ctx.lineWidth = 3;

        ctx.strokeRect(
            -w/2,
            -h/2,
            w,
            h
        );

        ctx.fillStyle =
            "#fff";

        ctx.font =
            "900 21px sans-serif";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "×"+body.factor,
            0,
            0
        );

    }else if(type === "bedrock"){

        ctx.fillStyle =
            "#444";

        ctx.fillRect(
            -w/2,
            -h/2,
            w,
            h
        );

        ctx.strokeStyle =
            "#222";

        ctx.lineWidth = 3;

        ctx.strokeRect(
            -w/2,
            -h/2,
            w,
            h
        );

    }else if(type === "dropper"){

        ctx.fillStyle =
            body.dropperEnabled
                ? "#f80"
                : "#888";

        ctx.fillRect(
            -w/2,
            -h/2,
            w,
            h
        );

        ctx.strokeStyle =
            "#333";

        ctx.lineWidth = 3;

        ctx.strokeRect(
            -w/2,
            -h/2,
            w,
            h
        );

        ctx.fillStyle =
            "#fff";

        ctx.font =
            "900 13px sans-serif";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            body.dropperEnabled
                ? "投下 ON"
                : "投下 OFF",
            0,
            0
        );

    }else if(type === "slime"){

        ctx.fillStyle =
            "#55b84a";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            w/2,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle =
            "#111";

        ctx.beginPath();

        ctx.arc(
            -6,
            -3,
            2.5,
            0,
            Math.PI*2
        );

        ctx.arc(
            6,
            -3,
            2.5,
            0,
            Math.PI*2
        );

        ctx.fill();

    }else{

        if(type === "wood"){
            ctx.fillStyle =
                "#9b641f";
        }

        if(type === "stone"){
            ctx.fillStyle =
                "#777";
        }

        if(type === "glass"){
            ctx.fillStyle =
                "rgba(120,210,255,.55)";
        }

        ctx.fillRect(
            -w/2,
            -h/2,
            w,
            h
        );

        ctx.strokeStyle =
            type === "glass"
                ? "#4aa6c8"
                : "#333";

        ctx.lineWidth = 2;

        ctx.strokeRect(
            -w/2,
            -h/2,
            w,
            h
        );
    }

    ctx.restore();
}

function drawHouse(body){

    const ctx =
        activeCtx;

    const w =
        body.objectWidth;

    const h =
        body.objectHeight;

    const t =
        Math.max(
            9,
            Math.min(w,h)*.14
        );

    ctx.save();

    ctx.translate(
        body.position.x,
        body.position.y
    );

    ctx.rotate(
        body.angle
    );

    ctx.fillStyle =
        "#d28a3a";

    ctx.fillRect(
        -w/2,
        -h/2,
        w,
        t
    );

    ctx.fillRect(
        -w/2,
        h/2-t,
        w,
        t
    );

    ctx.fillRect(
        -w/2,
        -h/2+t,
        t,
        h-t*2
    );

    ctx.fillRect(
        w/2-t,
        -h/2+t,
        t,
        h-t*2
    );

    ctx.strokeStyle =
        "#754617";

    ctx.lineWidth = 2;

    ctx.strokeRect(
        -w/2,
        -h/2,
        w,
        h
    );

    ctx.restore();
}

function drawSelection(){

    const body =
        selectedBody;

    if(!body){
        return;
    }

    const ctx =
        activeCtx;

    const w =
        body.objectWidth;

    const h =
        body.objectHeight;

    ctx.save();

    ctx.translate(
        body.position.x,
        body.position.y
    );

    ctx.rotate(
        body.angle
    );

    ctx.strokeStyle =
        "#f80";

    ctx.lineWidth = 3;

    ctx.setLineDash(
        [7,4]
    );

    ctx.strokeRect(
        -w/2,
        -h/2,
        w,
        h
    );

    ctx.setLineDash([]);

    ctx.restore();

    if(
        editorAction === "resize"
    ){

        getResizeHandles(body)
            .forEach(h=>{

                ctx.fillStyle =
                    "#fff";

                ctx.strokeStyle =
                    "#f80";

                ctx.lineWidth = 3;

                ctx.beginPath();

                ctx.arc(
                    h.x,
                    h.y,
                    7,
                    0,
                    Math.PI*2
                );

                ctx.fill();
                ctx.stroke();
            });
    }

    if(
        editorAction === "rotate"
    ){

        const handle =
            getRotateHandle(body);

        ctx.strokeStyle =
            "#f80";

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.moveTo(
            body.position.x,
            body.position.y
        );

        ctx.lineTo(
            handle.x,
            handle.y
        );

        ctx.stroke();

        ctx.fillStyle =
            "#fff";

        ctx.strokeStyle =
            "#f80";

        ctx.beginPath();

        ctx.arc(
            handle.x,
            handle.y,
            8,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.stroke();
    }
}

function drawExplosions(){

    const now =
        performance.now();

    explosions =
        explosions.filter(explosion=>{

            const elapsed =
                now-explosion.start;

            if(
                elapsed >
                explosion.duration
            ){
                return false;
            }

            const t =
                elapsed/explosion.duration;

            const radius =
                explosion.radius*t;

            const alpha =
                1-t;

            const gradient =
                activeCtx.createRadialGradient(
                    explosion.x,
                    explosion.y,
                    0,
                    explosion.x,
                    explosion.y,
                    radius
                );

            gradient.addColorStop(
                0,
                `rgba(255,255,255,${alpha})`
            );

            gradient.addColorStop(
                .3,
                `rgba(255,170,0,${alpha})`
            );

            gradient.addColorStop(
                .7,
                `rgba(255,70,0,${alpha*.7})`
            );

            gradient.addColorStop(
                1,
                "rgba(255,0,0,0)"
            );

            activeCtx.fillStyle =
                gradient;

            activeCtx.beginPath();

            activeCtx.arc(
                explosion.x,
                explosion.y,
                radius,
                0,
                Math.PI*2
            );

            activeCtx.fill();

            return true;
        });
}

function serializeBody(body){

    if(
        body.isGroundBedrock
    ){
        return null;
    }

    return {

        id:
            body.objectId,

        type:
            body.objectType,

        x:
            body.position.x,

        y:
            body.position.y,

        angle:
            body.angle,

        width:
            body.objectWidth,

        height:
            body.objectHeight,

        factor:
            body.factor || 2,

        timer:
            body.timerDuration || 8,

        strength:
            body.strength,

        dropInterval:
            body.dropInterval || 5,

        dropCount:
            body.dropCount || 1,

        dropBombTimer:
            body.dropBombTimer || 10,

        dropperEnabled:
            body.dropperEnabled || false
    };
}

function serializeStage(){

    return Composite
        .allBodies(engine.world)
        .map(serializeBody)
        .filter(Boolean);
}

function clearObjects(){

    Composite
        .allBodies(engine.world)
        .forEach(body=>{

            if(
                !body.isGroundBedrock
            ){

                Composite.remove(
                    engine.world,
                    body
                );
            }
        });

    selectedBody =
        null;
}

function loadObjects(objects){

    clearObjects();

    if(
        Array.isArray(objects)
    ){

        objects.forEach(o=>{

            createBody(
                o.type,
                o.x,
                o.y,
                {
                    objectId:
                        o.id || newId(),

                    width:
                        o.width,

                    height:
                        o.height,

                    angle:
                        o.angle || 0,

                    factor:
                        o.factor || 2,

                    timerDuration:
                        o.timer || 8,

                    strength:
                        o.strength,

                    dropInterval:
                        o.dropInterval || 5,

                    dropCount:
                        o.dropCount || 1,

                    dropBombTimer:
                        o.dropBombTimer || 10,

                    dropperEnabled:
                        o.dropperEnabled || false
                }
            );
        });
    }

    rebuildFloor();
}

function savedStages(){

    try{

        const data =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(!data){
            return [];
        }

        const parsed =
            JSON.parse(data);

        return Array.isArray(parsed)
            ? parsed
            : [];

    }catch(_){

        return [];
    }
}

function saveStages(data){

    localStorage.setItem(

    );
}

function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function renderSavedStages(){

    const list =
        document.getElementById(
            "stageList"
        );

    list.innerHTML = "";

    const stages =
        savedStages();

    if(
        stages.length === 0
    ){

        list.innerHTML =
            "<div class='stage-date'>保存されたステージはありません。</div>";

        return;
    }

    stages.forEach(stage=>{

        const item =
            document.createElement(
                "div"
            );

        item.className =
            "stage-item";

        const date =
            new Date(
                stage.createdAt
            ).toLocaleString(
                "ja-JP"
            );

        item.innerHTML = `

            <div class="stage-name">
                ${escapeHtml(stage.name)}
            </div>

            <div class="stage-date">
                ${escapeHtml(date)}
            </div>

            <div class="stage-buttons">

                <button data-edit="${stage.id}">
                    編集
                </button>

                <button data-play="${stage.id}">
                    遊ぶ
                </button>

                <button class="delete" data-delete="${stage.id}">
                    削除
                </button>

            </div>
        `;

        list.appendChild(item);
    });

    list.querySelectorAll(
        "[data-edit]"
    ).forEach(button=>{

        button.addEventListener(
            "click",
            ()=>{

                const stage =
                    savedStages()
                        .find(
                            s=>
                                s.id ===
                                button.dataset.edit
                        );

                if(!stage){
                    return;
                }

                openEditor();

                loadObjects(
                    stage.objects
                );

                closeSavedModal();
            }
        );
    });

    list.querySelectorAll(
        "[data-play]"
    ).forEach(button=>{

        button.addEventListener(
            "click",
            ()=>{

                const stage =
                    savedStages()
                        .find(
                            s=>
                                s.id ===
                                button.dataset.play
                        );

                if(!stage){
                    return;
                }

                openPlay(
                    stage
                );

                closeSavedModal();
            }
        );
    });

    list.querySelectorAll(
        "[data-delete]"
    ).forEach(button=>{

        button.addEventListener(
            "click",
            ()=>{

                const result =
                    savedStages()
                        .filter(
                            s=>
                                s.id !==
                                button.dataset.delete
                        );

                saveStages(
                    result
                );

                renderSavedStages();
            }
        );
    });
}

        exportedAt:
            new Date().toISOString(),

    };

    const blob =
        new Blob(
            [
                JSON.stringify(
                    data,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const a =
        document.createElement(
            "a"
        );

    a.href =
        url;

    a.download =
        "slime-castle-stages.json";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(
        url
    );
}

document.getElementById(
    "importFile"
).addEventListener(
    "change",
    async e=>{

        const file =
            e.target.files[0];

        if(!file){
            return;
        }

        try{

            const text =
                await file.text();

            const data =
                JSON.parse(
                    text
                );

            if(
                !data ||
                !Array.isArray(
                    data.stages
                )
            ){
                return;
            }

            const current =
                savedStages();

            const merged =
                [...current];

            data.stages.forEach(stage=>{

                if(
                    !merged.some(
                        s=>
                            s.id ===
                            stage.id
                    )
                ){

                    merged.push(
                        stage
                    );
                }
            });

            saveStages(
                merged
            );

            e.target.value = "";

        }catch(_){

            e.target.value = "";
        }
    }
);
