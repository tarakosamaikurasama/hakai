<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>スライム城くずし ステージメーカー</title>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#eee;
}
button{
  border:0;
  border-radius:12px;
  padding:10px 16px;
  font-size:15px;
  font-weight:bold;
  background:#fff;
  color:#222;
  box-shadow:0 2px 6px #0002;
  cursor:pointer;
}
button:active{
  transform:scale(.96);
}
#app{
  position:fixed;
  inset:0;
}
#canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}
#startScreen{
  position:absolute;
  inset:0;
  background:linear-gradient(#f7f7f7,#ddd);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
}
.startBox{
  width:min(420px,90vw);
  padding:30px 20px;
  background:#fff;
  border-radius:24px;
  box-shadow:0 8px 30px #0003;
  text-align:center;
}
.startBox h1{
  margin:0 0 25px;
  font-size:25px;
}
.startBtn{
  display:block;
  width:100%;
  margin:12px 0;
  padding:16px;
  font-size:18px;
}
.createBtn{
  background:#f80;
  color:#fff;
}
.playBtn{
  background:#222;
  color:#fff;
}
#stageScreen{
  position:absolute;
  inset:0;
  z-index:20;
  background:#eee;
  display:none;
  overflow:auto;
}
.stageHead{
  position:sticky;
  top:0;
  z-index:5;
  padding:14px;
  background:#222;
  color:#fff;
  display:flex;
  align-items:center;
  gap:10px;
}
.stageHead h2{
  margin:0;
  flex:1;
  font-size:19px;
}
.stageList{
  padding:15px;
}
.stageItem{
  background:#fff;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 3px 10px #0002;
}
.stageName{
  font-weight:bold;
  font-size:18px;
  margin-bottom:10px;
}
.stageBtns{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
#editorUI,#playUI{
  position:absolute;
  inset:0;
  z-index:10;
  display:none;
  pointer-events:none;
}
.topbar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:58px;
  background:#fff;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px;
  box-shadow:0 2px 8px #0002;
  pointer-events:auto;
}
.topbar button{
  padding:8px 11px;
}
.title{
  flex:1;
  min-width:0;
  text-align:center;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.toolbar{
  position:absolute;
  top:66px;
  left:8px;
  right:8px;
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:3px;
  pointer-events:auto;
}
.tool{
  flex:none;
  padding:9px 12px;
}
.tool.active{
  background:#f80;
  color:#fff;
}
#property{
  position:absolute;
  left:10px;
  bottom:10px;
  width:min(330px,calc(100vw - 20px));
  background:#fff;
  border-radius:16px;
  padding:12px;
  box-shadow:0 4px 15px #0003;
  display:none;
  pointer-events:auto;
}
#property .row{
  display:flex;
  align-items:center;
  gap:8px;
  margin:7px 0;
}
#property input{
  width:90px;
  padding:7px;
}
.playTools{
  position:absolute;
  left:8px;
  right:8px;
  top:66px;
  display:flex;
  gap:7px;
  pointer-events:auto;
}
#bombBtn{
  background:#222;
  color:#fff;
}
#allBombBtn{
  background:#f80;
  color:#fff;
}
#editorModeText{
  position:absolute;
  right:10px;
  bottom:10px;
  background:#fff;
  padding:8px 12px;
  border-radius:12px;
  box-shadow:0 2px 8px #0002;
  pointer-events:none;
}
</style>
</head>

<body>
<div id="app">

<canvas id="canvas"></canvas>

<div id="startScreen">
  <div class="startBox">
    <h1>スライム城くずし<br>ステージメーカー</h1>
    <button class="startBtn createBtn" id="createBtn">ステージを作る</button>
    <button class="startBtn playBtn" id="selectBtn">ステージで遊ぶ</button>
  </div>
</div>

<div id="stageScreen">
  <div class="stageHead">
    <button id="stageBack">戻る</button>
    <h2>ステージを選択</h2>
  </div>
  <div class="stageList" id="stageList"></div>
</div>

<div id="editorUI">
  <div class="topbar">
    <button id="editorBack">←</button>
    <div class="title" id="editorTitle">ステージ</div>
    <button id="saveBtn">保存</button>
    <button id="testBtn">遊ぶ</button>
    <button id="clearBtn">全消去</button>
  </div>

  <div class="toolbar">
    <button class="tool active" data-tool="move">移動</button>
    <button class="tool" data-tool="wood">木</button>
    <button class="tool" data-tool="glass">ガラス</button>
    <button class="tool" data-tool="stone">石</button>
    <button class="tool" data-tool="enemy">スライム</button>
    <button class="tool" data-tool="bomb">爆弾</button>
    <button class="tool" data-tool="multiply">増殖</button>
    <button class="tool" data-tool="bedrock">岩盤</button>
    <button class="tool" data-tool="erase">消去</button>
    <button class="tool" data-tool="rotate">回転</button>
    <button class="tool" data-tool="shape">形変更</button>
  </div>

  <div id="property">
    <div class="row">
      <b>幅</b>
      <input id="propW" type="number">
      <b>高さ</b>
      <input id="propH" type="number">
    </div>
    <div class="row">
      <b>角度</b>
      <input id="propAngle" type="number">
      <button id="applyProp">適用</button>
    </div>
  </div>

  <div id="editorModeText">編集中：ブロックは壊れません</div>
</div>

<div id="playUI">
  <div class="topbar">
    <button id="playBack">←</button>
    <div class="title" id="playTitle">ステージ</div>
    <button id="bombBtn">爆弾</button>
    <button id="allBombBtn">全爆破</button>
    <button id="restartBtn">リスタート</button>
  </div>
</div>

</div>

<script>
"use strict";

const {
  Engine,
  World,
  Bodies,
  Body,
  Events,
  Vector
}=Matter;

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const FLOOR_Y=1000;
const SAVE_KEY="slimeCastleMaker_v5";

let editorEngine=null;
let playEngine=null;
let currentMode="none";

let currentTool="move";
let selectedBody=null;
let rotateDragging=false;
let shapeDragging=null;
let movingBody=null;
let moveOffset={x:0,y:0};

let stageObjects=[];
let currentStageId=null;
let currentStageName="新しいステージ";

let newlyPlacedBodies=new Map();
let multiplyContacts=new Map();
let nextBodyId=1;

const camera={
  x:0,
  y:620,
  zoom:.7
};

const $=id=>document.getElementById(id);

function resizeCanvas(){
  canvas.width=canvas.clientWidth;
  canvas.height=canvas.clientHeight;
}
window.addEventListener("resize",resizeCanvas);
resizeCanvas();

function gameType(body){
  return body && body.plugin ? body.plugin.gameType : null;
}

function materialOf(body){
  return body && body.plugin ? body.plugin.material : null;
}

function isBlock(body){
  return gameType(body)==="block";
}

function isStaticObject(body){
  return gameType(body)==="bedrock" || gameType(body)==="floor";
}

function screenToWorld(x,y){
  return {
    x:(x-canvas.clientWidth/2)/camera.zoom+camera.x,
    y:(y-canvas.clientHeight/2)/camera.zoom+camera.y
  };
}

function worldToScreen(x,y){
  return {
    x:(x-camera.x)*camera.zoom+canvas.clientWidth/2,
    y:(y-camera.y)*camera.zoom+canvas.clientHeight/2
  };
}

function createEngine(){
  const engine=Engine.create({
    enableSleeping:true
  });

  engine.gravity.y=1;

  const floor=Bodies.rectangle(
    0,
    FLOOR_Y+50,
    100000,
    100,
    {
      isStatic:true,
      label:"floor",
      plugin:{
        gameType:"floor"
      }
    }
  );

  World.add(engine.world,floor);

  Events.on(engine,"beforeUpdate",()=>{
    const now=performance.now();

    for(const [body,endTime] of newlyPlacedBodies){
      if(now<endTime){
        Body.setVelocity(body,{x:0,y:0});
        Body.setAngularVelocity(body,0);
      }else{
        newlyPlacedBodies.delete(body);
        Matter.Sleeping.set(body,false);
      }
    }

    for(const body of engine.world.bodies){
      if(gameType(body)==="bedrock"){
        Body.setAngle(body,0);
        Body.setAngularVelocity(body,0);
      }
    }
  });

  Events.on(engine,"collisionStart",event=>{
    for(const pair of event.pairs){
      handleCollision(pair,engine);
    }
  });

  Events.on(engine,"collisionEnd",event=>{
    for(const pair of event.pairs){
      const a=pair.bodyA;
      const b=pair.bodyB;

      const ta=gameType(a);
      const tb=gameType(b);

      let bomb=null;
      let multi=null;

      if(ta==="bomb"&&tb==="multiply"){
        bomb=a;
        multi=b;
      }
      if(tb==="bomb"&&ta==="multiply"){
        bomb=b;
        multi=a;
      }

      if(bomb&&multi){
        const set=multiplyContacts.get(multi.id);
        if(set){
          set.delete(bomb.id);
        }
      }
    }
  });

  return engine;
}

function handleCollision(pair,engine){
  const a=pair.bodyA;
  const b=pair.bodyB;

  const ta=gameType(a);
  const tb=gameType(b);

  if(
    (ta==="bomb"&&tb==="multiply")||
    (tb==="bomb"&&ta==="multiply")
  ){
    let bomb=ta==="bomb"?a:b;
    let multi=ta==="multiply"?a:b;

    if(!multiplyContacts.has(multi.id)){
      multiplyContacts.set(multi.id,new Set());
    }

    const set=multiplyContacts.get(multi.id);

    if(!set.has(bomb.id)){
      set.add(bomb.id);

      const x=multi.position.x+(Math.random()-.5)*30;
      const y=multi.position.y+(multi.plugin.height||45)/2+42;

      createBomb(engine,x,y);
    }

    return;
  }

  if(
    (ta==="bomb"&&tb==="block")||
    (tb==="bomb"&&ta==="block")
  ){
    if(currentMode==="play"){
      const block=ta==="block"?a:b;
      damageBlock(block,30,engine);
    }
    return;
  }

  if(ta==="block"&&tb==="block"){
    if(currentMode==="editor"){
      return;
    }

    const speed=Math.max(
      Vector.magnitude(a.velocity),
      Vector.magnitude(b.velocity)
    );

    if(speed>8){
      damageBlock(a,20,engine);
      damageBlock(b,20,engine);
    }

    return;
  }

  if(
    (ta==="bomb"&&tb==="enemy")||
    (tb==="bomb"&&ta==="enemy")
  ){
    const bomb=ta==="bomb"?a:b;
    const enemy=ta==="enemy"?a:b;

    explodeAt(engine,bomb.position.x,bomb.position.y);

    if(engine.world.bodies.includes(enemy)){
      World.remove(engine.world,enemy);
    }

    return;
  }

  if(
    (ta==="enemy"&&tb==="floor")||
    (tb==="enemy"&&ta==="floor")
  ){
    const enemy=ta==="enemy"?a:b;

    if(Math.abs(enemy.velocity.y)>12){
      World.remove(engine.world,enemy);
    }

    return;
  }

  if(
    (ta==="enemy"&&tb==="bedrock")||
    (tb==="enemy"&&ta==="bedrock")
  ){
    const enemy=ta==="enemy"?a:b;

    if(Math.abs(enemy.velocity.y)>8){
      World.remove(engine.world,enemy);
    }
  }
}

function damageBlock(body,damage,engine){
  if(!body||gameType(body)!=="block")return;

  if(currentMode==="editor")return;

  body.plugin.hp=(body.plugin.hp||1)-damage;

  if(body.plugin.hp<=0){
    World.remove(engine.world,body);
  }
}

function explodeAt(engine,x,y){
  const bodies=engine.world.bodies.slice();

  for(const body of bodies){
    const type=gameType(body);

    if(type==="floor")continue;

    const dx=body.position.x-x;
    const dy=body.position.y-y;
    const dist=Math.sqrt(dx*dx+dy*dy);

    if(dist>160)continue;

    const power=(1-dist/160)*.045;

    if(!body.isStatic){
      let nx=dx;
      let ny=dy;

      const len=Math.sqrt(nx*nx+ny*ny)||1;

      nx/=len;
      ny/=len;

      Body.applyForce(
        body,
        body.position,
        {
          x:nx*power,
          y:ny*power
        }
      );
    }

    if(type==="block"&&currentMode==="play"){
      damageBlock(body,150,engine);
    }

    if(type==="enemy"&&dist<150){
      World.remove(engine.world,body);
    }
  }
}

function createBomb(engine,x,y){
  const bomb=Bodies.circle(
    x,
    y,
    14,
    {
      density:.002,
      friction:.2,
      restitution:.35,
      label:"bomb",
      plugin:{
        gameType:"bomb",
        bodyId:nextBodyId++
      }
    }
  );

  World.add(engine.world,bomb);

  return bomb;
}

function createBlock(engine,type,x,y,w=100,h=50,angle=0){
  let density=.0035;
  let friction=.4;
  let restitution=.08;
  let hp=2;

  if(type==="glass"){
    density=.0028;
    friction=.15;
    restitution=.25;
    hp=1;
  }

  if(type==="stone"){
    density=.008;
    friction=.6;
    restitution=.02;
    hp=3;
  }

  const body=Bodies.rectangle(
    x,
    y,
    w,
    h,
    {
      density,
      friction,
      restitution,
      angle,
      label:"block",
      plugin:{
        gameType:"block",
        material:type,
        width:w,
        height:h,
        hp,
        bodyId:nextBodyId++
      }
    }
  );

  World.add(engine.world,body);

  newlyPlacedBodies.set(body,performance.now()+300);

  Body.setVelocity(body,{x:0,y:0});
  Body.setAngularVelocity(body,0);
  Matter.Sleeping.set(body,true);

  return body;
}

function createEnemy(engine,x,y){
  const body=Bodies.circle(
    x,
    y,
    22,
    {
      density:.002,
      friction:.5,
      restitution:.1,
      label:"enemy",
      plugin:{
        gameType:"enemy",
        bodyId:nextBodyId++
      }
    }
  );

  World.add(engine.world,body);

  newlyPlacedBodies.set(body,performance.now()+300);

  Body.setVelocity(body,{x:0,y:0});
  Body.setAngularVelocity(body,0);
  Matter.Sleeping.set(body,true);

  return body;
}

function createMultiply(engine,x,y,w=70,h=45){
  const body=Bodies.rectangle(
    x,
    y,
    w,
    h,
    {
      isSensor:true,
      isStatic:true,
      label:"multiply",
      plugin:{
        gameType:"multiply",
        width:w,
        height:h,
        bodyId:nextBodyId++
      }
    }
  );

  World.add(engine.world,body);
  return body;
}

function createBedrock(engine,x,y,w=110,h=45){
  const body=Bodies.rectangle(
    x,
    y,
    w,
    h,
    {
      isStatic:true,
      label:"bedrock",
      plugin:{
        gameType:"bedrock",
        width:w,
        height:h,
        bodyId:nextBodyId++
      }
    }
  );

  World.add(engine.world,body);
  return body;
}

function addPlacedObject(tool,x,y){
  if(!editorEngine)return;

  let body=null;

  if(tool==="wood"){
    body=createBlock(editorEngine,"wood",x,y);
  }

  if(tool==="glass"){
    body=createBlock(editorEngine,"glass",x,y);
  }

  if(tool==="stone"){
    body=createBlock(editorEngine,"stone",x,y);
  }

  if(tool==="enemy"){
    body=createEnemy(editorEngine,x,y);
  }

  if(tool==="bomb"){
    body=createBomb(editorEngine,x,y);
  }

  if(tool==="multiply"){
    body=createMultiply(editorEngine,x,y);
  }

  if(tool==="bedrock"){
    body=createBedrock(editorEngine,x,y);
  }

  if(body){
    selectedBody=body;
  }
}

function startEditor(stage=null){
  stopPlay();
  stopEditor();

  currentMode="editor";

  editorEngine=createEngine();

  if(stage){
    currentStageId=stage.id;
    currentStageName=stage.name;
    loadStageIntoEngine(stage,editorEngine);
  }else{
    currentStageId="stage_"+Date.now();
    currentStageName="新しいステージ";
  }

  $("editorTitle").textContent=currentStageName;

  $("startScreen").style.display="none";
  $("stageScreen").style.display="none";
  $("editorUI").style.display="block";
  $("playUI").style.display="none";

  selectedBody=null;
  currentTool="move";
  updateToolButtons();

  runEngine(editorEngine);
}

function stopEditor(){
  if(editorEngine){
    Engine.clear(editorEngine);
    editorEngine=null;
  }

  selectedBody=null;
  movingBody=null;
  shapeDragging=null;
  rotateDragging=false;
}

function startPlay(stage){
  stopPlay();
  stopEditor();

  currentMode="play";

  playEngine=createEngine();

  currentStageId=stage.id;
  currentStageName=stage.name;

  loadStageIntoEngine(stage,playEngine);

  $("playTitle").textContent=currentStageName;

  $("startScreen").style.display="none";
  $("stageScreen").style.display="none";
  $("editorUI").style.display="none";
  $("playUI").style.display="block";

  runEngine(playEngine);
}

function stopPlay(){
  if(playEngine){
    Engine.clear(playEngine);
    playEngine=null;
  }
}

let lastTime=performance.now();

function runEngine(engine){
  if(!engine)return;

  function loop(time){
    if(
      engine===editorEngine||
      engine===playEngine
    ){
      const delta=Math.min(33,time-lastTime);
      lastTime=time;

      Engine.update(engine,delta);
      draw(engine);

      requestAnimationFrame(loop);
    }
  }

  lastTime=performance.now();
  requestAnimationFrame(loop);
}

function draw(engine){
  ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);

  ctx.save();

  ctx.translate(
    canvas.clientWidth/2,
    canvas.clientHeight/2
  );

  ctx.scale(camera.zoom,camera.zoom);

  ctx.translate(-camera.x,-camera.y);

  const bodies=engine.world.bodies;

  for(const body of bodies){
    drawBody(body);
  }

  drawSelection();

  ctx.restore();
}

function drawBody(body){
  const type=gameType(body);

  if(type==="floor"){
    ctx.save();

    ctx.fillStyle="#222";
    ctx.fillRect(
      -50000,
      FLOOR_Y,
      100000,
      100
    );

    ctx.fillStyle="#555";
    ctx.fillRect(
      -50000,
      FLOOR_Y,
      100000,
      8
    );

    ctx.restore();
    return;
  }

  ctx.save();

  ctx.translate(body.position.x,body.position.y);
  ctx.rotate(body.angle);

  if(type==="block"){
    const w=body.plugin.width;
    const h=body.plugin.height;

    if(body.plugin.material==="wood"){
      ctx.fillStyle="#b8793d";
      ctx.strokeStyle="#75451f";
    }

    if(body.plugin.material==="glass"){
      ctx.fillStyle="#8ed8e8aa";
      ctx.strokeStyle="#368ea0";
    }

    if(body.plugin.material==="stone"){
      ctx.fillStyle="#888";
      ctx.strokeStyle="#555";
    }

    ctx.lineWidth=3;

    ctx.fillRect(-w/2,-h/2,w,h);
    ctx.strokeRect(-w/2,-h/2,w,h);

    if(body.plugin.material==="wood"){
      ctx.strokeStyle="#dca56a";
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(-w*.35,-h*.25);
      ctx.lineTo(w*.3,h*.2);
      ctx.stroke();
    }
  }

  if(type==="bedrock"){
    const w=body.plugin.width;
    const h=body.plugin.height;

    ctx.fillStyle="#333";
    ctx.strokeStyle="#111";
    ctx.lineWidth=3;

    ctx.fillRect(-w/2,-h/2,w,h);
    ctx.strokeRect(-w/2,-h/2,w,h);

    ctx.strokeStyle="#777";
    ctx.beginPath();

    for(let i=-w;i<w;i+=25){
      ctx.moveTo(i,-h/2);
      ctx.lineTo(i+20,h/2);
    }

    ctx.stroke();
  }

  if(type==="enemy"){
    ctx.fillStyle="#55b84a";
    ctx.strokeStyle="#247d21";
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.arc(0,0,22,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle="#fff";
    ctx.beginPath();
    ctx.arc(-7,-5,5,0,Math.PI*2);
    ctx.arc(7,-5,5,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#111";
    ctx.beginPath();
    ctx.arc(-7,-5,2,0,Math.PI*2);
    ctx.arc(7,-5,2,0,Math.PI*2);
    ctx.fill();
  }

  if(type==="bomb"){
    ctx.fillStyle="#111";
    ctx.beginPath();
    ctx.arc(0,0,14,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#f80";
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.moveTo(8,-9);
    ctx.quadraticCurveTo(18,-20,12,-25);
    ctx.stroke();
  }

  if(type==="multiply"){
    const w=body.plugin.width;
    const h=body.plugin.height;

    ctx.globalAlpha=.65;
    ctx.fillStyle="#a65cff";
    ctx.strokeStyle="#6c27b5";
    ctx.lineWidth=3;

    ctx.fillRect(-w/2,-h/2,w,h);
    ctx.strokeRect(-w/2,-h/2,w,h);

    ctx.globalAlpha=1;
    ctx.fillStyle="#fff";
    ctx.font="bold 25px sans-serif";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("×2",0,0);
  }

  ctx.restore();
}

function getShapeHandles(body){
  const w=body.plugin.width;
  const h=body.plugin.height;

  const c=Math.cos(body.angle);
  const s=Math.sin(body.angle);

  const points=[
    {x:-w/2,y:-h/2},
    {x:w/2,y:-h/2},
    {x:w/2,y:h/2},
    {x:-w/2,y:h/2}
  ];

  return points.map(p=>({
    x:body.position.x+p.x*c-p.y*s,
    y:body.position.y+p.x*s+p.y*c
  }));
}

function drawSelection(){
  if(!selectedBody)return;

  const body=selectedBody;

  if(
    !body.plugin||
    gameType(body)==="floor"
  )return;

  ctx.save();

  if(currentTool==="rotate"&&isBlock(body)){
    const distance=Math.max(
      body.plugin.width,
      body.plugin.height
    )/2+40;

    const hx=
      body.position.x+
      Math.sin(body.angle)*distance;

    const hy=
      body.position.y-
      Math.cos(body.angle)*distance;

    ctx.strokeStyle="#f80";
    ctx.lineWidth=4;

    ctx.beginPath();
    ctx.moveTo(body.position.x,body.position.y);
    ctx.lineTo(hx,hy);
    ctx.stroke();

    ctx.fillStyle="#f80";
    ctx.beginPath();
    ctx.arc(hx,hy,9,0,Math.PI*2);
    ctx.fill();
  }

  if(currentTool==="shape"&&isBlock(body)){
    const handles=getShapeHandles(body);

    ctx.fillStyle="#fff";
    ctx.strokeStyle="#f80";
    ctx.lineWidth=3;

    for(const p of handles){
      ctx.beginPath();
      ctx.arc(p.x,p.y,8,0,Math.PI*2);
      ctx.fill();
      ctx.stroke();
    }
  }

  ctx.restore();
}

function hitTest(worldX,worldY,engine){
  const bodies=engine.world.bodies;

  for(let i=bodies.length-1;i>=0;i--){
    const body=bodies[i];

    if(gameType(body)==="floor")continue;

    const dx=worldX-body.position.x;
    const dy=worldY-body.position.y;

    const localX=
      dx*Math.cos(-body.angle)-
      dy*Math.sin(-body.angle);

    const localY=
      dx*Math.sin(-body.angle)+
      dy*Math.cos(-body.angle);

    if(gameType(body)==="enemy"){
      if(localX*localX+localY*localY<22*22){
        return body;
      }
    }

    if(gameType(body)==="bomb"){
      if(localX*localX+localY*localY<14*14){
        return body;
      }
    }

    if(
      gameType(body)==="block"||
      gameType(body)==="bedrock"||
      gameType(body)==="multiply"
    ){
      const w=body.plugin.width;
      const h=body.plugin.height;

      if(
        Math.abs(localX)<=w/2&&
        Math.abs(localY)<=h/2
      ){
        return body;
      }
    }
  }

  return null;
}

function nearestShapeHandle(body,x,y){
  const handles=getShapeHandles(body);

  let best=-1;
  let bestDist=Infinity;

  handles.forEach((p,i)=>{
    const dx=p.x-x;
    const dy=p.y-y;
    const d=Math.sqrt(dx*dx+dy*dy);

    if(d<bestDist){
      bestDist=d;
      best=i;
    }
  });

  return bestDist<25/camera.zoom?best:-1;
}

function isRotateHandle(body,x,y){
  if(!body||!isBlock(body))return false;

  const distance=Math.max(
    body.plugin.width,
    body.plugin.height
  )/2+40;

  const hx=
    body.position.x+
    Math.sin(body.angle)*distance;

  const hy=
    body.position.y-
    Math.cos(body.angle)*distance;

  const dx=x-hx;
  const dy=y-hy;

  return Math.sqrt(dx*dx+dy*dy)<20/camera.zoom;
}

canvas.addEventListener("pointerdown",e=>{
  const rect=canvas.getBoundingClientRect();

  const sx=e.clientX-rect.left;
  const sy=e.clientY-rect.top;

  const p=screenToWorld(sx,sy);

  const engine=
    currentMode==="editor"
    ?editorEngine
    :playEngine;

  if(!engine)return;

  canvas.setPointerCapture(e.pointerId);

  if(currentMode==="play"){
    if($("bombBtn").dataset.active==="1"){
      createBomb(playEngine,p.x,p.y);
      return;
    }

    return;
  }

  if(currentTool==="rotate"&&selectedBody){
    if(isRotateHandle(selectedBody,p.x,p.y)){
      rotateDragging=true;
      return;
    }
  }

  if(currentTool==="shape"&&selectedBody){
    const index=nearestShapeHandle(
      selectedBody,
      p.x,
      p.y
    );

    if(index>=0){
      shapeDragging=index;
      return;
    }
  }

  const body=hitTest(p.x,p.y,engine);

  if(currentTool==="erase"){
    if(body){
      World.remove(engine.world,body);

      if(selectedBody===body){
        selectedBody=null;
      }
    }

    return;
  }

  if(
    currentTool==="wood"||
    currentTool==="glass"||
    currentTool==="stone"||
    currentTool==="enemy"||
    currentTool==="bomb"||
    currentTool==="multiply"||
    currentTool==="bedrock"
  ){
    if(!body){
      addPlacedObject(currentTool,p.x,p.y);
    }else{
      selectedBody=body;
    }

    return;
  }

  if(currentTool==="move"){
    if(body){
      selectedBody=body;

      movingBody=body;

      moveOffset={
        x:body.position.x-p.x,
        y:body.position.y-p.y
      };

      Body.setVelocity(body,{x:0,y:0});
      Body.setAngularVelocity(body,0);
    }else{
      selectedBody=null;
    }
  }
});

canvas.addEventListener("pointermove",e=>{
  const rect=canvas.getBoundingClientRect();

  const sx=e.clientX-rect.left;
  const sy=e.clientY-rect.top;

  const p=screenToWorld(sx,sy);

  if(currentMode!=="editor")return;

  if(rotateDragging&&selectedBody){
    const dx=p.x-selectedBody.position.x;
    const dy=p.y-selectedBody.position.y;

    const angle=Math.atan2(dx,-dy);

    Body.setAngle(selectedBody,angle);
    Body.setAngularVelocity(selectedBody,0);

    return;
  }

  if(shapeDragging!==null&&selectedBody){
    resizeFromCorner(
      selectedBody,
      shapeDragging,
      p.x,
      p.y
    );

    return;
  }

  if(movingBody){
    Body.setPosition(
      movingBody,
      {
        x:p.x+moveOffset.x,
        y:p.y+moveOffset.y
      }
    );

    Body.setVelocity(movingBody,{x:0,y:0});
    Body.setAngularVelocity(movingBody,0);
  }
});

canvas.addEventListener("pointerup",e=>{
  rotateDragging=false;
  shapeDragging=null;
  movingBody=null;

  try{
    canvas.releasePointerCapture(e.pointerId);
  }catch(_){}
});

canvas.addEventListener("pointercancel",()=>{
  rotateDragging=false;
  shapeDragging=null;
  movingBody=null;
});

function resizeFromCorner(body,index,x,y){
  if(!isBlock(body))return;

  const angle=body.angle;
  const c=Math.cos(angle);
  const s=Math.sin(angle);

  const dx=x-body.position.x;
  const dy=y-body.position.y;

  const localX=dx*c+dy*s;
  const localY=-dx*s+dy*c;

  let w=Math.abs(localX)*2;
  let h=Math.abs(localY)*2;

  w=Math.max(30,w);
  h=Math.max(20,h);

  const oldW=body.plugin.width;
  const oldH=body.plugin.height;

  const scaleX=w/oldW;
  const scaleY=h/oldH;

  Body.scale(body,scaleX,scaleY);

  body.plugin.width=w;
  body.plugin.height=h;

  Body.setVelocity(body,{x:0,y:0});
  Body.setAngularVelocity(body,0);
}

function updateToolButtons(){
  document.querySelectorAll(".tool").forEach(btn=>{
    btn.classList.toggle(
      "active",
      btn.dataset.tool===currentTool
    );
  });
}

document.querySelectorAll(".tool").forEach(btn=>{
  btn.addEventListener("click",()=>{
    currentTool=btn.dataset.tool;

    updateToolButtons();

    if(
      currentTool!=="rotate"&&
      currentTool!=="shape"
    ){
      $("property").style.display="none";
    }
  });
});

$("bombBtn").addEventListener("click",()=>{
  const active=$("bombBtn").dataset.active==="1";

  $("bombBtn").dataset.active=active?"0":"1";

  $("bombBtn").style.background=
    active?"#222":"#f80";
});

$("allBombBtn").addEventListener("click",()=>{
  if(!playEngine)return;

  const bombs=playEngine.world.bodies.filter(
    b=>gameType(b)==="bomb"
  );

  bombs.forEach(b=>{
    explodeAt(
      playEngine,
      b.position.x,
      b.position.y
    );
  });
});

$("restartBtn").addEventListener("click",()=>{
  const stage=getSavedStages().find(
    s=>s.id===currentStageId
  );

  if(stage){
    startPlay(stage);
  }
});

$("editorBack").addEventListener("click",()=>{
  stopEditor();
  currentMode="none";

  $("editorUI").style.display="none";
  $("startScreen").style.display="flex";
});

$("playBack").addEventListener("click",()=>{
  stopPlay();
  currentMode="none";

  $("playUI").style.display="none";
  $("startScreen").style.display="flex";
});

$("stageBack").addEventListener("click",()=>{
  $("stageScreen").style.display="none";
  $("startScreen").style.display="flex";
});

$("createBtn").addEventListener("click",()=>{
  startEditor();
});

$("selectBtn").addEventListener("click",()=>{
  showStageScreen();
});

$("clearBtn").addEventListener("click",()=>{
  if(!editorEngine)return;

  const keep=editorEngine.world.bodies.filter(
    b=>gameType(b)==="floor"
  );

  editorEngine.world.bodies
    .slice()
    .forEach(body=>{
      if(!keep.includes(body)){
        World.remove(editorEngine.world,body);
      }
    });

  selectedBody=null;
});

$("saveBtn").addEventListener("click",()=>{
  saveCurrentStage();
});

$("testBtn").addEventListener("click",()=>{
  saveCurrentStage();

  const stage=getSavedStages().find(
    s=>s.id===currentStageId
  );

  if(stage){
    startPlay(stage);
  }
});

$("applyProp").addEventListener("click",()=>{
  if(!selectedBody||!isBlock(selectedBody))return;

  const w=Math.max(
    30,
    Number($("propW").value)||selectedBody.plugin.width
  );

  const h=Math.max(
    20,
    Number($("propH").value)||selectedBody.plugin.height
  );

  const angle=
    (Number($("propAngle").value)||0)*
    Math.PI/180;

  const sx=w/selectedBody.plugin.width;
  const sy=h/selectedBody.plugin.height;

  Body.scale(selectedBody,sx,sy);

  selectedBody.plugin.width=w;
  selectedBody.plugin.height=h;

  Body.setAngle(selectedBody,angle);
  Body.setVelocity(selectedBody,{x:0,y:0});
  Body.setAngularVelocity(selectedBody,0);
});

function saveCurrentStage(){
  if(!editorEngine)return;

  const data={
    id:currentStageId,
    name:currentStageName,
    objects:[]
  };

  for(const body of editorEngine.world.bodies){
    const type=gameType(body);

    if(type==="block"){
      data.objects.push({
        type:"block",
        material:body.plugin.material,
        x:body.position.x,
        y:body.position.y,
        w:body.plugin.width,
        h:body.plugin.height,
        angle:body.angle
      });
    }

    if(type==="enemy"){
      data.objects.push({
        type:"enemy",
        x:body.position.x,
        y:body.position.y
      });
    }

    if(type==="bomb"){
      data.objects.push({
        type:"bomb",
        x:body.position.x,
        y:body.position.y
      });
    }

    if(type==="multiply"){
      data.objects.push({
        type:"multiply",
        x:body.position.x,
        y:body.position.y,
        w:body.plugin.width,
        h:body.plugin.height
      });
    }

    if(type==="bedrock"){
      data.objects.push({
        type:"bedrock",
        x:body.position.x,
        y:body.position.y,
        w:body.plugin.width,
        h:body.plugin.height,
        angle:0
      });
    }
  }

  const stages=getSavedStages();

  const index=stages.findIndex(
    s=>s.id===data.id
  );

  if(index>=0){
    stages[index]=data;
  }else{
    stages.push(data);
  }

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(stages)
  );
}

function loadStageIntoEngine(stage,engine){
  newlyPlacedBodies.clear();
  multiplyContacts.clear();

  for(const obj of stage.objects||[]){
    if(obj.type==="block"){
      createBlock(
        engine,
        obj.material,
        obj.x,
        obj.y,
        obj.w,
        obj.h,
        obj.angle||0
      );
    }

    if(obj.type==="enemy"){
      createEnemy(
        engine,
        obj.x,
        obj.y
      );
    }

    if(obj.type==="bomb"){
      createBomb(
        engine,
        obj.x,
        obj.y
      );
    }

    if(obj.type==="multiply"){
      createMultiply(
        engine,
        obj.x,
        obj.y,
        obj.w,
        obj.h
      );
    }

    if(obj.type==="bedrock"){
      createBedrock(
        engine,
        obj.x,
        obj.y,
        obj.w,
        obj.h
      );
    }
  }
}

function getSavedStages(){
  try{
    return JSON.parse(
      localStorage.getItem(SAVE_KEY)||"[]"
    );
  }catch(_){
    return [];
  }
}

function showStageScreen(){
  $("startScreen").style.display="none";
  $("stageScreen").style.display="block";

  const list=$("stageList");
  list.innerHTML="";

  const stages=getSavedStages();

  if(stages.length===0){
    list.innerHTML=
      "<div class='stageItem'>保存されたステージはありません。</div>";
    return;
  }

  stages.forEach(stage=>{
    const item=document.createElement("div");
    item.className="stageItem";

    const name=document.createElement("div");
    name.className="stageName";
    name.textContent=stage.name;

    const buttons=document.createElement("div");
    buttons.className="stageBtns";

    const play=document.createElement("button");
    play.textContent="遊ぶ";
    play.addEventListener("click",()=>{
      startPlay(stage);
    });

    const edit=document.createElement("button");
    edit.textContent="編集";
    edit.addEventListener("click",()=>{
      startEditor(stage);
    });

    const del=document.createElement("button");
    del.textContent="削除";
    del.addEventListener("click",()=>{
      deleteStage(stage.id);
      showStageScreen();
    });

    buttons.appendChild(play);
    buttons.appendChild(edit);
    buttons.appendChild(del);

    item.appendChild(name);
    item.appendChild(buttons);

    list.appendChild(item);
  });
}

function deleteStage(id){
  const stages=getSavedStages().filter(
    s=>s.id!==id
  );

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(stages)
  );
}

setInterval(()=>{
  if(
    selectedBody&&
    currentMode==="editor"&&
    isBlock(selectedBody)
  ){
    $("propW").value=
      Math.round(selectedBody.plugin.width);

    $("propH").value=
      Math.round(selectedBody.plugin.height);

    $("propAngle").value=
      Math.round(
        selectedBody.angle*180/Math.PI
      );
  }
},100);
