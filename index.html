<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>スライム城くずしメーカー</title>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",Arial,sans-serif;
    background:#f4f4f4;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
}

.screen{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:none;
    overflow:hidden;
}

.screen.active{
    display:flex;
}

/* =========================
   スタート
========================= */

#startScreen{
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
        linear-gradient(#fff 0%,#f8fbff 55%,#e5f1ff 100%);
    z-index:100;
}

.logo{
    text-align:center;
    font-size:clamp(30px,7vw,48px);
    line-height:1.2;
    font-weight:900;
    color:#222;
    margin-bottom:38px;
    text-shadow:0 3px 0 #fff;
}

.startButtons{
    width:min(430px,88vw);
    display:flex;
    flex-direction:column;
    gap:18px;
}

.startButton{
    width:100%;
    min-height:70px;
    border-radius:18px;
    color:#fff;
    font-size:24px;
    font-weight:900;
    box-shadow:0 6px 0 rgba(0,0,0,.2);
}

.startButton:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 rgba(0,0,0,.2);
}

.makeButton{
    background:#ff8800;
}

.playButton{
    background:#168cff;
}

/* =========================
   ステージ選択
========================= */

#selectScreen{
    flex-direction:column;
    background:#eef2f6;
    z-index:90;
}

.header{
    height:62px;
    min-height:62px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px;
    background:#222;
    color:#fff;
    position:relative;
    z-index:100;
}

.header h1{
    margin:0;
    font-size:21px;
    flex:1;
}

.headerButton{
    background:#fff;
    color:#222;
    border-radius:10px;
    padding:9px 14px;
    font-weight:bold;
}

.stageList{
    flex:1;
    overflow:auto;
    padding:16px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;
}

.stageCard{
    background:#fff;
    border-radius:16px;
    padding:15px;
    min-height:145px;
    box-shadow:0 3px 12px rgba(0,0,0,.14);
    display:flex;
    flex-direction:column;
    gap:8px;
}

.stageName{
    font-size:20px;
    font-weight:900;
    flex:1;
}

.stageCard button{
    width:100%;
    padding:10px;
    border-radius:9px;
    background:#168cff;
    color:#fff;
    font-weight:bold;
}

.stageCard .delete{
    background:#e33;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:50px 15px;
    color:#777;
}

/* =========================
   ゲーム画面
========================= */

#editorScreen,
#playScreen{
    background:#cfe9ff;
}

.gameCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    z-index:1;
    touch-action:none;
}

/* =========================
   UI
========================= */

.gameUI{
    position:absolute;
    inset:0;
    z-index:50;
    pointer-events:none;
}

.gameUI button,
.gameUI input,
.gameUI .toolbar{
    pointer-events:auto;
}

.topbar{
    width:100%;
    min-height:58px;
    padding:6px;
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(20,20,20,.94);
    overflow-x:auto;
    overflow-y:hidden;
    white-space:nowrap;
    position:relative;
    z-index:100;
}

.topbar button{
    flex-shrink:0;
    background:#fff;
    color:#222;
    padding:9px 13px;
    border-radius:9px;
    font-weight:800;
}

.topbar .orange{
    background:#ff8800;
    color:#fff;
}

.topbar .red{
    background:#e33;
    color:#fff;
}

.topbar input{
    flex-shrink:0;
    width:180px;
    padding:9px;
    border:0;
    border-radius:9px;
    outline:none;
}

/* =========================
   ツールバー
========================= */

.toolbar{
    width:100%;
    padding:6px;
    display:flex;
    gap:6px;
    background:rgba(35,35,35,.94);
    overflow-x:auto;
    overflow-y:hidden;
    position:relative;
    z-index:100;
}

.tool{
    flex:0 0 65px;
    height:52px;
    border-radius:10px;
    background:#fff;
    color:#222;
    font-size:11px;
    font-weight:900;
    padding:3px;
}

.tool:active{
    transform:scale(.96);
}

.tool.selected{
    outline:4px solid #ff8800;
    outline-offset:-2px;
}

.toolIcon{
    display:block;
    height:27px;
    line-height:27px;
    font-size:22px;
}

/* =========================
   プロパティ
========================= */

#propertyPanel{
    position:absolute;
    right:10px;
    top:120px;
    width:235px;
    background:#fff;
    border-radius:15px;
    padding:14px;
    box-shadow:0 5px 25px rgba(0,0,0,.3);
    display:none;
    z-index:200;
    pointer-events:auto;
}

#propertyPanel.show{
    display:block;
}

#propertyPanel h3{
    margin:0 0 12px;
    font-size:18px;
}

.propertyRow{
    display:flex;
    align-items:center;
    gap:7px;
    margin:8px 0;
}

.propertyRow label{
    width:55px;
    font-weight:bold;
    font-size:13px;
}

.propertyRow input{
    flex:1;
    min-width:0;
    padding:7px;
    border:1px solid #bbb;
    border-radius:7px;
}

.propertyButtons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-top:10px;
}

.propertyButtons button{
    padding:9px 4px;
    border-radius:8px;
    background:#168cff;
    color:#fff;
    font-weight:bold;
}

/* =========================
   下部メッセージ
========================= */

.message{
    position:absolute;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    z-index:300;
    background:rgba(0,0,0,.82);
    color:#fff;
    padding:9px 16px;
    border-radius:12px;
    font-size:14px;
    pointer-events:none;
    opacity:0;
    transition:opacity .15s;
    white-space:nowrap;
}

.message.show{
    opacity:1;
}

.help{
    position:absolute;
    left:10px;
    bottom:10px;
    z-index:40;
    background:rgba(0,0,0,.7);
    color:#fff;
    padding:7px 11px;
    border-radius:8px;
    font-size:12px;
    pointer-events:none;
}

#playStageName{
    color:#fff;
    font-weight:900;
    padding:0 5px;
    flex-shrink:0;
}
</style>
</head>

<body>

<!-- =========================
     スタート
========================= -->

<section id="startScreen" class="screen active">
    <div class="logo">
        スライム城くずし<br>
        ステージメーカー
    </div>

    <div class="startButtons">
        <button class="startButton makeButton" id="makeBtn">
            ステージを作る
        </button>

        <button class="startButton playButton" id="playBtn">
            ステージで遊ぶ
        </button>
    </div>
</section>

<!-- =========================
     ステージ選択
========================= -->

<section id="selectScreen" class="screen">

    <div class="header">
        <button class="headerButton" id="selectBack">
            戻る
        </button>

        <h1>ステージを選択</h1>
    </div>

    <div id="stageList" class="stageList"></div>
</section>

<!-- =========================
     エディター
========================= -->

<section id="editorScreen" class="screen">

    <canvas id="editorCanvas" class="gameCanvas"></canvas>

    <div class="gameUI">

        <div class="topbar">

            <button id="editorBack">
                ← 戻る
            </button>

            <input id="stageName" placeholder="ステージ名">

            <button class="orange" id="saveStage">
                保存
            </button>

            <button id="testStage">
                ▶ 遊ぶ
            </button>

            <button class="red" id="clearStage">
                全消去
            </button>

        </div>

        <div class="toolbar">

            <button class="tool selected" data-tool="wood">
                <span class="toolIcon">🪵</span>
                木
            </button>

            <button class="tool" data-tool="glass">
                <span class="toolIcon">▱</span>
                ガラス
            </button>

            <button class="tool" data-tool="stone">
                <span class="toolIcon">⬛</span>
                石
            </button>

            <button class="tool" data-tool="enemy">
                <span class="toolIcon">🟢</span>
                敵
            </button>

            <button class="tool" data-tool="bomb">
                <span class="toolIcon">💣</span>
                爆弾
            </button>

            <button class="tool" data-tool="multiply">
                <span class="toolIcon">×2</span>
                増殖
            </button>

            <button class="tool" data-tool="bedrock">
                <span class="toolIcon">▰</span>
                岩盤
            </button>

            <button class="tool" data-tool="erase">
                <span class="toolIcon">⌫</span>
                消す
            </button>

            <button class="tool" data-tool="move">
                <span class="toolIcon">✋</span>
                移動
            </button>

            <button class="tool" data-tool="rotate">
                <span class="toolIcon">↻</span>
                回転
            </button>

            <button class="tool" data-tool="resize">
                <span class="toolIcon">↔</span>
                形変更
            </button>

        </div>

        <div id="propertyPanel">

            <h3>ブロック設定</h3>

            <div class="propertyRow">
                <label>横幅</label>
                <input id="propW" type="number" min="10" max="1000">
            </div>

            <div class="propertyRow">
                <label>高さ</label>
                <input id="propH" type="number" min="10" max="1000">
            </div>

            <div class="propertyRow">
                <label>角度</label>
                <input id="propAngle" type="number" step="1">
            </div>

            <div class="propertyButtons">

                <button id="rotateL">
                    ↶ 90°
                </button>

                <button id="rotateR">
                    ↷ 90°
                </button>

                <button id="thin">
                    細く
                </button>

                <button id="thick">
                    太く
                </button>

                <button id="applyProp">
                    適用
                </button>

                <button id="closeProp">
                    閉じる
                </button>

            </div>

        </div>

    </div>

    <div id="editorMessage" class="message"></div>

    <div class="help">
        タップ：配置・選択　ドラッグ：移動　回転・形変更：選択中を編集
    </div>

</section>

<!-- =========================
     プレイ
========================= -->

<section id="playScreen" class="screen">

    <canvas id="playCanvas" class="gameCanvas"></canvas>

    <div class="gameUI">

        <div class="topbar">

            <button id="playBack">
                ← 戻る
            </button>

            <span id="playStageName"></span>

            <button id="bombBtn">
                💣 爆弾を置く
            </button>

            <button class="red" id="allBomb">
                💥 全爆破
            </button>

            <button id="restartBtn">
                ↻ リセット
            </button>

        </div>

    </div>

    <div class="help">
        爆弾を置く → 画面をタップ
    </div>

</section>

<div id="playMessage" class="message"></div>

<script>
"use strict";

const MatterEngine = Matter.Engine;
const Runner = Matter.Runner;
const World = Matter.World;
const Bodies = Matter.Bodies;
const Body = Matter.Body;
const Composite = Matter.Composite;
const Events = Matter.Events;
const Bounds = Matter.Bounds;
const Vertices = Matter.Vertices;

const STORAGE_KEY = "slimeCastleMaker_v4";

const FLOOR_Y = 1000;

const EXPLOSION_RADIUS = 110;
const EXPLOSION_FORCE_RADIUS = 150;
const EXPLOSION_FORCE = 0.045;
const EXPLOSION_BLOCK_DAMAGE = 150;

const ENEMY_FALL_SPEED = 10;
const ENEMY_CRUSH_SPEED = 3;

const MATERIALS = {

    wood:{
        density:.0035,
        friction:.4,
        restitution:.08,
        hp:2,
        threshold:16
    },

    glass:{
        density:.0028,
        friction:.15,
        restitution:.25,
        hp:1,
        threshold:10
    },

    stone:{
        density:.008,
        friction:.6,
        restitution:.02,
        hp:3,
        threshold:48
    }

};

let currentTool = "wood";

let currentStageId = null;

let editorEngine = null;
let playEngine = null;

let editorRunner = null;
let playRunner = null;

let editorCamera = {
    x:0,
    y:400,
    zoom:.7
};

let playCamera = {
    x:0,
    y:450,
    zoom:.75
};

let selectedBody = null;
let dragData = null;
let pointerDown = false;

let stageObjects = [];

let multiplyContacts = new Map();

let explosionEffects = [];

const editorCanvas = document.getElementById("editorCanvas");
const playCanvas = document.getElementById("playCanvas");

function $(id){
    return document.getElementById(id);
}

/* =========================
   メッセージ
========================= */

let messageTimer = null;

function showMessage(text,play=false){

    const el = play ? $("playMessage") : $("editorMessage");

    el.textContent = text;
    el.classList.add("show");

    clearTimeout(messageTimer);

    messageTimer = setTimeout(()=>{
        el.classList.remove("show");
    },1800);
}

/* =========================
   画面
========================= */

function showScreen(id){

    document.querySelectorAll(".screen").forEach(screen=>{
        screen.classList.remove("active");
    });

    $(id).classList.add("active");
}

/* =========================
   localStorage
========================= */

function getStages(){

    try{
        return JSON.parse(
            localStorage.getItem(STORAGE_KEY) || "[]"
        );
    }catch(e){
        return [];
    }

}

function setStages(stages){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(stages)
    );

}

function uid(){

    return Math.random().toString(36).slice(2)
        + Date.now().toString(36);

}

/* =========================
   Canvas
========================= */

function resizeCanvas(canvas){

    const rect = canvas.getBoundingClientRect();

    canvas.width = Math.max(
        1,
        Math.round(rect.width)
    );

    canvas.height = Math.max(
        1,
        Math.round(rect.height)
    );

}

function resizeAll(){

    resizeCanvas(editorCanvas);
    resizeCanvas(playCanvas);

}

window.addEventListener(
    "resize",
    resizeAll
);

function pointerPosition(event,canvas){

    const rect = canvas.getBoundingClientRect();

    return {
        x:event.clientX - rect.left,
        y:event.clientY - rect.top
    };

}

function screenToWorld(canvas,x,y,camera){

    return {

        x:
            (x - canvas.clientWidth / 2)
            / camera.zoom
            + camera.x,

        y:
            (y - canvas.clientHeight / 2)
            / camera.zoom
            + camera.y

    };

}

function worldToScreen(canvas,x,y,camera){

    return {

        x:
            (x-camera.x)
            *camera.zoom
            +canvas.clientWidth/2,

        y:
            (y-camera.y)
            *camera.zoom
            +canvas.clientHeight/2

    };

}

/* =========================
   オブジェクト
========================= */

function createFloor(){

    return Bodies.rectangle(
        0,
        FLOOR_Y + 50,
        100000,
        100,
        {
            isStatic:true,
            label:"floor",
            plugin:{
                gameType:"floor"
            }
        }
    );

}

function createBlock(
    material,
    x,
    y,
    w=150,
    h=35,
    angle=0
){

    const m = MATERIALS[material];

    return Bodies.rectangle(
        x,
        y,
        w,
        h,
        {

            angle:angle*Math.PI/180,

            density:m.density,
            friction:m.friction,
            restitution:m.restitution,

            label:"block",

            plugin:{
                gameType:"block",
                material:material,
                width:w,
                height:h,
                hp:m.hp,
                maxHp:m.hp,
                threshold:m.threshold,
                id:uid()
            }

        }
    );

}

function createEnemy(x,y){

    return Bodies.circle(
        x,
        y,
        22,
        {

            density:.0018,
            friction:.35,
            restitution:.05,

            label:"enemy",

            plugin:{
                gameType:"enemy",
                id:uid(),
                alive:true,
                preVY:0
            }

        }
    );

}

function createBomb(x,y){

    return Bodies.circle(
        x,
        y,
        16,
        {

            density:.002,
            friction:.4,
            restitution:.15,

            /*
             * 爆弾は必ず動く
             */
            isStatic:false,

            label:"bomb",

            plugin:{
                gameType:"bomb",
                id:uid()
            }

        }
    );

}

function createMultiply(
    x,
    y,
    w=70,
    h=45
){

    return Bodies.rectangle(
        x,
        y,
        w,
        h,
        {

            isStatic:true,

            /*
             * ★重要
             * 増殖ブロック自体を透過させる
             * ので爆弾がそこで止まらない。
             */
            isSensor:true,

            label:"multiply",

            plugin:{
                gameType:"multiply",
                width:w,
                height:h,
                id:uid()
            }

        }
    );

}

function createBedrock(
    x,
    y,
    w=300,
    h=50
){

    return Bodies.rectangle(
        x,
        y,
        w,
        h,
        {

            isStatic:true,
            angle:0,

            label:"bedrock",

            plugin:{
                gameType:"bedrock",
                width:w,
                height:h,
                id:uid()
            }

        }
    );

}

/* =========================
   Engine
========================= */

function setupEngineEvents(engine){

    Events.on(
        engine,
        "beforeUpdate",
        ()=>{
            Composite.allBodies(engine.world)
                .forEach(body=>{

                    if(
                        body.label==="enemy" &&
                        body.plugin.alive
                    ){

                        body.plugin.preVY =
                            body.velocity.y;

                    }

                });
        }
    );

    Events.on(
        engine,
        "collisionStart",
        event=>{

            event.pairs.forEach(
                pair=>handleCollision(pair)
            );

        }
    );

    Events.on(
        engine,
        "collisionActive",
        event=>{

            event.pairs.forEach(
                pair=>handleActiveCollision(pair)
            );

        }
    );

    Events.on(
        engine,
        "collisionEnd",
        event=>{

            event.pairs.forEach(
                pair=>handleCollisionEnd(pair)
            );

        }
    );

}

/* =========================
   衝突
========================= */

function typeOf(body){

    return body?.plugin?.gameType || body?.label;

}

function handleCollision(pair){

    const a = pair.bodyA;
    const b = pair.bodyB;

    const ta = typeOf(a);
    const tb = typeOf(b);

    /*
     * 増殖
     */
    if(
        (ta==="bomb" && tb==="multiply") ||
        (ta==="multiply" && tb==="bomb")
    ){

        const bomb =
            ta==="bomb" ? a : b;

        const multiply =
            ta==="multiply" ? a : b;

        handleMultiply(
            multiply,
            bomb
        );

        return;

    }

    /*
     * スライム
     */
    const enemy =
        ta==="enemy"
            ? a
            : tb==="enemy"
                ? b
                : null;

    if(enemy && enemy.plugin.alive){

        const other =
            enemy===a ? b : a;

        const ot = typeOf(other);

        /*
         * 床・岩盤への落下
         */
        if(
            ot==="floor" ||
            ot==="bedrock"
        ){

            if(
                enemy.plugin.preVY
                >= ENEMY_FALL_SPEED
            ){

                killEnemy(enemy);

                return;

            }

        }

        /*
         * ブロックによる圧し潰し
         */
        if(
            ot==="block" ||
            ot==="bedrock"
        ){

            checkCrush(
                enemy,
                other,
                pair
            );

        }

    }

    /*
     * ブロック同士
     */
    if(
        ta==="block" &&
        tb==="block"
    ){

        blockHitBlock(a,b);

    }

    /*
     * 爆弾→ブロック
     */
    if(ta==="bomb" || tb==="bomb"){

        const bomb =
            ta==="bomb" ? a : b;

        const other =
            bomb===a ? b : a;

        if(typeOf(other)==="block"){

            damageBlock(
                other,
                30
            );

        }

    }

}

function handleActiveCollision(pair){

    const a = pair.bodyA;
    const b = pair.bodyB;

    const ta = typeOf(a);
    const tb = typeOf(b);

    const enemy =
        ta==="enemy"
            ? a
            : tb==="enemy"
                ? b
                : null;

    if(!enemy || !enemy.plugin.alive){
        return;
    }

    const other =
        enemy===a ? b : a;

    const ot = typeOf(other);

    if(
        ot==="block" ||
        ot==="bedrock"
    ){

        checkCrush(
            enemy,
            other,
            pair
        );

    }

}

function handleCollisionEnd(pair){

    const a = pair.bodyA;
    const b = pair.bodyB;

    const ta = typeOf(a);
    const tb = typeOf(b);

    if(
        (ta==="bomb" && tb==="multiply") ||
        (ta==="multiply" && tb==="bomb")
    ){

        const bomb =
            ta==="bomb" ? a : b;

        const multiply =
            ta==="multiply" ? a : b;

        const set =
            multiplyContacts.get(
                multiply.plugin.id
            );

        if(set){

            set.delete(
                bomb.plugin.id
            );

        }

    }

}

/* =========================
   増殖
========================= */

function handleMultiply(
    multiply,
    bomb
){

    if(!multiplyContacts.has(
        multiply.plugin.id
    )){

        multiplyContacts.set(
            multiply.plugin.id,
            new Set()
        );

    }

    const set =
        multiplyContacts.get(
            multiply.plugin.id
        );

    /*
     * まだ接触中なら何もしない。
     */
    if(set.has(
        bomb.plugin.id
    )){

        return;

    }

    /*
     * 今回の接触を登録
     */
    set.add(
        bomb.plugin.id
    );

    /*
     * 1接触につき1個だけ増殖
     */
    multiplyBomb(
        multiply,
        bomb
    );

}

function multiplyBomb(
    multiply,
    bomb
){

    const engine =
        currentScreenIsEditor()
            ? editorEngine
            : playEngine;

    if(!engine){
        return;
    }

    const p = multiply.position;

    const height =
        multiply.plugin.height || 45;

    /*
     * ★増殖した爆弾は必ず下側
     */
    const newBomb = createBomb(
        p.x + (Math.random()-.5)*50,
        p.y + height/2 + 45
    );

    World.add(
        engine.world,
        newBomb
    );

    if(currentScreenIsEditor()){
        stageObjects.push(newBomb);
    }

    Body.setVelocity(
        newBomb,
        {
            x:(Math.random()-.5)*1.5,
            y:1
        }
    );

}

/* =========================
   ブロックダメージ
========================= */

function blockHitBlock(a,b){

    const impact =
        Math.abs(a.velocity.y-b.velocity.y)
        +
        Math.abs(a.velocity.x-b.velocity.x);

    if(impact>1){

        damageBlock(
            a,
            impact*3
        );

        damageBlock(
            b,
            impact*3
        );

    }

}

function damageBlock(
    block,
    damage
){

    if(
        !block ||
        block.label!=="block"
    ){
        return;
    }

    const p = block.plugin;

    if(
        damage <
        p.threshold
    ){
        return;
    }

    p.hp--;

    if(p.hp<=0){

        const engine =
            currentScreenIsEditor()
                ? editorEngine
                : playEngine;

        World.remove(
            engine.world,
            block
        );

        const index =
            stageObjects.indexOf(block);

        if(index>=0){
            stageObjects.splice(index,1);
        }

        if(selectedBody===block){
            selectedBody=null;
        }

    }

}

/* =========================
   スライム
========================= */

function checkCrush(
    enemy,
    other,
    pair
){

    if(!enemy.plugin.alive){
        return;
    }

    const depth =
        pair.collision?.depth || 0;

    const above =
        other.position.y <
        enemy.position.y;

    const downward =
        other.isStatic ||
        other.velocity.y >
        ENEMY_CRUSH_SPEED;

    const relativeSpeed =
        Math.abs(
            enemy.plugin.preVY
            -
            (other.velocity?.y || 0)
        );

    /*
     * 上から落下して潰した
     */
    if(
        above &&
        downward &&
        depth>5
    ){

        if(
            other.isStatic ||
            relativeSpeed>ENEMY_CRUSH_SPEED
        ){

            killEnemy(enemy);
            return;

        }

    }

    /*
     * 高速衝突
     */
    if(
        relativeSpeed>=9
    ){

        killEnemy(enemy);

    }

}

function killEnemy(enemy){

    if(
        !enemy ||
        !enemy.plugin.alive
    ){
        return;
    }

    enemy.plugin.alive=false;

    const engine =
        currentScreenIsEditor()
            ? editorEngine
            : playEngine;

    World.remove(
        engine.world,
        enemy
    );

    const index =
        stageObjects.indexOf(enemy);

    if(index>=0){
        stageObjects.splice(index,1);
    }

    if(selectedBody===enemy){
        selectedBody=null;
    }

}

/* =========================
   爆発
========================= */

function explodeAt(
    engine,
    x,
    y
){

    explosionEffects.push({
        engine:engine,
        x:x,
        y:y,
        time:performance.now()
    });

    Composite.allBodies(
        engine.world
    ).forEach(body=>{

        const type =
            typeOf(body);

        /*
         * 岩盤には何もしない
         */
        if(
            type==="floor" ||
            type==="bedrock"
        ){
            return;
        }

        const dx =
            body.position.x-x;

        const dy =
            body.position.y-y;

        const distance =
            Math.sqrt(dx*dx+dy*dy);

        if(
            distance>
            EXPLOSION_FORCE_RADIUS
        ){
            return;
        }

        const power =
            1 -
            distance/
            EXPLOSION_FORCE_RADIUS;

        const length =
            Math.max(distance,1);

        const nx =
            dx/length;

        const ny =
            dy/length;

        if(!body.isStatic){

            Body.applyForce(
                body,
                body.position,
                {
                    x:nx*
                      EXPLOSION_FORCE*
                      power,

                    y:ny*
                      EXPLOSION_FORCE*
                      power
                }
            );

        }

        if(type==="block"){

            damageBlock(
                body,
                EXPLOSION_BLOCK_DAMAGE*
                power
            );

        }

        if(
            type==="enemy" &&
            body.plugin.alive &&
            distance<EXPLOSION_RADIUS
        ){

            killEnemy(body);

        }

    });

}

function explodeAllBombs(
    engine
){

    const bombs =
        Composite.allBodies(
            engine.world
        ).filter(
            b=>typeOf(b)==="bomb"
        );

    bombs.forEach(
        bomb=>{
            explodeAt(
                engine,
                bomb.position.x,
                bomb.position.y
            );
        }
    );

    bombs.forEach(
        bomb=>{
            World.remove(
                engine.world,
                bomb
            );
        }
    );

    if(
        engine===editorEngine
    ){

        stageObjects =
            stageObjects.filter(
                b=>typeOf(b)!=="bomb"
            );

    }

}

/* =========================
   エディター操作
========================= */

function findBodyAt(
    engine,
    point
){

    const bodies =
        Composite.allBodies(
            engine.world
        );

    for(
        let i=bodies.length-1;
        i>=0;
        i--
    ){

        const body=bodies[i];

        if(
            typeOf(body)==="floor"
        ){
            continue;
        }

        if(
            Bounds.contains(
                body.bounds,
                point
            ) &&
            Vertices.contains(
                body.vertices,
                point
            )
        ){

            return body;

        }

    }

    return null;

}

function addEditorBody(
    body
){

    World.add(
        editorEngine.world,
        body
    );

    stageObjects.push(body);

}

function removeEditorBody(
    body
){

    if(!body){
        return;
    }

    World.remove(
        editorEngine.world,
        body
    );

    const index =
        stageObjects.indexOf(body);

    if(index>=0){
        stageObjects.splice(index,1);
    }

    if(selectedBody===body){
        selectedBody=null;
    }

}

function editorPointerDown(event){

    if(!editorEngine){
        return;
    }

    const screen =
        pointerPosition(
            event,
            editorCanvas
        );

    const world =
        screenToWorld(
            editorCanvas,
            screen.x,
            screen.y,
            editorCamera
        );

    pointerDown=true;

    /*
     * 移動
     */
    if(currentTool==="move"){

        const body =
            findBodyAt(
                editorEngine,
                world
            );

        if(body){

            selectedBody=body;

            dragData={
                body:body,
                dx:body.position.x-world.x,
                dy:body.position.y-world.y
            };

        }

        return;
    }

    /*
     * 消去
     */
    if(currentTool==="erase"){

        const body =
            findBodyAt(
                editorEngine,
                world
            );

        if(body){
            removeEditorBody(body);
        }

        return;
    }

    /*
     * 回転
     */
    if(currentTool==="rotate"){

        const body =
            findBodyAt(
                editorEngine,
                world
            );

        if(body){

            selectedBody=body;

            if(
                body.label!=="bedrock"
            ){

                Body.rotate(
                    body,
                    15*Math.PI/180
                );

            }

            openProperty(body);

        }

        return;
    }

    /*
     * 形変更
     */
    if(currentTool==="resize"){

        const body =
            findBodyAt(
                editorEngine,
                world
            );

        if(body){
            openProperty(body);
        }

        return;
    }

    /*
     * 既存物体をタップした場合は選択
     */
    const existing =
        findBodyAt(
            editorEngine,
            world
        );

    if(
        existing &&
        [
            "block",
            "enemy",
            "bomb",
            "multiply",
            "bedrock"
        ].includes(existing.label)
    ){

        selectedBody=existing;

        if(
            ["wood","glass","stone"]
            .includes(currentTool)
        ){

            return;

        }

    }

    /*
     * 新規配置
     */
    if(
        ["wood","glass","stone"]
        .includes(currentTool)
    ){

        addEditorBody(
            createBlock(
                currentTool,
                world.x,
                world.y,
                150,
                35,
                0
            )
        );

        return;
    }

    if(currentTool==="enemy"){

        addEditorBody(
            createEnemy(
                world.x,
                world.y
            )
        );

        return;
    }

    if(currentTool==="bomb"){

        addEditorBody(
            createBomb(
                world.x,
                world.y
            )
        );

        return;
    }

    if(currentTool==="multiply"){

        addEditorBody(
            createMultiply(
                world.x,
                world.y
            )
        );

        return;
    }

    if(currentTool==="bedrock"){

        addEditorBody(
            createBedrock(
                world.x,
                world.y
            )
        );

    }

}

function editorPointerMove(event){

    if(
        !pointerDown ||
        !dragData
    ){
        return;
    }

    const screen =
        pointerPosition(
            event,
            editorCanvas
        );

    const world =
        screenToWorld(
            editorCanvas,
            screen.x,
            screen.y,
            editorCamera
        );

    const body =
        dragData.body;

    Body.setPosition(
        body,
        {
            x:world.x+dragData.dx,
            y:world.y+dragData.dy
        }
    );

    if(
        body.label==="bedrock"
    ){

        Body.setAngle(
            body,
            0
        );

    }

}

function editorPointerUp(){

    pointerDown=false;
    dragData=null;

}

editorCanvas.addEventListener(
    "pointerdown",
    editorPointerDown
);

editorCanvas.addEventListener(
    "pointermove",
    editorPointerMove
);

editorCanvas.addEventListener(
    "pointerup",
    editorPointerUp
);

editorCanvas.addEventListener(
    "pointercancel",
    editorPointerUp
);

editorCanvas.addEventListener(
    "wheel",
    event=>{

        event.preventDefault();

        editorCamera.zoom *=
            event.deltaY<0
                ? 1.1
                : .9;

        editorCamera.zoom =
            Math.max(
                .15,
                Math.min(
                    3,
                    editorCamera.zoom
                )
            );

    },
    {passive:false}
);

/* =========================
   プロパティ
========================= */

function openProperty(body){

    if(!body){
        return;
    }

    selectedBody=body;

    const p=body.plugin||{};

    $("propW").value =
        Math.round(
            p.width ||
            body.bounds.max.x-
            body.bounds.min.x
        );

    $("propH").value =
        Math.round(
            p.height ||
            body.bounds.max.y-
            body.bounds.min.y
        );

    $("propAngle").value =
        Math.round(
            body.angle*180/Math.PI
        );

    $("propertyPanel")
        .classList.add("show");

}

function resizeSelected(
    width,
    height
){

    if(
        !selectedBody ||
        selectedBody.label!=="block"
    ){
        return;
    }

    const p =
        selectedBody.plugin;

    width =
        Math.max(
            10,
            Math.min(
                1000,
                width
            )
        );

    height =
        Math.max(
            10,
            Math.min(
                1000,
                height
            )
        );

    Body.scale(
        selectedBody,
        width/p.width,
        height/p.height
    );

    p.width=width;
    p.height=height;

}

function rotateSelected(
    degrees
){

    if(!selectedBody){
        return;
    }

    if(
        selectedBody.label==="bedrock"
    ){
        Body.setAngle(
            selectedBody,
            0
        );
        return;
    }

    Body.rotate(
        selectedBody,
        degrees*Math.PI/180
    );

}

$("applyProp").onclick=()=>{

    if(!selectedBody){
        return;
    }

    if(
        selectedBody.label==="block"
    ){

        resizeSelected(
            Number($("propW").value),
            Number($("propH").value)
        );

    }

    if(
        selectedBody.label==="bedrock"
    ){

        const p =
            selectedBody.plugin;

        const w =
            Math.max(
                10,
                Number($("propW").value)
            );

        const h =
            Math.max(
                10,
                Number($("propH").value)
            );

        Body.scale(
            selectedBody,
            w/p.width,
            h/p.height
        );

        p.width=w;
        p.height=h;

        Body.setAngle(
            selectedBody,
            0
        );

    }

    if(
        selectedBody.label!=="bedrock"
    ){

        Body.setAngle(
            selectedBody,
            Number(
                $("propAngle").value
            )*Math.PI/180
        );

    }

    showMessage(
        "変更しました"
    );

};

$("rotateL").onclick=()=>{

    rotateSelected(-90);

    if(selectedBody){

        $("propAngle").value =
            Math.round(
                selectedBody.angle*
                180/Math.PI
            );

    }

};

$("rotateR").onclick=()=>{

    rotateSelected(90);

    if(selectedBody){

        $("propAngle").value =
            Math.round(
                selectedBody.angle*
                180/Math.PI
            );

    }

};

$("thin").onclick=()=>{

    if(
        selectedBody &&
        selectedBody.label==="block"
    ){

        resizeSelected(
            selectedBody.plugin.width*.8,
            selectedBody.plugin.height*.8
        );

        openProperty(

        );

    }

};

$("thick").onclick=()=>{

    if(
        selectedBody &&
        selectedBody.label==="block"
    ){

        resizeSelected(
            selectedBody.plugin.width*1.25,
            selectedBody.plugin.height*1.25
        );

};

};

/* =========================
   保存
========================= */

function serializeStage(){

    return {

        id:
            currentStageId ||
            uid(),

        name:
            $("stageName").value.trim()
            ||
            "無題のステージ",

        objects:
            stageObjects
            .filter(body=>{

                return [
                    "block",
                    "enemy",
                    "multiply",
                    "bedrock"
                ].includes(
                    typeOf(body)
                );

            })
            .map(body=>{

                const p=body.plugin;

                if(
                    body.label==="block"
                ){

                    return {

                        type:"block",
                        material:p.material,

                        x:body.position.x,
                        y:body.position.y,

                        w:p.width,
                        h:p.height,

                        angle:
                            body.angle*
                            180/Math.PI

                    };

                }

                if(
                    body.label==="enemy"
                ){

                    return {

                        type:"enemy",

                        x:body.position.x,
                        y:body.position.y

                    };

                }

                if(
                    body.label==="multiply"
                ){

                    return {

                        type:"multiply",

                        x:body.position.x,
                        y:body.position.y,

                        w:p.width,
                        h:p.height

                    };

                }

                if(
                    body.label==="bedrock"
                ){

                    return {

                        type:"bedrock",

                        x:body.position.x,
                        y:body.position.y,

                        w:p.width,
                        h:p.height,

                        angle:0

                    };

                }

            })

    };

}

function saveCurrentStage(){

    const stage =
        serializeStage();

    currentStageId =
        stage.id;

    const stages =
        getStages();

    const index =
        stages.findIndex(
            x=>x.id===stage.id
        );

    if(index>=0){

        stages[index]=stage;

    }else{

        stages.push(stage);

    }

    setStages(stages);

    showMessage(
        "ステージを保存しました"
    );

}

   エディター起動
========================= */

function stopEditor(){

    if(
        editorRunner &&
        editorEngine
    ){

        Runner.stop(
            editorRunner
        );

    }

    editorRunner=null;
    editorEngine=null;

    selectedBody=null;
    dragData=null;
    stageObjects=[];

    multiplyContacts.clear();

}

function createEditorEngine(){

    editorEngine =
        MatterEngine.create();

    editorEngine.gravity.y=1;

    World.add(
        editorEngine.world,
        createFloor()
    );

    setupEngineEvents(
        editorEngine
    );

    editorRunner =
        Runner.create();

    Runner.run(
        editorRunner,
        editorEngine
    );

}

function newEditor(){

    stopEditor();

    currentStageId=uid();

    $("stageName").value =
        "新しいステージ";

    createEditorEngine();

    editorCamera={
        x:0,
        y:400,
        zoom:.7
    };

    showScreen(
        "editorScreen"
    );

    resizeAll();

}

function loadStageIntoEditor(
    stage
){

    stopEditor();

    currentStageId=stage.id;

    $("stageName").value =
        stage.name || "";

    createEditorEngine();

    stageObjects=[];

    (stage.objects||[])
    .forEach(object=>{

        let body=null;

        if(
            object.type==="block"
        ){

            body=createBlock(
                object.material,
                object.x,
                object.y,
                object.w,
                object.h,
                object.angle||0
            );

        }

        if(
            object.type==="enemy"
        ){

            body=createEnemy(
                object.x,
                object.y
            );

        }

        if(
            object.type==="multiply"
        ){

            body=createMultiply(
                object.x,
                object.y,
                object.w,
                object.h
            );

        }

        if(
            object.type==="bedrock"
        ){

            body=createBedrock(
                object.x,
                object.y,
                object.w,
                object.h
            );

        }

        if(body){

            World.add(
                editorEngine.world,
                body
            );

            stageObjects.push(body);

        }

    });

    showScreen(
        "editorScreen"
    );

    resizeAll();

}

function renderStageList(){

    const list =
        $("stageList");

    list.innerHTML="";

    const stages =
        getStages();

    if(!stages.length){

        list.innerHTML =
            '<div class="empty">保存されたステージがありません。</div>';

        return;

    }

    stages.forEach(stage=>{

        const card =
            document.createElement(
                "div"
            );

        card.className="stageCard";

        const name =
            document.createElement(
                "div"
            );

        name.className="stageName";

        name.textContent =
            stage.name;

        const play =
            document.createElement(
                "button"
            );

        play.textContent =
            "▶ 遊ぶ";

        play.onclick=()=>{
            startPlay(stage);
        };

        const edit =
            document.createElement(
                "button"
            );

        edit.textContent =
            "✎ 編集";

        edit.onclick=()=>{
            loadStageIntoEditor(
                stage
            );
        };

        const del =
            document.createElement(
                "button"
            );

        del.textContent =
            "削除";

        del.className="delete";

        del.onclick=()=>{

            const newStages =
                getStages()
                .filter(
                    x=>x.id!==stage.id
                );

            setStages(
                newStages
            );

            renderStageList();

        };

        card.append(
            name,
            play,
            edit,
            del
        );

        list.appendChild(
            card
        );

    });

}

$("bombBtn").onclick=event=>{

    $("bombBtn")

            "active"
        );

    const active =
        $("bombBtn")
        .classList.contains(
            "active"
        );

    $("bombBtn").textContent =
        active
            ? "💣 爆弾設置中"
            : "💣 爆弾を置く";

};

playCanvas.addEventListener(
    "pointerdown",
    event=>{

        if(
            !playEngine ||
            !$("bombBtn")
                .classList
                .contains("active")
        ){

            return;

        }

        const screen =
            pointerPosition(
                event,
                playCanvas
            );

        const world =
            screenToWorld(
                playCanvas,
                screen.x,
                screen.y,
                playCamera
            );

        const bomb =
            createBomb(
                world.x,
                world.y
            );

        World.add(
            playEngine.world,
            bomb
        );

        Body.setVelocity(
            bomb,
            {
                x:0,
                y:1
            }
        );

    }
);

$("allBomb").onclick=event=>{

    event.stopPropagation();

    if(playEngine){

        explodeAllBombs(
            playEngine
        );

    }

};

$("restartBtn").onclick=event=>{

    event.stopPropagation();

    const stage =
        getStages()
        .find(
            x=>x.id===currentStageId
        );

    if(stage){
        startPlay(stage);
    }

};

/* =========================
   描画
========================= */

function drawEngine(
    canvas,
    ctx,
    engine,
    camera,
    editor
){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    ctx.translate(
        canvas.clientWidth/2,
        canvas.clientHeight/2
    );

    ctx.scale(
        camera.zoom,
        camera.zoom
    );

    ctx.translate(
        -camera.x,
        -camera.y
    );

    /*
     * 背景
     */
    ctx.fillStyle="#dceeff";

    ctx.fillRect(
        camera.x -
            canvas.clientWidth/
            (2*camera.zoom)-200,

        camera.y -
            canvas.clientHeight/
            (2*camera.zoom)-200,

        canvas.clientWidth/
            camera.zoom+400,

        canvas.clientHeight/
            camera.zoom+400
    );

    const bodies =
        Composite.allBodies(
            engine.world
        );

    bodies.forEach(body=>{

        const type =
            typeOf(body);

        if(type==="floor"){

            ctx.fillStyle="#777";

            ctx.fillRect(
                body.bounds.min.x,
                body.bounds.min.y,
                body.bounds.max.x-
                    body.bounds.min.x,
                body.bounds.max.y-
                    body.bounds.min.y
            );

            return;
        }

        ctx.save();

        ctx.translate(
            body.position.x,
            body.position.y
        );

        ctx.rotate(
            body.angle
        );

        if(type==="block"){

            const w =
                body.plugin.width;

            const h =
                body.plugin.height;

            if(
                body.plugin.material==="wood"
            ){
                ctx.fillStyle="#c98a46";
            }

            if(
                body.plugin.material==="glass"
            ){
                ctx.fillStyle="#83ddec";
            }

            if(
                body.plugin.material==="stone"
            ){
                ctx.fillStyle="#777";
            }

            ctx.fillRect(
                -w/2,
                -h/2,
                w,
                h
            );

            ctx.strokeStyle="#333";
            ctx.lineWidth=2;

            ctx.strokeRect(
                -w/2,
                -h/2,
                w,
                h
            );

        }

        if(type==="bedrock"){

            const w =
                body.plugin.width;

            const h =
                body.plugin.height;

            ctx.fillStyle="#30343a";

            ctx.fillRect(
                -w/2,
                -h/2,
                w,
                h
            );

            ctx.strokeStyle="#111";
            ctx.lineWidth=3;

            ctx.strokeRect(
                -w/2,
                -h/2,
                w,
                h
            );

            ctx.strokeStyle="#555";
            ctx.lineWidth=2;

            for(
                let x=-w/2;
                x<w/2;
                x+=35
            ){

                ctx.beginPath();

                ctx.moveTo(
                    x,
                    -h/2
                );

                ctx.lineTo(
                    x+20,
                    h/2
                );

                ctx.stroke();

            }

        }

        if(type==="multiply"){

            const w =
                body.plugin.width;

            const h =
                body.plugin.height;

            /*
             * センサーなので半透明で表示
             */
            ctx.fillStyle=
                "rgba(255,204,51,.55)";

            ctx.fillRect(
                -w/2,
                -h/2,
                w,
                h
            );

            ctx.strokeStyle="#b57900";
            ctx.lineWidth=3;

            ctx.strokeRect(
                -w/2,
                -h/2,
                w,
                h
            );

            ctx.fillStyle="#222";
            ctx.font="bold 28px Arial";
            ctx.textAlign="center";
            ctx.textBaseline="middle";

            ctx.fillText(
                "×2",
                0,
                0
            );

        }

        if(type==="enemy"){

            ctx.fillStyle="#55c94a";

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                22,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle="#fff";

            ctx.beginPath();

            ctx.arc(
                -7,
                -4,
                5,
                0,
                Math.PI*2
            );

            ctx.arc(
                7,
                -4,
                5,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle="#222";

            ctx.beginPath();

            ctx.arc(
                -7,
                -4,
                2,
                0,
                Math.PI*2
            );

            ctx.arc(
                7,
                -4,
                2,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

        if(type==="bomb"){

            ctx.fillStyle="#222";

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                16,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.strokeStyle="#333";
            ctx.lineWidth=4;

            ctx.beginPath();

            ctx.moveTo(
                8,
                -12
            );

            ctx.quadraticCurveTo(
                17,
                -22,
                20,
                -13
            );

            ctx.stroke();

        }

        ctx.restore();

    });

    /*
     * 選択枠
     */
    if(
        editor &&
        selectedBody
    ){

        const body =
            selectedBody;

        const w =
            body.plugin?.width ||
            45;

        const h =
            body.plugin?.height ||
            45;

        ctx.save();

        ctx.translate(
            body.position.x,
            body.position.y
        );

        ctx.rotate(
            body.angle
        );

        ctx.strokeStyle="#ff8800";
        ctx.lineWidth=
            4/camera.zoom;

        ctx.setLineDash([
            9/camera.zoom,
            6/camera.zoom
        ]);

        ctx.strokeRect(
            -w/2-5,
            -h/2-5,
            w+10,
            h+10
        );

        ctx.restore();

    }

    ctx.restore();

    /*
     * 爆発
     */
    const now =
        performance.now();

    explosionEffects =
        explosionEffects.filter(
            effect=>
                now-effect.time<300
        );

    explosionEffects.forEach(
        effect=>{

            if(
                effect.engine!==engine
            ){
                return;
            }

            const s =
                worldToScreen(
                    canvas,
                    effect.x,
                    effect.y,
                    camera
                );

            const progress =
                (now-effect.time)/300;

            ctx.beginPath();

            ctx.arc(
                s.x,
                s.y,
                progress*
                    130*
                    camera.zoom,
                0,
                Math.PI*2
            );

            ctx.strokeStyle="#ff8800";
            ctx.lineWidth=8;

            ctx.globalAlpha=
                1-progress;

            ctx.stroke();

            ctx.globalAlpha=1;

        }
    );

}

/* =========================
   描画ループ
========================= */

function editorLoop(){

    if(
        editorEngine &&
        $("editorScreen")
            .classList
            .contains("active")
    ){

        drawEngine(
            editorCanvas,
            editorCanvas.getContext("2d"),
            editorEngine,
            editorCamera,
            true
        );

    }

    requestAnimationFrame(
        editorLoop
    );

}

function playLoop(){

    if(
        playEngine &&
        $("playScreen")
            .classList
            .contains("active")
    ){

        drawEngine(
            playCanvas,
            playCanvas.getContext("2d"),
            playEngine,
            playCamera,
            false
        );

    }

    requestAnimationFrame(
        playLoop
    );

}

/* =========================
   岩盤の角度固定
========================= */

setInterval(()=>{

    [
        editorEngine,
        playEngine
    ].forEach(engine=>{

        if(!engine){
            return;
        }

        Composite.allBodies(
            engine.world
        ).forEach(body=>{

            if(
                body.label==="bedrock"
            ){

                Body.setAngle(
                    body,
                    0
                );

            }

        });

    });

},100);

/* =========================
   初期化
========================= */

resizeAll();

editorLoop();
playLoop();

</script>
