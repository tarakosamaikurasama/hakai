<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>日野市の街並みに歴史</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f3f3f3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#222}
button,input,select{font:inherit}
button{border:0;cursor:pointer}
.hidden{display:none!important}

#app{min-height:100vh;padding:14px}
.screen{display:none;min-height:calc(100vh - 28px)}
.screen.active{display:block}

.home{
 max-width:760px;margin:40px auto;background:white;border-radius:28px;
 padding:32px;box-shadow:0 8px 30px #0002;text-align:center
}
.home h1{font-size:34px;margin:8px 0 28px}
.home button{display:block;width:100%;margin:12px 0;padding:16px;border-radius:16px;background:#f80;color:white;font-weight:800;font-size:18px;box-shadow:0 4px 0 #c60}
.home button.secondary{background:white;color:#333;border:2px solid #ddd;box-shadow:none}

.workspace{max-width:1200px;margin:auto}
.topbar{
 display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:white;
 border-radius:18px;padding:10px;box-shadow:0 5px 20px #0001;margin-bottom:10px
}
.topbar h2{margin:0 10px 0 4px;font-size:20px}
.btn{
 padding:9px 13px;border-radius:12px;background:#f80;color:white;font-weight:700;
 box-shadow:0 3px 0 #c60
}
.btn.white{background:white;color:#222;border:1px solid #ddd;box-shadow:none}
.btn.danger{background:#d33;box-shadow:0 3px 0 #922}
.btn.active{outline:3px solid #222;outline-offset:1px}

.stageWrap{
 background:white;border-radius:24px;padding:10px;box-shadow:0 8px 28px #0002;
 position:relative;overflow:hidden
}
#gameCanvas{
 display:block;width:100%;height:min(70vh,700px);min-height:420px;
 background:linear-gradient(#dff3ff,#f9fbff);border-radius:18px;
 touch-action:none
}

.editorBar{
 margin-top:10px;background:#fff;border-radius:18px;padding:10px;
 box-shadow:0 5px 20px #0001
}
.palette{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.palette button{
 padding:8px 11px;border-radius:10px;background:#fafafa;border:1px solid #ddd;font-weight:700
}
.palette button.selectedTool{background:#f80;color:white;border-color:#f80}
.palette .selectTool{order:-1}

.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.actions button{padding:8px 12px;border-radius:10px;background:white;border:1px solid #ddd}
.actions button.active{background:#222;color:white}

.playBar{
 background:#fff;border-radius:18px;padding:10px;box-shadow:0 5px 20px #0001;
 display:flex;gap:7px;align-items:center;flex-wrap:wrap
}
.playBar .info{margin-left:auto;font-size:14px;font-weight:700}

.smallPanel{
 position:absolute;z-index:20;left:14px;right:14px;top:14px;
 background:#fffffff5;backdrop-filter:blur(12px);
 border:1px solid #ddd;border-radius:14px;padding:9px;
 box-shadow:0 7px 25px #0003
}
.smallPanelLine{display:flex;align-items:center;gap:7px;flex-wrap:nowrap;white-space:nowrap}
.smallPanel input,.smallPanel select{
 width:auto;min-width:55px;padding:5px 6px;border:1px solid #ccc;border-radius:7px
}
.smallPanel button{padding:6px 9px;border-radius:8px;background:#f80;color:white;font-weight:700}

.selectionInfo{
 position:absolute;z-index:15;right:15px;bottom:15px;
 background:#fffffff2;border-radius:13px;padding:10px 12px;
 box-shadow:0 4px 18px #0003;font-size:14px;min-width:180px
}

.modal{
 position:fixed;inset:0;background:#0005;z-index:100;
 display:flex;align-items:center;justify-content:center;padding:15px
}
.modalBox{
 width:min(600px,100%);max-height:90vh;overflow:auto;background:white;
 border-radius:22px;padding:20px;box-shadow:0 12px 50px #0005
}
.modalBox h3{margin-top:0}
.modalRow{display:flex;gap:8px;align-items:center;margin:9px 0;flex-wrap:wrap}
.modalRow input,.modalRow select{
 flex:1;min-width:120px;padding:9px;border:1px solid #ccc;border-radius:9px
}

.stageListItem{
 border:1px solid #ddd;border-radius:14px;padding:12px;margin:9px 0
}
.stageListItem strong{display:block;margin-bottom:8px}
.stageListItem .row{display:flex;gap:6px;flex-wrap:wrap}
.stageListItem button{padding:7px 10px;border-radius:8px;background:#f80;color:white}
.stageListItem button.white{background:white;color:#222;border:1px solid #ddd}

.notice{
 padding:9px 11px;background:#fff5e9;border-radius:10px;font-size:13px;margin-bottom:10px
}

@media(max-width:600px){
 #app{padding:7px}
 .home{margin:15px auto;padding:22px}
 .home h1{font-size:27px}
 #gameCanvas{min-height:390px;height:60vh}
 .topbar h2{width:100%}
 .smallPanelLine{overflow-x:auto}
}
</style>
</head>
<body>
<div id="app">

<section id="homeScreen" class="screen active">
 <div class="home">
  <h1>街並みクラッシュ</h1>
  <button onclick="newStage()">ステージを作る</button>
  <button onclick="showStageList()">ステージで遊ぶ</button>
  <button class="secondary" onclick="showStageList(true)">保存データ</button>
 </div>
</section>

<section id="editorScreen" class="screen">
 <div class="workspace">
  <div class="topbar">
   <h2>ステージ編集</h2>
   <button class="btn white" onclick="goHome()">ホーム</button>
   <button class="btn" onclick="openSaveDialog()">保存</button>
   <button class="btn white" onclick="openImport()">データ移行</button>
   <button class="btn white" onclick="exportData()">書き出す</button>
  </div>

  <div class="stageWrap">
   <canvas id="gameCanvas"></canvas>
   <div id="dropperPanelEditor" class="smallPanel hidden"></div>
  </div>

  <div class="editorBar">
   <div class="palette">
    <button class="selectTool" onclick="setTool('select')">選択</button>
    <button onclick="setTool('wood')">木</button>
    <button onclick="setTool('glass')">ガラス</button>
    <button onclick="setTool('stone')">石</button>
    <button onclick="setTool('houseWood')">木の家</button>
    <button onclick="setTool('houseGlass')">ガラスの家</button>
    <button onclick="setTool('houseStone')">石の家</button>
    <button onclick="setTool('houseBedrock')">岩盤の家</button>
    <button onclick="setTool('multiplier')">倍ブロック</button>
    <button onclick="setTool('bedrock')">岩盤</button>
    <button onclick="setTool('bomb')">爆弾</button>
    <button onclick="setTool('dog')">犬</button>
    <button onclick="setTool('bigDog')">巨大犬</button>
    <button onclick="setTool('armorDog')">よろい犬</button>
    <button onclick="setTool('movingDog')">動く犬</button>
    <button onclick="setTool('bombDropper')">爆弾投下機</button>
    <button onclick="setTool('dogSpawner')">自動犬生成機</button>
   </div>

   <div class="actions">
    <button onclick="setEditAction('move')">移動</button>
    <button onclick="setEditAction('resize')">形変更</button>
    <button onclick="setEditAction('rotate')">回転</button>
    <button onclick="duplicateSelected()">複製</button>
    <button onclick="deleteSelected()">個別削除</button>
    <button onclick="openSelectedMachineSettings()">生成機設定</button>
    <button onclick="openManualBombSettings()">手動爆弾設定</button>
    <button onclick="zoom(-0.1)">ズーム−</button>
    <button onclick="zoom(0.1)">ズーム＋</button>
   </div>
  </div>
 </div>
</section>

<section id="playScreen" class="screen">
 <div class="workspace">
  <div class="topbar">
   <h2>ステージで遊ぶ</h2>
   <button class="btn white" onclick="goHome()">ホーム</button>
  </div>

  <div class="stageWrap">
   <canvas id="gameCanvasPlay"></canvas>
   <div id="dropperPanelPlay" class="smallPanel hidden"></div>
   <div id="selectionInfo" class="selectionInfo hidden"></div>
  </div>

  <div class="playBar">
   <button class="btn" onclick="resetPlay()">リセット（やり直す）</button>
   <button class="btn danger" onclick="explodeAll()">全爆破</button>
   <button class="btn white" onclick="setPlaySelect()">選択</button>
   <button class="btn white" onclick="openManualBombSettings()">手動爆弾設定</button>
   <button class="btn white" onclick="openSelectedMachineSettings()">生成機設定</button>
   <button class="btn white" onclick="zoom(-0.1)">ズーム−</button>
   <button class="btn white" onclick="zoom(0.1)">ズーム＋</button>
   <span class="info" id="playInfo">爆弾を置いてください</span>
  </div>
 </div>
</section>

<div id="modal" class="modal hidden">
 <div class="modalBox" id="modalBox"></div>
</div>

<input id="importInput" type="file" accept=".json,application/json" class="hidden">

</div>

<script>
const {
 Engine,Render,Runner,World,Bodies,Body,Composite,Events,Vector
}=Matter;

const canvas=document.getElementById("gameCanvas");
const playCanvas=document.getElementById("gameCanvasPlay");

let engine=null;
let mode="editor";
let stage=null;
let selected=null;
let tool="select";
let editAction=null;
let zoomLevel=1;
let pointerState=null;
let playSourceStage=null;
let explosions=[];
let lastTime=performance.now();
let manualBombTimer=5;
let activeMachine=null;
let nextMachineTimes=new Map();
let generatedVisuals=[];
let stageCounter=1;

const FLOOR_H=35;
const WORLD_W=1000;
const MIN_SIZE=18;

const MATERIALS={
 wood:{name:"木",max:5,color:"#a96832",damage:1},
 glass:{name:"ガラス",max:2,color:"#aee8ff",damage:1},
 stone:{name:"石",max:10,color:"#888",damage:1},
 bedrock:{name:"岩盤",max:Infinity,color:"#30343b",damage:0}
};

function newId(){
 return "id_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9);
}

function deepCopy(v){
 return JSON.parse(JSON.stringify(v));
}

function closeModal(){
 document.getElementById("modal").classList.add("hidden");
 document.getElementById("modalBox").innerHTML="";
}

function openModal(html){
 document.getElementById("modalBox").innerHTML=html;
 document.getElementById("modal").classList.remove("hidden");
}

function showScreen(id){
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 resizeCanvas();
}

function goHome(){
 closeModal();
 showScreen("homeScreen");
}

function blankStage(name){
 return {
  id:newId(),
  name:name||"ステージ "+stageCounter++,
  objects:[]
 };
}

function newStage(){
 stage=blankStage();
 playSourceStage=null;
 selected=null;
 mode="editor";
 resetEngine();
 showScreen("editorScreen");
}

function getCanvas(){
 return mode==="editor"?canvas:playCanvas;
}

function resizeCanvas(){
 const c=getCanvas();
 if(!c)return;
 const rect=c.getBoundingClientRect();
 const dpr=Math.min(devicePixelRatio||1,2);
 c.width=Math.max(1,rect.width*dpr);
 c.height=Math.max(1,rect.height*dpr);
 if(engine){
  engine.renderWidth=c.width/dpr;
  engine.renderHeight=c.height/dpr;
 }
 rebuildFloor();
}

function worldWidth(){
 return 1000;
}

function screenSize(){
 const c=getCanvas();
 const r=c.getBoundingClientRect();
 return {w:r.width,h:r.height};
}

function worldFloorY(){
 const s=screenSize();
 return s.h-FLOOR_H;
}

function createEngine(){
 engine=Engine.create({enableSleeping:false});
 engine.gravity.y=1;
 engine.gravity.scale=0.001;
 Events.on(engine,"collisionStart",handleCollision);
}

function resetEngine(){
 if(engine){
  Events.off(engine,"collisionStart",handleCollision);
 }
 createEngine();
 nextMachineTimes=new Map();
 explosions=[];
 generatedVisuals=[];
 rebuildPhysicsFromStage();
}

function rebuildFloor(){
 if(!engine)return;
 const bodies=Composite.allBodies(engine.world);
 bodies.filter(b=>b.label==="ground").forEach(b=>World.remove(engine.world,b));
 const s=screenSize();
 const floor=Bodies.rectangle(s.w/2,(s.h-FLOOR_H/2),s.w,FLOOR_H,{
  isStatic:true,label:"ground",friction:0.9,restitution:0
 });
 floor.plugin={kind:"ground"};
 World.add(engine.world,floor);
}

function rebuildPhysicsFromStage(){
 if(!engine)return;
 World.clear(engine.world,false);
 rebuildFloor();

 if(!stage)return;

 stage.objects.forEach(o=>{
  const b=createBodyFromObject(o);
  if(b)World.add(engine.world,b);
 });
}

function objectMaterial(o){
 if(o.type==="wood"||o.type==="houseWood")return "wood";
 if(o.type==="glass"||o.type==="houseGlass")return "glass";
 if(o.type==="stone"||o.type==="houseStone")return "stone";
 if(o.type==="bedrock"||o.type==="houseBedrock")return "bedrock";
 return null;
}

function isHouse(o){
 return o.type.startsWith("house");
}

function objectStrength(o){
 if(o.maxHp!=null)return o.maxHp;
 if(o.type==="dog")return 3;
 if(o.type==="bigDog")return 6;
 if(o.type==="armorDog")return 3;
 if(o.type==="movingDog")return 3;
 const m=objectMaterial(o);
 if(m)return MATERIALS[m].max;
 if(o.type==="multiplier")return 7;
 return Infinity;
}

function createBodyFromObject(o){
 let b;

 if(isHouse(o)){
  const w=o.width||120;
  const h=o.height||100;
  const t=Math.max(10,Math.min(w,h)*0.18);
  const parts=[
   Bodies.rectangle(o.x,o.y-h/2+t/2,w,t),
   Bodies.rectangle(o.x,o.y+h/2-t/2,w,t),
   Bodies.rectangle(o.x-w/2+t/2,o.y,t,h-2*t),
   Bodies.rectangle(o.x+w/2-t/2,o.y,t,h-2*t)
  ];
  b=Body.create({
   parts,
   angle:o.angle||0,
   label:o.type,
   isStatic:o.type==="houseBedrock"
  });
 }else if(o.type==="bomb"){
  b=Bodies.circle(o.x,o.y,o.radius||13,{
   restitution:0.15,friction:0.7,label:"bomb"
  });
 }else if(o.type==="dog"||o.type==="bigDog"||o.type==="armorDog"||o.type==="movingDog"){
  const r=o.type==="bigDog"?24:15;
  b=Bodies.circle(o.x,o.y,r,{restitution:0.05,friction:0.9,label:o.type});
 }else if(o.type==="bombDropper"||o.type==="dogSpawner"){
  b=Bodies.rectangle(o.x,o.y,o.width||100,o.height||35,{
   isStatic:true,isSensor:false,label:o.type
  });
 }else{
  b=Bodies.rectangle(o.x,o.y,o.width||80,o.height||45,{
   angle:o.angle||0,
   isStatic:o.type==="bedrock",
   isSensor:o.type==="multiplier",
   label:o.type,
   friction:0.8,restitution:0.05
  });
 }

 b.plugin=b.plugin||{};
 b.plugin.objectId=o.id;
 b.plugin.kind=o.type;
 b.plugin.hp=o.hp!=null?o.hp:objectStrength(o);
 b.plugin.maxHp=objectStrength(o);
 b.plugin.blockedMultiplierId=o.blockedMultiplierId||null;
 b.plugin.bombDuration=o.bombDuration||manualBombTimer;
 b.plugin.createdAt=o.createdAt||performance.now();
 b.plugin.nextDropAt=o.nextDropAt||0;
 b.plugin.enabled=o.enabled!==false;
 b.plugin.dogDirection=o.dogDirection||1;
 b.plugin.lastWalkChange=performance.now()+500+Math.random()*2000;

 return b;
}

function findObject(id){
 return stage?.objects.find(o=>o.id===id);
}

function rootBody(body){
 return body.parent||body;
}

function bodyObject(body){
 const r=rootBody(body);
 return findObject(r.plugin?.objectId);
}

function addObject(type,x,y){
 if(mode!=="editor")return;

 let o={
  id:newId(),type,x,y,width:80,height:45,angle:0,
  hp:objectStrength({type}),
 };

 if(isHouse({type})){
  o.width=130;
  o.height=100;
  o.hp=objectStrength(o);
 }

 if(type==="bomb"){
  o.width=26;o.height=26;
  o.radius=13;
  o.bombDuration=manualBombTimer;
  o.createdAt=performance.now();
 }

 if(type==="multiplier"){
  o.factor=2;
 }

 if(type==="bombDropper"){
  o.width=105;o.height=34;
  o.interval=3;
  o.count=1;
  o.bombTimer=manualBombTimer;
  o.enabled=true;
 }

 if(type==="dogSpawner"){
  o.width=105;o.height=34;
  o.interval=4;
  o.count=1;
  o.dogType="dog";
  o.direction="down";
  o.enabled=true;
 }

 if(type==="dog"||type==="bigDog"||type==="armorDog"||type==="movingDog"){
  o.width=30;o.height=30;
  o.hp=objectStrength(o);
 }

 stage.objects.push(o);
 const b=createBodyFromObject(o);
 World.add(engine.world,b);
 selected=b;
}

function setTool(t){
 tool=t;
 editAction=null;
 document.querySelectorAll(".palette button").forEach(b=>b.classList.remove("selectedTool"));
 const map={
  select:"選択",wood:"木",glass:"ガラス",stone:"石",
  houseWood:"木の家",houseGlass:"ガラスの家",houseStone:"石の家",
  houseBedrock:"岩盤の家",multiplier:"倍ブロック",bedrock:"岩盤",
  bomb:"爆弾",dog:"犬",bigDog:"巨大犬",armorDog:"よろい犬",
  movingDog:"動く犬",bombDropper:"爆弾投下機",dogSpawner:"自動犬生成機"
 };
 [...document.querySelectorAll(".palette button")].find(b=>b.textContent===map[t])?.classList.add("selectedTool");
}

function setEditAction(a){
 if(tool!=="select")setTool("select");
 editAction=a;
 document.querySelectorAll(".actions button").forEach(b=>b.classList.remove("active"));
 const names={move:"移動",resize:"形変更",rotate:"回転"};
 const target=[...document.querySelectorAll(".actions button")].find(b=>b.textContent===names[a]);
 if(target)target.classList.add("active");
}

function setPlaySelect(){
 tool="select";
 editAction="inspect";
 document.getElementById("playInfo").textContent="ブロックを選択できます";
}

function getPointer(e){
 const c=getCanvas();
 const r=c.getBoundingClientRect();
 return {x:e.clientX-r.left,y:e.clientY-r.top};
}

function screenToWorld(p){
 const s=screenSize();
 return {
  x:s.w/2+(p.x-s.w/2)/zoomLevel,
  y:s.h+(p.y-s.h)/zoomLevel
 };
}

function worldToScreen(p){
 const s=screenSize();
 return {
  x:s.w/2+(p.x-s.w/2)*zoomLevel,
  y:s.h+(p.y-s.h)*zoomLevel
 };
}

function bodyAt(p){
 const w=screenToWorld(p);
 const bodies=Composite.allBodies(engine.world).filter(b=>b.label!=="ground");
 for(let i=bodies.length-1;i>=0;i--){
  const b=bodies[i];
  if(b.plugin?.kind==="bombDropper"||b.plugin?.kind==="dogSpawner"||b.plugin?.kind==="bomb"||b.plugin?.kind?.includes("Dog")||b.plugin?.kind==="dog"||b.plugin?.kind==="wood"||b.plugin?.kind==="glass"||b.plugin?.kind==="stone"||b.plugin?.kind==="bedrock"||b.plugin?.kind==="multiplier"||b.plugin?.kind?.startsWith("house")){
   if(Matter.Bounds.contains(b.bounds,w)){
    if(Matter.Vertices.contains(b.vertices,w))return rootBody(b);
   }
  }
 }
 return null;
}

function handlePointerDown(e){
 const p=getPointer(e);
 const w=screenToWorld(p);

 if(mode==="play"){
  const b=bodyAt(p);
  if(b){
   const o=bodyObject(b);

   if(o?.type==="bombDropper"||o?.type==="dogSpawner"){
    activeMachine=b;
    o.enabled=o.enabled===false;
    b.plugin.enabled=o.enabled;
    showSelection(b);
    return;
   }

   if(tool==="select"){
    selected=b;
    showSelection(b);
    return;
   }

   return;
  }

  if(tool==="select")return;

  if(tool==="bomb"){
   addObject("bomb",w.x,w.y);
   return;
  }

  return;
 }

 if(tool!=="select"){
  addObject(tool,w.x,w.y);
  return;
 }

 const b=bodyAt(p);

 if(editAction==="rotate"&&selected){
  if(rotationHandleHit(selected,w)){
   pointerState={type:"rotate",body:selected};
   return;
  }
 }

 if(editAction==="resize"&&selected){
  const h=resizeHandleHit(selected,w);
  if(h){
   pointerState={type:"resize",body:selected,corner:h};
   return;
  }
 }

 if(b){
  selected=b;
  showSelection(b);

  if(editAction==="move"){
   pointerState={
    type:"move",body:b,
    dx:b.position.x-w.x,
    dy:b.position.y-w.y
   };
  }
 }else{
  selected=null;
 }
}

function handlePointerMove(e){
 if(!pointerState)return;
 const p=getPointer(e);
 const w=screenToWorld(p);
 const b=pointerState.body;
 const o=bodyObject(b);
 if(!o)return;

 if(pointerState.type==="move"){
  Body.setPosition(b,{
   x:w.x+pointerState.dx,
   y:w.y+pointerState.dy
  });
  o.x=b.position.x;o.y=b.position.y;
 }

 if(pointerState.type==="rotate"){
  const a=Math.atan2(w.y-b.position.y,w.x-b.position.x)+Math.PI/2;
  Body.setAngle(b,a);
  o.angle=a;
 }

 if(pointerState.type==="resize"){
  resizeBodyFromCenter(b,o,w);
 }
}

function handlePointerUp(){
 pointerState=null;
}

function rotationHandleHit(b,w){
 const end=rotateHandlePosition(b);
 return Math.hypot(end.x-w.x,end.y-w.y)<18/zoomLevel;
}

function rotateHandlePosition(b){
 const len=Math.max(35,(b.bounds.max.y-b.bounds.min.y)*0.5);
 return Vector.add(b.position,Vector.rotate({x:0,y:-len},b.angle));
}

function resizeHandleHit(b,w){
 const o=bodyObject(b);
 if(!o||o.type==="bombDropper"||o.type==="dogSpawner")return null;

 const hw=(o.width||80)/2;
 const hh=(o.height||45)/2;
 const local=Vector.rotate(
  {x:w.x-b.position.x,y:w.y-b.position.y},
  -(b.angle||0)
 );

 const corners=[
  {x:hw,y:hh,n:"br"},
  {x:-hw,y:hh,n:"bl"},
  {x:hw,y:-hh,n:"tr"},
  {x:-hw,y:-hh,n:"tl"}
 ];

 let best=null,dist=Infinity;
 corners.forEach(c=>{
  const d=Math.hypot(c.x-local.x,c.y-local.y);
  if(d<dist){dist=d;best=c.n}
 });
 return dist<20/zoomLevel?best:null;
}

function resizeBodyFromCenter(b,o,w){
 const local=Vector.rotate(
  {x:w.x-b.position.x,y:w.y-b.position.y},
  -(b.angle||0)
 );

 const nw=Math.max(MIN_SIZE,Math.abs(local.x)*2);
 const nh=Math.max(MIN_SIZE,Math.abs(local.y)*2);

 const ow=o.width||80;
 const oh=o.height||45;

 const sx=nw/ow;
 const sy=nh/oh;

 Body.scale(b,sx,sy);
 Body.setVelocity(b,{x:0,y:0});
 Body.setAngularVelocity(b,0);

 o.width=nw;
 o.height=nh;
}

function handleCollision(e){
 if(mode!=="play"&&mode!=="editor")return;

 e.pairs.forEach(pair=>{
  const a=rootBody(pair.bodyA);
  const b=rootBody(pair.bodyB);

  if(a.plugin?.kind==="bomb"&&b.plugin?.kind==="multiplier"){
   tryMultiply(a,b);
  }else if(b.plugin?.kind==="bomb"&&a.plugin?.kind==="multiplier"){
   tryMultiply(b,a);
  }
 });
}

function tryMultiply(bomb,mult){
 if(bomb.plugin?.blockedMultiplierId===mult.plugin?.objectId)return;

 const mo=bodyObject(mult);
 if(!mo)return;

 const factor=Math.max(2,Math.min(20,parseInt(mo.factor)||2));
 const sourceId=mo.id;

 bomb.plugin.blockedMultiplierId=sourceId;

 const bo=bodyObject(bomb);
 if(bo)bo.blockedMultiplierId=sourceId;

 for(let i=1;i<factor;i++){
  const child={
   id:newId(),
   type:"bomb",
   x:bomb.position.x,
   y:bomb.position.y,
   width:26,
   height:26,
   radius:13,
   angle:bomb.angle,
   bombDuration:remainingBombTime(bomb),
   createdAt:performance.now(),
   blockedMultiplierId:sourceId,
   manualBomb:false
  };

  stage.objects.push(child);
  const cb=createBodyFromObject(child);
  cb.plugin.blockedMultiplierId=sourceId;
  World.add(engine.world,cb);
 }
}

function remainingBombTime(b){
 const dur=(b.plugin?.bombDuration||manualBombTimer)*1000;
 const elapsed=performance.now()-(b.plugin?.createdAt||performance.now());
 return Math.max(.2,(dur-elapsed)/1000);
}

function explodeBomb(b,manual=false){
 if(!b||!b.world)return;

 const o=bodyObject(b);
 const x=b.position.x;
 const y=b.position.y;

 explosions.push({
  x,y,r:10,max:100,start:performance.now(),duration:450
 });

 const force=manual?0.055:0.045;

 Composite.allBodies(engine.world).forEach(target=>{
  if(target===b||target.label==="ground")return;

  const dx=target.position.x-x;
  const dy=target.position.y-y;
  const d=Math.hypot(dx,dy);

  if(d>170||d<1)return;

  const strength=(1-d/170)*force;
  Body.applyForce(target,target.position,{
   x:(dx/d)*strength,
   y:(dy/d)*strength-0.008
  });

  if(mode==="play"){
   damageBody(target,1);
  }
 });

 if(o?.type==="bomb"){
  stage.objects=stage.objects.filter(x=>x.id!==o.id);
 }

 World.remove(engine.world,b);
}

function damageBody(b,amount){
 const o=bodyObject(b);
 if(!o)return;

 if(o.type==="bedrock"||o.type==="houseBedrock")return;

 let defense=1;

 if(o.type==="armorDog")defense=2;

 const actual=amount/defense;

 b.plugin.hp-=actual;
 o.hp=b.plugin.hp;

 if(b.plugin.hp<=0){
  stage.objects=stage.objects.filter(x=>x.id!==o.id);
  World.remove(engine.world,b);

  if(selected===b){
   selected=null;
   document.getElementById("selectionInfo").classList.add("hidden");
  }
 }
}

function spawnBomb(x,y,timer,blockedId=null){
 const o={
  id:newId(),type:"bomb",x,y,width:26,height:26,
  radius:13,angle:0,bombDuration:timer||manualBombTimer,
  createdAt:performance.now(),blockedMultiplierId:blockedId,
  manualBomb:false
 };

 stage.objects.push(o);
 const b=createBodyFromObject(o);
 World.add(engine.world,b);
 return b;
}

function machineSpawnPoint(o){
 if(o.type==="bombDropper"){
  return {x:o.x,y:o.y+(o.height||34)/2+22};
 }

 const hw=(o.width||105)/2;
 const hh=(o.height||34)/2;

 if(o.direction==="left")return {x:o.x-hw-25,y:o.y};
 if(o.direction==="right")return {x:o.x+hw+25,y:o.y};
 if(o.direction==="up")return {x:o.x,y:o.y-hh-25};
 return {x:o.x,y:o.y+hh+25};
}

function spawnDog(o){
 const p=machineSpawnPoint(o);

 const dog={
  id:newId(),
  type:o.dogType||"dog",
  x:p.x,y:p.y,width:o.dogType==="bigDog"?48:30,height:o.dogType==="bigDog"?48:30,
  angle:0,
  hp:objectStrength({type:o.dogType||"dog"})
 };

 stage.objects.push(dog);
 const b=createBodyFromObject(dog);

 if(o.direction==="left")Body.setVelocity(b,{x:-3,y:0});
 if(o.direction==="right")Body.setVelocity(b,{x:3,y:0});
 if(o.direction==="up")Body.setVelocity(b,{x:0,y:-3});
 if(o.direction==="down")Body.setVelocity(b,{x:0,y:3});

 if(dog.type==="movingDog"){
  b.plugin.walking=true;
  b.plugin.lastWalkChange=performance.now();
  b.plugin.dogDirection=Math.random()<.5?-1:1;
 }

 World.add(engine.world,b);
 return b;
}

function updateMachines(now){
 if(!stage||!engine)return;

 stage.objects.forEach(o=>{
  if(o.type!=="bombDropper"&&o.type!=="dogSpawner")return;
  if(o.enabled===false)return;

  let next=nextMachineTimes.get(o.id);
  if(next==null){
   next=now+(o.interval||3)*1000;
   nextMachineTimes.set(o.id,next);
   return;
  }

  if(now>=next){
   const count=Math.max(1,Math.min(30,o.count||1));

   if(o.type==="bombDropper"){
    const p=machineSpawnPoint(o);
    for(let i=0;i<count;i++){
     spawnBomb(p.x+(i-(count-1)/2)*18,p.y,o.bombTimer||manualBombTimer);
    }
    generatedVisuals.push({
     type:"bomb",x:p.x,y:p.y,start:now,duration:300
    });
   }

   if(o.type==="dogSpawner"){
    for(let i=0;i<count;i++){
     const p=machineSpawnPoint(o);
     spawnDog(o);
    }
    generatedVisuals.push({
     type:"dog",x:o.x,y:o.y,start:now,duration:300
    });
   }

   nextMachineTimes.set(o.id,now+(o.interval||3)*1000);
  }
 });
}

function updateBombTimers(now){
 if(!engine)return;

 Composite.allBodies(engine.world).forEach(b=>{
  if(b.plugin?.kind!=="bomb")return;

  const duration=(b.plugin.bombDuration||manualBombTimer)*1000;
  const elapsed=now-(b.plugin.createdAt||now);

  if(elapsed>=duration){
   explodeBomb(b);
  }
 });
}

function updateMovingDogs(now){
 if(mode!=="play"||!engine)return;

 const s=screenSize();

 Composite.allBodies(engine.world).forEach(b=>{
  if(b.plugin?.kind!=="movingDog")return;

  if(now>(b.plugin.lastWalkChange||0)){
   b.plugin.dogDirection=Math.random()<.5?-1:1;
   b.plugin.lastWalkChange=now+800+Math.random()*2500;
  }

  const vx=b.plugin.dogDirection*1.1;
  Body.setVelocity(b,{x:vx,y:b.velocity.y});

  const r=15;
  const left=r;
  const right=s.w-r;

  if(b.position.x<left)Body.setPosition(b,{x:left,y:b.position.y});
  if(b.position.x>right)Body.setPosition(b,{x:right,y:b.position.y});
 });
}

function updateExplosions(now){
 explosions=explosions.filter(x=>now-x.start<x.duration);
 generatedVisuals=generatedVisuals.filter(x=>now-x.start<x.duration);
}

function draw(){
 const c=getCanvas();
 if(!c||!engine)return;

 const ctx=c.getContext("2d");
 const dpr=Math.min(devicePixelRatio||1,2);
 const s=screenSize();

 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,s.w,s.h);

 ctx.save();
 ctx.translate(s.w/2,s.h);
 ctx.scale(zoomLevel,zoomLevel);
 ctx.translate(-s.w/2,-s.h);

 drawWorld(ctx,s);
 ctx.restore();

 drawEffects(ctx);
}

function drawWorld(ctx,s){
 const bodies=Composite.allBodies(engine.world);

 bodies.forEach(b=>{
  if(b.label==="ground")return;
  drawBody(ctx,b);
 });

 ctx.fillStyle="#5b4636";
 ctx.fillRect(0,s.h-FLOOR_H,s.w,FLOOR_H);

 ctx.fillStyle="#80634a";
 for(let x=0;x<s.w;x+=40){
  ctx.fillRect(x,s.h-FLOOR_H+6,25,5);
 }
}

function drawBody(ctx,b){
 const o=bodyObject(b);
 if(!o)return;

 ctx.save();
 ctx.translate(b.position.x,b.position.y);
 ctx.rotate(b.angle||0);

 const w=o.width||80;
 const h=o.height||45;

 if(isHouse(o)){
  const mat=objectMaterial(o);
  const m=MATERIALS[mat];
  ctx.fillStyle=m.color;
  ctx.globalAlpha=mat==="glass"?.55:1;

  const t=Math.max(10,Math.min(w,h)*.18);
  ctx.fillRect(-w/2,-h/2,w,t);
  ctx.fillRect(-w/2,h/2-t,w,t);
  ctx.fillRect(-w/2,-h/2,t,h);
  ctx.fillRect(w/2-t,-h/2,t,h);

  ctx.globalAlpha=1;
  ctx.strokeStyle="#222";
  ctx.lineWidth=2;
  ctx.strokeRect(-w/2,-h/2,w,h);
 }else if(o.type==="wood"){
  ctx.fillStyle=MATERIALS.wood.color;
  ctx.fillRect(-w/2,-h/2,w,h);
  ctx.strokeStyle="#6b3c1c";
  ctx.strokeRect(-w/2,-h/2,w,h);
 }else if(o.type==="glass"){
  ctx.fillStyle=MATERIALS.glass.color;
  ctx.globalAlpha=.55;
  ctx.fillRect(-w/2,-h/2,w,h);
  ctx.globalAlpha=1;
  ctx.strokeStyle="#5bb8df";
  ctx.lineWidth=2;
  ctx.strokeRect(-w/2,-h/2,w,h);
 }else if(o.type==="stone"){
  ctx.fillStyle=MATERIALS.stone.color;
  ctx.fillRect(-w/2,-h/2,w,h);
  ctx.strokeStyle="#555";
  ctx.strokeRect(-w/2,-h/2,w,h);
 }else if(o.type==="bedrock"){
  ctx.fillStyle=MATERIALS.bedrock.color;
  ctx.fillRect(-w/2,-h/2,w,h);
  ctx.strokeStyle="#111";
  ctx.strokeRect(-w/2,-h/2,w,h);
 }else if(o.type==="multiplier"){
  ctx.fillStyle="#d58cff";
  ctx.fillRect(-w/2,-h/2,w,h);
  ctx.fillStyle="#fff";
  ctx.font="bold 24px sans-serif";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText("×"+(o.factor||2),0,0);
 }else if(o.type==="bomb"){
  ctx.fillStyle="#252525";
  ctx.beginPath();
  ctx.arc(0,0,13,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#111";
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.strokeStyle="#c8752d";
  ctx.beginPath();
  ctx.moveTo(7,-10);
  ctx.quadraticCurveTo(15,-20,10,-25);
  ctx.stroke();
 }else if(o.type==="dog"||o.type==="bigDog"||o.type==="armorDog"||o.type==="movingDog"){
  const r=o.type==="bigDog"?24:15;
  ctx.fillStyle=o.type==="armorDog"?"#7b8189":"#d69b62";
  ctx.beginPath();
  ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#222";
  ctx.beginPath();
  ctx.arc(-r*.35,-r*.1,2.5,0,Math.PI*2);
  ctx.arc(r*.35,-r*.1,2.5,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#f4c4a0";
  ctx.beginPath();
  ctx.arc(0,r*.25,r*.35,0,Math.PI*2);
  ctx.fill();

  if(o.type==="armorDog"){
   ctx.strokeStyle="#454b54";
   ctx.lineWidth=4;
   ctx.stroke();
  }
 }else if(o.type==="bombDropper"){
  ctx.fillStyle="#4b667d";
  ctx.fillRect(-w/2,-h/2,w,h);
  ctx.fillStyle=o.enabled===false?"#d33":"#4cce67";
  ctx.beginPath();
  ctx.arc(w/2-12,-h/2+10,5,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#fff";
  ctx.font="bold 12px sans-serif";
  ctx.textAlign="center";
  ctx.fillText(o.enabled===false?"OFF":"ON",0,4);
 }else if(o.type==="dogSpawner"){
  ctx.fillStyle="#70578d";
  ctx.fillRect(-w/2,-h/2,w,h);
  ctx.fillStyle=o.enabled===false?"#d33":"#4cce67";
  ctx.beginPath();
  ctx.arc(w/2-12,-h/2+10,5,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#fff";
  ctx.font="bold 11px sans-serif";
  ctx.textAlign="center";
  ctx.fillText(o.enabled===false?"OFF":"犬生成",0,4);
 }

 ctx.restore();

 if(selected===b&&mode==="editor"){
  drawSelection(ctx,b);
 }
 if(selected===b&&mode==="play"){
  drawPlaySelection(ctx,b);
 }
}

function drawSelection(ctx,b){
 const o=bodyObject(b);
 if(!o)return;

 ctx.save();
 ctx.translate(b.position.x,b.position.y);
 ctx.rotate(b.angle||0);

 const w=o.width||60;
 const h=o.height||40;

 ctx.strokeStyle="#f80";
 ctx.lineWidth=3/zoomLevel;
 ctx.strokeRect(-w/2-4,-h/2-4,w+8,h+8);

 if(editAction==="resize"){
  ctx.fillStyle="#fff";
  ctx.strokeStyle="#f80";
  ctx.lineWidth=2/zoomLevel;
  [[-w/2,-h/2],[w/2,-h/2],[-w/2,h/2],[w/2,h/2]].forEach(p=>{
   ctx.beginPath();
   ctx.rect(p[0]-6/zoomLevel,p[1]-6/zoomLevel,12/zoomLevel,12/zoomLevel);
   ctx.fill();
   ctx.stroke();
  });
 }

 if(editAction==="rotate"){
  const len=Math.max(35,h*.5);
  ctx.strokeStyle="#f80";
  ctx.lineWidth=3/zoomLevel;
  ctx.beginPath();
  ctx.moveTo(0,-h/2);
  ctx.lineTo(0,-h/2-len);
  ctx.stroke();

  ctx.fillStyle="#fff";
  ctx.strokeStyle="#f80";
  ctx.beginPath();
  ctx.arc(0,-h/2-len,8/zoomLevel,0,Math.PI*2);
  ctx.fill();
  ctx.stroke();
 }

 ctx.restore();
}

function drawPlaySelection(ctx,b){
 const o=bodyObject(b);
 if(!o)return;

 ctx.save();
 ctx.translate(b.position.x,b.position.y);
 ctx.rotate(b.angle||0);

 const w=o.width||30;
 const h=o.height||30;

 ctx.strokeStyle="#f80";
 ctx.lineWidth=3/zoomLevel;
 ctx.strokeRect(-w/2-4,-h/2-4,w+8,h+8);

 ctx.restore();
}

function drawEffects(ctx){
 const now=performance.now();

 explosions.forEach(e=>{
  const p=worldToScreen({x:e.x,y:e.y});
  const q=(now-e.start)/e.duration;
  const r=(e.max||100)*q;

  ctx.save();
  ctx.globalAlpha=1-q;
  const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
  g.addColorStop(0,"#fff");
  g.addColorStop(.25,"#ffdc66");
  g.addColorStop(1,"transparent");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(p.x,p.y,r,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
 });

 generatedVisuals.forEach(v=>{
  const p=worldToScreen({x:v.x,y:v.y});
  const q=(now-v.start)/v.duration;

  ctx.save();
  ctx.globalAlpha=1-q;
  ctx.fillStyle=v.type==="bomb"?"#222":"#70578d";
  ctx.beginPath();
  ctx.arc(p.x,p.y+q*35,8,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
 });
}

function updateInfo(){
 if(mode!=="play")return;
 const bombs=Composite.allBodies(engine.world).filter(b=>b.plugin?.kind==="bomb").length;
 document.getElementById("playInfo").textContent=`爆弾 ${bombs}個`;
}

function loop(now){
 const dt=Math.min(33,now-lastTime);
 lastTime=now;

 if(engine){
  updateBombTimers(now);
  updateMachines(now);
  updateMovingDogs(now);
  updateExplosions(now);

  Matter.Engine.update(engine,dt);
  draw();
  updateInfo();
 }

 requestAnimationFrame(loop);
}

canvas.addEventListener("pointerdown",e=>{
 canvas.setPointerCapture?.(e.pointerId);
 handlePointerDown(e);
});
canvas.addEventListener("pointermove",handlePointerMove);
canvas.addEventListener("pointerup",handlePointerUp);
canvas.addEventListener("pointercancel",handlePointerUp);

playCanvas.addEventListener("pointerdown",e=>{
 playCanvas.setPointerCapture?.(e.pointerId);
 handlePointerDown(e);
});
playCanvas.addEventListener("pointermove",handlePointerMove);
playCanvas.addEventListener("pointerup",handlePointerUp);
playCanvas.addEventListener("pointercancel",handlePointerUp);

window.addEventListener("resize",resizeCanvas);

function setupCanvasSwitch(){
 canvas.style.display=mode==="editor"?"block":"none";
 playCanvas.style.display=mode==="play"?"block":"none";
}

const originalShowScreen=showScreen;
showScreen=function(id){
 originalShowScreen(id);
 setupCanvasSwitch();
 setTimeout(resizeCanvas,30);
};

const originalResetEngine=resetEngine;
resetEngine=function(){
 originalResetEngine();
 setupCanvasSwitch();
};

document.addEventListener("click",e=>{
 if(!e.target.closest(".modalBox")&&e.target.id==="modal"){
  closeModal();
 }
});

function boot(){
 canvas.style.display="block";
 playCanvas.style.display="none";
 createEngine();
 stage=blankStage("ステージ "+stageCounter);
 mode="editor";
 setTool("select");
 resizeCanvas();
 requestAnimationFrame(loop);
}

boot();
</script>
</body>
