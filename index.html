<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>スライム城くずし ステージメーカー</title>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,"Noto Sans JP",sans-serif;
 background:#eaf5ff;
}
button,input{
 font:inherit;
}
button{
 border:0;
 cursor:pointer;
}
.screen{
 position:fixed;
 inset:0;
 display:none;
}
.screen.active{
 display:block;
}

/* ===== スタート ===== */
#startScreen{
 background:linear-gradient(#fff,#e7f4ff);
 align-items:center;
 justify-content:center;
 flex-direction:column;
}
#startScreen.active{
 display:flex;
}
.logo{
 font-size:clamp(30px,7vw,52px);
 font-weight:900;
 text-align:center;
 margin-bottom:40px;
}
.startButtons{
 width:min(430px,88vw);
 display:flex;
 flex-direction:column;
 gap:18px;
}
.startButtons button{
 height:72px;
 border-radius:18px;
 color:#fff;
 font-size:24px;
 font-weight:900;
 box-shadow:0 6px 0 rgba(0,0,0,.2);
}
.startButtons button:active{
 transform:translateY(4px);
 box-shadow:0 2px 0 rgba(0,0,0,.2);
}
.make{
 background:#f80;
}
.play{
 background:#168cff;
}

/* ===== ステージ選択 ===== */
#selectScreen{
 background:#edf3f8;
 flex-direction:column;
}
#selectScreen.active{
 display:flex;
}
.header{
 height:60px;
 min-height:60px;
 background:#222;
 color:#fff;
 display:flex;
 align-items:center;
 gap:10px;
 padding:7px;
}
.header h1{
 margin:0;
 flex:1;
 font-size:21px;
}
.header button{
 background:#fff;
 border-radius:9px;
 padding:9px 14px;
 font-weight:bold;
}
.stageList{
 flex:1;
 overflow:auto;
 padding:16px;
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
 gap:14px;
}
.stageCard{
 background:#fff;
 border-radius:15px;
 padding:14px;
 box-shadow:0 3px 12px rgba(0,0,0,.13);
 min-height:145px;
 display:flex;
 flex-direction:column;
 gap:7px;
}
.stageCard strong{
 font-size:20px;
 flex:1;
}
.stageCard button{
 border-radius:8px;
 padding:9px;
 background:#168cff;
 color:#fff;
 font-weight:bold;
}
.stageCard .del{
 background:#e33;
}
.empty{
 grid-column:1/-1;
 text-align:center;
 padding:50px;
 color:#777;
}

/* ===== ゲーム ===== */
.gameCanvas{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 display:block;
 touch-action:none;
 z-index:1;
}
.gameUI{
 position:absolute;
 inset:0;
 z-index:100;
 pointer-events:none;
}
.gameUI button,
.gameUI input,
.gameUI .toolbar,
.gameUI .property{
 pointer-events:auto;
}
.topbar{
 position:absolute;
 left:0;
 right:0;
 top:0;
 min-height:57px;
 display:flex;
 align-items:center;
 gap:6px;
 padding:6px;
 background:rgba(25,25,25,.96);
 overflow-x:auto;
 z-index:150;
}
.topbar button{
 flex-shrink:0;
 background:#fff;
 color:#222;
 border-radius:9px;
 padding:9px 12px;
 font-weight:900;
}
.topbar .orange{
 background:#f80;
 color:#fff;
}
.topbar .red{
 background:#e33;
 color:#fff;
}
.topbar input{
 width:180px;
 flex-shrink:0;
 border:0;
 border-radius:8px;
 padding:9px;
}
.toolbar{
 position:absolute;
 top:57px;
 left:0;
 right:0;
 display:flex;
 gap:6px;
 padding:6px;
 background:rgba(35,35,35,.96);
 overflow-x:auto;
 z-index:150;
}
.tool{
 width:66px;
 min-width:66px;
 height:52px;
 border-radius:10px;
 background:#fff;
 color:#222;
 font-size:11px;
 font-weight:900;
}
.tool.selected{
 outline:4px solid #f80;
}
.toolIcon{
 display:block;
 font-size:21px;
 height:27px;
 line-height:27px;
}
.help{
 position:absolute;
 bottom:10px;
 left:10px;
 z-index:120;
 color:#fff;
 background:rgba(0,0,0,.7);
 border-radius:8px;
 padding:7px 10px;
 font-size:12px;
 pointer-events:none;
}
.message{
 position:absolute;
 left:50%;
 bottom:16px;
 transform:translateX(-50%);
 background:rgba(0,0,0,.84);
 color:#fff;
 border-radius:12px;
 padding:9px 16px;
 z-index:500;
 opacity:0;
 transition:.15s;
 pointer-events:none;
 white-space:nowrap;
}
.message.show{
 opacity:1;
}

/* ===== 設定 ===== */
.property{
 position:absolute;
 right:10px;
 top:125px;
 width:245px;
 background:#fff;
 border-radius:15px;
 box-shadow:0 5px 25px rgba(0,0,0,.3);
 padding:13px;
 display:none;
 z-index:400;
}
.property.show{
 display:block;
}
.property h3{
 margin:0 0 10px;
}
.propertyRow{
 display:flex;
 gap:7px;
 align-items:center;
 margin:7px 0;
}
.propertyRow label{
 width:45px;
 font-weight:bold;
 font-size:13px;
}
.propertyRow input{
 width:100%;
 min-width:0;
 padding:6px;
 border:1px solid #bbb;
 border-radius:7px;
}
.propertyButtons{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:6px;
}
.propertyButtons button{
 padding:8px;
 border-radius:8px;
 background:#168cff;
 color:#fff;
 font-weight:bold;
}
</style>
</head>

<body>

<section id="startScreen" class="screen active">
 <div class="logo">
  スライム城くずし<br>
  ステージメーカー
 </div>

 <div class="startButtons">
  <button class="make" id="makeBtn">ステージを作る</button>
  <button class="play" id="playBtn">ステージで遊ぶ</button>
 </div>
</section>

<section id="selectScreen" class="screen">
 <div class="header">
  <button id="selectBack">← 戻る</button>
  <h1>ステージを選択</h1>
 </div>

 <div id="stageList" class="stageList"></div>
</section>

<section id="editorScreen" class="screen">

 <canvas id="editorCanvas" class="gameCanvas"></canvas>

 <div class="gameUI">

  <div class="topbar">
   <button id="editorBack">← 戻る</button>

   <input
    id="stageName"
    placeholder="ステージ名"
   >

   <button
    class="orange"
    id="saveBtn"
   >
    保存
   </button>

   <button id="testBtn">
    ▶ 遊ぶ
   </button>

   <button
    class="red"
    id="clearBtn"
   >
    全消去
   </button>
  </div>

  <div class="toolbar">

   <button class="tool selected" data-tool="wood">
    <span class="toolIcon">🪵</span>
    木
   </button>

   <button class="tool" data-tool="glass">
    <span class="toolIcon">▱</span>
    ガラス
   </button>

   <button class="tool" data-tool="stone">
    <span class="toolIcon">⬛</span>
    石
   </button>

   <button class="tool" data-tool="enemy">
    <span class="toolIcon">🟢</span>
    敵
   </button>

   <button class="tool" data-tool="bomb">
    <span class="toolIcon">💣</span>
    爆弾
   </button>

   <button class="tool" data-tool="multiply">
    <span class="toolIcon">×2</span>
    増殖
   </button>

   <button class="tool" data-tool="bedrock">
    <span class="toolIcon">▰</span>
    岩盤
   </button>

   <button class="tool" data-tool="erase">
    <span class="toolIcon">⌫</span>
    消す
   </button>

   <button class="tool" data-tool="move">
    <span class="toolIcon">✋</span>
    移動
   </button>

   <button class="tool" data-tool="rotate">
    <span class="toolIcon">↻</span>
    回転
   </button>

   <button class="tool" data-tool="shape">
    <span class="toolIcon">⌗</span>
    形変更
   </button>

  </div>

  <div
   class="property"
   id="property"
  >

   <h3>ブロック設定</h3>

   <div class="propertyRow">
    <label>幅</label>
    <input id="propW" type="number">
   </div>

   <div class="propertyRow">
    <label>高さ</label>
    <input id="propH" type="number">
   </div>

   <div class="propertyButtons">
    <button id="rotateMinus">↶ 90°</button>
    <button id="rotatePlus">↷ 90°</button>
    <button id="thinBtn">細く</button>
    <button id="thickBtn">太く</button>
    <button id="applyBtn">適用</button>
    <button id="closeProp">閉じる</button>
   </div>

  </div>

 </div>

 <div class="help">
  配置：タップ　移動：ドラッグ　回転：中央の線をドラッグ　形変更：4つの角をドラッグ
 </div>

 <div
  id="editorMessage"
  class="message"
 ></div>

</section>

<section id="playScreen" class="screen">

 <canvas id="playCanvas" class="gameCanvas"></canvas>

 <div class="gameUI">

  <div class="topbar">

   <button id="playBack">
    ← 戻る
   </button>

   <span
    id="playName"
    style="color:white;font-weight:900;padding:0 5px"
   ></span>

   <button id="bombMode">
    💣 爆弾を置く
   </button>

   <button
    class="red"
    id="explodeBtn"
   >
    💥 全爆破
   </button>

   <button id="restartBtn">
    ↻ リセット
   </button>

  </div>

 </div>

 <div class="help">
  「爆弾を置く」を押してから画面をタップ
 </div>

 <div
  id="playMessage"
  class="message"
 ></div>

</section>

<script>
"use strict";

const {
 Engine,
 Runner,
 World,
 Bodies,
 Body,
 Composite,
 Events,
 Bounds,
 Vertices
}=Matter;

const STORAGE_KEY="slimeCastleMaker_v5";

const FLOOR_Y=1000;

const EXPLOSION_RADIUS=110;
const EXPLOSION_FORCE_RADIUS=160;
const EXPLOSION_FORCE=.045;
const EXPLOSION_DAMAGE=150;

const MATERIALS={
 wood:{
  density:.0035,
  friction:.4,
  restitution:.08,
  hp:2,
  threshold:16
 },
 glass:{
  density:.0028,
  friction:.15,
  restitution:.25,
  hp:1,
  threshold:10
 },
 stone:{
  density:.008,
  friction:.6,
  restitution:.02,
  hp:3,
  threshold:48
 }
};

let editorEngine=null;
let playEngine=null;

let editorRunner=null;
let playRunner=null;

let currentTool="wood";

let currentStageId=null;

let stageObjects=[];

let selectedBody=null;

let drag=null;

let editorCamera={
 x:0,
 y:620,
 zoom:.7
};

let playCamera={
 x:0,
 y:620,
 zoom:.7
};

let multiplyContacts=new Map();

let effects=[];

const editorCanvas=
 document.getElementById("editorCanvas");

const playCanvas=
 document.getElementById("playCanvas");

/* =================================
   共通
================================= */

function $(id){
 return document.getElementById(id);
}

function showScreen(id){

 document
  .querySelectorAll(".screen")
  .forEach(s=>{
   s.classList.remove("active");
  });

 $(id).classList.add("active");
}

function showMessage(text,isPlay=false){

 const el=
  isPlay
   ?$("playMessage")
   :$("editorMessage");

 el.textContent=text;

 el.classList.add("show");

 clearTimeout(el._timer);

 el._timer=setTimeout(()=>{
  el.classList.remove("show");
 },1600);
}

function newId(){

 return Date.now().toString(36)+
  Math.random()
   .toString(36)
   .slice(2);
}

function getStages(){

 try{

  const v=
   localStorage.getItem(STORAGE_KEY);

  if(v){
   return JSON.parse(v);
  }

  /*
   * 古いバージョンの保存データも読む。
   */
  for(
   const key of [
    "slimeCastleMaker_v4",
    "slimeCastleMaker_v3"
   ]
  ){

   const old=
    localStorage.getItem(key);

   if(old){
    return JSON.parse(old);
   }
  }

  return [];

 }catch(e){

  return [];
 }
}

function setStages(a){

 localStorage.setItem(
  STORAGE_KEY,
  JSON.stringify(a)
 );
}

/* =================================
   Canvas
================================= */

function resizeCanvas(canvas){

 const r=
  canvas.getBoundingClientRect();

 canvas.width=
  Math.max(1,Math.round(r.width));

 canvas.height=
  Math.max(1,Math.round(r.height));
}

function resizeAll(){

 resizeCanvas(editorCanvas);
 resizeCanvas(playCanvas);
}

window.addEventListener(
 "resize",
 resizeAll
);

function getPointer(canvas,e){

 const r=
  canvas.getBoundingClientRect();

 return {
  x:e.clientX-r.left,
  y:e.clientY-r.top
 };
}

function screenToWorld(
 canvas,
 x,
 y,
 camera
){

 return {
  x:
   (x-canvas.clientWidth/2)/
   camera.zoom+
   camera.x,

  y:
   (y-canvas.clientHeight/2)/
   camera.zoom+
   camera.y
 };
}

/* =================================
   Body
================================= */

function createFloor(){

 return Bodies.rectangle(
  0,
  FLOOR_Y+50,
  100000,
  100,
  {
   isStatic:true,
   label:"floor",
   plugin:{
    gameType:"floor"
   }
  }
 );
}

function createBlock(
 material,
 x,
 y,
 w,
 h,
 angle=0
){

 const m=MATERIALS[material];

 return Bodies.rectangle(
  x,
  y,
  w,
  h,
  {
   angle:angle*Math.PI/180,

   density:m.density,

   friction:m.friction,

   restitution:m.restitution,

   label:"block",

   plugin:{
    gameType:"block",
    material:material,
    width:w,
    height:h,
    hp:m.hp,
    maxHp:m.hp,
    threshold:m.threshold,
    id:newId()
   }
  }
 );
}

function createEnemy(x,y){

 return Bodies.circle(
  x,
  y,
  22,
  {
   density:.0018,
   friction:.4,
   restitution:.03,

   label:"enemy",

   plugin:{
    gameType:"enemy",
    alive:true,
    preVY:0,
    id:newId()
   }
  }
 );
}

function createBomb(x,y){

 return Bodies.circle(
  x,
  y,
  16,
  {
   isStatic:false,
   density:.002,
   friction:.4,
   restitution:.15,

   label:"bomb",

   plugin:{
    gameType:"bomb",
    id:newId()
   }
  }
 );
}

function createMultiply(
 x,
 y,
 w=75,
 h=45
){

 return Bodies.rectangle(
  x,
  y,
  w,
  h,
  {
   isStatic:true,

   /*
    * 爆弾を透過。
    */
   isSensor:true,

   label:"multiply",

   plugin:{
    gameType:"multiply",
    width:w,
    height:h,
    id:newId()
   }
  }
 );
}

function createBedrock(
 x,
 y,
 w=300,
 h=50
){

 return Bodies.rectangle(
  x,
  y,
  w,
  h,
  {
   isStatic:true,
   angle:0,

   label:"bedrock",

   plugin:{
    gameType:"bedrock",
    width:w,
    height:h,
    id:newId()
   }
  }
 );
}

function gameType(b){

 return b?.plugin?.gameType||
  b?.label;
}

/* =================================
   Engine
================================= */

function setupEngine(engine){

 Events.on(
  engine,
  "beforeUpdate",
  ()=>{
   Composite
    .allBodies(engine.world)
    .forEach(b=>{

     if(
      gameType(b)==="enemy"&&
      b.plugin.alive
     ){
      b.plugin.preVY=
       b.velocity.y;
     }

     if(
      gameType(b)==="bedrock"
     ){
      Body.setAngle(b,0);
     }
    });
  }
 );

 Events.on(
  engine,
  "collisionStart",
  e=>{
   e.pairs.forEach(
    handleCollision
   );
  }
 );

 Events.on(
  engine,
  "collisionActive",
  e=>{
   e.pairs.forEach(
    handleActiveCollision
   );
  }
 );

 Events.on(
  engine,
  "collisionEnd",
  e=>{
   e.pairs.forEach(
    handleEndCollision
   );
  }
 );
}

/* =================================
   Collision
================================= */

function handleCollision(pair){

 const a=pair.bodyA;
 const b=pair.bodyB;

 const ta=gameType(a);
 const tb=gameType(b);

 /* ×2 */
 if(
  ta==="bomb"&&
  tb==="multiply"
 ){

  multiplyBomb(b,a);
  return;
 }

 if(
  tb==="bomb"&&
  ta==="multiply"
 ){

  multiplyBomb(a,b);
  return;
 }

 /* 敵 */
 let enemyBody=null;
 let other=null;

 if(ta==="enemy"){
  enemyBody=a;
  other=b;
 }

 if(tb==="enemy"){
  enemyBody=b;
  other=a;
 }

 if(
  enemyBody&&
  enemyBody.plugin.alive
 ){

  const ot=gameType(other);

  if(
   (ot==="floor"||
    ot==="bedrock")&&
   enemyBody.plugin.preVY>=10
  ){

   killEnemy(enemyBody);
   return;
  }

  if(
   ot==="block"||
   ot==="bedrock"
  ){

   crushEnemy(
    enemyBody,
    other,
    pair
   );
  }
 }

 /* ブロック同士 */
 if(
  ta==="block"&&
  tb==="block"
 ){

  const speed=
   Math.abs(
    a.velocity.y-
    b.velocity.y
   )+
   Math.abs(
    a.velocity.x-
    b.velocity.x
   );

  if(speed>1){

   damageBlock(
    a,
    speed*3
   );

   damageBlock(
    b,
    speed*3
   );
  }
 }

 /* 爆弾 */
 if(
  ta==="bomb"||
  tb==="bomb"
 ){

  const bombBody=
   ta==="bomb"?a:b;

  const otherBody=
   bombBody===a?b:a;

  if(
   gameType(otherBody)==="block"
  ){

   damageBlock(
    otherBody,
    30
   );
  }
 }
}

function handleActiveCollision(pair){

 const a=pair.bodyA;
 const b=pair.bodyB;

 let enemyBody=null;
 let other=null;

 if(gameType(a)==="enemy"){
  enemyBody=a;
  other=b;
 }

 if(gameType(b)==="enemy"){
  enemyBody=b;
  other=a;
 }

 if(
  !enemyBody||
  !enemyBody.plugin.alive
 ){
  return;
 }

 if(
  gameType(other)==="block"||
  gameType(other)==="bedrock"
 ){

  crushEnemy(
   enemyBody,
   other,
   pair
  );
 }
}

function handleEndCollision(pair){

 const a=pair.bodyA;
 const b=pair.bodyB;

 if(
  gameType(a)==="bomb"&&
  gameType(b)==="multiply"
 ){

  removeMultiplyContact(
   b,
   a
  );
 }

 if(
  gameType(b)==="bomb"&&
  gameType(a)==="multiply"
 ){

  removeMultiplyContact(
   a,
   b
  );
 }
}

function removeMultiplyContact(
 multi,
 bombBody
){

 const id=multi.plugin.id;

 if(
  multiplyContacts.has(id)
 ){

  multiplyContacts
   .get(id)
   .delete(
    bombBody.plugin.id
   );
 }
}

/* =================================
   ×2
================================= */

function multiplyBomb(
 multi,
 bombBody
){

 const id=multi.plugin.id;

 if(
  !multiplyContacts.has(id)
 ){

  multiplyContacts.set(
   id,
   new Set()
  );
 }

 const contacts=
  multiplyContacts.get(id);

 /*
  * 同じ爆弾が触れている間は
  * 何度も増殖しない。
  */
 if(
  contacts.has(
   bombBody.plugin.id
  )
 ){
  return;
 }

 contacts.add(
  bombBody.plugin.id
 );

 const engine=
  $("editorScreen")
   .classList
   .contains("active")
   ?editorEngine
   :playEngine;

 if(!engine)return;

 /*
  * 必ず×2の下側。
  */
 const x=
  multi.position.x+
  (Math.random()-.5)*40;

 const y=
  multi.position.y+
  multi.plugin.height/2+
  42;

 const duplicate=
  createBomb(x,y);

 World.add(
  engine.world,
  duplicate
 );

 Body.setVelocity(
  duplicate,
  {
   x:(Math.random()-.5)*1.5,
   y:1
  }
 );

 if(
  engine===editorEngine
 ){
  stageObjects.push(
   duplicate
  );
 }
}

/* =================================
   Damage
================================= */

function damageBlock(
 b,
 damage
){

 if(
  !b||
  gameType(b)!=="block"
 ){
  return;
 }

 const p=b.plugin;

 if(
  damage<p.threshold
 ){
  return;
 }

 p.hp--;

 if(p.hp<=0){

  const engine=
   $("editorScreen")
    .classList
    .contains("active")
    ?editorEngine
    :playEngine;

  World.remove(
   engine.world,
   b
  );

  const i=
   stageObjects.indexOf(b);

  if(i>=0){
   stageObjects.splice(i,1);
  }

  if(
   selectedBody===b
  ){
   selectedBody=null;
  }
 }
}

/* =================================
   Enemy
================================= */

function crushEnemy(
 enemyBody,
 other,
 pair
){

 if(
  !enemyBody.plugin.alive
 ){
  return;
 }

 const above=
  other.position.y<
  enemyBody.position.y;

 const depth=
  pair.collision?.depth||0;

 const relative=
  Math.abs(
   enemyBody.plugin.preVY-
   (other.velocity?.y||0)
  );

 if(
  above&&
  depth>5
 ){

  killEnemy(enemyBody);
  return;
 }

 if(
  above&&
  relative>9
 ){

  killEnemy(enemyBody);
 }
}

function killEnemy(b){

 if(
  !b||
  !b.plugin.alive
 ){
  return;
 }

 b.plugin.alive=false;

 const engine=
  $("editorScreen")
   .classList
   .contains("active")
   ?editorEngine
   :playEngine;

 World.remove(
  engine.world,
  b
 );

 const i=
  stageObjects.indexOf(b);

 if(i>=0){
  stageObjects.splice(i,1);
 }

 if(
  selectedBody===b
 ){
  selectedBody=null;
 }
}

/* =================================
   爆発
================================= */

function explodeAt(
 engine,
 x,
 y
){

 effects.push({
  engine:engine,
  x:x,
  y:y,
  time:performance.now()
 });

 Composite
  .allBodies(engine.world)
  .forEach(b=>{

   const t=gameType(b);

   if(
    t==="floor"||
    t==="bedrock"||
    t==="multiply"
   ){
    return;
   }

   const dx=
    b.position.x-x;

   const dy=
    b.position.y-y;

   const distance=
    Math.sqrt(
     dx*dx+dy*dy
    );

   if(
    distance>
    EXPLOSION_FORCE_RADIUS
   ){
    return;
   }

   const power=
    1-
    distance/
    EXPLOSION_FORCE_RADIUS;

   const length=
    Math.max(
     distance,
     1
    );

   if(!b.isStatic){

    Body.applyForce(
     b,
     b.position,
     {
      x:
       dx/length*
       EXPLOSION_FORCE*
       power,

      y:
       dy/length*
       EXPLOSION_FORCE*
       power
     }
    );
   }

   if(t==="block"){

    damageBlock(
     b,
     EXPLOSION_DAMAGE*
     power
    );
   }

   if(
    t==="enemy"&&
    distance<EXPLOSION_RADIUS
   ){

    killEnemy(b);
   }
  });
}

function explodeAll(engine){

 const bombs=
  Composite
   .allBodies(engine.world)
   .filter(
    b=>gameType(b)==="bomb"
   );

 bombs.forEach(b=>{

  explodeAt(
   engine,
   b.position.x,
   b.position.y
  );
 });

 bombs.forEach(b=>{
  World.remove(
   engine.world,
   b
  );
 });

 if(
  engine===editorEngine
 ){

  stageObjects=
   stageObjects.filter(
    b=>gameType(b)!=="bomb"
   );
 }
}

/* =================================
   Body検索
================================= */

function bodyAt(
 engine,
 point
){

 const bodies=
  Composite.allBodies(
   engine.world
  );

 for(
  let i=bodies.length-1;
  i>=0;
  i--
 ){

  const b=bodies[i];

  if(
   gameType(b)==="floor"
  ){
   continue;
  }

  if(
   Bounds.contains(
    b.bounds,
    point
   )&&
   Vertices.contains(
    b.vertices,
    point
   )
  ){

   return b;
  }
 }

 return null;
}

editorCanvas.addEventListener(
 "pointerdown",
 e=>{

  if(!editorEngine)return;

  e.preventDefault();

  const s=
   getPointer(
    editorCanvas,
    e
   );

  const p=
   screenToWorld(
    editorCanvas,
    s.x,
    s.y,
    editorCamera
   );

  /* 回転ハンドル */
  if(
   currentTool==="rotate"&&
   selectedBody&&
   gameType(selectedBody)!=="bedrock"
  ){

   const dx=
    p.x-selectedBody.position.x;

   const dy=
    p.y-selectedBody.position.y;

   const distance=
    Math.sqrt(
     dx*dx+dy*dy
    );

   const radius=
    Math.max(
     selectedBody.plugin.width||50,
     selectedBody.plugin.height||50
    )/2+40;

   if(
    Math.abs(
     distance-radius
    )<35
   ){

    drag={
     mode:"rotate",
     body:selectedBody
    };

    return;
   }
  }

  /* 4頂点 */
  if(
   currentTool==="shape"&&
   selectedBody&&
   gameType(selectedBody)==="block"
  ){

   const handles=
    getShapeHandles(
     selectedBody
    );

   let nearest=null;
   let nearestDistance=Infinity;

   handles.forEach(h=>{

    const dx=
     p.x-h.x;

    const dy=
     p.y-h.y;

    const d=
     Math.sqrt(
      dx*dx+dy*dy
     );

    if(d<nearestDistance){

     nearestDistance=d;
     nearest=h;
    }
   });

   if(
    nearest&&
    nearestDistance<30
   ){

    drag={
     mode:"shape",
     body:selectedBody,
     corner:nearest.corner
    };

    return;
   }
  }

  /* 移動 */
  if(
   currentTool==="move"
  ){

   const b=
    bodyAt(
     editorEngine,
     p
    );

   if(b){

    selectedBody=b;

    drag={
     mode:"move",
     body:b,
     dx:
      b.position.x-p.x,
     dy:
      b.position.y-p.y
    };
   }

   return;
  }

  /* 消去 */
  if(
   currentTool==="erase"
  ){

   const b=
    bodyAt(
     editorEngine,
     p
    );

   if(b){

    World.remove(
     editorEngine.world,
     b
    );

    const i=
     stageObjects.indexOf(b);

    if(i>=0){
     stageObjects.splice(i,1);
    }

    if(
     selectedBody===b
    ){
     selectedBody=null;
    }
   }

   return;
  }

  /* 回転 */
  if(
   currentTool==="rotate"
  ){

   const b=
    bodyAt(
     editorEngine,
     p
    );

   if(b){

    selectedBody=b;

    if(
     gameType(b)!=="bedrock"
    ){

     drag={
      mode:"rotate",
      body:b
     };
    }
   }

   return;
  }

  /* 形変更 */
  if(
   currentTool==="shape"
  ){

   const b=
    bodyAt(
     editorEngine,
     p
    );

   if(b){
    selectedBody=b;
   }

   return;
  }

  /*
   * 既存物体をタップした場合は
   * 新しい物体を重ねない。
   */
  const existing=
   bodyAt(
    editorEngine,
    p
   );

  if(existing){

   selectedBody=existing;

   return;
  }

  /* 新規 */
  let b=null;

  if(
   ["wood","glass","stone"]
   .includes(currentTool)
  ){

   b=createBlock(
    currentTool,
    p.x,
    p.y,
    150,
    35,
    0
   );
  }

  if(
   currentTool==="enemy"
  ){

   b=createEnemy(
    p.x,
    p.y
   );
  }

  if(
   currentTool==="bomb"
  ){

   b=createBomb(
    p.x,
    p.y
   );
  }

  if(
   currentTool==="multiply"
  ){

   b=createMultiply(
    p.x,
    p.y
   );
  }

  if(
   currentTool==="bedrock"
  ){

   b=createBedrock(
    p.x,
    p.y
   );
  }

  if(b){

   World.add(
    editorEngine.world,
    b
   );

   stageObjects.push(b);

   selectedBody=b;
  }
 }
);

   const angle=

    b,

   );

  /* 形変更 */

   drag.mode==="shape"

   resizeFromCorner(
    b,
    drag.corner,
    p
   );
  }
 }
);

/* =================================
   4頂点
================================= */

/*
 * ここを大幅に修正。
 *
 * 「画面座標」と「ワールド座標」を
 * 混ぜない。
 *
 * 4点は必ず実際のBodyの4頂点から
 * 計算する。
 */
function getShapeHandles(b){

 const w=
  b.plugin.width;

 const h=
  b.plugin.height;

 const cos=
  Math.cos(b.angle);

 const sin=
  Math.sin(b.angle);

 const corners=[
  {
   x:-w/2,
   y:-h/2,
   corner:"tl"
  },
  {
   x:w/2,
   y:-h/2,
   corner:"tr"
  },
  {
   x:w/2,
   y:h/2,
   corner:"br"
  },
  {
   x:-w/2,
   y:h/2,
   corner:"bl"
  }
 ];

 return corners.map(c=>({

  corner:c.corner,

  x:
   b.position.x+
   c.x*cos-
   c.y*sin,

  y:
   b.position.y+
   c.x*sin+
   c.y*cos

 }));
}

function resizeFromCorner(
 b,
 corner,
 pointer
){

 const cos=
  Math.cos(b.angle);

 const sin=
  Math.sin(b.angle);

 const dx=
  pointer.x-b.position.x;

 const dy=
  pointer.y-b.position.y;

 /*
  * ワールド座標→
  * ブロックローカル座標。
  */
 const lx=
  dx*cos+
  dy*sin;

 const ly=
  -dx*sin+
  dy*cos;

 const oldW=
  b.plugin.width;

 const oldH=
  b.plugin.height;

 let ox;
 let oy;

 /*
  * ドラッグしている角の
  * 対角線側を固定。
  */
 if(corner==="tr"){
  ox=-oldW/2;
  oy= oldH/2;
 }

 if(corner==="tl"){
  ox= oldW/2;
  oy= oldH/2;
 }

 if(corner==="br"){
  ox=-oldW/2;
  oy=-oldH/2;
 }

 if(corner==="bl"){
  ox= oldW/2;
  oy=-oldH/2;
 }

 /*
  * 常に長方形になる。
  */
 const left=
  Math.min(lx,ox);

 const right=
  Math.max(lx,ox);

 const top=
  Math.min(ly,oy);

 const bottom=
  Math.max(ly,oy);

 const newW=
  Math.max(
   20,
   right-left
  );

 const newH=
  Math.max(
   20,
   bottom-top
  );

 /*
  * 対角線側を固定したまま
  * 新しい中心を計算。
  */
 const centerLX=
  (lx+ox)/2;

 const centerLY=
  (ly+oy)/2;

 const centerX=
  b.position.x+
  centerLX*cos-
  centerLY*sin;

 const centerY=
  b.position.y+
  centerLX*sin+
  centerLY*cos;

 Body.scale(
  b,
  newW/oldW,
  newH/oldH
 );

 Body.setPosition(
  b,
  {
   x:centerX,
   y:centerY
  }
 );

 b.plugin.width=newW;
 b.plugin.height=newH;
}

function serializeStage(){

 return {

  id:currentStageId,

  name:
   $("stageName")
    .value
    .trim()||
   "無題のステージ",

  objects:
   stageObjects
    .filter(b=>{

     return [
      "block",
      "enemy",
      "bomb",
      "multiply",
      "bedrock"
     ].includes(
      gameType(b)
     );

    })
    .map(b=>{

     const t=
      gameType(b);

     if(t==="block"){

      return {
       type:"block",
       material:b.plugin.material,
       x:b.position.x,
       y:b.position.y,
       w:b.plugin.width,
       h:b.plugin.height,
       angle:
        b.angle*180/Math.PI
      };
     }

     if(t==="enemy"){

      return {
       type:"enemy",
       x:b.position.x,
       y:b.position.y
      };
     }

     if(t==="bomb"){

      return {
       type:"bomb",
       x:b.position.x,
       y:b.position.y
      };
     }

     if(t==="multiply"){

      return {
       type:"multiply",
       x:b.position.x,
       y:b.position.y,
       w:b.plugin.width,
       h:b.plugin.height
      };
     }

     if(t==="bedrock"){

      return {
       type:"bedrock",
       x:b.position.x,
       y:b.position.y,
       w:b.plugin.width,
       h:b.plugin.height,
       angle:0
      };
     }

    })
 };
}

  return;
 }

 all.forEach(stage=>{

  const card=
   document.createElement(
    "div"
   );

  card.className=
   "stageCard";

  const name=
   document.createElement(
    "strong"
   );

  name.textContent=
   stage.name;

  const play=
   document.createElement(
    "button"
   );

  play.textContent=
   "▶ 遊ぶ";

  play.onclick=()=>{
   startPlay(stage);
  };

  const edit=
   document.createElement(
    "button"
   );

  edit.textContent=
   "✎ 編集";

  edit.onclick=()=>{
   startEditor(stage);
  };

  const del=
   document.createElement(
    "button"
   );

  del.className="del";

  del.textContent=
   "削除";

  del.onclick=()=>{

   setStages(
    all.filter(
     x=>x.id!==stage.id
    )
   );

   renderStages();
  };

  card.append(
   name,
   play,
   edit,
   del
  );

  list.append(card);
 });
}

/* =================================
   Navigation
================================= */

$("makeBtn").onclick=()=>{
 startEditor();
};

$("playBtn").onclick=()=>{
 renderStages();
 showScreen(
  "selectScreen"
 );
};

$("selectBack").onclick=()=>{
 showScreen(
  "startScreen"
 );
};

$("editorBack").onclick=()=>{
 stopEditor();
 showScreen(
  "startScreen"
 );
};

$("playBack").onclick=()=>{
 stopPlay();
 renderStages();
 showScreen(
  "selectScreen"
 );
};

/* =================================
   描画
================================= */

function draw(
 canvas,
 engine,
 camera,
 isEditor
){

 const ctx=
  canvas.getContext("2d");

 ctx.clearRect(
  0,
  0,
  canvas.width,
  canvas.height
 );

 /*
  * ここからワールド座標系。
  *
  * 重要：
  * 以前はこの中でtoScreen()を
  * さらに使っていたため、
  * 4点が画面端などに飛んでいた。
  *
  * 今回は描画中の座標系を
  * 最初からワールド座標にしている。
  */
 ctx.save();

 ctx.translate(
  canvas.clientWidth/2,
  canvas.clientHeight/2
 );

 ctx.scale(
  camera.zoom,
  camera.zoom
 );

 ctx.translate(
  -camera.x,
  -camera.y
 );

 /* 背景 */
 const visibleW=
  canvas.clientWidth/
  camera.zoom;

 const visibleH=
  canvas.clientHeight/
  camera.zoom;

 const left=
  camera.x-visibleW/2-500;

 const top=
  camera.y-visibleH/2-500;

 ctx.fillStyle="#d9edff";

 ctx.fillRect(
  left,
  top,
  visibleW+1000,
  visibleH+1000
 );

 /* 雲っぽい背景ライン */
 ctx.strokeStyle=
  "rgba(255,255,255,.35)";

 ctx.lineWidth=2;

 for(
  let y=
   Math.floor(top/100)*100;
  y<top+visibleH+1000;
  y+=100
 ){

  ctx.beginPath();

  ctx.moveTo(
   left,
   y
  );

  ctx.lineTo(
   left+visibleW+1000,
   y
  );

  ctx.stroke();
 }

 const bodies=
  Composite.allBodies(
   engine.world
  );

 bodies.forEach(b=>{

  const t=
   gameType(b);

  /* ===== 床 ===== */
  if(t==="floor"){

   /*
    * 巨大Bodyをそのまま描かず、
    * 見えている範囲だけ描画。
    */
   const floorLeft=
    camera.x-visibleW/2-100;

   ctx.fillStyle="#707070";

   ctx.fillRect(
    floorLeft,
    FLOOR_Y,
    visibleW+200,
    100
   );

   ctx.fillStyle="#4b4b4b";

   ctx.fillRect(
    floorLeft,
    FLOOR_Y,
    visibleW+200,
    8
   );

   /*
    * 床の模様
    */
   ctx.strokeStyle="#8c8c8c";
   ctx.lineWidth=2;

   for(
    let x=floorLeft;
    x<floorLeft+visibleW+200;
    x+=40
   ){

    ctx.beginPath();

    ctx.moveTo(
     x,
     FLOOR_Y+10
    );

    ctx.lineTo(
     x+20,
     FLOOR_Y+35
    );

    ctx.stroke();
   }

   return;
  }

  ctx.save();

  ctx.translate(
   b.position.x,
   b.position.y
  );

  ctx.rotate(
   b.angle
  );

  /* ===== 木・ガラス・石 ===== */
  if(t==="block"){

   const w=
    b.plugin.width;

   const h=
    b.plugin.height;

   if(
    b.plugin.material==="wood"
   ){
    ctx.fillStyle="#c98a46";
   }

   if(
    b.plugin.material==="glass"
   ){
    ctx.fillStyle="#79d5e8";
   }

   if(
    b.plugin.material==="stone"
   ){
    ctx.fillStyle="#777";
   }

   ctx.fillRect(
    -w/2,
    -h/2,
    w,
    h
   );

   ctx.strokeStyle="#333";
   ctx.lineWidth=3;

   ctx.strokeRect(
    -w/2,
    -h/2,
    w,
    h
   );
  }

  /* ===== 岩盤 ===== */
  if(t==="bedrock"){

   const w=
    b.plugin.width;

   const h=
    b.plugin.height;

   ctx.fillStyle="#30343a";

   ctx.fillRect(
    -w/2,
    -h/2,
    w,
    h
   );

   ctx.strokeStyle="#111";
   ctx.lineWidth=4;

   ctx.strokeRect(
    -w/2,
    -h/2,
    w,
    h
   );

   ctx.strokeStyle="#555";
   ctx.lineWidth=2;

   for(
    let x=-w/2;
    x<w/2;
    x+=35
   ){

    ctx.beginPath();

    ctx.moveTo(
     x,
     -h/2
    );

    ctx.lineTo(
     x+20,
     h/2
    );

    ctx.stroke();
   }
  }

  /* ===== ×2 ===== */
  if(t==="multiply"){

   const w=
    b.plugin.width;

   const h=
    b.plugin.height;

   ctx.fillStyle=
    "rgba(255,200,30,.48)";

   ctx.fillRect(
    -w/2,
    -h/2,
    w,
    h
   );

   ctx.strokeStyle="#b57900";
   ctx.lineWidth=3;

   ctx.strokeRect(
    -w/2,
    -h/2,
    w,
    h
   );

   ctx.fillStyle="#222";

   ctx.font=
    "bold 28px Arial";

   ctx.textAlign="center";
   ctx.textBaseline="middle";

   ctx.fillText(
    "×2",
    0,
    0
   );
  }

  /* ===== 敵 ===== */
  if(t==="enemy"){

   ctx.fillStyle="#55c94a";

   ctx.beginPath();

   ctx.arc(
    0,
    0,
    22,
    0,
    Math.PI*2
   );

   ctx.fill();

   ctx.fillStyle="#fff";

   ctx.beginPath();

   ctx.arc(
    -7,
    -4,
    5,
    0,
    Math.PI*2
   );

   ctx.arc(
    7,
    -4,
    5,
    0,
    Math.PI*2
   );

   ctx.fill();

   ctx.fillStyle="#222";

   ctx.beginPath();

   ctx.arc(
    -7,
    -4,
    2,
    0,
    Math.PI*2
   );

   ctx.arc(
    7,
    -4,
    2,
    0,
    Math.PI*2
   );

   ctx.fill();
  }

  /* ===== 爆弾 ===== */
  if(t==="bomb"){

   ctx.fillStyle="#222";

   ctx.beginPath();

   ctx.arc(
    0,
    0,
    16,
    0,
    Math.PI*2
   );

   ctx.fill();

   ctx.strokeStyle="#333";
   ctx.lineWidth=4;

   ctx.beginPath();

   ctx.moveTo(
    8,
    -12
   );

   ctx.quadraticCurveTo(
    17,
    -22,
    20,
    -13
   );

   ctx.stroke();
  }

  ctx.restore();
 });

 /* =================================
    選択表示
 ================================= */

 if(
  isEditor&&
  selectedBody&&
  gameType(selectedBody)!=="floor"
 ){

  const b=
   selectedBody;

  /*
   * 長方形の選択枠
   *
   * ここもworld座標のまま描画する。
   * toScreen()を使わない。
   */
  if(
   gameType(b)==="block"||
   gameType(b)==="bedrock"||
   gameType(b)==="multiply"
  ){

   const w=
    b.plugin.width;

   const h=
    b.plugin.height;

   ctx.save();

   ctx.translate(
    b.position.x,
    b.position.y
   );

   ctx.rotate(
    b.angle
   );

   ctx.strokeStyle="#f80";

   ctx.lineWidth=
    4/camera.zoom;

   ctx.setLineDash([
    8/camera.zoom,
    5/camera.zoom
   ]);

   ctx.strokeRect(
    -w/2-6,
    -h/2-6,
    w+12,
    h+12
   );

   ctx.setLineDash([]);

   ctx.restore();
  }

  /*
   * ================================
   * 回転ハンドル
   * ================================
   *
   * ブロック中央から
   * 「ブロックの上方向」に線を出す。
   */
  if(
   currentTool==="rotate"&&
   gameType(b)!=="bedrock"
  ){

   const distance=
    Math.max(
     b.plugin.width||50,
     b.plugin.height||50
    )/2+40;

   /*
    * ローカルの上方向を
    * ワールド座標に変換。
    */
   const hx=
    b.position.x+
    Math.sin(b.angle)*
    distance;

   const hy=
    b.position.y-
    Math.cos(b.angle)*
    distance;

   ctx.strokeStyle="#f80";

   ctx.lineWidth=
    4/camera.zoom;

   ctx.beginPath();

   ctx.moveTo(
    b.position.x,
    b.position.y
   );

   ctx.lineTo(
    hx,
    hy
   );

   ctx.stroke();

   ctx.fillStyle="#f80";

   ctx.beginPath();

   ctx.arc(
    hx,
    hy,
    9/camera.zoom,
    0,
    Math.PI*2
   );

   ctx.fill();
  }

  /*
   * ================================
   * 形変更の4点
   * ================================
   *
   * 必ず実際の四隅の位置に描画。
   */
  if(
   currentTool==="shape"&&
   gameType(b)==="block"
  ){

   const handles=
    getShapeHandles(b);

   handles.forEach(h=>{

    ctx.fillStyle="#fff";

    ctx.strokeStyle="#f80";

    ctx.lineWidth=
     3/camera.zoom;

    ctx.beginPath();

    ctx.rect(
     h.x-8/camera.zoom,
     h.y-8/camera.zoom,
     16/camera.zoom,
     16/camera.zoom
    );

    ctx.fill();

    ctx.stroke();
   });
  }
 }

 ctx.restore();

 /* =================================
    爆発
 ================================= */

 const now=
  performance.now();

 effects=
  effects.filter(
   x=>now-x.time<300
  );

 effects.forEach(effect=>{

  if(
   effect.engine!==engine
  ){
   return;
  }

  const progress=
   (now-effect.time)/300;

  /*
   * ここだけ画面座標へ変換。
   */
  const sx=
   (effect.x-camera.x)*
   camera.zoom+
   canvas.clientWidth/2;

  const sy=
   (effect.y-camera.y)*
   camera.zoom+
   canvas.clientHeight/2;

  ctx.strokeStyle="#f80";

  ctx.lineWidth=8;

  ctx.globalAlpha=
   1-progress;

  ctx.beginPath();

  ctx.arc(
   sx,
   sy,
   progress*
   130*
   camera.zoom,
   0,
   Math.PI*2
  );

  ctx.stroke();

  ctx.globalAlpha=1;
 });
}

/* =================================
   Animation
================================= */

function editorLoop(){

 if(
  editorEngine&&
  $("editorScreen")
   .classList
   .contains("active")
 ){

  draw(
   editorCanvas,
   editorEngine,
   editorCamera,
   true
  );
 }

 requestAnimationFrame(
  editorLoop
 );
}

function playLoop(){

 if(
  playEngine&&
  $("playScreen")
   .classList
   .contains("active")
 ){

  draw(
   playCanvas,
   playEngine,
   playCamera,
   false
  );
 }

 requestAnimationFrame(
  playLoop
 );
}

/* =================================
   起動
================================= */

resizeAll();

editorLoop();

playLoop();

</script>
